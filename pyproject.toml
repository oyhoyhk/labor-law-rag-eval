[project]
name = "elice-rag-eval"
version = "0.1.0"
description = "Citation-grounded RAG QA over Korean labor statutes with a self-built eval harness"
requires-python = ">=3.12,<3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "httpx>=0.27",
    "numpy>=2.5.3",
    "openai>=3.22.1",
    "python-dotenv>=1.0",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
