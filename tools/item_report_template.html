<title>노동법 RAG 문항별 채점표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: summary strip → one filter row → item ledger; each row opens into two panes (retrieval | grading) */
:root {
  --bg: #f6f7f5; --panel: #ffffff; --line: #dde1dc; --fg: #1d2420; --muted: #5d6862; --faint: #8a948e;
  --accent: #2f5d50; --accent-soft: #e3ece8;
  --ok: #2e7d4f; --ok-soft: #e2f1e7; --bad: #b3372e; --bad-soft: #f7e3e0; --warn: #9a6a12; --warn-soft: #f6ecd6;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141917; --panel: #1b2220; --line: #2e3834; --fg: #e4ebe7; --muted: #a2aea8; --faint: #76827c;
  --accent: #8cc4b2; --accent-soft: #243631;
  --ok: #6fcf95; --ok-soft: #1d3326; --bad: #f08a80; --bad-soft: #3b2220; --warn: #e2b55a; --warn-soft: #3a3020; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141917; --panel: #1b2220; --line: #2e3834; --fg: #e4ebe7; --muted: #a2aea8; --faint: #76827c;
  --accent: #8cc4b2; --accent-soft: #243631;
  --ok: #6fcf95; --ok-soft: #1d3326; --bad: #f08a80; --bad-soft: #3b2220; --warn: #e2b55a; --warn-soft: #3a3020; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 20px; }
h1 { font-size: 22px; margin: 0; text-wrap: balance; letter-spacing: -0.01em }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 13px }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0 }
.stat b { display: block; font-size: 22px; font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500 }
.stat span { color: var(--muted); font-size: 12px }
.stat.hero { border-color: var(--accent); background: var(--accent-soft) }
.levels { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px }
table { border-collapse: collapse; width: 100% }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: 11px; letter-spacing: .04em; color: var(--muted); font-weight: 600; text-transform: uppercase }
td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right }
.levels tr:last-child td { border-bottom: 0 }
.bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--ok); vertical-align: middle; margin-left: 6px }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-block: 8px; border-bottom: 1px solid var(--line) }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel) }
.chip:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.sep { width: 1px; height: 20px; background: var(--line) }
#q { flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; padding: 5px 10px; font: inherit }
#count { color: var(--muted); font-size: 13px }
.list { display: grid; gap: 6px }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0 }
details[open] { border-color: var(--accent) }
summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 62px 44px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px }
summary::-webkit-details-marker { display: none }
summary .qtext { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.lv { font-size: 11px; font-family: var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; text-align: center }
.tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end }
.pill { font-size: 12px; border-radius: 4px; padding: 1px 7px; white-space: nowrap; font-weight: 500 }
.pill.ok { background: var(--ok-soft); color: var(--ok) } .pill.bad { background: var(--bad-soft); color: var(--bad) }
.pill.warn { background: var(--warn-soft); color: var(--warn) } .pill.na { background: var(--accent-soft); color: var(--muted) }
.dots { display: inline-flex; gap: 3px } .dot { width: 8px; height: 8px; border-radius: 50% } .dot.ok { background: var(--ok) } .dot.bad { background: var(--bad) }
.body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; border-top: 1px solid var(--line) }
.pane { padding: 14px 16px; min-width: 0; display: grid; gap: 10px; align-content: start }
.pane + .pane { border-left: 1px solid var(--line) }
.pane h3 { margin: 0; font-size: 13px; color: var(--accent); letter-spacing: .02em }
.q { grid-column: 1 / -1; padding: 12px 16px 0; font-size: 15px; font-weight: 500 }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px } .kv dt { color: var(--muted) } .kv dd { margin: 0; min-width: 0 }
.ret { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px }
.ret td, .ret th { padding: 4px 8px; font-size: 12.5px }
.ret tr.gold td { background: var(--ok-soft) }
.ret tr.miss td { background: var(--bad-soft); color: var(--bad) }
.via { font-size: 11px; color: var(--muted) }
.answer { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 13px; max-height: 320px; overflow: auto }
.kp { display: grid; grid-template-columns: 22px 1fr; gap: 2px 6px; font-size: 13px }
.kp .mark { font-weight: 700 } .kp .mark.ok { color: var(--ok) } .kp .mark.bad { color: var(--bad) }
.kp .quote { grid-column: 2; color: var(--muted); font-size: 12px; border-left: 2px solid var(--line); padding-left: 8px }
.ref { font-size: 12.5px; color: var(--muted) }
.legend { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 14px }
@media (max-width: 760px) {
  summary { grid-template-columns: 54px 40px 1fr; } summary .tags { grid-column: 1 / -1; justify-content: flex-start }
  .body { grid-template-columns: 1fr } .pane + .pane { border-left: 0; border-top: 1px solid var(--line) }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="wrap">
  <header>
    <h1>노동법 RAG 문항별 채점표</h1>
    <p class="sub" id="sub"></p>
  </header>
  <section class="stats" id="stats"></section>
  <section class="levels"><table id="levels"></table></section>
  <div class="legend">
    <span>검색 판정: GT 근거 조문을 검색 상위 10개(연결 포함 프롬프트 전체)에서 모두 찾았는지 규칙으로 대조</span>
    <span>답변 판정: 답할 문항은 정답 포인트 전부 포함(Judge), 거절할 문항은 거절 또는 결론 미단정</span>
    <span>점 3개: 같은 구성 3회 실행의 정답 여부</span>
  </div>
  <div class="filters" role="toolbar" aria-label="문항 필터">
    <button class="chip" data-f="res" data-v="all" aria-pressed="true">전체</button>
    <button class="chip" data-f="res" data-v="bad" aria-pressed="false">오답</button>
    <button class="chip" data-f="res" data-v="unstable" aria-pressed="false">3회 중 흔들림</button>
    <button class="chip" data-f="res" data-v="miss" aria-pressed="false">검색 누락</button>
    <span class="sep"></span>
    <span id="lvchips" style="display:contents"></span>
    <input id="q" type="search" placeholder="문항 ID·질문·조문 검색" aria-label="검색">
    <span id="count"></span>
  </div>
  <section class="list" id="list"></section>
</div>

<script>
const DATA = /*__DATA__*/null;
const LV = {L1: "단일 조문", L2: "조건·경계값", L3: "다중·위임·예외", L4: "시점", SUM: "요약형", L5a: "판례 사례(조문)", L5b: "판례 인용", OOS: "범위 밖"};
const VIA = {search: "검색", link: "위임 연결", precedent: "판례 연결", sibling: "형제 청크"};
const MODE = {gate: "검색 0개로 차단", declined: "모델 거절", hedged: "근거 없음 명시 답변", asserted: "결론 단정(오답)"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pct = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
const items = DATA.items, m = DATA.meta, o = m.overall;
const answerable = items.filter(x => x.expected === "answered");

document.getElementById("sub").textContent =
  `${m.embedding.split("@")[0]} · 검색 ${m.config.k}개 + 위임·판례 연결 · 생성 ${m.model} · 채점 ${m.judge} · 실행 ${m.run}`;

const nCorrect = items.filter(x => x.m0).length;
const retAll = answerable.filter(x => x.gold.length && x.missing.length === 0 && x.found_search.length === x.gold.length).length;
const withGold = answerable.filter(x => x.gold.length).length;
const stats = [
  ["hero", `${nCorrect} / ${items.length}`, "전체 정답 (M0)"],
  ["", `${retAll} / ${withGold}`, "검색이 정답 조문 전부 찾음"],
  ["", pct(o.M1_recall_any[0]), "정답 조문 1개 이상 찾음"],
  ["", (o.M1_mrr[0]).toFixed(3), "MRR (첫 정답 순위)"],
  ["", pct(o.M4_kp_coverage[0]), "정답 포인트 포함률"],
  ["", pct(o.M3_citation_precision[0]), "인용 정밀도"],
];
document.getElementById("stats").innerHTML = stats.map(([c, v, l]) => `<div class="stat ${c}"><b>${v}</b><span>${l}</span></div>`).join("");

const order = ["L1", "L2", "L3", "L4", "SUM", "L5a", "L5b", "OOS"];
const rows = order.map(lv => {
  const xs = items.filter(x => x.level === lv); if (!xs.length) return "";
  const ok = xs.filter(x => x.m0).length, g = xs.filter(x => x.gold.length);
  const ra = g.length ? g.filter(x => x.missing.length === 0 && x.found_search.length === x.gold.length).length : null;
  return `<tr><td><span class="lv">${lv}</span> ${LV[lv]}</td><td class="n">${xs.length}</td>
    <td class="n">${ok}<span class="bar" style="width:${Math.round(ok / xs.length * 60)}px" aria-hidden="true"></span></td>
    <td class="n">${ra == null ? "—" : ra + " / " + g.length}</td>
    <td>${xs.filter(x => !x.m0).map(x => `<a href="#${x.id}" class="mono">${x.id}</a>`).join(" ") || "—"}</td></tr>`;
}).join("");
document.getElementById("levels").innerHTML =
  `<thead><tr><th>유형</th><th style="text-align:right">문항</th><th style="text-align:right">정답</th><th style="text-align:right">검색 전부</th><th>오답 문항</th></tr></thead><tbody>${rows}</tbody>`;

document.getElementById("lvchips").innerHTML = order.map(lv =>
  `<button class="chip" data-f="lv" data-v="${lv}" aria-pressed="false">${lv}</button>`).join("");

function retPill(x) {
  if (!x.gold.length) return `<span class="pill na">GT 근거 없음</span>`;
  if (x.missing.length === 0 && x.found_search.length === x.gold.length) return `<span class="pill ok">검색 전부</span>`;
  if (x.missing.length === 0) return `<span class="pill ok">연결로 전부</span>`;
  if (x.missing.length < x.gold.length) return `<span class="pill warn">검색 일부 (${x.gold.length - x.missing.length}/${x.gold.length})</span>`;
  return `<span class="pill bad">검색 실패</span>`;
}
function ansPill(x) {
  if (x.expected !== "answered") return x.m0 ? `<span class="pill ok">${MODE[x.refusal_mode] || "거절"}</span>` : `<span class="pill bad">${MODE[x.refusal_mode] || "답변함"}</span>`;
  if (x.status !== "answered") return `<span class="pill bad">거절함</span>`;
  const k = x.key_points, n = k.filter(p => p.ok).length;
  return `<span class="pill ${x.m0 ? "ok" : "bad"}">${x.m0 ? "정답" : "오답"} · 포인트 ${n}/${k.length}</span>`;
}
function body(x) {
  const goldRows = x.retrieved.map(r => `<tr class="${r.gold ? "gold" : ""}"><td class="n">${r.rank}</td><td>${esc(r.id)}</td>
    <td class="n">${r.score ? r.score.toFixed(3) : "—"}</td><td class="via">${VIA[r.via] || r.via}</td><td>${r.gold ? "✓ 정답" : ""}</td></tr>`).join("");
  const missRows = x.missing.map(a => `<tr class="miss"><td class="n">—</td><td>${esc(a)}</td><td></td><td class="via">미검색</td><td>✗ 누락</td></tr>`).join("");
  const kp = x.key_points.length ? x.key_points.map(p => `<span class="mark ${p.ok ? "ok" : "bad"}">${p.ok ? "✓" : "✗"}</span><span>${esc(p.text)}</span>${p.quote ? `<span class="quote">${esc(p.quote)}</span>` : ""}`).join("") : "";
  return `<div class="body">
    <div class="q" style="grid-column:1/-1">${esc(x.question)}</div>
    <div class="pane">
      <h3>RAG 검색 · 프롬프트에 들어간 근거</h3>
      <dl class="kv">
        <dt>GT 근거</dt><dd>${x.gold.length ? x.gold.map(esc).join(", ") : "없음(거절해야 하는 문항)"}</dd>
        <dt>검색으로 찾음</dt><dd>${x.found_search.map(esc).join(", ") || "—"}</dd>
        <dt>연결로 찾음</dt><dd>${x.found_link.map(esc).join(", ") || "—"}</dd>
        <dt>누락</dt><dd>${x.missing.map(esc).join(", ") || "—"}</dd>
        <dt>첫 정답 순위</dt><dd class="mono">${x.rr ? Math.round(1 / x.rr) + "위" : "—"}</dd>
      </dl>
      <div class="ret"><table><thead><tr><th>#</th><th>조문·판례</th><th>유사도</th><th>경로</th><th></th></tr></thead><tbody>${goldRows}${missRows}</tbody></table></div>
    </div>
    <div class="pane">
      <h3>LLM 답변 · 채점</h3>
      <dl class="kv">
        <dt>기대</dt><dd>${x.expected === "answered" ? "답변" : "거절 또는 근거 없음 명시"}</dd>
        <dt>실제</dt><dd>${x.status === "answered" ? "답변" : "거절"}${x.refusal_reason ? ` (${esc(x.refusal_reason)})` : ""}</dd>
        <dt>판정</dt><dd>${ansPill(x)}</dd>
        ${x.asserts_conclusion != null ? `<dt>결론 단정</dt><dd>${x.asserts_conclusion ? "예" : "아니오"}</dd>` : ""}
        <dt>인용</dt><dd>${x.citations.map(esc).join(", ") || "—"}${x.cit_precision != null ? ` <span class="mono">(정밀도 ${pct(x.cit_precision)} · 재현율 ${pct(x.cit_recall)})</span>` : ""}</dd>
        <dt>근거 없는 주장</dt><dd>${x.n_claims ? `${x.unsupported.length} / ${x.n_claims}` : "—"}</dd>
      </dl>
      ${kp ? `<div class="kp">${kp}</div>` : ""}
      ${x.unsupported.length ? `<div class="ref">근거 없는 주장: ${x.unsupported.map(esc).join(" / ")}</div>` : ""}
      <div class="answer">${esc(x.answer)}</div>
      <div class="ref"><b>GT 참고 답변</b> ${esc(x.reference)}</div>
    </div>
  </div>`;
}
const state = {res: "all", lv: new Set(), q: ""};
function match(x) {
  if (state.res === "bad" && x.m0) return false;
  if (state.res === "unstable" && new Set(x.stability).size < 2) return false;
  if (state.res === "miss" && !x.missing.length) return false;
  if (state.lv.size && !state.lv.has(x.level)) return false;
  if (state.q) { const h = (x.id + " " + x.question + " " + x.gold.join(" ") + " " + x.retrieved.map(r => r.id).join(" ")).toLowerCase(); if (!h.includes(state.q)) return false; }
  return true;
}
function render() {
  const xs = items.filter(match);
  document.getElementById("count").textContent = `${xs.length}개 문항`;
  document.getElementById("list").innerHTML = xs.map(x => `<details id="${x.id}" data-id="${x.id}">
    <summary><span class="mono">${x.id}</span><span class="lv" title="${LV[x.level]}">${x.level}</span><span class="qtext">${esc(x.question)}</span>
    <span class="tags">${retPill(x)}${ansPill(x)}<span class="dots" title="3회 실행 정답 여부">${x.stability.map(s => `<span class="dot ${s ? "ok" : "bad"}"></span>`).join("")}</span></span></summary></details>`).join("");
}
document.getElementById("list").addEventListener("toggle", e => {
  const d = e.target; if (d.open && !d.dataset.filled) { d.insertAdjacentHTML("beforeend", body(items.find(x => x.id === d.dataset.id))); d.dataset.filled = 1; }
}, true);
document.querySelector(".filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  if (b.dataset.f === "res") { state.res = b.dataset.v; document.querySelectorAll('[data-f="res"]').forEach(c => c.setAttribute("aria-pressed", c === b)); }
  else { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); on ? state.lv.add(b.dataset.v) : state.lv.delete(b.dataset.v); }
  render();
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
render();
function openHash() { const d = document.getElementById(location.hash.slice(1)); if (d && d.tagName === "DETAILS") { d.open = true; d.scrollIntoView({block: "start"}); } }
window.addEventListener("hashchange", openHash); openHash();
</script>
