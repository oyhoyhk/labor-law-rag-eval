"ok": true, "quote": "임신 중인 여성 근로자에게 시간외근로를 시킬 수 없고, 근로자가 요구하면 쉬운 종류의 근로로 전환해야 합니다.", "reason": "임신 중 시간외근로 금지와 요구 시 쉬운 근로로 전환할 의무를 모두 명시했습니다."}}}, {"key": "g014-kp1", "id": "g014", "level": "L2", "question": "임신 13주에 유산한 직원에게 유산휴가를 며칠 줘야 하나요?", "kp_index": 1, "all_kps": ["임신기간 15주 이내: 유산 또는 사산한 날부터 10일까지"], "answer": "임신기간이 15주 이내인 경우에는 유산한 날부터 10일까지 유산휴가를 주어야 합니다. 따라서 임신 13주에 유산한 직원에게는 유산한 날부터 10일의 유산휴가를 부여해야 합니다. [S1]\n\n직원이 유산ㆍ사산휴가를 청구하려면 휴가 청구 사유, 유산ㆍ사산 발생일 및 임신기간 등을 적은 신청서에 의료기관의 진단서를 첨부하여 사업주에게 제출해야 합니다. [S1]\n\n유산ㆍ사산휴가 중 최초 60일은 유급입니다. [S2]", "reference": "임신기간이 15주 이내이므로 유산한 날부터 10일까지 유산휴가를 주어야 합니다(근로기준법 시행령 제43조제3항제1호).", "judges": {"opus": {"ok": true, "quote": "임신기간이 15주 이내인 경우에는 유산한 날부터 10일까지 유산휴가를 주어야 합니다.", "reason": "답변이 '임신기간 15주 이내'와 '유산한 날부터 10일까지'를 정답과 같은 의미로 명시하며, '사산'은 빠졌지만 질문이 유산 사례라 핵심 사실은 모두 담겨 있다."}, "codex": {"ok": true, "quote": "임신기간이 15주 이내인 경우에는 유산한 날부터 10일까지 유산휴가를 주어야 합니다.", "reason": "질문의 유산 사례에 대해 임신기간 15주 이내라는 조건과 유산한 날부터 10일까지라는 휴가 기간을 명시했습니다."}}}, {"key": "n23-kp1", "id": "n23", "level": "L4", "question": "난임치료휴가를 썼다는 이유로 회사에서 징계를 받았습니다. 회사가 징역이나 벌금 같은 형사처벌을 받을 수 있나요?", "kp_index": 1, "all_kps": ["난임치료휴가를 이유로 한 해고·징계 등 불리한 처우를 3년 이하 징역 또는 3천만원 이하 벌금 대상으로 추가하는 벌칙 개정(2026.5.26 공포)이 있음", "해당 벌칙은 2026-11-27 시행 예정으로 2026-10-01 현재 제37조에는 난임치료휴가 불리한 처우에 대한 벌칙이 없음"], "answer": "네. 사업주는 난임치료휴가를 이유로 근로자에게 해고·징계 등 불리한 처우를 해서는 안 됩니다. [S1]\n\n다만 제공된 근거상 난임치료휴가를 이유로 징계한 경우의 형사처벌 조항은 확인되지 않습니다. 제37조 제2항의 3년 이하 징역 또는 3천만 원 이하 벌금 대상에는 제18조의3 제2항 위반이 열거되어 있지 않습니다. [S2]\n\n대신 사업주가 난임치료휴가를 주지 않은 경우에는 500만 원 이하의 과태료 대상입니다. [S3] 난임치료휴가 신청은 사용하려는 날과 신청 연월일 등을 적은 문서로 해야 하며, 사업주는 난임치료 사실을 증명할 서류를 요구할 수 있습니다. [S11]\n\n따라서 제공된 근거만으로는 회사가 난임치료휴가를 이유로 징계했다는 사정만으로 징역이나 벌금의 형사처벌을 받는다고 단정할 수 없고, 과태료 조항도 휴가를 주지 않은 경우에 관한 것입니다. [S2][S3]\n\n참고로 난임치료휴가 관련 개정 내용은 2026년 11월 27일부터 시행될 예정이며, 최초 유급일수가 2일에서 4일로 변경됩니다. 기준일인 2026년 10월 1일 현재는 연간 6일 이내 중 최초 2일이 유급입니다. [S1]", "reference": "난임치료휴가를 이유로 한 불리한 처우를 3년 이하의 징역 또는 3천만원 이하의 벌금으로 처벌하는 남녀고용평등법 제37조제2항제2호의3은 2026.5.26 공포된 개정으로 신설되었지만 2026년 11월 27일 시행 예정입니다. 따라서 2026년 10월 1일 현재 제37조에는 이에 대한 벌칙이 없으며, 불리한 처우 금지 의무(제18조의3제2항) 자체는 현재도 적용됩니다.", "judges": {"opus": {"ok": false, "quote": "참고로 난임치료휴가 관련 개정 내용은 2026년 11월 27일부터 시행될 예정이며, 최초 유급일수가 2일에서 4일로 변경됩니다.", "reason": "답변은 개정 내용으로 유급일수 변경만 언급하고, 2026.5.26 공포된 개정으로 불리한 처우가 3년 이하 징역 또는 3천만원 이하 벌금 대상에 추가된다는 사실은 언급하지 않습니다."}, "codex": {"ok": false, "quote": "다만 제공된 근거상 난임치료휴가를 이유로 징계한 경우의 형사처벌 조항은 확인되지 않습니다.", "reason": "불리한 처우를 3년 이하 징역 또는 3천만원 이하 벌금 대상으로 추가하는 개정과 2026년 5월 26일 공포 사실이 없습니다."}}}, {"key": "l5a08-kp3", "id": "l5a08", "level": "L5a", "question": "6개월짜리 계약직으로 일하기로 했는데 회사가 근로계약서에 임금 계산 방법이나 휴일, 연차 같은 내용을 하나도 적어주지 않았습니다. 회사는 계약직은 기간제법만 적용돼서 과태료 문제일 뿐이라고 하는데, 계약직에게도 근로기준법상 근로조건 명시 의무가 적용되나요?", "kp_index": 3, "all_kps": ["사용자는 근로계약 체결 시 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시해야 함(근로기준법 제17조 제1항)", "기간제근로자도 근로기준법상 근로자이므로 제17조가 적용됨", "기간제법이 적용된다는 이유로 근로기준법 제17조 의무가 배제되지 않음"], "answer": "네. 계약직 근로자에게도 근로기준법상 근로조건 명시 의무가 적용됩니다. 근로기준법은 근로계약 체결 시 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시하고, 임금의 구성항목·계산방법·지급방법과 소정근로시간·휴일·연차 유급휴가가 적힌 서면을 교부하도록 정합니다. [S2]\n\n기간제근로자는 근로기준법상 근로자에 해당하므로, 6개월 계약직이라는 이유만으로 근로기준법 제17조의 적용이 배제되지 않습니다. [S8]\n\n대법원은 기간제 근로계약에도 근로기준법 제17조와 그 벌칙 조항이 적용되고, 기간제법이 같은 위반행위에 과태료를 정하고 있다는 이유만으로 근로기준법의 적용이 배제되지 않는다고 판단했습니다(대법원 2024. 6. 27. 선고 2020도16541 판결). [S13]\n\n따라서 회사가 임금 계산방법, 휴일, 연차 유급휴가 등을 서면으로 명시·교부하지 않았다면 기간제법상 과태료 문제뿐 아니라 근로기준법상 의무 위반도 문제될 수 있습니다. 기간제법도 기간제근로자와 계약을 체결할 때 근로계약기간, 근로시간·휴게, 임금의 구성항목·계산방법·지불방법, 휴일·휴가 등을 서면으로 명시하도록 합니다. [S1] 기간제법상 서면 명시 의무 위반에는 500만 원 이하의 과태료가 규정되어 있습니다. [S7]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "적용됩니다. 근로기준법 제17조제1항은 사용자가 근로계약을 체결할 때 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시하도록 정하고 있고, 기간제근로자도 근로기준법상 근로자이므로 이 의무가 적용됩니다. 기간제법에 근로기준법 제17조의 적용을 배제하는 규정이 없으므로, 기간제법에 과태료 규정이 있다는 이유로 근로기준법상 의무와 벌칙(제114조제1호)이 사라지지 않습니다.", "judges": {"opus": {"ok": true, "quote": "대법원은 기간제 근로계약에도 근로기준법 제17조와 그 벌칙 조항이 적용되고, 기간제법이 같은 위반행위에 과태료를 정하고 있다는 이유만으로 근로기준법의 적용이 배제되지 않는다고 판단했습니다(대법원 2024. 6. 27. 선고 2020도16541 판결).", "reason": "답변은 기간제법이 적용되거나 과태료를 정하고 있다는 이유로 근로기준법 제17조 의무가 배제되지 않는다고 명시해 정답 포인트와 일치합니다."}, "codex": {"ok": true, "quote": "대법원은 기간제 근로계약에도 근로기준법 제17조와 그 벌칙 조항이 적용되고, 기간제법이 같은 위반행위에 과태료를 정하고 있다는 이유만으로 근로기준법의 적용이 배제되지 않는다고 판단했습니다(대법원 2024. 6. 27. 선고 2020도16541 판결).", "reason": "기간제법이 같은 위반행위에 과태료를 정하더라도 근로기준법 제17조의 적용이 배제되지 않는다고 명시합니다."}}}, {"key": "l5a06-kp2", "id": "l5a06", "level": "L5a", "question": "저는 회사 노사협의회 근로자위원입니다. 사측 위원인 의장이 '논의할 안건이 없다'며 1년 가까이 정기회의를 한 번도 열지 않았습니다. 안건이 없으면 정기회의를 열지 않아도 되는 건가요?", "kp_index": 2, "all_kps": ["노사협의회는 3개월마다 정기적으로 회의를 개최해야 함(근로자참여법 제12조 제1항)", "구체적 안건이 있는지와 관계없이 정기회의 개최 의무가 있음", "정기회의를 개최하지 않으면 벌칙 대상(제32조)"], "answer": "아닙니다. 노사협의회는 논의할 구체적인 안건이 없어도 3개월마다 정기회의를 개최해야 합니다. [S1]\n\n대법원도 노사협의회는 협의 사항이나 의결 사항에 관한 구체적인 안건이 있는지와 관계없이 3개월마다 정기회의를 개최해야 하고, 사용자는 정기회의에서 경영계획·실적, 분기별 생산계획·실적, 인력계획, 기업의 경제적·재정적 상황을 성실히 보고하거나 설명해야 한다고 판단했습니다(대법원 2025. 5. 1. 선고 2025도2059 판결). [S11]\n\n따라서 의장이 ‘논의할 안건이 없다’는 이유로 1년 가까이 정기회의를 개최하지 않은 것은 제12조 제1항의 정기회의 개최 의무에 어긋날 수 있습니다. [S1] 사용자가 정기회의를 정기적으로 개최하지 않으면 200만 원 이하의 벌금 대상이 될 수 있습니다. [S3]\n\n또한 노사 일방의 대표자가 회의 목적을 문서로 밝혀 소집을 요구하면 의장은 그 요구에 따라야 하며, 원칙적으로 회의 개최 7일 전까지 회의 일시·장소·의제 등을 각 위원에게 통보해야 합니다. [S2]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "아닙니다. 근로자참여 및 협력증진에 관한 법률 제12조제1항에 따라 노사협의회는 3개월마다 정기적으로 회의를 열어야 하며, 논의할 안건이 있는지와 관계없이 이 의무가 있습니다. 정기회의를 개최하지 않으면 제32조에 따른 벌칙 대상입니다.", "judges": {"opus": {"ok": true, "quote": "대법원도 노사협의회는 협의 사항이나 의결 사항에 관한 구체적인 안건이 있는지와 관계없이 3개월마다 정기회의를 개최해야 하고", "reason": "구체적 안건 유무와 관계없이 개최 의무가 있다고 명시함."}, "codex": {"ok": true, "quote": "노사협의회는 논의할 구체적인 안건이 없어도 3개월마다 정기회의를 개최해야 합니다. [S1]", "reason": "구체적인 안건이 없어도 정기회의를 개최해야 한다고 명시했습니다."}}}, {"key": "n19-kp2", "id": "n19", "level": "L4", "question": "최저임금을 지키지 않는 회사를 감독하는 공무원을 이제 '노동감독관'이라고 부른다던데, 지금 최저임금법상 감독은 누가 맡고 있나요?", "kp_index": 2, "all_kps": ["현행 최저임금법상 「근로기준법」 제101조에 따른 근로감독관이 최저임금법 시행 사무를 관장하고 사업장 출입·서류 제출 요구·검사·질문을 할 수 있음", "「노동감독관 직무집행법」에 따른 노동감독관으로 바꾸는 개정은 2026-12-08 시행 예정으로 아직 미시행"], "answer": "현재 최저임금법상 감독 업무는 「근로기준법」 제101조에 따른 **근로감독관**이 담당합니다. [S2][S4]\n\n고용노동부장관은 근로감독관에게 최저임금법 시행에 관한 사무를 관장하도록 하고, 근로감독관은 사업장에 출입하여 장부·서류 제출을 요구하거나 물건을 검사하고 관계인에게 질문할 수 있습니다. [S2]\n\n근로감독관은 소속 지방고용노동관서의 장의 지휘·감독을 받습니다. [S1] 또한 최저임금 적용 제외 인가, 임금 관련 보고 요구, 과태료 부과·징수 권한은 지방고용노동관서의 장에게 위임되어 있습니다. [S3][S8][S11][S12]\n\n따라서 **2026년 10월 1일 현재 명칭과 법적 근거는 ‘근로감독관’**입니다. 다만 2026년 12월 8일부터는 관련 조문이 개정되어 ‘노동감독관’이라는 명칭과 「노동감독관 직무집행법」에 따른 규율이 시행될 예정입니다. [S2][S4]", "reference": "2026년 10월 1일 현재 최저임금법 제26조에 따라 고용노동부장관은 「근로기준법」 제101조에 따른 근로감독관에게 최저임금법 시행 사무를 맡기며, 근로감독관은 사업장 출입, 장부·서류 제출 요구, 검사와 질문을 할 수 있습니다. 명칭을 「노동감독관 직무집행법」에 따른 노동감독관으로 바꾸는 개정(2026.4.7 공포)은 2026년 12월 8일 시행 예정입니다.", "judges": {"opus": {"ok": true, "quote": "따라서 **2026년 10월 1일 현재 명칭과 법적 근거는 ‘근로감독관’**입니다. 다만 2026년 12월 8일부터는 관련 조문이 개정되어 ‘노동감독관’이라는 명칭과 「노동감독관 직무집행법」에 따른 규율이 시행될 예정입니다.", "reason": "노동감독관 직무집행법에 따른 개정이 2026-12-08 시행 예정이고 현재는 근로감독관이라 아직 미시행이라는 점이 명시되어 있다."}, "codex": {"ok": true, "quote": "따라서 **2026년 10월 1일 현재 명칭과 법적 근거는 ‘근로감독관’**입니다. 다만 2026년 12월 8일부터는 관련 조문이 개정되어 ‘노동감독관’이라는 명칭과 「노동감독관 직무집행법」에 따른 규율이 시행될 예정입니다. [S2][S4]", "reason": "「노동감독관 직무집행법」에 따른 노동감독관으로의 변경이 2026년 12월 8일 시행 예정이며 현재는 미시행임을 명시했습니다."}}}, {"key": "l5b03-kp3", "id": "l5b03", "level": "L5b", "question": "의원과 '위탁진료계약'을 맺고 2년간 봉직의로 일했습니다. 주중과 토요일 대부분을 그 의원에서 진료했고, 진료 실적과 상관없이 매달 고정된 금액을 받았으며 매달 진료 현황을 보고했습니다. 계약서가 위탁계약이라 퇴직금이 없다고 하는데, 저도 퇴직금을 받을 수 있나요?", "kp_index": 3, "all_kps": ["퇴직금 대상 근로자는 직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람임(근로기준법 제2조제1항제1호, 퇴직급여법 제2조제1호)", "판례: 근로자 여부는 계약 형식보다 실질에 비추어 임금을 목적으로 종속적 관계에서 근로를 제공했는지로 판단함", "판례: 위탁진료계약 형식이라도 정해진 시간·장소 근무, 실적 무관 고정 보수, 진료 현황 보고 등이 있으면 근로기준법상 근로자(퇴직금 지급 대상)에 해당함"], "answer": "계약서의 명칭이 ‘위탁진료계약’인지보다 실제로 임금을 목적으로 종속적인 관계에서 근로를 제공했는지가 중요합니다. 근로자퇴직급여 보장법상 ‘근로자’는 근로기준법상 근로자를 말하고, 사용자는 퇴직급여제도를 설정해야 합니다. [S7] [S3]\n\n제시하신 사정인 ① 2년간 계속 근무한 점, ② 주중과 토요일 대부분 의원에서 진료한 점, ③ 진료 실적과 무관하게 매월 고정액을 받은 점, ④ 매월 진료 현황을 보고한 점은 종속적인 관계에서 근로를 제공했는지를 판단할 때 중요한 사정입니다. [S14]\n\n대법원은 위탁진료계약의 형식에도 불구하고, 정해진 시간과 장소에서 진료하고 고정된 보수를 받으며 근무 현황을 보고한 의사를 근로기준법상 근로자로 판단했습니다(대법원 2023. 9. 21. 선고 2021도11675 판결). [S14] 따라서 질문의 사실관계가 판례 사안과 같다면 근로자로 인정되어 퇴직금을 받을 가능성이 있습니다. [S14]\n\n퇴직금제도를 설정한 사용자는 계속근로기간 1년에 대하여 30일분 이상의 평균임금을 퇴직금으로 지급하는 제도를 설정해야 합니다. [S3] 다만 실제 지급 여부와 금액은 근로자성, 계속근로기간 및 평균임금 등 구체적인 사실관계에 따라 판단됩니다. [S3] [S14]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "받을 수 있을 가능성이 큽니다. 퇴직금을 받는 '근로자'는 근로기준법 제2조제1항제1호에 따라 '직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람'이고, 근로자퇴직급여 보장법도 이 정의를 따릅니다(제2조제1호). 위탁진료계약을 맺은 의사가 이 근로자에 해당하는지는 조문에 판단 기준이 없습니다. 대법원은 의원과 위탁진료계약을 맺고 진료한 의사의 퇴직금이 문제 된 사안에서, 근로자 여부는 계약 형식보다 실질에 비추어 임금을 목적으로 종속적인 관계에서 근로를 제공했는지로 판단해야 한다고 하면서, 계약 형식이 위탁진료계약이더라도 주중과 토요일 대부분을 그 의원에서 근무하고 진료 현황을 보고했으며 실적과 관계없이 고정 보수를 받았다면 근로기준법상 근로자에 해당한다고 판단했습니다(대법원 2023. 9. 21. 선고 2021도11675 판결). 근로자라면 사용자는 퇴직일부터 14일 이내에 퇴직금을 지급해야 합니다(근로자퇴직급여 보장법 제9조제1항). 다만 근로자성은 구체적 근무 실태에 따라 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "대법원은 위탁진료계약의 형식에도 불구하고, 정해진 시간과 장소에서 진료하고 고정된 보수를 받으며 근무 현황을 보고한 의사를 근로기준법상 근로자로 판단했습니다(대법원 2023. 9. 21. 선고 2021도11675 판결).", "reason": "위탁진료계약 형식이라도 정해진 시간·장소 근무, 고정 보수, 현황 보고가 있으면 근로자로 본 판례를 명시하고, 이에 따라 퇴직금 수령 가능성도 언급했습니다."}, "codex": {"ok": true, "quote": "제시하신 사정인 ① 2년간 계속 근무한 점, ② 주중과 토요일 대부분 의원에서 진료한 점, ③ 진료 실적과 무관하게 매월 고정액을 받은 점, ④ 매월 진료 현황을 보고한 점은 종속적인 관계에서 근로를 제공했는지를 판단할 때 중요한 사정입니다. [S14]\n\n대법원은 위탁진료계약의 형식에도 불구하고, 정해진 시간과 장소에서 진료하고 고정된 보수를 받으며 근무 현황을 보고한 의사를 근로기준법상 근로자로 판단했습니다(대법원 2023. 9. 21. 선고 2021도11675 판결). [S14] 따라서 질문의 사실관계가 판례 사안과 같다면 근로자로 인정되어 퇴직금을 받을 가능성이 있습니다. [S14]", "reason": "위탁계약 형식에도 정해진 시간·장소 근무, 실적과 무관한 고정 보수, 현황 보고를 근거로 근로자성을 인정한 판례와 퇴직금 수급 가능성을 설명하고 있습니다."}}}, {"key": "g024-kp3", "id": "g024", "level": "L3", "question": "무주택자인데 전세보증금 때문에 퇴직금 중간정산을 받을 수 있나요? 몇 번까지 되나요?", "kp_index": 3, "all_kps": ["주택구입 등 대통령령 사유로 근로자가 요구하면 퇴직 전 중간정산 가능", "무주택자가 주거 목적으로 전세금 또는 보증금을 부담하는 경우가 사유에 해당", "하나의 사업에 근로하는 동안 1회로 한정"], "answer": "네. 무주택자인 근로자가 주거 목적으로 전세금 또는 보증금을 부담하는 경우에는 퇴직금 중간정산 사유에 해당할 수 있습니다. [S1]\n\n다만 근로자가 하나의 사업에 근로하는 동안 전세금 또는 보증금 부담을 사유로 중간정산을 받을 수 있는 횟수는 1회로 한정됩니다. [S1]\n\n중간정산은 근로자가 퇴직하기 전에 요구하는 경우 사용자가 미리 정산하여 지급할 수 있는 제도이며, 사용자가 반드시 지급해야 하는 것은 조문상 명시되어 있지 않습니다. [S2]", "reference": "가능합니다. 무주택자가 주거 목적으로 전세금이나 보증금을 부담하는 경우는 중간정산 사유이며, 하나의 사업에 근로하는 동안 1회로 한정됩니다. 정산 후 계속근로기간은 정산시점부터 새로 계산합니다(근로자퇴직급여 보장법 제8조제2항, 시행령 제3조제1항제2호).", "judges": {"opus": {"ok": true, "quote": "다만 근로자가 하나의 사업에 근로하는 동안 전세금 또는 보증금 부담을 사유로 중간정산을 받을 수 있는 횟수는 1회로 한정됩니다.", "reason": "하나의 사업에 근로하는 동안 1회로 한정된다는 내용이 정답 포인트와 일치한다."}, "codex": {"ok": true, "quote": "다만 근로자가 하나의 사업에 근로하는 동안 전세금 또는 보증금 부담을 사유로 중간정산을 받을 수 있는 횟수는 1회로 한정됩니다. [S1]", "reason": "하나의 사업에 근로하는 동안 해당 사유의 중간정산은 1회로 한정된다고 명시했습니다."}}}, {"key": "l5a07-kp2", "id": "l5a07", "level": "L5a", "question": "건설현장에서 건설업 등록이 없는 하청업체 소속으로 일했는데 하청업체가 임금을 주지 않았습니다. 이 하청업체에 일을 준 회사는 건설업 등록 업체이고, 그 위에 원청이 또 있습니다. 근로기준법 제44조의2에 따라 하청업체와 연대해서 제 임금을 책임지는 건 누구인가요?", "kp_index": 2, "all_kps": ["건설업에서 2차례 이상 공사도급이 이루어지고 건설사업자가 아닌 하수급인이 임금을 지급하지 못하면 직상 수급인이 하수급인과 연대하여 임금 지급 책임을 짐(근로기준법 제44조의2 제1항)", "제44조의2의 연대책임 주체는 직상 수급인(건설사업자가 아닌 하수급인에게 하도급을 준 건설사업자)으로 한정됨"], "answer": "건설업에서 2차례 이상 도급이 이루어지고, 건설사업자가 아닌 하수급인이 근로자에게 해당 건설공사 임금을 지급하지 못한 경우에는 **그 하수급인에게 직접 일을 준 직상 수급인**이 하수급인과 연대하여 임금을 지급할 책임을 집니다. [S1]\n\n따라서 질문의 경우에는 **건설업 등록이 없는 하청업체에 직접 일을 준 건설업 등록 업체**가 하청업체와 연대책임을 부담합니다. 그 회사가 원청으로부터 공사를 받은 수급인이라면, 원청이 아니라 우선 그 회사가 제44조의2상 직상 수급인입니다. [S1]\n\n직상 수급인이 건설사업자가 아닌 경우에는 그 상위 수급인 중 최하위 건설사업자를 직상 수급인으로 봅니다. [S1] 질문에서는 직상 수급인이 건설업 등록 업체이므로 이 예외 규정에 따라 원청을 직상 수급인으로 보지는 않습니다. [S1]\n\n대법원은 건설업 등록이 없는 하수급인이 임금을 지급하지 않았다면, 직상 수급인은 자신에게 귀책사유가 있는지 또는 하수급인에게 공사대금을 지급했는지와 관계없이 하수급인과 연대하여 임금을 지급할 책임이 있다고 판단했습니다(대법원 2021. 7. 8. 선고 2020다296321 판결) [S11]. 대법원은 또한 근로자가 임금 수령권한을 하수급인에게 위임했더라도, 하수급인이 근로자에게 지급하지 않았다면 직상 수급인이 제44조의2상 책임을 면하지 않는다고 판단했습니다(대법원 2024. 6. 27. 선고 2024도4055 판결) [S12]. 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "건설업 등록이 없는 하청업체에 일을 준 직상 수급인(건설업 등록 업체)이 하청업체와 연대해 임금 지급 책임을 집니다(근로기준법 제44조의2제1항). 이 조항의 연대책임은 직상 수급인에게 지워지며, 그 위의 원청은 이 조항에 따른 연대책임 주체가 아닙니다.", "judges": {"opus": {"ok": true, "quote": "따라서 질문의 경우에는 **건설업 등록이 없는 하청업체에 직접 일을 준 건설업 등록 업체**가 하청업체와 연대책임을 부담합니다. 그 회사가 원청으로부터 공사를 받은 수급인이라면, 원청이 아니라 우선 그 회사가 제44조의2상 직상 수급인입니다.", "reason": "연대책임 주체를 하수급인에게 하도급을 준 건설사업자인 직상 수급인으로 특정하고 원청은 제외함. 다만 '우선'이라는 표현이 다소 모호하지만, '원청을 직상 수급인으로 보지는 않습니다'라는 문장이 있어 직상 수급인으로 한정된다는 취지가 드러남."}, "codex": {"ok": true, "quote": "따라서 질문의 경우에는 **건설업 등록이 없는 하청업체에 직접 일을 준 건설업 등록 업체**가 하청업체와 연대책임을 부담합니다. 그 회사가 원청으로부터 공사를 받은 수급인이라면, 원청이 아니라 우선 그 회사가 제44조의2상 직상 수급인입니다. [S1]\n\n직상 수급인이 건설사업자가 아닌 경우에는 그 상위 수급인 중 최하위 건설사업자를 직상 수급인으로 봅니다. [S1] 질문에서는 직상 수급인이 건설업 등록 업체이므로 이 예외 규정에 따라 원청을 직상 수급인으로 보지는 않습니다. [S1]", "reason": "질문의 연대책임 주체를 미등록 하청업체에 직접 하도급을 준 등록 업체로 특정하고 상위 원청은 직상 수급인이 아니라고 명시했습니다."}}}, {"key": "g028-kp3", "id": "g028", "level": "L3", "question": "육아휴직 1년 중 4개월만 사용했습니다. 남은 기간을 반영하면 육아기 근로시간 단축은 최대 얼마나 쓸 수 있나요?", "kp_index": 3, "all_kps": ["육아휴직 기간은 원칙 1년 이내", "육아기 근로시간 단축 기간은 1년 이내이나 육아휴직 미사용 기간의 두 배를 가산", "1년 + (8개월 × 2) = 2년 4개월(28개월)"], "answer": "육아기 근로시간 단축 기간은 원칙적으로 1년 이내입니다. 다만 육아휴직 기간 중 사용하지 않은 기간이 있으면 그 기간의 2배를 가산한 기간 이내로 사용할 수 있습니다. [S1]\n\n육아휴직 1년 중 4개월을 사용했다면 남은 8개월의 2배인 16개월을 가산할 수 있으므로, 육아기 근로시간 단축은 최대 **2년 4개월(28개월)**까지 가능합니다. [S1]\n\n다만 단축 후 근로시간은 주당 15시간 이상 35시간 이하여야 하고, 육아기 근로시간 단축을 나누어 사용하는 경우 1회 기간은 1개월 이상이어야 합니다. [S1][S2]", "reference": "육아기 근로시간 단축은 기본 1년이고, 제19조제2항 본문의 육아휴직 기간(1년) 중 사용하지 않은 8개월의 두 배인 16개월을 더해 최대 28개월(2년 4개월)까지 쓸 수 있습니다(남녀고용평등법 제19조의2제4항).", "judges": {"opus": {"ok": true, "quote": "남은 8개월의 2배인 16개월을 가산할 수 있으므로, 육아기 근로시간 단축은 최대 **2년 4개월(28개월)**까지 가능합니다.", "reason": "1년에 8개월×2=16개월을 더한 2년 4개월(28개월)이라는 계산과 결과를 모두 제시했다."}, "codex": {"ok": true, "quote": "육아휴직 1년 중 4개월을 사용했다면 남은 8개월의 2배인 16개월을 가산할 수 있으므로, 육아기 근로시간 단축은 최대 **2년 4개월(28개월)**까지 가능합니다. [S1]", "reason": "기본 1년에 미사용 8개월의 두 배인 16개월을 가산한 최대 2년 4개월(28개월)을 명시했습니다."}}}, {"key": "g037-kp2", "id": "g037", "level": "L4", "question": "직장 내 성희롱 예방교육은 법인 대표나 상급자도 의무적으로 들어야 하나요?", "kp_index": 2, "all_kps": ["현행 제13조제2항은 사업주 및 근로자가 성희롱 예방 교육을 받아야 한다고 규정", "법인의 대표자·상급자를 수강 의무자로 명시하는 개정이 공포됨", "그 개정은 2026-11-27 시행 예정"], "answer": "네. 현재 시행 중인 조문에 따르면 사업주와 근로자는 직장 내 성희롱 예방교육을 받아야 합니다. [S1]\n\n따라서 법인의 대표자가 사업주에 해당하거나 근로자인 경우에는 교육 대상입니다. 다만, 2026년 11월 27일부터는 법인 대표자와 상급자도 명시적으로 교육 대상에 포함됩니다. [S1]\n\n교육은 연 1회 이상 실시해야 하며, 법령, 성희롱 발생 시 처리 절차와 조치 기준, 피해 근로자의 상담·구제 절차 등을 포함해야 합니다. [S2]\n\n2026년 11월 27일 시행 예정인 개정 내용은 공포일인 2026년 5월 26일에 따라 시행됩니다. [S1]", "reference": "현행 조문은 사업주와 근로자에게 수강 의무를 두고 있습니다. 법인의 대표자와 상급자를 명시하는 개정이 공포됐으며 2026년 11월 27일부터 시행됩니다.", "judges": {"opus": {"ok": true, "quote": "다만, 2026년 11월 27일부터는 법인 대표자와 상급자도 명시적으로 교육 대상에 포함됩니다. [S1]", "reason": "법인 대표자·상급자를 명시적 교육 대상으로 포함하는 개정을 언급했고, '공포일인 2026년 5월 26일'이라는 문장으로 공포 사실도 밝혔습니다."}, "codex": {"ok": true, "quote": "다만, 2026년 11월 27일부터는 법인 대표자와 상급자도 명시적으로 교육 대상에 포함됩니다. [S1]\n\n교육은 연 1회 이상 실시해야 하며, 법령, 성희롱 발생 시 처리 절차와 조치 기준, 피해 근로자의 상담·구제 절차 등을 포함해야 합니다. [S2]\n\n2026년 11월 27일 시행 예정인 개정 내용은 공포일인 2026년 5월 26일에 따라 시행됩니다. [S1]", "reason": "법인 대표자와 상급자를 교육 대상에 명시적으로 포함하는 개정 내용과 그 공포 사실을 명시합니다."}}}, {"key": "l5b09-kp2", "id": "l5b09", "level": "L5b", "question": "계약직으로 2년 넘게 같은 업무를 계속해서 무기계약 근로자로 간주됐습니다. 그런데 회사는 제 임금과 수당은 예전 계약직 기준 그대로라고 합니다. 같은 일을 하는 기간 없는 계약 직원들에게 적용되는 취업규칙의 임금 기준을 저도 적용받을 수 있나요?", "kp_index": 2, "all_kps": ["예외 사유 없이 2년을 초과해 사용된 기간제근로자는 기간의 정함이 없는 근로계약을 체결한 근로자로 봄(기간제법 제4조제2항)", "판례: 무기계약으로 간주된 근로자에게는 동종·유사 업무의 기간 없는 계약 근로자가 있으면 달리 정함이 없는 한 그 근로자에게 적용되는 취업규칙 등이 동일하게 적용됨", "취업규칙 기준에 미달하는 근로계약 부분은 무효이고 취업규칙 기준에 따름(근로기준법 제97조)"], "answer": "기간제근로자를 2년을 초과하여 사용하면 기간의 정함이 없는 근로계약을 체결한 근로자로 간주됩니다. [S13]\n\n이 경우 같은 사업 또는 사업장에서 동종·유사 업무에 종사하는 기간의 정함이 없는 근로자에게 적용되는 취업규칙 등이 달리 정해져 있지 않다면 원칙적으로 동일하게 적용됩니다. 따라서 회사가 별도의 특별한 사정을 제시하지 못한다면, 같은 일을 하는 기간의 정함이 없는 근로자에게 적용되는 취업규칙의 임금·수당 기준을 적용받을 수 있습니다. [S13]\n\n또한 기간제근로자라는 이유로 동종·유사 업무의 기간의 정함이 없는 근로자보다 차별적 처우를 해서는 안 됩니다. [S3]\n\n취업규칙의 기준보다 낮은 임금·수당을 정한 근로계약 부분은 무효이고, 그 부분은 취업규칙의 기준에 따릅니다. [S1] 근로자와 사용자는 취업규칙과 근로계약을 지키고 성실히 이행할 의무가 있습니다. [S6]\n\n대법원은 기간의 정함이 없는 근로계약을 체결한 것으로 간주된 근로자에게 동종·유사 업무의 무기계약 근로자에게 적용되는 취업규칙 등을 원칙적으로 동일하게 적용해야 한다고 판단했습니다(대법원 2019. 12. 24. 선고 2015다254873 판결) [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "적용받을 수 있습니다. 기간제법 제4조제2항에 따라 예외 사유 없이 2년을 초과해 사용된 기간제근로자는 기간의 정함이 없는 근로계약을 체결한 근로자로 보지만, 이 조항은 간주된 뒤의 임금 등 근로조건을 정하지 않습니다. 대법원은 무기계약으로 간주된 근로자의 임금이 문제 된 사안에서, 해당 사업장에 동종 또는 유사한 업무에 종사하는 기간의 정함이 없는 근로계약 근로자가 있으면 달리 정함이 없는 한 그 근로자에게 적용되는 취업규칙 등이 동일하게 적용된다고 판단했습니다(대법원 2019. 12. 24. 선고 2015다254873 판결). 이때 근로기준법 제97조에 따라 취업규칙에서 정한 기준에 미달하는 근로계약 부분은 무효가 되고 취업규칙 기준에 따릅니다. 다만 동종·유사 업무인지, 달리 정한 사정이 있는지 등 구체적 사실관계에 따라 결론이 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "대법원은 기간의 정함이 없는 근로계약을 체결한 것으로 간주된 근로자에게 동종·유사 업무의 무기계약 근로자에게 적용되는 취업규칙 등을 원칙적으로 동일하게 적용해야 한다고 판단했습니다(대법원 2019. 12. 24. 선고 2015다254873 판결)", "reason": "무기계약 간주 근로자에게 동종·유사 업무의 기간 없는 계약 근로자의 취업규칙 등이 달리 정함이 없는 한 동일하게 적용된다는 판례 내용을 명시합니다."}, "codex": {"ok": true, "quote": "이 경우 같은 사업 또는 사업장에서 동종·유사 업무에 종사하는 기간의 정함이 없는 근로자에게 적용되는 취업규칙 등이 달리 정해져 있지 않다면 원칙적으로 동일하게 적용됩니다. 대법원은 기간의 정함이 없는 근로계약을 체결한 것으로 간주된 근로자에게 동종·유사 업무의 무기계약 근로자에게 적용되는 취업규칙 등을 원칙적으로 동일하게 적용해야 한다고 판단했습니다(대법원 2019. 12. 24. 선고 2015다254873 판결) [S13]", "reason": "무기계약으로 간주된 근로자에게 동종·유사 업무의 무기계약 근로자가 적용받는 취업규칙 등이 달리 정함이 없는 한 동일하게 적용된다는 내용과 판례를 명시했습니다."}}}, {"key": "n27-kp2", "id": "n27", "level": "L3", "question": "회사에 노사협의회를 새로 만들었습니다. 협의회 규정에는 무엇을 꼭 넣어야 하고, 언제까지 어디에 제출해야 하나요?", "kp_index": 2, "all_kps": ["협의회규정은 협의회 설치일부터 15일 이내에 고용노동부장관에게 제출해야 함", "필수 기재 사항(시행령): 위원 수, 근로자위원 선출 절차·후보 등록, 사용자위원 자격, 근로 간주 시간, 회의 소집·회기 등 운영, 임의 중재 방법·절차, 고충처리위원 수 및 고충처리", "협의회규정 제정·변경 시 협의회 의결을 거쳐야 함"], "answer": "협의회규정에는 다음 사항을 반드시 포함해야 합니다. [S3]\n\n1. 협의회 위원의 수 [S3]  \n2. 근로자위원의 선출 절차와 후보 등록에 관한 사항 [S3]  \n3. 사용자위원의 자격에 관한 사항 [S3]  \n4. 협의회 위원이 근로한 것으로 보는 시간에 관한 사항 [S3]  \n5. 회의 소집, 회기 및 그 밖의 협의회 운영에 관한 사항 [S3]  \n6. 임의 중재의 방법·절차 등에 관한 사항 [S3]  \n7. 고충처리위원의 수 및 고충처리에 관한 사항 [S3]  \n\n협의회규정을 제정할 때에는 협의회의 의결을 거쳐야 합니다. [S3]\n\n협의회를 설치한 날부터 15일 이내에 협의회규정을 고용노동부장관에게 제출해야 합니다. [S1] 제출 업무는 관할 지방고용노동관서의 장에게 위임되어 있습니다. [S11]\n\n제출할 때에는 별지 제1호서식의 제정·변경 협의회규정 제출서에 제정된 개인회생, 임금 감소 제도 시행 등이 중간정산 사유에 해당합니다. [S12]\n\n- 퇴직급여제도를 설정하거나 다른 종류로 변경하려면 근로자대표의 동의가 필요하고, 제도의 내용을 근로자에게 불리하게 변경하려면 근로자대표의 동의가 필요합니다. [S5]\n\n- 퇴직연금제도가 폐지되거나 운영이 중단된 기간에는 퇴직금제도를 적용합니다. [S9]\n\n- 대법원은 월급이나 일당에 퇴직금을 포함해 미리 지급하기로 한 약정은 유효한 중간정산으로 인정되지 않는 한 원칙적으로 무효이고, 그 명목으로 지급한 금원도 퇴직금 지급의 효력이 없다고 판단했습니다(대법원 2011. 10. 13. 선고 2009도8248 판결). [S14] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "계속근로기간 1년에 대하여 30일분 이상의 평균임금을 퇴직금으로 지급하며(제8조①), 계속근로기간 1년 미만이거나 4주 평균 주 15시간 미만인 근로자는 퇴직급여제도 설정 의무 대상이 아닙니다(제4조①). 퇴직하면 지급사유 발생일부터 14일 이내에 지급해야 하고, 특별한 사정이 있으면 당사자 합의로 지급기일을 연장할 수 있습니다(제9조①).", "judges": {"opus": {"ok": true, "quote": "퇴직금제도를 설정한 경우 계속근로기간 1년에 대해 30일분 이상의 평균임금을 퇴직금으로 지급해야 합니다.", "reason": "계속근로기간 1년에 대해 30일분 이상의 평균임금을 지급한다는 내용이 수치와 의무 모두 일치한다."}, "codex": {"ok": true, "quote": "퇴직금제도를 설정한 경우 계속근로기간 1년에 대해 30일분 이상의 평균임금을 퇴직금으로 지급해야 합니다.", "reason": "계속근로기간 1년당 30일분 이상의 평균임금을 퇴직금으로 지급해야 한다고 명시합니다."}}}, {"key": "g024-kp2", "id": "g024", "level": "L3", "question": "무주택자인데 전세보증금 때문에 퇴직금 중간정산을 받을 수 있나요? 몇 번까지 되나요?", "kp_index": 2, "all_kps": ["주택구입 등 대통령령 사유로 근로자가 요구하면 퇴직 전 중간정산 가능", "무주택자가 주거 목적으로 전세금 또는 보증금을 부담하는 경우가 사유에 해당", "하나의 사업에 근로하는 동안 1회로 한정"], "answer": "네. 무주택자인 근로자가 주거 목적으로 전세금 또는 보증금을 부담하는 경우에는 퇴직금 중간정산 사유에 해당할 수 있습니다. [S1]\n\n다만 근로자가 하나의 사업에 근로하는 동안 전세금 또는 보증금 부담을 사유로 중간정산을 받을 수 있는 횟수는 1회로 한정됩니다. [S1]\n\n중간정산은 근로자가 퇴직하기 전에 요구하는 경우 사용자가 미리 정산하여 지급할 수 있는 제도이며, 사용자가 반드시 지급해야 하는 것은 조문상 명시되어 있지 않습니다. [S2]", "reference": "가능합니다. 무주택자가 주거 목적으로 전세금이나 보증금을 부담하는 경우는 중간정산 사유이며, 하나의 사업에 근로하는 동안 1회로 한정됩니다. 정산 후 계속근로기간은 정산시점부터 새로 계산합니다(근로자퇴직급여 보장법 제8조제2항, 시행령 제3조제1항제2호).", "judges": {"opus": {"ok": true, "quote": "네. 무주택자인 근로자가 주거 목적으로 전세금 또는 보증금을 부담하는 경우에는 퇴직금 중간정산 사유에 해당할 수 있습니다.", "reason": "무주택자가 주거 목적으로 전세금 또는 보증금을 부담하는 경우가 중간정산 사유에 해당한다고 명시했다."}, "codex": {"ok": true, "quote": "무주택자인 근로자가 주거 목적으로 전세금 또는 보증금을 부담하는 경우에는 퇴직금 중간정산 사유에 해당할 수 있습니다. [S1]", "reason": "무주택 근로자가 주거 목적으로 전세금 또는 보증금을 부담하는 경우를 중간정산 사유로 명시했습니다."}}}, {"key": "l5a03-kp3", "id": "l5a03", "level": "L5a", "question": "퇴사하면서 회사와 '퇴직금은 두 달 뒤에 주겠다'는 합의서를 썼습니다. 그런데 두 달이 지나도 퇴직금이 들어오지 않습니다. 회사는 지급 기한을 연장하기로 합의했으니 법 위반은 아니라고 하는데, 정말 그런가요?", "kp_index": 3, "all_kps": ["사용자는 퇴직 시 지급사유 발생일부터 14일 이내에 퇴직금을 지급해야 함(근로자퇴직급여 보장법 제9조 제1항)", "특별한 사정이 있으면 당사자 합의로 지급기일을 연장할 수 있음(제9조 제1항 단서)", "연장한 지급기일까지 지급하지 않으면 제9조 제1항 위반으로 형사처벌 대상(제43조 제1호)"], "answer": "아닙니다. 사용자는 근로자가 퇴직한 날부터 14일 이내에 퇴직금을 지급해야 하지만, 특별한 사정이 있으면 당사자 간 합의로 지급기일을 연장할 수 있습니다. [S6]\n\n다만 연장한 지급기일까지 퇴직금을 지급하지 않으면, 지급기일 연장 합의가 있었다는 이유만으로 법 위반이 없어지는 것은 아닙니다. [S6]\n\n대법원도 사용자가 퇴직 후 14일 이내에 지급기일을 연장하기로 합의했더라도, 연장한 지급기일까지 퇴직금을 지급하지 않으면 퇴직급여 보장법 위반죄가 성립한다고 판단했습니다(대법원 2023. 7. 13. 선고 2023도188 판결). [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n또한 퇴직금 지급이 늦어지면, 지급 사유 발생일부터 14일이 지난 다음 날부터 지급일까지 연 20%의 지연이자가 적용될 수 있습니다. 다만 법령상 지급 지연 사유가 있는 기간에는 지연이자가 적용되지 않을 수 있습니다. [S1] [S2] [S11]\n\n퇴직금 미지급은 5년 이하의 징역 또는 5천만 원 이하의 벌금 대상이 될 수 있습니다. [S8]", "reference": "법 위반입니다. 근로자퇴직급여 보장법 제9조제1항에 따라 퇴직금은 지급사유 발생일부터 14일 이내에 지급해야 하고, 특별한 사정이 있으면 당사자 합의로 지급기일을 연장할 수 있습니다. 그러나 연장하기로 합의한 기일까지도 지급하지 않았다면 제9조제1항 위반이며 제43조제1호에 따른 처벌 대상입니다.", "judges": {"opus": {"ok": true, "quote": "연장한 지급기일까지 퇴직금을 지급하지 않으면 퇴직급여 보장법 위반죄가 성립한다고 판단했습니다", "reason": "연장한 기일까지 지급하지 않으면 법 위반죄가 성립하고 형사처벌 대상(5년 이하 징역 또는 5천만 원 이하 벌금)이 된다고 명시합니다. 제43조 제1호라는 조문 번호는 없지만 핵심 사실은 일치합니다."}, "codex": {"ok": true, "quote": "대법원도 사용자가 퇴직 후 14일 이내에 지급기일을 연장하기로 합의했더라도, 연장한 지급기일까지 퇴직금을 지급하지 않으면 퇴직급여 보장법 위반죄가 성립한다고 판단했습니다(대법원 2023. 7. 13. 선고 2023도188 판결).", "reason": "연장한 지급기일까지 지급하지 않으면 퇴직급여 보장법 위반죄가 성립한다고 명시하여 형사처벌 대상이라는 핵심 내용을 담았습니다."}}}, {"key": "s07-kp1", "id": "s07", "level": "SUM", "question": "최저임금은 누구에게 적용되고, 회사가 최저임금보다 적게 정한 계약은 어떻게 되며, 최저임금을 깎아서 줄 수 있는 경우가 있는지 요약해 주세요.", "kp_index": 1, "all_kps": ["근로자를 사용하는 모든 사업에 적용하되, 동거하는 친족만 사용하는 사업과 가사 사용인은 제외", "사용자는 최저임금액 이상의 임금을 지급해야 하고 최저임금을 이유로 종전 임금수준을 낮출 수 없음", "최저임금액에 못 미치는 임금을 정한 부분은 무효이며 최저임금액과 같은 임금을 지급하기로 한 것으로 봄", "1년 이상 계약을 맺은 수습 근로자는 수습 시작 후 3개월 이내에 시간급 최저임금액의 10%를 감액할 수 있음(단순노무업무 직종 제외)"], "answer": "- **적용 대상:** 최저임금법은 근로자를 사용하는 모든 사업 또는 사업장에 적용됩니다. 다만 동거하는 친족만 사용하는 사업, 가사사용인, 선원법 적용을 받는 선원과 그 선박 소유자에게는 적용되지 않습니다. [S3]\n\n- **계약 내용:** 사용자는 적용 대상 근로자에게 최저임금액 이상을 지급해야 하며, 최저임금을 이유로 종전 임금수준을 낮출 수 없습니다. 근로계약에서 최저임금보다 적은 금액을 정한 부분은 무효이고, 그 부분은 최저임금액과 같은 임금을 지급하기로 정한 것으로 봅니다. [S1] 근로조건은 최저기준이므로, 당사자는 이를 이유로 근로조건을 낮출 수 없습니다. [S10]\n\n- **깎아서 지급할 수 있는 경우:** 1년 이상의 기간을 정한 근로계약을 체결하고 수습 중인 근로자는 수습 시작일부터 3개월 이내에 대통령령에 따라 최저임금액의 90%를 적용할 수 있습니다. 다만 단순노무업무 종사자는 제외됩니다. [S2] [S8] 또한 정신장애나 신체장애로 근로능력이 현저히 낮은 사람 등은 사용자가 고용노동부장관의 인가를 받은 경우 최저임금 적용에서 제외될 수 있습니다. [S7] 시행령상 인가 기준은 정신 또는 신체의 장애가 업무 수행에 직접적으로 현저한 지장을 주는 것이 명백하다고 인정되는 사람입니다. [S4]\n\n- **참고:** 최저임금액은 시간·일·주·월 단위로 정하며, 단위가 다르면 시행령에 따라 시간급으로 환산합니다. [S2] [S5] [S6]", "reference": "최저임금법은 근로자를 사용하는 모든 사업에 적용되지만, 동거하는 친족만을 사용하는 사업과 가사 사용인에게는 적용되지 않습니다(제3조). 사용자는 최저임금액 이상의 임금을 지급해야 하고 최저임금을 이유로 종전 임금수준을 낮출 수 없으며, 최저임금액에 못 미치는 금액을 정한 계약 부분은 무효로 되어 최저임금액과 같은 임금을 지급하기로 한 것으로 봅니다(제6조). 예외적으로 1년 이상 근로계약을 맺고 수습을 시작한 날부터 3개월 이내인 근로자는 시간급 최저임금액에서 10%를 뺀 금액을 최저임금으로 할 수 있으나, 단순노무업무 직종은 제외됩니다(제5조제2항, 시행령 제3조).", "judges": {"opus": {"ok": true, "quote": "최저임금법은 근로자를 사용하는 모든 사업 또는 사업장에 적용됩니다. 다만 동거하는 친족만 사용하는 사업, 가사사용인, 선원법 적용을 받는 선원과 그 선박 소유자에게는 적용되지 않습니다.", "reason": "모든 사업 적용과 동거 친족만 사용하는 사업·가사사용인 제외를 명시했고, 선원 관련 추가 제외는 정답 포인트와 모순되지 않습니다."}, "codex": {"ok": true, "quote": "최저임금법은 근로자를 사용하는 모든 사업 또는 사업장에 적용됩니다. 다만 동거하는 친족만 사용하는 사업, 가사사용인, 선원법 적용을 받는 선원과 그 선박 소유자에게는 적용되지 않습니다.", "reason": "모든 사업에 적용한다는 원칙과 동거 친족만 사용하는 사업 및 가사사용인 제외를 모두 명시했습니다."}}}, {"key": "n13-kp1", "id": "n13", "level": "L2", "question": "대학 부설 연구소에서 박사학위를 가진 연구원과 실험을 보조하는 직원을 계약직으로 쓰고 있습니다. 두 사람 모두 기간제 사용기간 2년 제한의 예외에 해당해 2년을 넘겨 계약직으로 쓸 수 있나요?", "kp_index": 1, "all_kps": ["박사 학위를 소지하고 해당 분야에 종사하는 경우는 사용기간 제한의 예외임", "기업 또는 대학의 부설 연구기관에서 연구업무에 직접 종사하거나 실험·조사 등 연구업무에 직접 관여하여 지원하는 업무에 종사하는 경우도 예외임"], "answer": "박사학위를 가진 연구원은 해당 분야에 종사하는 경우 기간제 사용기간 2년 제한의 예외에 해당하므로, 2년을 초과하여 기간제근로자로 사용할 수 있습니다. [S1][S2]\n\n대학 부설 연구소에서 연구업무에 직접 종사하는 사람은 기간제 사용기간 2년 제한의 예외에 해당합니다. [S1][S2]\n\n실험을 보조하는 직원은 실험·조사 등을 수행하는 등 연구업무에 직접 관여하여 지원하는 업무에 종사하는 경우에 한하여 예외에 해당합니다. [S1] 따라서 단순히 대학 부설 연구소에서 근무한다는 사정만으로는 부족하고, 실제 업무가 연구업무에 직접 관여하여 지원하는지 확인해야 합니다. [S1]\n\n예외 사유가 없거나 소멸되었는데도 2년을 초과하여 기간제근로자로 사용하면 기간의 정함이 없는 근로계약을 체결한 근로자로 봅니다. [S2]\n\n대법원은 기간제근로자의 업무 성격이 시행령상 예외 업무에 해당하면 2년 초과 사용 예외가 적용될 수 있다고 판단했습니다(대법원 2017. 11. 9. 선고 2015두57611 판결) [S12]. 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "박사 학위를 소지하고 해당 분야에 종사하는 경우는 기간제근로자 사용기간 제한의 예외에 해당합니다(기간제 및 단시간근로자 보호 등에 관한 법률 시행령 제3조제1항제1호). 또한 기업 또는 대학의 부설 연구기관에서 연구업무에 직접 종사하거나 실험·조사 등 연구업무에 직접 관여하여 지원하는 업무에 종사하는 경우도 예외이므로(제3조제3항제8호바목), 두 사람 모두 2년을 초과하여 기간제로 사용할 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "박사학위를 가진 연구원은 해당 분야에 종사하는 경우 기간제 사용기간 2년 제한의 예외에 해당하므로, 2년을 초과하여 기간제근로자로 사용할 수 있습니다.", "reason": "박사 학위 소지자가 해당 분야에 종사하는 경우 사용기간 제한의 예외라는 점을 명시적으로 단언함."}, "codex": {"ok": true, "quote": "박사학위를 가진 연구원은 해당 분야에 종사하는 경우 기간제 사용기간 2년 제한의 예외에 해당하므로, 2년을 초과하여 기간제근로자로 사용할 수 있습니다. [S1][S2]", "reason": "박사학위 소지자가 해당 분야에 종사하는 경우 사용기간 제한의 예외임을 명시했습니다."}}}, {"key": "g027-kp1", "id": "g027", "level": "L3", "question": "입사 후 만 6년을 계속 근무했고, 지난 1년 중 4개월은 육아휴직을 했으며 나머지 기간은 모두 정상 출근했습니다. 이번에 받을 연차휴가는 며칠인가요?", "kp_index": 1, "all_kps": ["육아휴직으로 휴업한 기간은 연차 산정 시 출근한 것으로 봄(80% 출근 요건 충족)", "육아휴직 기간은 근속기간에 포함", "15일에 최초 1년을 초과하는 계속 근로 연수 매 2년마다 1일 가산 → 17일(한도 25일)"], "answer": "근로자가 1년간 80퍼센트 이상 출근하면 15일의 유급휴가를 받고, 3년 이상 계속 근로한 경우 최초 1년을 초과하는 계속 근로 연수 매 2년에 1일을 가산하며, 총 휴가 일수는 25일을 한도로 합니다. [S1]\n\n육아휴직 기간은 연차휴가 산정에서 출근한 것으로 봅니다. [S1] 따라서 지난 1년 중 4개월을 육아휴직하고 나머지 기간을 정상 출근했다면, 해당 기간은 출근율 산정상 출근한 것으로 보아 1년간 80퍼센트 이상 출근한 경우에 해당합니다. [S1]\n\n입사 후 만 6년을 계속 근무한 경우에는 기본 15일에 최초 1년을 초과하는 계속 근로 연수 매 2년에 따른 가산휴가 2일을 더하여 **17일**입니다. [S1]\n\n다만, 해당 사업장이 근로기준법상 연차 유급휴가 적용 사업장인지 여부는 상시 사용하는 근로자 수 등에 따라 판단될 수 있습니다. [S12]\n\n현재 조문은 2027년 6월 10일 개정 시행 예정이며, 그날부터 연차휴가의 분할 청구 및 휴가 사용을 이유로 한 불리한 처우 금지 등이 추가됩니다. [S1]", "reference": "육아휴직 기간은 출근한 것으로 보고 근속기간에도 포함되므로 80% 출근 요건을 충족합니다. 기본 15일에 최초 1년을 초과한 5년에 대해 매 2년당 1일(2일)을 가산해 17일입니다(근로기준법 제60조제1항·제4항·제6항, 남녀고용평등법 제19조제4항).", "judges": {"opus": {"ok": true, "quote": "육아휴직 기간은 연차휴가 산정에서 출근한 것으로 봅니다. [S1] 따라서 지난 1년 중 4개월을 육아휴직하고 나머지 기간을 정상 출근했다면, 해당 기간은 출근율 산정상 출근한 것으로 보아 1년간 80퍼센트 이상 출근한 경우에 해당합니다.", "reason": "육아휴직 기간을 출근한 것으로 보아 80% 출근 요건을 충족한다고 명시적으로 단언함."}, "codex": {"ok": true, "quote": "육아휴직 기간은 연차휴가 산정에서 출근한 것으로 봅니다. [S1] 따라서 지난 1년 중 4개월을 육아휴직하고 나머지 기간을 정상 출근했다면, 해당 기간은 출근율 산정상 출근한 것으로 보아 1년간 80퍼센트 이상 출근한 경우에 해당합니다. [S1]", "reason": "육아휴직 기간을 출근한 것으로 보고 80퍼센트 출근 요건을 충족한다고 명시합니다."}}}, {"key": "s03-kp1", "id": "s03", "level": "SUM", "question": "임신한 직원을 보호하기 위해 근로기준법이 정한 제도를 요약해 주세요.", "kp_index": 1, "all_kps": ["출산전후휴가 90일(미숙아 100일, 다태아 120일)이며 출산 후 45일(다태아 60일) 이상 배정", "휴가 중 최초 60일(다태아 75일)은 유급", "임신 중 시간외근로 금지, 요구 시 쉬운 종류의 근로로 전환", "임신 12주 이내 또는 32주 이후 1일 2시간 근로시간 단축 허용(임금 삭감 금지)"], "answer": "임신한 근로자를 보호하기 위한 주요 제도는 다음과 같습니다.\n\n1. **출산전후휴가**  \n   사용자는 출산 전후 90일의 휴가를 부여해야 하며, 미숙아 출산 시 100일, 다태임신 시 120일로 연장됩니다. 출산 후 휴가 기간은 원칙적으로 45일 이상이어야 하고, 다태임신은 60일 이상이어야 합니다. 최초 60일은 유급이며, 다태임신은 최초 75일이 유급입니다. [S1]  \n   미숙아는 임신 37주 미만 출생 또는 출생 시 체중 2,500그램 미만이면서 출생 후 24시간 이내 신생아중환자실에 입원한 영유아를 말합니다. [S11]\n\n2. **출산전후휴가의 분할 사용**  \n   유산·사산 경험, 출산 당시 만 40세 이상, 유산·사산 위험에 대한 의료기관 진단 등 사유가 있으면 출산 전 휴가를 나누어 사용할 수 있습니다. 다만 출산 후 휴가는 연속하여 45일 이상, 다태임신은 60일 이상이어야 합니다. [S1] [S13]\n\n3. **유산·사산휴가**  \n   임신 중 유산 또는 사산한 근로자가 청구하면 유산·사산휴가를 부여해야 합니다. 임신기간에 따라 유산 또는 사산일부터 10일, 30일, 60일 또는 90일까지 부여합니다. [S1] [S13]\n\n4. **임신 중 시간외근로 및 업무 전환 제한**  \n   사용자는 임신 중인 여성 근로자에게 시간외근로를 시킬 수 없으며, 근로자가 요구하면 쉬운 종류의 근로로 전환해야 합니다. [S1]\n\n5. **임신기 근로시간 단축**  \n   임신 12주 이내 또는 32주 이후인 근로자가 신청하면 1일 2시간의 근로시간 단축을 허용해야 합니다. 유산·조산 등 위험이 있는 근로자는 임신 전 기간에 이를 신청할 수 있습니다. [S1] [S4]  \n   근로시간 단축을 이유로 임금을 삭감할 수 없습니다. 신청하려면 원칙적으로 개시 예정일 3일 전까지 관련 사항을 적은 문서와 의사의 진단서를 제출해야 합니다. [S1] [S2]\n\n6. **업무 시작·종료 시각 변경**  \n   임신 중인 근로자가 1일 소정근로시간을 유지하면서 업무의 시작 및 종료 시각 변경을 신청하면 사용자는 이를 허용해야 합니다. 다만 정상적인 사업 운영에 중대한 지장이 있거나 근로자의 안전·건강 관련 법령을 위반하게 되는 경우에는 예외가 인정됩니다. [S1] [S6]  \n   신청은 원칙적으로 변경 예정일 3일 전까지 문서와 임신 사실을 증명하는 의사의 진단서를 제출해야 합니다. [S6]\n\n7. **태아검진 시간**  \n   임산부 정기건강진단에 필요한 시간을 청구하면 사용자는 이를 허용해야 하며, 그 시간을 이유로 임금을 삭감할 수 없습니다. [S3]\n\n8. **탄력적 근로시간제 적용 제외**  \n   15세 이상 18세 미만 근로자와 임신 중인 여성 근로자에게는 2주 이내", "reference": "출산 전후를 통틀어 90일(미숙아 100일, 다태아 120일)의 출산전후휴가를 주되 출산 후 45일(다태아 60일) 이상이 되어야 하고, 최초 60일(다태아 75일)은 유급입니다. 임신 중에는 시간외근로를 시킬 수 없고 요구하면 쉬운 근로로 전환해야 하며, 임신 12주 이내 또는 32주 이후에는 1일 2시간 근로시간 단축을 허용하고 임금을 삭감할 수 없습니다(근로기준법 제74조).", "judges": {"opus": {"ok": true, "quote": "사용자는 출산 전후 90일의 휴가를 부여해야 하며, 미숙아 출산 시 100일, 다태임신 시 120일로 연장됩니다. 출산 후 휴가 기간은 원칙적으로 45일 이상이어야 하고, 다태임신은 60일 이상이어야 합니다.", "reason": "90일·미숙아 100일·다태아 120일과 출산 후 45일(다태아 60일) 이상 배정이 모두 명시되어 있다."}, "codex": {"ok": true, "quote": "사용자는 출산 전후 90일의 휴가를 부여해야 하며, 미숙아 출산 시 100일, 다태임신 시 120일로 연장됩니다. 출산 후 휴가 기간은 원칙적으로 45일 이상이어야 하고, 다태임신은 60일 이상이어야 합니다.", "reason": "출산전후휴가의 각 기간과 출산 후 최소 배정 기간을 모두 명시했습니다."}}}, {"key": "l5b07-kp3", "id": "l5b07", "level": "L5b", "question": "1년 계약직으로 입사해서 1년 뒤 한 번 재계약하고 딱 2년을 채운 뒤 계약 만료로 퇴사했습니다. 연차를 하나도 쓰지 않았는데, 미사용 연차수당은 최대 며칠분을 받을 수 있나요? 첫해 11일, 1년 지났을 때 15일, 2년 다 채웠을 때 또 15일이 생겨서 41일 아닌가요?", "kp_index": 3, "all_kps": ["1년간 80% 이상 출근 시 15일, 계속근로 1년 미만은 1개월 개근 시 1일의 유급휴가(근로기준법 제60조제1항·제2항)", "판례: 연차휴가는 전년도 1년간의 근로를 마친 다음 날 발생하므로 2년째 근로를 마치고 근로관계가 끝나면 15일이 추가로 발생하지 않음", "판례: 1년 초과 2년 이하 근로자의 최대 연차휴가일수는 11일 + 15일 = 총 26일(41일 아님)"], "answer": "조문상 1년 미만 근로자는 1개월 개근 시 1일의 유급휴가를 받고, 1년간 80% 이상 출근하면 15일의 유급휴가를 받습니다. 3년 이상 계속 근로한 경우에만 최초 1년을 초과하는 계속근로 연수 매 2년마다 1일이 가산됩니다. [S1]\n\n대법원은 1년을 초과하되 2년 이하로 근로한 경우 최초 1년 동안의 최대 11일과 최초 1년을 마친 다음 날 발생하는 15일을 합쳐 최대 26일이라고 판단했습니다(대법원 2022. 9. 7. 선고 2022다245419 판결). [S14]\n\n따라서 질문처럼 1년 계약 후 한 차례 재계약하여 정확히 2년을 근무하고 계약 만료로 퇴사한 경우, 미사용 연차수당은 원칙적으로 최대 26일분이며 41일분은 아닙니다. [S14]\n\n대법원은 연차휴가를 사용할 권리 또는 연차휴가수당 청구권이 전년도 1년간의 근로를 마친 다음 날 발생하고, 그 전에 근로관계가 종료되면 해당 권리를 청구할 수 없다고 판단했습니다(대법원 2021. 10. 14. 선고 2021다227100 판결). [S15]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n참고로 현재 제60조와 제61조는 시행 중이지만, 2027년 6월 10일부터 연차휴가의 분할 청구, 휴가 시기 및 불리한 처우 금지 등에 관한 개정 내용이 시행될 예정입니다. [S1] [S2]", "reference": "41일이 아니라 최대 26일분입니다. 근로기준법 제60조제2항은 계속 근로기간이 1년 미만인 근로자에게 1개월 개근 시 1일의 유급휴가를, 제1항은 1년간 80퍼센트 이상 출근한 근로자에게 15일의 유급휴가를 주도록 정하지만, 연차휴가가 언제 발생하는지는 조문에 정함이 없습니다. 대법원은 연차수당 지급이 문제 된 사안에서, 연차휴가는 전년도 1년간의 근로에 대한 대가로서 전년도 1년간의 근로를 마친 다음 날 발생하므로, 1년을 초과하되 2년 이하의 기간 동안 근로한 근로자의 최대 연차휴가일수는 제60조제2항의 11일과 제1항의 15일을 합한 총 26일이라고 판단했습니다(대법원 2022. 9. 7. 선고 2022다245419 판결). 2년째 근로를 마친 날 근로관계가 끝났다면 두 번째 15일은 발생하지 않습니다. 다만 근로관계가 하루라도 더 유지되었는지 등 구체적 사실관계에 따라 결론이 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "대법원은 1년을 초과하되 2년 이하로 근로한 경우 최초 1년 동안의 최대 11일과 최초 1년을 마친 다음 날 발생하는 15일을 합쳐 최대 26일이라고 판단했습니다(대법원 2022. 9. 7. 선고 2022다245419 판결).", "reason": "11일과 15일을 합친 최대 26일을 명시했고, 41일분이 아니라는 점도 함께 단언했습니다."}, "codex": {"ok": true, "quote": "대법원은 1년을 초과하되 2년 이하로 근로한 경우 최초 1년 동안의 최대 11일과 최초 1년을 마친 다음 날 발생하는 15일을 합쳐 최대 26일이라고 판단했습니다(대법원 2022. 9. 7. 선고 2022다245419 판결). [S14]", "reason": "판례에 따른 1년 초과 2년 이하 근로자의 최대 연차휴가가 11일과 15일을 합한 26일임을 명시했습니다."}}}, {"key": "g036-kp1", "id": "g036", "level": "L4", "question": "공공기관이 발주한 도급 사업에서 임금에 해당하는 비용을 따로 구분해 매월 지급해야 하는 의무가 지금 시행 중인가요?", "kp_index": 1, "all_kps": ["2027-01-01 시행 예정으로 2026-10-01 현재 미시행", "시행 후 국가·지방자치단체·공공기관 등 도급인은 임금비용을 구분하여 매월 지급"], "answer": "아니요. 해당 의무를 정한 근로기준법 제44조의4는 기준일인 2026년 10월 1일 현재 아직 시행 전이며, 2027년 1월 1일부터 시행될 예정입니다. [S1]\n\n제44조의4는 국가·지방자치단체·공공기관 등이 대통령령으로 정하는 업종, 금액 규모 및 기간에 해당하는 사업을 도급하는 경우, 도급금액 중 수급인이 근로자에게 지급해야 할 임금비용을 구분하여 매월 지급하도록 정하고 있습니다. [S1]", "reference": "아직 시행 전입니다. 임금비용 구분지급 의무(근로기준법 제44조의4)는 2026년 3월 17일 공포된 개정으로 신설됐고 2027년 1월 1일부터 시행됩니다. 시행되면 공공기관 등 도급인은 대통령령으로 정하는 사업에서 임금비용을 구분해 매월 지급해야 합니다.", "judges": {"opus": {"ok": true, "quote": "해당 의무를 정한 근로기준법 제44조의4는 기준일인 2026년 10월 1일 현재 아직 시행 전이며, 2027년 1월 1일부터 시행될 예정입니다.", "reason": "답변에 2027-01-01 시행 예정이라는 날짜와 2026-10-01 현재 미시행이라는 사실이 모두 들어 있습니다."}, "codex": {"ok": true, "quote": "해당 의무를 정한 근로기준법 제44조의4는 기준일인 2026년 10월 1일 현재 아직 시행 전이며, 2027년 1월 1일부터 시행될 예정입니다.", "reason": "2026년 10월 1일 현재 미시행이며 2027년 1월 1일 시행 예정이라는 사실을 모두 명시했습니다."}}}, {"key": "g002-kp1", "id": "g002", "level": "L1", "question": "임금이 체불돼서 생계비 융자를 받으려면 체불된 날부터 언제까지 신청해야 하나요?", "kp_index": 1, "all_kps": ["임금등이 체불된 날부터 1년 이내에 신청", "공단에 생계비융자를 신청"], "answer": "생계비 융자를 받으려는 근로자는 **임금등이 체불된 날부터 1년 이내**에 공단에 신청해야 합니다. [S2]", "reference": "고용노동부장관이 고시하는 서류를 갖추어 임금등이 체불된 날부터 1년 이내에 공단에 생계비융자를 신청해야 합니다(임금채권보장법 시행규칙 제8조의12제7항).", "judges": {"opus": {"ok": true, "quote": "생계비 융자를 받으려는 근로자는 **임금등이 체불된 날부터 1년 이내**에 공단에 신청해야 합니다. [S2]", "reason": "체불된 날부터 1년 이내라는 신청 기한을 명시적으로 단언함."}, "codex": {"ok": true, "quote": "생계비 융자를 받으려는 근로자는 **임금등이 체불된 날부터 1년 이내**에 공단에 신청해야 합니다.", "reason": "임금등이 체불된 날부터 1년 이내에 신청해야 한다고 명시했습니다."}}}, {"key": "l5b04-kp2", "id": "l5b04", "level": "L5b", "question": "회사로부터 해고 통보를 이메일로만 받았습니다. 이메일에는 해고 사유와 해고 날짜가 구체적으로 적혀 있고 저도 메일을 열어 확인했습니다. 해고는 서면으로 통지해야 효력이 있다고 들었는데, 이메일 통보도 서면 통지로 인정되나요?", "kp_index": 2, "all_kps": ["해고는 해고사유와 해고시기를 서면으로 통지해야 효력이 있음(근로기준법 제27조)", "판례: 이메일에 의한 해고통지도 구체적 사안에 따라 서면에 의한 해고통지로서 유효할 수 있음", "판례: 해고 의사가 명확하고 해고사유·시기가 구체적으로 기재되어 있으며 근로자가 이메일을 수신해 내용을 알고 있어야 함"], "answer": "근로기준법상 사용자는 해고하려면 해고사유와 해고시기를 서면으로 통지해야 하며, 서면으로 통지하지 않은 해고는 효력이 없습니다. [S1]\n\n대법원은 이메일이 전자문서라는 이유만으로 서면 통지가 아니라고 볼 수는 없고, 이메일에 해고사유와 해고시기가 구체적으로 적혀 있으며 근로자가 이를 수신해 내용을 알고 해고에 적절히 대응할 수 있다면, 구체적 사안에 따라 서면에 의한 해고통지로 유효할 수 있다고 판단했습니다(대법원 2015. 9. 10. 선고 2015두41401 판결). [S12]\n\n따라서 질문처럼 이메일에 해고사유와 해고 날짜가 구체적으로 기재되어 있고 이메일을 열어 확인했다면, 이메일 통보가 서면 통지로 인정될 가능성이 있습니다. 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "인정될 수 있습니다. 근로기준법 제27조는 사용자가 해고사유와 해고시기를 서면으로 통지해야 하고, 서면으로 통지해야 해고의 효력이 있다고 정하지만, 이메일이 '서면'에 해당하는지는 조문에 정의가 없습니다. 대법원은 이메일로 해고를 통지한 사안에서, '서면'은 이메일 등 전자문서와 구별되지만 이메일에 해고 의사가 명확하고 해고사유와 해고시기가 구체적으로 기재되어 서면 통지의 역할과 기능을 충분히 수행하고, 근로자가 이메일을 수신하는 등으로 내용을 알고 있다면 구체적 사안에 따라 서면에 의한 해고통지로서 유효하다고 보아야 할 경우가 있다고 판단했습니다(대법원 2015. 9. 10. 선고 2015두41401 판결). 다만 이는 모든 이메일 통지를 유효로 본 것이 아니므로, 결론은 이메일의 형식과 작성 경위 등 구체적 사실관계에 따라 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "구체적 사안에 따라 서면에 의한 해고통지로 유효할 수 있다고 판단했습니다(대법원 2015. 9. 10. 선고 2015두41401 판결).", "reason": "판례상 이메일 해고통지가 구체적 사안에 따라 서면통지로 유효할 수 있다는 내용을 명시합니다."}, "codex": {"ok": true, "quote": "대법원은 이메일이 전자문서라는 이유만으로 서면 통지가 아니라고 볼 수는 없고, 이메일에 해고사유와 해고시기가 구체적으로 적혀 있으며 근로자가 이를 수신해 내용을 알고 해고에 적절히 대응할 수 있다면, 구체적 사안에 따라 서면에 의한 해고통지로 유효할 수 있다고 판단했습니다(대법원 2015. 9. 10. 선고 2015두41401 판결).", "reason": "판례에 따라 이메일 해고통지도 구체적 사안에 따라 서면 통지로 유효할 수 있다고 명시했습니다."}}}, {"key": "l5a04-kp2", "id": "l5a04", "level": "L5a", "question": "건설현장 일을 소개받아 일했는데, 소개해 준 사람이 '본인 계좌는 쓸 수 없다'며 임금 대리수령 위임장에 서명하게 했고, 회사는 제 임금을 제가 전혀 모르는 사람 계좌로 일괄 송금했습니다. 저는 돈을 제대로 받지 못했는데 회사는 이미 지급했다고 합니다. 회사에 다시 임금을 청구할 수 있나요?", "kp_index": 2, "all_kps": ["임금은 통화로 직접 근로자에게 그 전액을 지급해야 함(근로기준법 제43조 제1항)", "법령·단체협약에 의한 예외는 임금 일부 공제와 통화 외 지급에 관한 것이며 직접 지급 원칙에는 예외가 없음", "근로자가 위임했더라도 모르는 제3자에게 지급한 것은 직접 지급 원칙 위반으로 유효한 임금 지급이 아님", "근로자는 회사에 임금 지급을 청구할 수 있음"], "answer": "네. 회사가 귀하가 전혀 모르는 사람의 계좌로 임금을 일괄 송금한 것만으로는 임금을 직접 지급했다고 보기 어렵고, 다시 청구할 수 있습니다. 임금은 원칙적으로 통화로 근로자에게 직접 전액 지급해야 합니다. [S7]\n\n대법원은 근로자가 제3자에게 임금 수령을 위임한 경우에도, 그 제3자가 사회통념상 근로자 본인에게 지급하는 것과 동일시되거나 임금을 근로자 본인에게 그대로 전달할 것이 확실한 사람인 경우에만 예외적으로 수령자로 볼 수 있고, 그 판단은 엄격해야 한다고 판단했습니다. [S12] 귀하의 경우처럼 임금을 받은 사람이 귀하와 전혀 모르는 사이이고, 귀하에게 돈이 제대로 전달되지 않았다면 회사의 송금은 직접 지급 원칙에 위반되어 무효라고 판단될 가능성이 있습니다. [S12]\n\n따라서 회사가 해당 송금을 이유로 임금 지급이 끝났다고 주장하더라도, 귀하는 미지급 임금을 회사에 청구할 수 있습니다. 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "청구할 수 있습니다. 근로기준법 제43조제1항은 임금을 통화로 직접 근로자에게 전액 지급하도록 정하고 있고, 법령·단체협약에 따른 예외는 임금 일부 공제와 통화 이외의 지급에 관한 것뿐입니다. 근로자가 위임장에 서명했더라도 모르는 제3자 계좌로 보낸 것은 직접 지급 원칙에 어긋나 유효한 임금 지급이 아니므로, 회사에 임금을 다시 청구할 수 있습니다.", "judges": {"opus": {"ok": false, "quote": "", "reason": "법령·단체협약에 의한 예외가 임금 일부 공제와 통화 외 지급에 한정되고 직접 지급 원칙에는 예외가 없다는 내용이 없으며, 오히려 제3자 수령을 예외적으로 인정하는 취지를 서술해 정답 포인트와 어긋납니다."}, "codex": {"ok": false, "quote": "대법원은 근로자가 제3자에게 임금 수령을 위임한 경우에도, 그 제3자가 사회통념상 근로자 본인에게 지급하는 것과 동일시되거나 임금을 근로자 본인에게 그대로 전달할 것이 확실한 사람인 경우에만 예외적으로 수령자로 볼 수 있고, 그 판단은 엄격해야 한다고 판단했습니다.", "reason": "법령·단체협약상 예외가 일부 공제와 통화 외 지급에 한정된다는 설명이 없고 직접 지급 원칙의 예외를 인정했습니다."}}}, {"key": "g016-kp1", "id": "g016", "level": "L2", "question": "아이가 출산 예정일보다 일찍 태어났는데, 육아휴직을 30일 전이 아니라 더 임박해서 신청해도 되나요?", "kp_index": 1, "all_kps": ["출산 예정일 이전에 자녀가 출생한 경우는 예외 사유에 해당", "휴직개시예정일 7일 전까지 신청 가능"], "answer": "네. 출산 예정일 이전에 자녀가 출생한 경우에는 휴직개시예정일 7일 전까지 육아휴직을 신청할 수 있습니다. [S1]\n\n육아휴직 신청서에는 신청인의 인적사항, 자녀의 성명·생년월일, 휴직개시예정일과 종료예정일, 신청 연월일 등을 적어 사업주에게 제출해야 합니다. [S1]\n\n사업주는 해당 신청을 받은 경우 신청일부터 3일 이내에 육아휴직을 허용한 사실을 서면 또는 전자적 방식으로 알려야 합니다. [S1] 사업주가 그 기간 내에 허용 사실을 알리지 않으면, 근로자가 신청한 대로 육아휴직을 허용한 것으로 봅니다. [S1]\n\n다만 휴직개시예정일 전날까지 해당 사업에서 계속 근로한 기간이 6개월 미만인 근로자는 육아휴직 적용 대상에서 제외될 수 있습니다. [S5]", "reference": "네. 출산 예정일 이전에 자녀가 출생한 경우에는 휴직개시예정일 7일 전까지 육아휴직을 신청할 수 있습니다(남녀고용평등법 시행령 제11조제3항제2호).", "judges": {"opus": {"ok": true, "quote": "네. 출산 예정일 이전에 자녀가 출생한 경우에는 휴직개시예정일 7일 전까지 육아휴직을 신청할 수 있습니다. [S1]", "reason": "답변은 출산 예정일 이전 출생을 30일 전 신청 원칙과 달리 더 임박한 신청이 허용되는 경우로 단언하므로, '예외'라는 단어는 없어도 의미가 같다."}, "codex": {"ok": true, "quote": "출산 예정일 이전에 자녀가 출생한 경우에는 휴직개시예정일 7일 전까지 육아휴직을 신청할 수 있습니다.", "reason": "출산 예정일 이전에 자녀가 출생한 경우에 더 임박한 신청이 가능하다고 명시하여 예외 사유임을 담고 있습니다."}}}, {"key": "g022-kp2", "id": "g022", "level": "L3", "question": "입사 5개월 된 직원이 육아휴직을 신청했는데, 휴직 시작 예정일 전날 기준으로도 근속 6개월이 안 됩니다. 회사가 거부할 수 있나요?", "kp_index": 2, "all_kps": ["대통령령으로 정하는 경우 육아휴직 허용 의무의 예외", "휴직개시예정일 전날까지 계속 근로기간이 6개월 미만인 근로자의 신청은 거부 가능"], "answer": "네. 휴직개시예정일 전날까지 해당 사업에서 계속 근로한 기간이 6개월 미만인 근로자가 신청한 경우에는 육아휴직 허용 의무의 예외이므로, 회사가 육아휴직을 거부할 수 있습니다. [S1][S2]", "reference": "거부할 수 있습니다. 남녀고용평등법 제19조제1항 단서의 위임에 따라 휴직개시예정일 전날까지 계속 근로기간이 6개월 미만인 근로자가 신청한 경우는 허용 의무의 예외입니다(시행령 제10조).", "judges": {"opus": {"ok": true, "quote": "휴직개시예정일 전날까지 해당 사업에서 계속 근로한 기간이 6개월 미만인 근로자가 신청한 경우에는 육아휴직 허용 의무의 예외이므로, 회사가 육아휴직을 거부할 수 있습니다.", "reason": "기준일(휴직개시예정일 전날), 계속 근로기간 6개월 미만이라는 조건, 회사가 거부할 수 있다는 효과가 모두 명시되어 있습니다."}, "codex": {"ok": true, "quote": "휴직개시예정일 전날까지 해당 사업에서 계속 근로한 기간이 6개월 미만인 근로자가 신청한 경우에는 육아휴직 허용 의무의 예외이므로, 회사가 육아휴직을 거부할 수 있습니다.", "reason": "휴직개시예정일 전날까지 계속 근로기간이 6개월 미만인 근로자의 신청을 회사가 거부할 수 있다고 명시했습니다."}}}, {"key": "l5b02-kp1", "id": "l5b02", "level": "L5b", "question": "병원 방사선사인데 야간에는 집에서 '콜 대기' 당직을 섭니다. 호출이 오면 병원에 나가 촬영을 하고, 호출이 없으면 집에서 쉬거나 잠을 잡니다. 이 콜 대기 시간 전체가 근로시간으로 인정돼서 수당을 받을 수 있나요?", "kp_index": 1, "all_kps": ["작업을 위해 사용자의 지휘·감독 아래에 있는 대기시간 등은 근로시간으로 봄(근로기준법 제50조제3항)", "판례: 당직이 근무 밀도가 낮은 대기성 단속적 업무이면 본래 업무에 실제로 종사한 시간만 근로시간임(본래 업무의 연장이거나 통상근무와 같으면 당직시간 전체가 근로시간)", "판례: 콜대기 시간 전부를 근로시간으로 단정할 수 없고 근무 밀도·호출 빈도·출근 시한 등을 심리해 범위를 판단해야 함"], "answer": "콜 대기 시간 전체가 자동으로 근로시간으로 인정되는 것은 아닙니다. 근로자가 사용자의 지휘·감독을 받는 시간은 근로시간이고, 자유롭게 이용할 수 있는 휴게시간은 근로시간이 아닙니다. [S4]\n\n집에서 대기하면서 호출이 없을 때 자유롭게 쉬거나 잠을 잘 수 있었는지, 호출을 받으면 몇 분 안에 병원에 출근해야 하는지, 호출 빈도와 실제 촬영 업무의 내용·시간, 통상근무와 콜 대기 근무의 밀도 차이 등을 종합해 판단합니다. [S12]\n\n대법원은 2024. 11. 14. 선고 2021다220062 등 판결에서, 방사선사의 자택 콜 대기 시간에 대해 위와 같은 사정을 충분히 심리하지 않고 대기 시간 전부를 근로시간으로 인정한 판단은 잘못이라고 판단했습니다. [S12] 따라서 호출이 없던 시간은 근로시간이 아닐 수 있고, 호출을 받아 병원에서 촬영한 시간이나 실질적으로 사용자의 지휘·감독 아래 있던 시간은 근로시간으로 인정될 수 있습니다. [S12]\n\n근로시간으로 인정되어 1일 8시간 또는 1주 40시간을 초과한 연장근로가 되면 통상임금의 50% 이상을 가산해야 하며, 오후 10시부터 다음 날 오전 6시 사이의 야간근로에도 통상임금의 50% 이상을 가산해야 합니다. [S2][S4]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "콜 대기 시간 전체가 당연히 근로시간으로 인정되지는 않습니다. 근로기준법 제50조제3항은 작업을 위하여 근로자가 사용자의 지휘·감독 아래에 있는 대기시간 등을 근로시간으로 보므로, 호출을 받아 병원에서 실제로 촬영한 시간은 근로시간입니다. 집에서 쉬거나 잠을 자며 호출을 기다린 시간이 이 대기시간에 해당하는지는 조문에 기준이 없습니다. 대법원은 병원 방사선기사 등의 자택 당직·콜대기 근무시간이 문제 된 사안에서, 당직 중 업무가 본래 업무의 연장이거나 통상근무와 같으면 당직시간이 근로시간에 포함되지만 근무 밀도가 낮은 대기성의 단속적 업무라면 본래의 업무에 실제로 종사한 시간만을 근로시간으로 보아야 한다고 하면서, 콜대기 근무시간 전부를 근로시간으로 인정한 원심을 심리미진으로 파기했습니다(대법원 2024. 11. 14. 선고 2021다220062 등 판결). 따라서 호출 빈도, 호출 시 출근 시한, 수면 보장 여부 등에 따라 콜 대기 시간의 전부 또는 일부만 근로시간으로 인정될 수 있으며, 결론은 구체적 근무 실태에 따라 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "근로자가 사용자의 지휘·감독을 받는 시간은 근로시간이고, 자유롭게 이용할 수 있는 휴게시간은 근로시간이 아닙니다.", "reason": "콜 대기 맥락에서 사용자의 지휘·감독 아래 있는 시간은 근로시간이라는 핵심을 단언하므로 true로 보나, 근거 조문(제50조제3항)과 '대기시간'을 명시한 표현은 없습니다."}, "codex": {"ok": true, "quote": "근로자가 사용자의 지휘·감독을 받는 시간은 근로시간이고, 자유롭게 이용할 수 있는 휴게시간은 근로시간이 아닙니다. [S4]", "reason": "사용자의 지휘·감독 아래 있는 시간을 근로시간으로 본다는 핵심 내용을 명시합니다."}}}, {"key": "n06-kp1", "id": "n06", "level": "L3", "question": "우리 공장 생산라인 직원이 출산휴가에 들어가 그 자리를 파견근로자로 채우려고 합니다. 제조업 생산공정에는 파견을 쓸 수 없다고 들었는데 가능한가요? 가능하다면 파견기간은 얼마나 되나요?", "kp_index": 1, "all_kps": ["원칙적으로 제조업의 직접생산공정업무는 파견 대상이 아니지만, 출산·질병·부상 등으로 결원이 생긴 경우에는 파견 가능함", "결원 대체 파견의 기간은 해당 사유가 없어지는 데 필요한 기간임", "사용사업주는 과반수 노조 또는 근로자 과반수 대표와 사전에 성실하게 협의해야 함"], "answer": "제조업의 직접생산공정업무에는 원칙적으로 근로자파견을 할 수 없습니다. [S1]\n\n다만 출산으로 결원이 생긴 경우에는 예외적으로 근로자파견을 할 수 있습니다. 따라서 생산라인 직원의 출산전후휴가로 결원이 발생한 경우에는 해당 결원을 메우기 위한 파견이 가능합니다. [S1]\n\n이 경우 파견기간은 출산이라는 사유가 없어지는 데 필요한 기간까지입니다. [S2] 출산전후휴가는 원칙적으로 출산 전후 90일이고, 미숙아 출산은 100일, 한 번에 둘 이상 자녀를 임신한 경우는 120일이며, 출산 후 휴가는 각각 45일, 45일, 60일 이상이어야 합니다. [S5]\n\n따라서 파견기간은 출산휴가로 발생한 결원이 없어지는 데 필요한 기간을 넘길 수 없고, 출산휴가 기간에 맞추어 정해야 합니다. [S2] 파견근로자를 사용하려면 해당 사업장에 과반수 노동조합이 있으면 그 노동조합과, 없으면 근로자 과반수를 대표하는 자와 사전에 성실하게 협의해야 합니다. [S1]", "reference": "근로자파견은 원칙적으로 제조업의 직접생산공정업무를 제외한 업무에서만 가능하지만, 제1항에도 불구하고 출산·질병·부상 등으로 결원이 생긴 경우에는 파견을 쓸 수 있으며 이때 과반수 노동조합 또는 근로자 과반수 대표와 사전에 성실히 협의해야 합니다(파견근로자 보호 등에 관한 법률 제5조제2항·제4항). 이 경우 파견기간은 1년 상한이 아니라 해당 사유가 없어지는 데 필요한 기간입니다(제6조제1항·제4항제1호).", "judges": {"opus": {"ok": true, "quote": "제조업의 직접생산공정업무에는 원칙적으로 근로자파견을 할 수 없습니다. [S1] 다만 출산으로 결원이 생긴 경우에는 예외적으로 근로자파견을 할 수 있습니다.", "reason": "원칙적 금지와 출산 결원 시 예외적 허용을 명시했으며, 질병·부상 사유는 빠졌지만 '등'으로 예시된 사유이고 질문 사안(출산)에 해당하는 핵심 예외는 단언했다."}, "codex": {"ok": true, "quote": "제조업의 직접생산공정업무에는 원칙적으로 근로자파견을 할 수 없습니다. [S1]\n\n다만 출산으로 결원이 생긴 경우에는 예외적으로 근로자파견을 할 수 있습니다.", "reason": "제조업 직접생산공정업무의 원칙적 파견 금지와 출산으로 인한 결원 발생 시 예외적 파견 가능을 명시했습니다."}}}, {"key": "n01-kp1", "id": "n01", "level": "L3", "question": "작년 3월에 회사를 새로 차렸는데 1년이 넘도록 퇴직연금(확정급여형·확정기여형)을 설정하지 못했습니다. 이 경우 직원들 퇴직급여는 어떻게 처리되나요?", "kp_index": 1, "all_kps": ["새로 성립된 사업의 사용자는 사업 성립 후 1년 이내에 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 함", "퇴직급여제도를 설정하지 않은 경우 퇴직금제도를 설정한 것으로 봄"], "answer": "새로 성립한 사업의 사용자는 사업 성립 후 1년 이내에 근로자대표의 의견을 들어 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 합니다. [S1]\n\n그러나 1년 이내에 퇴직급여제도나 개인형퇴직연금제도를 설정하지 않았다면, 법에 따라 퇴직금제도를 설정한 것으로 봅니다. [S2] 따라서 직원들의 퇴직급여는 퇴직금제도에 따라 처리됩니다. [S2]\n\n퇴직연금제도를 새로 설정하려면 근로자대표의 동의 또는 의견을 반영한 퇴직연금규약을 작성하여 고용노동부장관에게 신고해야 합니다. 확정급여형은 근로자대표의 동의를 얻거나 의견을 들어야 하고, 확정기여형도 같은 절차가 적용됩니다. [S5][S6] 신고 시에는 퇴직연금규약과 근로자대표의 동의 또는 의견 청취를 증명하는 자료 등을 제출해야 합니다. [S11]\n\n따라서 현재까지 퇴직연금제도를 설정하지 못했다면, 그 기간에는 퇴직금제도가 적용되는 것으로 처리해야 합니다. [S2]", "reference": "새로 성립된 사업의 사용자는 근로자대표의 의견을 들어 사업 성립 후 1년 이내에 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 합니다(근로자퇴직급여 보장법 제5조). 그럼에도 퇴직급여제도나 개인형퇴직연금제도를 설정하지 않았다면 제11조에 따라 퇴직금제도를 설정한 것으로 보므로, 직원들은 퇴직금(계속근로 1년당 30일분 평균임금)을 받게 됩니다.", "judges": {"opus": {"ok": true, "quote": "새로 성립한 사업의 사용자는 사업 성립 후 1년 이내에 근로자대표의 의견을 들어 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 합니다.", "reason": "새로 성립한 사업의 사용자가 성립 후 1년 이내에 DB 또는 DC형 퇴직연금제도를 설정해야 한다는 의무를 주체, 기간, 대상 모두 일치하게 명시함."}, "codex": {"ok": true, "quote": "새로 성립한 사업의 사용자는 사업 성립 후 1년 이내에 근로자대표의 의견을 들어 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 합니다. [S1]", "reason": "새로 성립한 사업의 사용자가 사업 성립 후 1년 이내에 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 한다는 의무를 명시했습니다."}}}, {"key": "s02-kp1", "id": "s02", "level": "SUM", "question": "직장 내 괴롭힘이 무엇인지, 신고가 들어오면 회사가 해야 할 일을 관련 규정에 따라 요약해 주세요.", "kp_index": 1, "all_kps": ["직장 내 괴롭힘은 지위·관계 등의 우위를 이용해 업무상 적정범위를 넘어 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위", "신고 접수·인지 시 지체 없이 객관적으로 조사", "조사 기간 피해근로자등 보호를 위한 근무장소 변경·유급휴가 등 조치(피해자 의사에 반하지 않게)", "괴롭힘이 확인되면 행위자에 대해 징계 등 필요한 조치", "신고 근로자와 피해근로자등에게 해고나 불리한 처우 금지"], "answer": "직장 내 괴롭힘은 사용자 또는 근로자가 직장에서의 지위나 관계 등의 우위를 이용하여 업무상 적정범위를 넘어 다른 근로자에게 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위입니다. [S2]\n\n신고가 접수되거나 회사가 발생 사실을 인지하면, 회사는 지체 없이 당사자 등을 대상으로 객관적인 사실조사를 해야 합니다. [S1]\n\n조사 기간에는 피해근로자 또는 피해를 주장하는 근로자를 보호하기 위해 필요한 경우 근무장소 변경, 유급휴가 명령 등 적절한 조치를 해야 하며, 피해근로자 등의 의사에 반하는 조치는 할 수 없습니다. [S1]\n\n조사 결과 직장 내 괴롭힘이 확인되면, 피해근로자가 요청한 경우 근무장소 변경, 배치전환, 유급휴가 명령 등 적절한 조치를 해야 합니다. [S1]\n\n또한 회사는 지체 없이 행위자에게 징계, 근무장소 변경 등 필요한 조치를 해야 하며, 조치 전에 피해근로자의 의견을 들어야 합니다. [S1]\n\n신고자와 피해근로자 등에게 해고나 그 밖의 불리한 처우를 해서는 안 됩니다. [S1]\n\n조사자, 조사 내용을 보고받은 사람 및 조사 과정 참여자는 피해근로자 등의 의사에 반하여 조사 중 알게 된 비밀을 다른 사람에게 누설해서는 안 됩니다. 다만 사용자에게 조사 관련 내용을 보고하거나 관계 기관의 요청에 따라 필요한 정보를 제공하는 경우는 제외됩니다. [S1]\n\n상시 10명 이상의 근로자를 사용하는 사용자는 직장 내 괴롭힘의 예방 및 발생 시 조치 등에 관한 사항을 취업규칙에 작성하여 고용노동부장관에게 신고해야 합니다. [S10]\n\n사용자가 직장 내 괴롭힘을 한 경우에는 1천만원 이하의 과태료가 부과될 수 있고, 조사·보호·후속조치·비밀유지 관련 규정을 위반한 경우에는 500만원 이하의 과태료가 부과될 수 있습니다. [S4]\n\n다만 과태료 규정은 2026년 10월 8일, 2026년 12월 8일 및 2027년 1월 1일에 각각 개정 시행될 예정입니다. [S4]", "reference": "직장 내 괴롭힘은 지위·관계 등의 우위를 이용해 업무상 적정범위를 넘어 다른 근로자에게 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위입니다(제76조의2). 신고를 받거나 인지하면 지체 없이 객관적으로 조사하고, 조사 기간에는 피해근로자등의 의사에 반하지 않는 범위에서 근무장소 변경·유급휴가 등 보호조치를 해야 합니다. 괴롭힘이 확인되면 행위자를 징계하는 등 필요한 조치를 하고, 신고자와 피해자에게 불리한 처우를 해서는 안 됩니다(제76조의3).", "judges": {"opus": {"ok": true, "quote": "직장 내 괴롭힘은 사용자 또는 근로자가 직장에서의 지위나 관계 등의 우위를 이용하여 업무상 적정범위를 넘어 다른 근로자에게 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위입니다.", "reason": "지위·관계 우위 이용, 업무상 적정범위 초과, 신체적·정신적 고통 또는 근무환경 악화라는 정의 요소를 모두 명시함."}, "codex": {"ok": true, "quote": "직장 내 괴롭힘은 사용자 또는 근로자가 직장에서의 지위나 관계 등의 우위를 이용하여 업무상 적정범위를 넘어 다른 근로자에게 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위입니다.", "reason": "우위 이용, 업무상 적정범위 초과, 신체적·정신적 고통 또는 근무환경 악화라는 정의를 모두 명시했습니다."}}}, {"key": "l5a08-kp1", "id": "l5a08", "level": "L5a", "question": "6개월짜리 계약직으로 일하기로 했는데 회사가 근로계약서에 임금 계산 방법이나 휴일, 연차 같은 내용을 하나도 적어주지 않았습니다. 회사는 계약직은 기간제법만 적용돼서 과태료 문제일 뿐이라고 하는데, 계약직에게도 근로기준법상 근로조건 명시 의무가 적용되나요?", "kp_index": 1, "all_kps": ["사용자는 근로계약 체결 시 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시해야 함(근로기준법 제17조 제1항)", "기간제근로자도 근로기준법상 근로자이므로 제17조가 적용됨", "기간제법이 적용된다는 이유로 근로기준법 제17조 의무가 배제되지 않음"], "answer": "네. 계약직 근로자에게도 근로기준법상 근로조건 명시 의무가 적용됩니다. 근로기준법은 근로계약 체결 시 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시하고, 임금의 구성항목·계산방법·지급방법과 소정근로시간·휴일·연차 유급휴가가 적힌 서면을 교부하도록 정합니다. [S2]\n\n기간제근로자는 근로기준법상 근로자에 해당하므로, 6개월 계약직이라는 이유만으로 근로기준법 제17조의 적용이 배제되지 않습니다. [S8]\n\n대법원은 기간제 근로계약에도 근로기준법 제17조와 그 벌칙 조항이 적용되고, 기간제법이 같은 위반행위에 과태료를 정하고 있다는 이유만으로 근로기준법의 적용이 배제되지 않는다고 판단했습니다(대법원 2024. 6. 27. 선고 2020도16541 판결). [S13]\n\n따라서 회사가 임금 계산방법, 휴일, 연차 유급휴가 등을 서면으로 명시·교부하지 않았다면 기간제법상 과태료 문제뿐 아니라 근로기준법상 의무 위반도 문제될 수 있습니다. 기간제법도 기간제근로자와 계약을 체결할 때 근로계약기간, 근로시간·휴게, 임금의 구성항목·계산방법·지불방법, 휴일·휴가 등을 서면으로 명시하도록 합니다. [S1] 기간제법상 서면 명시 의무 위반에는 500만 원 이하의 과태료가 규정되어 있습니다. [S7]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "적용됩니다. 근로기준법 제17조제1항은 사용자가 근로계약을 체결할 때 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시하도록 정하고 있고, 기간제근로자도 근로기준법상 근로자이므로 이 의무가 적용됩니다. 기간제법에 근로기준법 제17조의 적용을 배제하는 규정이 없으므로, 기간제법에 과태료 규정이 있다는 이유로 근로기준법상 의무와 벌칙(제114조제1호)이 사라지지 않습니다.", "judges": {"opus": {"ok": true, "quote": "근로기준법은 근로계약 체결 시 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시하고, 임금의 구성항목·계산방법·지급방법과 소정근로시간·휴일·연차 유급휴가가 적힌 서면을 교부하도록 정합니다.", "reason": "답변은 근로계약 체결 시 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시할 의무를 근로기준법상 의무로 단언하며, 이 의무의 근거를 이후 문장에서 제17조로 밝혀 정답 포인트와 의미가 일치합니다."}, "codex": {"ok": true, "quote": "근로기준법은 근로계약 체결 시 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시하고, 임금의 구성항목·계산방법·지급방법과 소정근로시간·휴일·연차 유급휴가가 적힌 서면을 교부하도록 정합니다.", "reason": "근로계약 체결 시 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시해야 한다는 의무를 명시합니다."}}}, {"key": "n24-kp1", "id": "n24", "level": "L4", "question": "두 달째 월급을 못 받고 있습니다. 임금체불 사업주 처벌이 '5년 이하 징역, 5천만원 이하 벌금'으로 강화됐다고 들었는데, 지금 회사가 임금을 체불하면 어떤 형사처벌을 받나요?", "kp_index": 1, "all_kps": ["2026-10-01 현재 임금 지급 의무(제43조) 위반은 3년 이하의 징역 또는 3천만원 이하의 벌금 대상임(근로기준법 제109조제1항)", "제43조 등 위반을 5년 이하의 징역 또는 5천만원 이하의 벌금으로 상향하는 개정(2026.4.7 공포)은 2026-10-08 시행 예정으로 아직 미시행"], "answer": "현재 근거상 임금체불에 대한 처벌은 위반한 조문에 따라 다릅니다.\n\n- 근로기준법 제43조를 위반한 경우, 즉 임금을 지급하지 않은 경우에는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처합니다. [S1]\n- 다만 2026년 10월 8일부터는 근로기준법 제43조 위반에 대한 처벌이 5년 이하의 징역 또는 5천만원 이하의 벌금으로 강화될 예정입니다. [S4]\n- 근로자가 퇴직한 경우 퇴직금을 지급하지 않으면 근로자퇴직급여 보장법 제9조 위반으로 5년 이하의 징역 또는 5천만원 이하의 벌금에 처합니다. [S5]\n- 임금체불 사업주가 명단 공개 기준일 이전 3년 이내 2회 이상 유죄가 확정되고, 직전 1년 이내 체불총액이 3천만원 이상이면 고용노동부장관이 인적사항 등을 공개할 수 있습니다. [S10]\n- 상습체불사업주는 직전 1년간 3개월분 이상을 체불했거나, 5회 이상 체불하면서 체불총액이 3천만원 이상인 경우 고용노동부장관이 정할 수 있습니다. [S2]\n\n따라서 질문의 회사가 현재 재직 중인 근로자의 월급을 두 달째 지급하지 않은 경우, 근거상 현재 적용되는 기본 형사처벌은 근로기준법 제43조 위반에 따른 3년 이하의 징역 또는 3천만원 이하의 벌금입니다. [S1] 2026년 10월 8일부터는 5년 이하의 징역 또는 5천만원 이하의 벌금으로 강화될 예정입니다. [S4]", "reference": "2026년 10월 1일 현재 근로기준법 제109조제1항에 따라 임금 전액 지급 의무(제43조)를 위반하면 3년 이하의 징역 또는 3천만원 이하의 벌금에 처해집니다. 이 죄는 피해자의 명시적인 의사와 다르게 공소를 제기할 수 없으나, 명단 공개된 체불사업 없음", "업무상 부상·질병 요양 휴업 기간과 그 후 30일, 산전·산후 휴업 기간과 그 후 30일은 해고 금지", "적어도 30일 전에 해고를 예고하고, 예고하지 않으면 30일분 이상의 통상임금을 지급", "해고사유와 해고시기를 서면으로 통지해야 해고의 효력이 있음"], "answer": "회사가 직원을 해고할 때에는 다음 제한과 절차를 지켜야 합니다.\n\n1. **정당한 이유가 있어야 합니다.** 사용자는 정당한 이유 없이 해고할 수 없습니다. 업무상 부상·질병의 요양으로 휴업한 기간과 그 후 30일, 산전·산후 휴업 기간과 그 후 30일에는 원칙적으로 해고할 수 없습니다. [S1]\n\n2. **경영상 해고는 별도 요건을 충족해야 합니다.** 긴박한 경영상 필요가 있어야 하고, 해고를 피하기 위한 노력을 다해야 하며, 합리적이고 공정한 기준으로 대상자를 선정해야 합니다. 또한 근로자대표에게 해고 예정일 50일 전까지 관련 사항을 통보하고 성실하게 협의해야 합니다. [S2]\n\n3. **대규모 경영상 해고는 신고해야 합니다.** 1개월 동안 해고하는 인원이 사업장 규모별 기준에 해당하면, 최초 해고일 30일 전까지 고용노동부장관에게 신고해야 합니다. 기준은 상시 근로자 99명 이하 사업장에서 10명 이상, 100명 이상 999명 이하 사업장에서 상시 근로자 수의 10% 이상, 1,000명 이상 사업장에서 100명 이상입니다. [S5] 신고서는 관할 지방고용노동관서의 장에게 제출합니다. [S8]\n\n4. **해고를 예고해야 합니다.** 해고하려면 적어도 30일 전에 예고해야 하며, 예고하지 않으면 30일분 이상의 통상임금을 지급해야 합니다. 다만 계속 근로기간이 3개월 미만인 경우, 천재·사변 등으로 사업 계속이 불가능한 경우, 근로자의 고의로 사업에 막대한 지장이나 재산상 손해가 발생한 경우에는 예외가 있습니다. [S3] 근로자의 귀책사유에 관한 구체적인 예외 사유는 근로기준법 시행규칙 별표 1에 따릅니다. [S6]\n\n5. **해고사유와 해고시기를 서면으로 통지해야 합니다.** 서면통지가 없으면 해고는 효력이 없습니다. 해고 예고를 서면으로 하면서 해고사유와 해고시기를 명시한 경우에는 별도의 서면통지를 한 것으로 봅니다. [S4]\n\n6. **부당해고라면 구제신청이 가능합니다.** 근로자는 부당해고라고 판단하면 노동위원회에 구제를 신청할 수 있고, 해고가 있었던 날부터 3개월 이내에 신청해야 합니다. [S9]\n\n대법원은 경영상 해고에서 긴박한 경영상 필요가 반드시 도산 회피에 한정되지 않고 인원감축의 객관적 합리성이 있는 경우도 포함될 수 있지만, 해고 회피 노력과 대상자 선정기준의 합리성·공정성은 사용자가 증명해야 한다고 판단했습니다(대법원 2021. 7. 29. 선고 2016두64876 판결) [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n대법원은 근무성적이나 근무능력 부족을 이유로 한 해고도 정당한 이유가 있어야 하며, 평가가 공정하고 객관적이어야 하고, 상당 기간 일반적으로 기대되는 최소 수준에 미치지 못하며 개선 가능성도 인정되기 어려워 사회통념상 고용", "reference": "정당한 이유 없이 해고할 수 없고(제23조①), 업무상 부상·질병 요양 휴업 기간과 그 후 30일 및 산전·산후 휴업 기간과 그 후 30일에는 해고하지 못합니다(제23조②). 해고하려면 적어도 30일 전에 예고하거나 30일분 이상의 통상임금을 지급해야 하며(제26조), 해고사유와 해고시기를 서면으로 통지해야 효력이 있습니다(제27조).", "judges": {"opus": {"ok": true, "quote": "해고사유와 해고시기를 서면으로 통지해야 합니다. 서면통지가 없으면 해고는 효력이 없습니다.", "reason": "해고사유·시기의 서면통지와 이를 해고 효력 요건으로 보는 내용을 모두 명시함."}, "codex": {"ok": true, "quote": "**해고사유와 해고시기를 서면으로 통지해야 합니다.** 서면통지가 없으면 해고는 효력이 없습니다.", "reason": "해고사유와 해고시기의 서면통지 의무 및 서면통지가 없을 때의 해고 효력 부정을 모두 명시했습니다."}}}, {"key": "g003-kp1", "id": "g003", "level": "L1", "question": "아내가 유산했을 때 남편이 쓸 수 있는 휴가가 있나요? 며칠이고 유급인가요?", "kp_index": 1, "all_kps": ["배우자 유산·사산휴가는 5일의 범위에서 부여", "최초 3일은 유급"], "answer": "네. 배우자의 유산을 이유로 남편이 청구하면 사업주는 **배우자 유산·사산휴가를 5일 범위에서 부여해야 하며, 최초 3일은 유급**입니다. [S1]\n\n다만 **인공임신중절 수술에 따른 유산**에는 적용되지 않으며, 「모자보건법」 제14조제1항에 따른 경우는 예외입니다. [S1]\n\n휴가는 **아내가 유산한 날부터 20일 이내에 청구**해야 합니다. [S1] 신청할 때에는 사용하려는 날, 유산일, 청구 연월일 등을 적은 문서를 제출해야 하며, 사업주는 유산 사실을 증명하는 서류를 요구할 수 있습니다. [S4]\n\n사업주는 이 휴가를 이유로 해고하거나 그 밖의 불리한 처우를 해서는 안 됩니다. [S1]", "reference": "배우자 유산·사산휴가를 청구할 수 있으며, 사업주는 5일의 범위에서 휴가를 주어야 하고 그중 최초 3일은 유급입니다. 배우자가 유산 또는 사산한 날부터 20일 이내에 청구해야 합니다(남녀고용평등법 제18조의4).", "judges": {"opus": {"ok": true, "quote": "배우자의 유산을 이유로 남편이 청구하면 사업주는 **배우자 유산·사산휴가를 5일 범위에서 부여해야 하며, 최초 3일은 유급**입니다.", "reason": "답변이 배우자 유산·사산휴가를 5일 범위에서 부여한다고 명시하고 있습니다."}, "codex": {"ok": true, "quote": "네. 배우자의 유산을 이유로 남편이 청구하면 사업주는 **배우자 유산·사산휴가를 5일 범위에서 부여해야 하며, 최초 3일은 유급**입니다. [S1]", "reason": "배우자 유산·사산휴가를 5일 범위에서 부여해야 한다고 명시했습니다."}}}, {"key": "g028-kp2", "id": "g028", "level": "L3", "question": "육아휴직 1년 중 4개월만 사용했습니다. 남은 기간을 반영하면 육아기 근로시간 단축은 최대 얼마나 쓸 수 있나요?", "kp_index": 2, "all_kps": ["육아휴직 기간은 원칙 1년 이내", "육아기 근로시간 단축 기간은 1년 이내이나 육아휴직 미사용 기간의 두 배를 가산", "1년 + (8개월 × 2) = 2년 4개월(28개월)"], "answer": "육아기 근로시간 단축 기간은 원칙적으로 1년 이내입니다. 다만 육아휴직 기간 중 사용하지 않은 기간이 있으면 그 기간의 **두 배를 가산한 기간 이내**로 사용할 수 있습니다. [S1]\n\n육아휴직 1년 중 4개월만 사용했다면 남은 육아휴직 기간은 8개월이므로, 이를 두 배로 가산한 16개월에 기본 1년을 더해 **최대 28개월**까지 육아기 근로시간 단축을 사용할 수 있습니다. [S1]\n\n육아기 근로시간 단축은 나누어 사용할 수 있지만, 1회 사용기간은 1개월 이상이어야 합니다. [S2]", "reference": "육아기 근로시간 단축은 기본 1년이고, 제19조제2항 본문의 육아휴직 기간(1년) 중 사용하지 않은 8개월의 두 배인 16개월을 더해 최대 28개월(2년 4개월)까지 쓸 수 있습니다(남녀고용평등법 제19조의2제4항).", "judges": {"opus": {"ok": true, "quote": "육아기 근로시간 단축 기간은 원칙적으로 1년 이내입니다. 다만 육아휴직 기간 중 사용하지 않은 기간이 있으면 그 기간의 **두 배를 가산한 기간 이내**로 사용할 수 있습니다.", "reason": "원칙 1년 이내와 미사용 기간의 두 배 가산을 모두 명시했다."}, "codex": {"ok": true, "quote": "육아기 근로시간 단축 기간은 원칙적으로 1년 이내입니다. 다만 육아휴직 기간 중 사용하지 않은 기간이 있으면 그 기간의 **두 배를 가산한 기간 이내**로 사용할 수 있습니다. [S1]", "reason": "기본 기간 1년 이내와 육아휴직 미사용 기간의 두 배 가산을 모두 명시했습니다."}}}, {"key": "n09-kp1", "id": "n09", "level": "L2", "question": "6개월 단위의 탄력적 근로시간제를 도입하려고 합니다. 근무일이 끝나고 다음 근무일 시작 전까지 최소 몇 시간을 쉬게 해야 하나요? 임신 중인 직원에게도 이 제도를 적용할 수 있나요?", "kp_index": 1, "all_kps": ["근로일 종료 후 다음 근로일 개시 전까지 연속 11시간 이상의 휴식 시간을 줘야 함", "3개월 초과 탄력적 근로시간제는 15세 이상 18세 미만 근로자와 임신 중인 여성 근로자에게 적용하지 않음"], "answer": "6개월 단위의 탄력적 근로시간제를 적용할 때에는 근로일 종료 후 다음 근로일 개시 전까지 **연속하여 11시간 이상**의 휴식시간을 주어야 합니다. [S1]\n\n다만 천재지변 등 불가피한 경우에는 근로자대표와 서면 합의가 있으면 예외를 둘 수 있으며, 해당 사유에는 재난 또는 이에 준하는 사고의 수습·예방, 생명 보호나 안전 확보를 위한 긴급 조치 등이 포함됩니다. [S1][S6]\n\n임신 중인 여성 근로자에게는 3개월 초과 6개월 이내의 탄력적 근로시간제를 적용할 수 없습니다. [S1] 3개월 이내의 탄력적 근로시간제도 임신 중인 여성 근로자에게 적용할 수 없습니다. [S2]", "reference": "3개월을 초과하는 탄력적 근로시간제로 근로시키는 경우 근로일 종료 후 다음 근로일 개시 전까지 연속하여 11시간 이상의 휴식 시간을 주어야 합니다(근로기준법 제51조의2제2항). 또한 이 제도는 15세 이상 18세 미만 근로자와 임신 중인 여성 근로자에게는 적용되지 않습니다(제51조의2제6항).", "judges": {"opus": {"ok": true, "quote": "6개월 단위의 탄력적 근로시간제를 적용할 때에는 근로일 종료 후 다음 근로일 개시 전까지 **연속하여 11시간 이상**의 휴식시간을 주어야 합니다.", "reason": "근로일 종료 후 다음 근로일 개시 전까지 연속 11시간 이상의 휴식시간을 주어야 한다고 명시해 정답 포인트와 일치합니다."}, "codex": {"ok": true, "quote": "6개월 단위의 탄력적 근로시간제를 적용할 때에는 근로일 종료 후 다음 근로일 개시 전까지 **연속하여 11시간 이상**의 휴식시간을 주어야 합니다. [S1]", "reason": "근로일 종료 후 다음 근로일 개시 전까지 연속 11시간 이상의 휴식을 주어야 한다고 명시했습니다."}}}, {"key": "g021-kp2", "id": "g021", "level": "L3", "question": "우리 회사가 5인 이상 사업장인지 판단할 때 상시 근로자 수는 어떻게 계산하나요?", "kp_index": 2, "all_kps": ["상시 근로자 수 산정 방법은 대통령령에 위임", "법 적용 사유 발생일 전 1개월 동안 사용한 근로자 연인원을 같은 기간 가동 일수로 나누어 산정", "파견근로자는 연인원에서 제외"], "answer": "근로기준법은 상시 5명 이상의 근로자를 사용하는 모든 사업 또는 사업장에 적용됩니다. [S2]\n\n상시 근로자 수는 원칙적으로 법 적용 사유가 발생한 날 전 1개월 동안 사용한 근로자의 연인원을 같은 기간의 가동 일수로 나누어 계산합니다. 사업 성립 후 1개월이 지나지 않았다면 성립일부터 법 적용 사유 발생일까지를 산정기간으로 합니다. [S1]\n\n계산 결과가 5명 미만이어도 산정기간의 일별 근로자 수를 확인하여, 5명 미만인 날이 전체 산정기간의 절반 미만이면 5명 이상 사업장으로 봅니다. 반대로 계산 결과가 5명 이상이어도 5명 미만인 날이 절반 이상이면 5명 이상 사업장으로 보지 않습니다. [S1]\n\n연인원에는 고용형태와 관계없이 해당 사업장에서 근로하는 통상근로자, 기간제근로자, 단시간근로자 등이 포함되지만, 파견근로자는 제외됩니다. 동거하는 친족도 해당 사업장에서 근로하는 근로자가 1명이라도 있으면 포함됩니다. [S1]\n\n다만 근로기준법이나 근로계약상 휴일로 보장되어 근로의무가 없는 날에 실제 근무하지 않은 근로자는 연인원과 일별 근로자 수에 포함하지 않는다는 대법원 판단이 있습니다(대법원 2024. 1. 25. 선고 2023다275998 판결). [S14]\n\n외국기업의 경우에는 원칙적으로 국내에서 사용하는 근로자 수를 기준으로 판단하며, 외국에서 사용하는 근로자 수까지 합산할 수 없다는 대법원 판단이 있습니다(대법원 2024. 10. 25. 선고 2023두37391 판결). [S15]\n\n참고로 연차유급휴가 적용 여부는 일반적인 1개월 산정이 아니라, 법 적용 사유 발생일 전 1년 동안 계속하여 5명 이상의 근로자를 사용했는지를 기준으로 판단합니다. [S1]\n\n판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "근로기준법 제11조제3항의 위임에 따라, 법 적용 사유 발생일 전 1개월 동안 사용한 근로자의 연인원을 같은 기간의 가동 일수로 나누어 산정합니다. 파견근로자는 연인원에서 제외됩니다(시행령 제7조의2).", "judges": {"opus": {"ok": true, "quote": "상시 근로자 수는 원칙적으로 법 적용 사유가 발생한 날 전 1개월 동안 사용한 근로자의 연인원을 같은 기간의 가동 일수로 나누어 계산합니다.", "reason": "산정기간(사유 발생일 전 1개월), 분자(연인원), 분모(가동 일수)가 정답 포인트와 모두 일치합니다."}, "codex": {"ok": true, "quote": "상시 근로자 수는 원칙적으로 법 적용 사유가 발생한 날 전 1개월 동안 사용한 근로자의 연인원을 같은 기간의 가동 일수로 나누어 계산합니다.", "reason": "산정기간, 근로자 연인원 및 같은 기간의 가동 일수로 나누는 산정 방법을 모두 명시합니다."}}}, {"key": "l5a01-kp1", "id": "l5a01", "level": "L5a", "question": "기간을 정하지 않고 일하던 중 회사에서 '계약종료통지서'를 받았는데 계약을 끝내는 날짜만 있고 왜 끝내는지는 아무 사유도 적혀 있지 않습니다. 회사는 제가 이유를 이미 알고 있으니 문제없다고 하는데, 이런 해고 통지도 효력이 있나요?", "kp_index": 1, "all_kps": ["해고는 해고사유와 해고시기를 서면으로 통지해야 효력이 있음(근로기준법 제27조)", "해고사유가 전혀 기재되지 않은 서면 통지는 제27조 위반으로 해고의 효력 없음", "근로자가 해고사유를 이미 알고 있었다는 사정만으로 위반이 치유되지 않음"], "answer": "근로자를 해고하려면 사용자는 해고사유와 해고시기를 서면으로 통지해야 하며, 이를 서면으로 통지하지 않은 해고는 효력이 없습니다. [S1]\n\n대법원은 기간을 정하지 않은 고용계약에서 회사가 교부한 계약종료통지서에 계약종료 사유나 근거규정이 전혀 기재되지 않은 사안에서, 그 통지서가 해고사유를 전혀 기재하지 않았으므로 근로기준법 제27조를 위반한 해고통지라고 판단했습니다(대법원 2021. 2. 25. 선고 2017다226605 판결). 따라서 근로자가 해고 이유를 이미 알고 있었더라도, 해고통지서에 해고사유가 전혀 없다면 원칙적으로 효력이 인정되기 어렵습니다. [S13]\n\n다만 해고통지서라는 명칭이 아니더라도 근로자의 처지에서 해고사유를 구체적으로 알 수 있는 서면이면 충분하다고 대법원은 판단했습니다(대법원 2021. 7. 29. 선고 2021두36103 판결). [S14]\n\n질문의 계약종료통지서에 종료 날짜만 있고 해고사유가 전혀 없다면, 위 판례에 비추어 근로기준법 제27조에 따른 서면통지 요건을 갖추지 못한 해고로 볼 가능성이 큽니다. [S1] [S13]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "효력이 없습니다. 근로기준법 제27조는 해고사유와 해고시기를 서면으로 통지해야 해고의 효력이 있다고 정하고 있으므로, 사유가 전혀 적히지 않은 통지서로는 해고 통지 요건을 갖추지 못합니다. 서면 통지가 효력 요건이므로 근로자가 이유를 이미 알고 있었다는 사정으로 대신할 수 없습니다.", "judges": {"opus": {"ok": true, "quote": "근로자를 해고하려면 사용자는 해고사유와 해고시기를 서면으로 통지해야 하며, 이를 서면으로 통지하지 않은 해고는 효력이 없습니다.", "reason": "해고사유·해고시기를 서면으로 통지해야 효력이 있다는 점을 명시했고, 근거 조문인 근로기준법 제27조도 답변의 다른 문장에서 언급했다."}, "codex": {"ok": true, "quote": "근로자를 해고하려면 사용자는 해고사유와 해고시기를 서면으로 통지해야 하며, 이를 서면으로 통지하지 않은 해고는 효력이 없습니다. [S1]", "reason": "해고사유와 해고시기를 서면으로 통지해야 해고의 효력이 있음을 명시했습니다."}}}, {"key": "n26-kp3", "id": "n26", "level": "L3", "question": "파견업체에서 근로자를 받아 쓰려고 합니다. 파견계약을 맺을 때 우리 회사가 파견업체에 어떤 정보를 줘야 하고, 말로만 알려줘도 되나요?", "kp_index": 3, "all_kps": ["사용사업주는 파견계약 체결 시 사용사업주 사업에서 파견근로자와 같은 종류 또는 유사한 업무를 하는 근로자에 대한 정보를 제공해야 함", "제공 정보: 근로자 유무·수, 임금 및 구성항목, 업무 시작·종료 시각과 휴게, 휴일·휴가, 연장·야간·휴일근로, 안전·보건, 복리후생시설 이용 등", "정보는 서면으로 제공해야 함"], "answer": "사용사업주는 파견계약을 체결할 때 파견사업주에게 다음 정보를 제공해야 합니다.\n\n- 같은 종류 또는 유사한 업무를 수행하는 근로자의 유무와 수\n- 임금 및 임금의 구성항목\n- 업무 시작·종료 시각과 휴게시간\n- 휴일·휴가\n- 연장·야간·휴일근로\n- 안전·보건\n- 복리후생시설 이용\n- 그 밖에 차별적 처우의 대상이 되는 근로조건 중 위 항목에 포함되지 않은 사항 [S3]\n\n이 정보는 서면으로 제공해야 하므로, 말로만 알려주는 것은 법령상 정한 제공방법에 맞지 않습니다. [S3]\n\n또한 근로자파견계약 자체도 서면으로 체결해야 하며, 계약에는 파견근로자의 수, 업무 내용, 근로 장소, 지휘·명령자, 파견기간, 근로시간, 휴일·휴가, 연장·야간·휴일근로, 안전·보건, 파견 대가 등의 사항을 포함해야 합니다. [S1] 시행규칙은 원칙적으로 각 파견근로자별로 계약서를 작성하도록 하되, 계약 내용이 같으면 하나의 계약서로 작성할 수 있다고 정합니다. [S7]", "reference": "파견법 제20조제2항에 따라 사용사업주는 파견계약을 체결할 때 차별 금지 준수에 필요한 정보를 파견사업주에게 제공해야 하며, 시행령 제4조의2는 그 정보를 같은 종류 또는 유사한 업무를 하는 자사 근로자의 유무·수, 임금 및 구성항목, 근로시간·휴게, 휴일·휴가, 연장·야간·휴일근로, 안전·보건, 복리후생시설 이용 등으로 정합니다. 이 정보는 서면으로 제공해야 하므로 말로만 알려주는 것은 허용되지 않습니다.", "judges": {"opus": {"ok": true, "quote": "이 정보는 서면으로 제공해야 하므로, 말로만 알려주는 것은 법령상 정한 제공방법에 맞지 않습니다.", "reason": "정보를 서면으로 제공해야 한다고 명시적으로 단언하고 있다."}, "codex": {"ok": true, "quote": "이 정보는 서면으로 제공해야 하므로, 말로만 알려주는 것은 법령상 정한 제공방법에 맞지 않습니다. [S3]", "reason": "정보를 서면으로 제공해야 한다는 의무를 명시합니다."}}}, {"key": "l5b04-kp1", "id": "l5b04", "level": "L5b", "question": "회사로부터 해고 통보를 이메일로만 받았습니다. 이메일에는 해고 사유와 해고 날짜가 구체적으로 적혀 있고 저도 메일을 열어 확인했습니다. 해고는 서면으로 통지해야 효력이 있다고 들었는데, 이메일 통보도 서면 통지로 인정되나요?", "kp_index": 1, "all_kps": ["해고는 해고사유와 해고시기를 서면으로 통지해야 효력이 있음(근로기준법 제27조)", "판례: 이메일에 의한 해고통지도 구체적 사안에 따라 서면에 의한 해고통지로서 유효할 수 있음", "판례: 해고 의사가 명확하고 해고사유·시기가 구체적으로 기재되어 있으며 근로자가 이메일을 수신해 내용을 알고 있어야 함"], "answer": "근로기준법상 사용자는 해고하려면 해고사유와 해고시기를 서면으로 통지해야 하며, 서면으로 통지하지 않은 해고는 효력이 없습니다. [S1]\n\n대법원은 이메일이 전자문서라는 이유만으로 서면 통지가 아니라고 볼 수는 없고, 이메일에 해고 의사와 구체적인 해고사유·해고시기가 기재되어 있으며 근로자가 이를 수신해 내용을 알고 해고에 적절히 대응할 수 있다면, 구체적인 사안에 따라 서면에 의한 해고통지로 유효할 수 있다고 판단했습니다(대법원 2015. 9. 10. 선고 2015두41401 판결) [S12]\n\n따라서 질문처럼 이메일에 해고사유와 해고 날짜가 구체적으로 적혀 있고 본인이 이메일을 열어 확인했다면, 이메일 통보도 서면 통지로 인정될 가능성이 있습니다. [S12] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "인정될 수 있습니다. 근로기준법 제27조는 사용자가 해고사유와 해고시기를 서면으로 통지해야 하고, 서면으로 통지해야 해고의 효력이 있다고 정하지만, 이메일이 '서면'에 해당하는지는 조문에 정의가 없습니다. 대법원은 이메일로 해고를 통지한 사안에서, '서면'은 이메일 등 전자문서와 구별되지만 이메일에 해고 의사가 명확하고 해고사유와 해고시기가 구체적으로 기재되어 서면 통지의 역할과 기능을 충분히 수행하고, 근로자가 이메일을 수신하는 등으로 내용을 알고 있다면 구체적 사안에 따라 서면에 의한 해고통지로서 유효하다고 보아야 할 경우가 있다고 판단했습니다(대법원 2015. 9. 10. 선고 2015두41401 판결). 다만 이는 모든 이메일 통지를 유효로 본 것이 아니므로, 결론은 이메일의 형식과 작성 경위 등 구체적 사실관계에 따라 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "근로기준법상 사용자는 해고하려면 해고사유와 해고시기를 서면으로 통지해야 하며, 서면으로 통지하지 않은 해고는 효력이 없습니다.", "reason": "근로기준법상 해고사유·시기의 서면 통지 의무와 위반 시 효력이 없다는 점을 단언했으며, 조문 번호(제27조)는 빠졌지만 핵심 사실은 일치함."}, "codex": {"ok": true, "quote": "근로기준법상 사용자는 해고하려면 해고사유와 해고시기를 서면으로 통지해야 하며, 서면으로 통지하지 않은 해고는 효력이 없습니다. [S1]", "reason": "해고사유와 해고시기를 서면으로 통지해야 해고의 효력이 있다는 핵심 내용을 명시했습니다."}}}, {"key": "g026-kp3", "id": "g026", "level": "L3", "question": "회사가 육아기 근로시간 단축을 거부할 수 있는 경우는 언제이고, 거부하면 회사는 무엇을 해야 하나요?", "kp_index": 3, "all_kps": ["단축개시예정일 전날까지 계속 근로기간 6개월 미만 근로자의 신청", "업무 성격상 근로시간 분할이 곤란하거나 정상적 사업 운영에 중대한 지장이 있음을 사업주가 증명하는 경우", "거부 시 사유를 서면 통보하고 육아휴직 사용이나 출퇴근 시간 조정 등 지원 가능 여부를 근로자와 협의"], "answer": "회사는 다음 경우 육아기 근로시간 단축을 거부할 수 있습니다.\n\n1. 단축개시예정일 전날까지 해당 사업에서 계속 근로한 기간이 6개월 미만인 근로자가 신청한 경우입니다. [S3] 2). 거부하면 사유를 서면으로 알리고 육아휴직이나 출퇴근 시간 조정 등 다른 지원이 가능한지 협의해야 합니다(남녀고용평등법 제19조의2제2항).", "judges": {"opus": {"ok": true, "quote": "근로자의 업무 성격상 근로시간을 분할하여 수행하기 곤란하거나, 그 밖에 육아기 근로시간 단축이 정상적인 사업 운영에 중대한 지장을 초래하는 경우로서 회사가 이를 증명하는 경우입니다.", "reason": "근로시간 분할 곤란 또는 정상적 사업 운영에 대한 중대한 지장, 그리고 사업주의 증명 요건을 모두 단언함."}, "codex": {"ok": true, "quote": "근로자의 업무 성격상 근로시간을 분할하여 수행하기 곤란하거나, 그 밖에 육아기 근로시간 단축이 정상적인 사업 운영에 중대한 지장을 초래하는 경우로서 회사가 이를 증명하는 경우입니다. [S3]", "reason": "업무 분할의 곤란 또는 정상적인 사업 운영의 중대한 지장과 회사의 증명 조건을 모두 명시했습니다."}}}, {"key": "g012-kp2", "id": "g012", "level": "L2", "question": "휴일에 10시간 근무했다면 휴일근로 가산수당은 어떻게 계산되나요?", "kp_index": 2, "all_kps": ["8시간 이내 휴일근로는 통상임금의 100분의 50 가산", "8시간을 초과한 휴일근로(2시간)는 통상임금의 100분의 100 가산"], "answer": "휴일근로 10시간 중 8시간까지는 통상임금의 50% 이상, 8시간을 초과한 2시간은 통상임금의 100% 이상을 가산하여 지급해야 합니다. [S1]\n\n따라서 통상임금이 시간급으로 정해져 있다면 휴일근로 가산수당은 다음과 같이 계산합니다. [S1][S10]\n\n- 8시간: 시간급 통상임금 × 8 × 50%\n- 초과 2시간: 시간급 통상임금 × 2 × 100%\n\n합계는 **시간급 통상임금 × 6**입니다. [S1]\n\n대법원은 단체협약이나 취업규칙 등으로 휴일로 정한 날의 근로도 휴일근로수당 지급 대상에 포함될 수 있고, 해당 날이 휴일인지 여부는 관련 규정의 문언과 경위, 관행, 실제 임금 지급 방식 등을 종합하여 판단해야 한다고 판단했습니다(대법원 2020. 6. 25. 선고 2016다3386 판결) [S11] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "8시간까지는 통상임금의 50%, 8시간을 초과한 2시간은 통상임금의 100%를 가산해 지급해야 합니다(근로기준법 제56조제2항).", "judges": {"opus": {"ok": true, "quote": "8시간을 초과한 2시간은 통상임금의 100% 이상을 가산하여 지급해야 합니다.", "reason": "8시간을 초과한 2시간에 통상임금의 100%(100분의 100) 가산을 명시하고 있다."}, "codex": {"ok": true, "quote": "- 초과 2시간: 시간급 통상임금 × 2 × 100%", "reason": "8시간을 초과한 2시간에 통상임금의 100%를 가산한다는 계산을 명시했습니다."}}}, {"key": "g033-kp1", "id": "g033", "level": "L4", "question": "직원 30명 미만 회사는 근로자대표와 합의하면 주 12시간 연장근로에 8시간을 더 할 수 있다고 들었는데, 지금도 가능한가요?", "kp_index": 1, "all_kps": ["30명 미만 사업장의 1주 8시간 추가 연장 조항(제53조제3항·제6항)은 2022-12-31까지만 효력", "2026-10-01 현재 효력이 상실되어 적용할 수 없음(당사자 합의 연장 한도는 1주 12시간)"], "answer": "원칙적으로는 가능합니다. 상시 30명 미만의 근로자를 사용하는 사용자가 근로자대표와 서면으로 합의하면, 제53조 제1항 또는 제2항에 따른 연장근로에 더하여 1주간 8시간을 초과하지 않는 범위에서 연장근로를 할 수 있습니다. 합의서에는 연장근로가 필요한 사유와 기간, 대상 근로자의 범위를
