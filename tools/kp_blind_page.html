외됩니다. [S2]\n\n위 요건을 충족하면 수습 시작일부터 3개월 이내에는 해당 시간급 최저임금액에서 **10%를 뺀 금액**, 즉 최저임금의 **90%**까지 지급할 수 있습니다. [S1]\n\n사용자는 최저임금 적용 근로자에게 원칙적으로 최저임금액 이상을 지급해야 하며, 최저임금보다 낮게 정한 근로계약 부분은 무효이고 최저임금액을 지급하기로 한 것으로 봅니다. [S3]\n\n따라서 3개월이 지나거나 위 요건을 충족하지 못하면 최저임금의 90%를 적용할 수 없고, 최저임금액 이상을 지급해야 합니다. [S1] [S2]", "reference": "최저임금법 제5조제2항에 따라 1년 이상의 기간을 정해 근로계약을 맺은 수습 근로자로서 수습 시작일부터 3개월 이내인 사람에게는 다른 최저임금액을 정할 수 있고, 시행령 제3조는 그 금액을 시간급 최저임금액에서 100분의 10을 뺀 금액으로 정합니다. 다만 단순노무업무로 고용노동부장관이 고시한 직종에 종사하는 근로자는 감액할 수 없습니다.", "judges": {"opus": {"ok": true, "quote": "위 요건을 충족하면 수습 시작일부터 3개월 이내에는 해당 시간급 최저임금액에서 **10%를 뺀 금액**, 즉 최저임금의 **90%**까지 지급할 수 있습니다. [S1]", "reason": "'시간급 최저임금액에서 10%를 뺀 금액'은 '100분의 10을 뺀 금액'과 의미가 같습니다."}, "codex": {"ok": true, "quote": "위 요건을 충족하면 수습 시작일부터 3개월 이내에는 해당 시간급 최저임금액에서 **10%를 뺀 금액**, 즉 최저임금의 **90%**까지 지급할 수 있습니다. [S1]", "reason": "시간급 최저임금액에서 100분의 10을 뺀 금액을 지급할 수 있다고 명시했습니다."}}}, {"key": "n08-kp3", "id": "n08", "level": "L3", "question": "회사 사정이 어려워 직원들 임금 3억 원이 밀렸습니다. 사업주로서 정부의 체불임금 지급 융자를 받으려는데 한도가 2억 원이라고 들었습니다. 2억 원을 넘게 융자받을 방법은 없나요?", "kp_index": 3, "all_kps": ["일반 체불 임금등 융자는 사업주당 총 2억원(근로자 1명당 2천만원) 범위임", "요건을 모두 갖춘 특별융자대상사업주는 2억원을 초과하는 체불 임금등에 대한 특별융자를 신청할 수 있음(최근 3개월 내 미청산 체불 2억원 초과, 신청액 120% 이상 부동산 담보 등)", "특별융자는 근로자 1명당 2천만원, 사업주당 총 10억원 범위임"], "answer": "가능합니다. 일반 체불임금 융자는 사업주당 총 2억 원까지이고, 근로자 1명당 신청액은 2천만 원까지입니다. [S3]\n\n다만 다음 요건을 모두 갖춘 사업주는 2억 원을 초과하는 특별융자를 신청할 수 있습니다. [S4]\n\n- 법 적용 대상 사업 또는 사업장을 6개월 이상 운영한 사업주여야 합니다. [S5]\n- 대상 근로자가 확인 신청일까지 6개월 이상 계속 근로 중이거나, 6개월 이상 계속 근로 후 확인 신청일 전 1년 이내 퇴직한 사람이어야 합니다. [S7]\n- 확인 신청일 기준 최근 3개월 이내 발생하여 청산되지 않은 체불임금이 2억 원을 초과해야 합니다. [S4]\n- 특별융자 신청액의 120% 이상에 해당하는 부동산을 담보로 제공해야 합니다. [S4]\n- 융자 상환계획과 취약근로자 우선 지원계획이 구체적이고 타당해야 합니다. [S4]\n\n특별융자는 근로자 1명당 2천만 원까지, 사업주당 총 10억 원까지 신청할 수 있습니다. 다만 일반융자를 이미 받은 금액이 있으면 10억 원에서 그 금액을 공제한 범위에서 신청할 수 있습니다. [S4]\n\n신청하려면 특별융자대상사업주 확인신청서와 일반 확인자료, 담보 부동산 자료, 상환계획서 및 취약근로자 우선 지원계획서를 관할 지방고용노동관서의 장에게 제출해야 합니다. [S4] 확인 결과 적합하면 통지서를 받은 날부터 45일 이내에 근로복지공단에 특별융자를 신청해야 합니다. [S4][S13]\n\n공단은 예산 범위에서 융자대상자를 결정하며, 담보 부동산 가액 평가 등을 통해 융자금 회수가 어렵다고 판단하면 융자계약 체결을 거부할 수 있습니다. [S6] 특별융자의 상환기간은 2년 또는 3년 거치 후 4년 또는 5년 분할상환이고, 금리는 연 5%를 초과하지 않는 범위에서 정해집니다. [S1]\n\n따라서 체불액 3억 원인 경우에도 최근 3개월 내 발생·미청산 체불액이 2억 원을 초과하고 담보·계획 요건 등을 충족하면 특별융자를 통해 2억 원을 초과하여 신청할 수 있습니다. [S4] 다만 실제 융자액은 공단의 심사와 담보 부동산 가액 평가 결과에 따라 결정됩니다. [S1][S6]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "일반 체불 임금등 융자는 사업주당 총 2억원, 근로자 1명당 2천만원 범위에서 신청할 수 있습니다(임금채권보장법 시행규칙 제8조의8제4항). 다만 제8조의8제4항 전단에도 불구하고 최근 3개월 이내 발생한 미청산 체불액이 2억원을 초과하고 신청 금액의 120% 이상 부동산을 담보로 제공하는 등 요건을 모두 갖춘 사업주는 2억원을 초과하는 특별융자를 근로자 1명당 2천만원, 사업주당 총 10억원 범위에서 신청할 수 있습니다(제8조의9제1항·제5항).", "judges": {"opus": {"ok": true, "quote": "특별융자는 근로자 1명당 2천만 원까지, 사업주당 총 10억 원까지 신청할 수 있습니다.", "reason": "특별융자의 근로자 1명당 2천만원과 사업주당 총 10억원 한도를 모두 명시함."}, "codex": {"ok": true, "quote": "특별융자는 근로자 1명당 2천만 원까지, 사업주당 총 10억 원까지 신청할 수 있습니다.", "reason": "특별융자의 근로자 1명당 한도와 사업주당 총 한도를 모두 명시했습니다."}}}, {"key": "g011-kp1", "id": "g011", "level": "L2", "question": "입사한 지 2개월 된 직원을 해고할 때도 30일 전에 예고해야 하나요?", "kp_index": 1, "all_kps": ["계속 근로한 기간이 3개월 미만이면 해고예고 의무가 적용되지 않음"], "answer": "아니요. 근로자가 계속 근로한 기간이 3개월 미만이면 해고예고 의무가 적용되지 않으므로, 입사 후 2개월 된 직원은 원칙적으로 30일 전 예고나 30일분 이상의 통상임금 지급 없이 해고할 수 있습니다. [S1]\n\n다만 해고에는 정당한 이유가 있어야 하고, 해고사유와 해고시기를 서면으로 통지해야 효력이 있습니다. [S2][S3]\n\n대법원은 해고사유를 서면에 전혀 기재하지 않은 경우 근로기준법 제27조를 위반한 해고통지라고 판단했습니다(대법원 2021. 2. 25. 선고 2017다226605 판결). [S12] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "아닙니다. 근로자가 계속 근로한 기간이 3개월 미만인 경우에는 30일 전 해고예고(또는 30일분 통상임금 지급) 의무가 적용되지 않습니다(근로기준법 제26조 단서 제1호).", "judges": {"opus": {"ok": true, "quote": "근로자가 계속 근로한 기간이 3개월 미만이면 해고예고 의무가 적용되지 않으므로, 입사 후 2개월 된 직원은 원칙적으로 30일 전 예고나 30일분 이상의 통상임금 지급 없이 해고할 수 있습니다.", "reason": "답변이 계속 근로기간 3개월 미만이면 해고예고 의무가 적용되지 않는다고 명시적으로 단언하여 정답 포인트와 의미가 일치함."}, "codex": {"ok": true, "quote": "근로자가 계속 근로한 기간이 3개월 미만이면 해고예고 의무가 적용되지 않으므로, 입사 후 2개월 된 직원은 원칙적으로 30일 전 예고나 30일분 이상의 통상임금 지급 없이 해고할 수 있습니다.", "reason": "계속 근로한 기간이 3개월 미만이면 해고예고 의무가 적용되지 않는다고 명시적으로 단언했습니다."}}}, {"key": "g019-kp1", "id": "g019", "level": "L2", "question": "육아기 근로시간 단축을 나눠 쓸 때 한 번에 최소 얼마 이상 써야 하나요? 계약 만료가 얼마 안 남은 기간제 직원은요?", "kp_index": 1, "all_kps": ["육아기 근로시간 단축은 나누어 사용할 수 있음", "1회 기간은 1개월 이상", "계약 만료로 1개월 이상 쓸 수 없는 기간제근로자는 남은 근로계약기간"], "answer": "육아기 근로시간 단축은 나누어 사용할 수 있으며, **1회 사용기간은 원칙적으로 1개월 이상**이어야 합니다. [S1]\n\n다만 기간제근로자가 근로계약 만료로 1개월 이상 사용할 수 없는 경우에는 **남은 근로계약기간 이상** 사용하면 됩니다. [S1]", "reference": "육아기 근로시간 단축은 나누어 쓸 수 있고 1회 기간은 1개월 이상이어야 합니다. 다만 근로계약기간 만료로 1개월 이상 쓸 수 없는 기간제근로자는 남은 근로계약기간 동안 쓸 수 있습니다(남녀고용평등법 제19조의4제2항).", "judges": {"opus": {"ok": true, "quote": "육아기 근로시간 단축은 나누어 사용할 수 있으며,", "reason": "나누어 사용할 수 있다고 명시하여 포인트와 같습니다."}, "codex": {"ok": true, "quote": "육아기 근로시간 단축은 나누어 사용할 수 있으며, **1회 사용기간은 원칙적으로 1개월 이상**이어야 합니다. [S1]", "reason": "육아기 근로시간 단축을 나누어 사용할 수 있다고 명시했습니다."}}}, {"key": "s03-kp2", "id": "s03", "level": "SUM", "question": "임신한 직원을 보호하기 위해 근로기준법이 정한 제도를 요약해 주세요.", "kp_index": 2, "all_kps": ["출산전후휴가 90일(미숙아 100일, 다태아 120일)이며 출산 후 45일(다태아 60일) 이상 배정", "휴가 중 최초 60일(다태아 75일)은 유급", "임신 중 시간외근로 금지, 요구 시 쉬운 종류의 근로로 전환", "임신 12주 이내 또는 32주 이후 1일 2시간 근로시간 단축 허용(임금 삭감 금지)"], "answer": "임신한 근로자를 보호하기 위한 주요 제도는 다음과 같습니다.\n\n1. **출산전후휴가**  \n   사용자는 출산 전후 90일의 휴가를 부여해야 하며, 미숙아 출산 시 100일, 다태임신 시 120일로 연장됩니다. 출산 후 휴가 기간은 원칙적으로 45일 이상이어야 하고, 다태임신은 60일 이상이어야 합니다. 최초 60일은 유급이며, 다태임신은 최초 75일이 유급입니다. [S1]  \n   미숙아는 임신 37주 미만 출생 또는 출생 시 체중 2,500그램 미만이면서 출생 후 24시간 이내 신생아중환자실에 입원한 영유아를 말합니다. [S11]\n\n2. **출산전후휴가의 분할 사용**  \n   유산·사산 경험, 출산 당시 만 40세 이상, 유산·사산 위험에 대한 의료기관 진단 등 사유가 있으면 출산 전 휴가를 나누어 사용할 수 있습니다. 다만 출산 후 휴가는 연속하여 45일 이상, 다태임신은 60일 이상이어야 합니다. [S1] [S13]\n\n3. **유산·사산휴가**  \n   임신 중 유산 또는 사산한 근로자가 청구하면 유산·사산휴가를 부여해야 합니다. 임신기간에 따라 유산 또는 사산일부터 10일, 30일, 60일 또는 90일까지 부여합니다. [S1] [S13]\n\n4. **임신 중 시간외근로 및 업무 전환 제한**  \n   사용자는 임신 중인 여성 근로자에게 시간외근로를 시킬 수 없으며, 근로자가 요구하면 쉬운 종류의 근로로 전환해야 합니다. [S1]\n\n5. **임신기 근로시간 단축**  \n   임신 12주 이내 또는 32주 이후인 근로자가 신청하면 1일 2시간의 근로시간 단축을 허용해야 합니다. 유산·조산 등 위험이 있는 근로자는 임신 전 기간에 이를 신청할 수 있습니다. [S1] [S4]  \n   근로시간 단축을 이유로 임금을 삭감할 수 없습니다. 신청하려면 원칙적으로 개시 예정일 3일 전까지 관련 사항을 적은 문서와 의사의 진단서를 제출해야 합니다. [S1] [S2]\n\n6. **업무 시작·종료 시각 변경**  \n   임신 중인 근로자가 1일 소정근로시간을 유지하면서 업무의 시작 및 종료 시각 변경을 신청하면 사용자는 이를 허용해야 합니다. 다만 정상적인 사업 운영에 중대한 지장이 있거나 근로자의 안전·건강 관련 법령을 위반하게 되는 경우에는 예외가 인정됩니다. [S1] [S6]  \n   신청은 원칙적으로 변경 예정일 3일 전까지 문서와 임신 사실을 증명하는 의사의 진단서를 제출해야 합니다. [S6]\n\n7. **태아검진 시간**  \n   임산부 정기건강진단에 필요한 시간을 청구하면 사용자는 이를 허용해야 하며, 그 시간을 이유로 임금을 삭감할 수 없습니다. [S3]\n\n8. **탄력적 근로시간제 적용 제외**  \n   15세 이상 18세 미만 근로자와 임신 중인 여성 근로자에게는 2주 이내", "reference": "출산 전후를 통틀어 90일(미숙아 100일, 다태아 120일)의 출산전후휴가를 주되 출산 후 45일(다태아 60일) 이상이 되어야 하고, 최초 60일(다태아 75일)은 유급입니다. 임신 중에는 시간외근로를 시킬 수 없고 요구하면 쉬운 근로로 전환해야 하며, 임신 12주 이내 또는 32주 이후에는 1일 2시간 근로시간 단축을 허용하고 임금을 삭감할 수 없습니다(근로기준법 제74조).", "judges": {"opus": {"ok": true, "quote": "최초 60일은 유급이며, 다태임신은 최초 75일이 유급입니다.", "reason": "최초 60일(다태아 75일) 유급이 정확히 일치한다."}, "codex": {"ok": true, "quote": "최초 60일은 유급이며, 다태임신은 최초 75일이 유급입니다.", "reason": "최초 60일 및 다태아의 최초 75일 유급을 명시했습니다."}}}, {"key": "s05-kp1", "id": "s05", "level": "SUM", "question": "퇴직금 제도의 핵심 내용을 요약해 주세요.", "kp_index": 1, "all_kps": ["계속근로기간 1년 미만이거나 4주 평균 1주 소정근로시간 15시간 미만인 근로자는 퇴직급여제도 설정 의무 대상 아님", "계속근로기간 1년에 대하여 30일분 이상의 평균임금을 퇴직금으로 지급", "퇴직 시 지급사유 발생일부터 14일 이내 지급(특별한 사정이 있으면 합의로 연장)"], "answer": "- 사용자는 퇴직하는 근로자에게 급여를 지급하기 위해 퇴직급여제도 중 하나 이상을 설정해야 합니다. 다만 계속근로기간이 1년 미만이거나 4주간 평균 1주간 소정근로시간이 15시간 미만인 근로자는 제외됩니다. [S5]\n\n- 퇴직급여제도에는 확정급여형·확정기여형·중소기업퇴직연금기금제도 및 퇴직금제도가 포함됩니다. [S3]\n\n- 퇴직금제도를 설정한 경우 계속근로기간 1년에 대해 30일분 이상의 평균임금을 퇴직금으로 지급해야 합니다. [S1]\n\n- 사용자가 퇴직급여제도나 개인형퇴직연금제도를 설정하지 않으면 퇴직금제도를 설정한 것으로 봅니다. [S2]\n\n- 퇴직금은 근로자가 퇴직한 날부터 14일 이내에 지급해야 하며, 특별한 사정이 있으면 당사자 합의로 지급기일을 연장할 수 있습니다. [S10]\n\n- 퇴직금은 원칙적으로 근로자가 지정한 개인형퇴직연금제도의 계정 등으로 이전하는 방법으로 지급해야 하며, 근로자가 계정을 지정하지 않으면 근로자 명의의 개인형퇴직연금제도 계정으로 이전합니다. [S10]\n\n- 근로자가 요구하고 대통령령으로 정한 사유가 있으면 퇴직 전 퇴직금 중간정산이 가능합니다. 중간정산 후 퇴직금 산정을 위한 계속근로기간은 정산 시점부터 새로 계산합니다. [S1] 주택 구입·전세금 또는 보증금 부담, 일정한 의료비 부담, 파산·개인회생, 임금 감소 제도 시행 등이 중간정산 사유에 해당합니다. [S12]\n\n- 하나의 사업에서는 급여 및 부담금 산정방법 등에 차등을 두어서는 안 되며, 제도를 설정하거나 다른 제도로 변경할 때에는 근로자대표의 동의가 필요합니다. [S5]\n\n- 월급이나 일당에 퇴직금 명목의 금액을 포함해 미리 지급하기로 한 약정은 중간정산으로 인정되는 경우가 아니면 퇴직금 지급의 효력이 없습니다. 대법원은 2011. 10. 13. 선고 2009도8248 판결에서 이와 같이 판단했습니다. [S14] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "계속근로기간 1년에 대하여 30일분 이상의 평균임금을 퇴직금으로 지급하며(제8조①), 계속근로기간 1년 미만이거나 4주 평균 주 15시간 미만인 근로자는 퇴직급여제도 설정 의무 대상이 아닙니다(제4조①). 퇴직하면 지급사유 발생일부터 14일 이내에 지급해야 하고, 특별한 사정이 있으면 당사자 합의로 지급기일을 연장할 수 있습니다(제9조①).", "judges": {"opus": {"ok": true, "quote": "다만 계속근로기간이 1년 미만이거나 4주간 평균 1주간 소정근로시간이 15시간 미만인 근로자는 제외됩니다.", "reason": "답변은 1년 미만 또는 4주 평균 주 15시간 미만 근로자를 퇴직급여제도 설정 의무에서 제외한다고 명시해 정답 포인트와 일치한다."}, "codex": {"ok": true, "quote": "사용자는 퇴직하는 근로자에게 급여를 지급하기 위해 퇴직급여제도 중 하나 이상을 설정해야 합니다. 다만 계속근로기간이 1년 미만이거나 4주간 평균 1주간 소정근로시간이 15시간 미만인 근로자는 제외됩니다.", "reason": "퇴직급여제도 설정 의무와 그 대상에서 제외되는 두 조건을 모두 명시했습니다."}}}, {"key": "s01-kp1", "id": "s01", "level": "SUM", "question": "회사가 직원을 해고할 때 법적으로 지켜야 하는 제한과 절차를 요약해 주세요.", "kp_index": 1, "all_kps": ["정당한 이유 없이 해고할 수 없음", "업무상 부상·질병 요양 휴업 기간과 그 후 30일, 산전·산후 휴업 기간과 그 후 30일은 해고 금지", "적어도 30일 전에 해고를 예고하고, 예고하지 않으면 30일분 이상의 통상임금을 지급", "해고사유와 해고시기를 서면으로 통지해야 해고의 효력이 있음"], "answer": "회사가 직원을 해고할 때에는 다음 제한과 절차를 지켜야 합니다.\n\n1. **정당한 이유가 있어야 합니다.** 사용자는 정당한 이유 없이 해고할 수 없습니다. [S1]  \n   취업규칙에 해고사유가 정해져 있더라도 정당한 이유가 필요합니다. [S14]\n\n2. **특정 기간에는 해고가 제한됩니다.** 업무상 부상·질병의 요양으로 휴업한 기간과 그 후 30일, 또는 산전·산후 여성이 법에 따라 휴업한 기간과 그 후 30일에는 원칙적으로 해고할 수 없습니다. 다만 일시보상이나 사업 계속 불가능 등의 예외가 있습니다. [S1]\n\n3. **경영상 해고는 별도 요건을 모두 충족해야 합니다.** 긴박한 경영상 필요가 있어야 하고, 해고 회피 노력을 다해야 하며, 합리적이고 공정한 기준으로 대상자를 선정해야 합니다. 또한 근로자대표에게 해고 예정일 50일 전까지 관련 사항을 통보하고 성실하게 협의해야 합니다. [S2]  \n   대법원은 경영상 해고에서 해고 회피 노력과 대상자 선정기준의 합리성·공정성을 사용자가 증명해야 한다고 판단했습니다(대법원 2021. 7. 29. 선고 2016두64876 판결) [S13]  \n   일정 규모 이상의 인원을 해고하는 경우에는 최초 해고일 30일 전까지 고용노동부장관에게 신고해야 합니다. [S5] 신고서에는 해고 사유, 예정 인원, 근로자대표와 협의한 내용 및 해고 일정이 포함되어야 합니다. [S5][S8]\n\n4. **해고를 예고해야 합니다.** 해고하려면 적어도 30일 전에 예고해야 하며, 예고하지 않으면 30일분 이상의 통상임금을 지급해야 합니다. 다만 계속 근로기간이 3개월 미만인 경우, 천재·사변 등으로 사업 계속이 불가능한 경우, 근로자의 중대한 귀책사유가 법령상 요건에 해당하는 경우에는 예외가 있습니다. [S3][S6]\n\n5. **해고사유와 해고시기를 서면으로 통지해야 합니다.** 서면통지가 없으면 해고의 효력이 없습니다. [S4] 30일 전 해고예고를 서면으로 하면서 해고사유와 해고시기를 명시한 경우에는 별도의 서면통지를 한 것으로 봅니다. [S4]\n\n6. **부당해고를 당한 근로자는 구제를 신청할 수 있습니다.** 근로자는 부당해고가 있었던 날부터 3개월 이내에 노동위원회에 구제를 신청할 수 있습니다. [S9]\n\n7. **경영상 해고 후 재고용 의무가 발생할 수 있습니다.** 경영상 이유로 해고한 뒤 3년 이내에 해고 당시 업무와 같은 업무의 근로자를 채용하려는 경우, 해고된 근로자가 원하면 우선적으로 고용해야 합니다. [S7]\n\n대법원은 일부 사업 부문만 폐지한 경우에도 원칙적으로 경영상 해고 요건을 갖추어야 하며, 그 요건을 갖추지 못한 해고는 정당한 이유가 없어 무효라고 판단했습니다(대법원 2021. 7. 29. 선고 2016두64876 판결) [S", "reference": "정당한 이유 없이 해고할 수 없고(제23조①), 업무상 부상·질병 요양 휴업 기간과 그 후 30일 및 산전·산후 휴업 기간과 그 후 30일에는 해고하지 못합니다(제23조②). 해고하려면 적어도 30일 전에 예고하거나 30일분 이상의 통상임금을 지급해야 하며(제26조), 해고사유와 해고시기를 서면으로 통지해야 효력이 있습니다(제27조).", "judges": {"opus": {"ok": true, "quote": "사용자는 정당한 이유 없이 해고할 수 없습니다.", "reason": "정당한 이유 없이 해고할 수 없다는 점을 명시적으로 단언함."}, "codex": {"ok": true, "quote": "사용자는 정당한 이유 없이 해고할 수 없습니다.", "reason": "정당한 이유 없는 해고를 금지한다고 명시했습니다."}}}, {"key": "n05-kp2", "id": "n05", "level": "L3", "question": "두 달마다 주던 정기상여금을 최저임금에 포함시키려고, 총액은 그대로 두고 매달 나눠 주는 방식으로 취업규칙을 바꾸려 합니다. 취업규칙 불리한 변경처럼 직원 과반수의 동의를 받아야 하나요?", "kp_index": 2, "all_kps": ["취업규칙을 근로자에게 불리하게 변경할 때는 원칙적으로 과반수 노동조합 또는 근로자 과반수의 동의를 받아야 함(근로기준법 제94조제1항 단서)", "최저임금 산입을 위해 1개월 초과 주기 임금을 총액 변동 없이 매월 지급하도록 취업규칙을 바꾸는 경우에는 근로기준법 제94조제1항에도 불구하고 과반수 노조 또는 근로자 과반수의 의견 청취로 족함(동의 불요)"], "answer": "최저임금에 산입하기 위해 1개월을 초과하는 주기로 지급하던 임금을 총액의 변동 없이 매월 지급하도록 취업규칙을 변경하는 경우에는, 근로기준법 제94조제1항의 예외로서 근로자 과반수의 동의가 아니라 의견을 들어야 합니다. 과반수 노동조합이 있으면 그 노동조합의 의견을 듣고, 없으면 근로자 과반수의 의견을 들어야 합니다. [S1]\n\n다만 일반적으로 취업규칙을 근로자에게 불리하게 변경하는 경우에는 과반수 노동조합 또는 근로자 과반수의 동의를 받아야 합니다. [S2] 따라서 위 변경이 총액의 변동 없이 최저임금 산입을 위한 지급주기 변경에 해당한다면, 제6조의2에 따라 의견청취 절차를 적용합니다. [S1]\n\n상시 10명 이상의 근로자를 사용하는 사업장은 취업규칙 변경 내용을 신고해야 하며, 변경 전후 비교자료와 의견을 들었음을 증명하는 자료를 첨부해야 합니다. [S5][S8]", "reference": "취업규칙을 근로자에게 불리하게 변경할 때는 원칙적으로 과반수 노동조합(없으면 근로자 과반수)의 동의를 받아야 합니다(근로기준법 제94조제1항 단서). 그러나 최저임금법 제6조의2는 최저임금 산입 임금(제6조제4항)에 포함시키기 위해 1개월을 초과하는 주기로 지급하던 임금을 총액 변동 없이 매월 지급하는 것으로 취업규칙을 바꾸는 경우, 근로기준법 제94조제1항에도 불구하고 과반수 노동조합 또는 근로자 과반수의 의견을 듣도록 정하고 있으므로 이 경우에는 동의 없이 의견 청취로 족합니다.", "judges": {"opus": {"ok": true, "quote": "최저임금에 산입하기 위해 1개월을 초과하는 주기로 지급하던 임금을 총액의 변동 없이 매월 지급하도록 취업규칙을 변경하는 경우에는, 근로기준법 제94조제1항의 예외로서 근로자 과반수의 동의가 아니라 의견을 들어야 합니다.", "reason": "최저임금 산입 목적, 총액 변동 없는 매월 지급 변경, 제94조제1항의 예외, 동의가 아닌 의견청취로 족하다는 점을 모두 명시했습니다."}, "codex": {"ok": true, "quote": "최저임금에 산입하기 위해 1개월을 초과하는 주기로 지급하던 임금을 총액의 변동 없이 매월 지급하도록 취업규칙을 변경하는 경우에는, 근로기준법 제94조제1항의 예외로서 근로자 과반수의 동의가 아니라 의견을 들어야 합니다. 과반수 노동조합이 있으면 그 노동조합의 의견을 듣고, 없으면 근로자 과반수의 의견을 들어야 합니다.", "reason": "최저임금 산입 목적, 1개월 초과 지급주기, 총액 유지 및 매월 지급이라는 조건과 동의 대신 과반수 노조 또는 근로자 과반수의 의견 청취가 필요함을 모두 명시합니다."}}}, {"key": "n25-kp3", "id": "n25", "level": "L3", "question": "하청업체 직원인데 하청 사장이 월급을 못 줬습니다. 원청이 공사대금을 제때 안 줘서 그렇다는데, 원청에도 임금 책임을 물을 수 있나요? 어떤 경우에 원청 책임이 인정되나요?", "kp_index": 3, "all_kps": ["직상 수급인(원청)의 귀책사유로 하수급인이 임금을 지급하지 못한 경우 직상 수급인이 하수급인과 연대책임을 짐", "귀책사유 범위(시행령): 정당한 사유 없이 도급계약상 지급일에 도급 금액을 지급하지 않은 경우", "그 밖에 원자재 공급 지연·미공급, 도급계약 조건 불이행으로 정상 수행이 불가능하게 된 경우도 포함"], "answer": "원칙적으로 사업이 도급에 따라 이루어지고 하수급인이 임금을 지급하지 못한 경우, 직상 수급인이 하수급인과 연대하여 책임을 질 수 있습니다. 다만 일반 도급에서는 하수급인의 임금 미지급이 직상 수급인의 귀책사유로 발생해야 합니다. [S1]\n\n직상 수급인의 귀책사유는 다음과 같습니다. [S4]\n\n- 정당한 사유 없이 도급계약상 도급금액 지급일에 도급금액을 지급하지 않은 경우 [S4]\n- 정당한 사유 없이 원자재 공급을 늦추거나 공급하지 않은 경우 [S4]\n- 정당한 사유 없이 도급계약 조건을 이행하지 않아 하수급인이 사업을 정상적으로 수행하지 못한 경우 [S4]\n\n따라서 원청이 정당한 사유 없이 공사대금을 지급기일에 지급하지 않았고, 그로 인해 하청업체가 직원에게 임금을 지급하지 못했다면 원청에 연대책임을 물을 수 있습니다. [S1] [S4]\n\n건설업에서 공사도급이 2차례 이상 이루어졌고, 임금을 지급하지 않은 하수급인이 건설사업자가 아니라면 별도 기준이 적용됩니다. 이 경우 직상 수급인은 자신의 귀책사유가 있는지 또는 하수급인에게 공사대금을 지급했는지와 관계없이 하수급인과 연대하여 임금을 지급할 책임을 집니다. [S2] [S11]\n\n다만 이 건설업상 연대책임은 하수급인이 직상 수급인이 된 이후 하수급인이 사용한 근로자의 임금에 대해서만 인정되고, 그 이전에 이미 발생한 임금 미지급까지 형사책임을 부담하는 것은 아닙니다. [S12]\n\n또한 건설업에서는 일정한 경우 직상 수급인이 하수급인에게 지급할 하도급대금 채무의 범위에서 근로자에게 임금을 직접 지급해야 합니다. 예를 들어 직상 수급인과 하수급인이 임금 직접지급에 합의한 경우, 확정된 지급명령 등 집행권원이 있는 경우, 또는 하수급인이 임금채무를 알리고 직상 수급인이 하수급인의 지급불능 사유를 명백하다고 인정한 경우입니다. [S3]\n\n따라서 질문의 경우에는 ① 건설업인지, ② 도급이 2차례 이상인지, ③ 하청업체가 건설사업자인지, ④ 원청의 공사대금 지급 지연이 정당한 사유 없이 발생했는지, ⑤ 미지급 임금이 어느 기간에 발생했는지를 확인해야 합니다. [S1] [S2] [S4] [S12]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "근로기준법 제44조제1항에 따라 직상 수급인의 귀책사유로 하수급인이 임금을 지급하지 못하면 직상 수급인은 하수급인과 연대하여 임금 책임을 집니다. 그 귀책사유는 시행령 제24조가 정한 정당한 사유 없는 도급 금액 지급일 미지급, 원자재 공급 지연·미공급, 도급계약 조건 불이행의 세 가지이므로, 원청이 공사대금을 정당한 사유 없이 제때 주지 않았다면 원청에도 책임을 물을 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "정당한 사유 없이 원자재 공급을 늦추거나 공급하지 않은 경우 [S4]", "reason": "원자재 공급 지연·미공급과 도급계약 조건 불이행으로 정상 수행이 불가능하게 된 경우('정당한 사유 없이 도급계약 조건을 이행하지 않아 하수급인이 사업을 정상적으로 수행하지 못한 경우')를 모두 귀책사유로 명시하고 있음."}, "codex": {"ok": true, "quote": "- 정당한 사유 없이 원자재 공급을 늦추거나 공급하지 않은 경우 [S4]\n- 정당한 사유 없이 도급계약 조건을 이행하지 않아 하수급인이 사업을 정상적으로 수행하지 못한 경우 [S4]", "reason": "원자재 공급 지연·미공급과 도급계약 조건 불이행으로 정상 수행이 불가능해진 경우를 모두 귀책사유로 명시했습니다."}}}, {"key": "g020-kp3", "id": "g020", "level": "L2", "question": "퇴직금을 제 통장으로 바로 받을 수 있나요?", "kp_index": 3, "all_kps": ["퇴직금은 원칙적으로 근로자가 지정한 개인형퇴직연금제도(IRP) 계정 또는 제23조의8 계정으로 이전하는 방법으로 지급", "55세 이후 퇴직 등 대통령령으로 정한 사유가 있으면 예외", "계정을 지정하지 않으면 근로자 명의의 개인형퇴직연금제도 계정으로 이전"], "answer": "원칙적으로 퇴직금은 근로자가 지정한 개인형퇴직연금제도(IRP) 계정 또는 중소기업퇴직연금기금제도 계정으로 이전하는 방법으로 지급해야 합니다. [S1]\n\n근로자가 계정을 지정하지 않으면 근로자 명의의 개인형퇴직연금제도 계정으로 이전합니다. [S1]\n\n다만 다음과 같은 경우에는 본인 통장으로 직접 지급될 수 있습니다: ① 55세 이후 퇴직하여 급여를 받는 경우, ② 급여가 고용노동부장관이 정한 금액 이하인 경우, ③ 근로자가 사망한 경우, ④ 퇴직 후 국외로 출국한 경우, ⑤ 다른 법령에 따라 급여의 전부 또는 일부를 공제하는 경우입니다. [S2]\n\n퇴직금은 지급사유가 발생한 날부터 14일 이내에 지급해야 하며, 특별한 사정이 있으면 당사자 간 합의로 지급기일을 연장할 수 있습니다. [S1]\n\n대법원은 지급기일을 연장하기로 합의했더라도 연장된 지급기일까지 퇴직금을 지급하지 않으면 퇴직급여 보장법 위반죄가 성립한다고 판단했습니다(대법원 2023. 7. 13. 선고 2023도188 판결). [S14] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "원칙적으로 퇴직금은 근로자가 지정한 개인형퇴직연금제도 계정 등으로 이전하는 방식으로 지급되며, 지정하지 않으면 본인 명의 IRP 계정으로 이전됩니다. 다만 55세 이후 퇴직, 고시 금액 이하 급여, 사망 등 시행령 사유가 있으면 예외입니다(근로자퇴직급여 보장법 제9조제2항·제3항, 시행령 제3조의2).", "judges": {"opus": {"ok": true, "quote": "근로자가 계정을 지정하지 않으면 근로자 명의의 개인형퇴직연금제도 계정으로 이전합니다.", "reason": "정답 포인트와 같은 내용을 명시적으로 단언했습니다."}, "codex": {"ok": true, "quote": "근로자가 계정을 지정하지 않으면 근로자 명의의 개인형퇴직연금제도 계정으로 이전합니다. [S1]", "reason": "계정을 지정하지 않을 때 근로자 명의의 개인형퇴직연금제도 계정으로 이전한다고 명시했습니다."}}}, {"key": "l5b05-kp3", "id": "l5b05", "level": "L5b", "question": "파견으로 2년 넘게 일한 회사가 저를 직접 고용하겠다며 근로계약서를 줬는데 '계약기간 1년'으로 되어 있습니다. 저는 기간제를 원한 적이 없습니다. 직접고용이라면 기간 없는 계약이어야 하는 것 아닌가요?", "kp_index": 3, "all_kps": ["2년을 초과해 계속 파견근로자를 사용한 사용사업주는 해당 파견근로자를 직접 고용해야 함(파견법 제6조의2제1항제3호)", "판례: 직접고용 시 특별한 사정이 없는 한 기간을 정하지 않은 근로계약을 체결해야 함이 원칙이고, 특별한 사정은 사용사업주가 증명해야 함", "판례: 특별한 사정 없이 체결한 기간제 근로계약 중 기간을 정한 부분은 무효가 될 수 있음"], "answer": "파견사업주·사용사업주·파견근로자 간 합의가 있더라도 총 파견기간은 원칙적으로 2년을 초과할 수 없습니다. 사용사업주가 제6조제2항을 위반하여 2년을 초과해 계속 파견근로자를 사용하면, 사용사업주는 해당 파견근로자를 직접 고용해야 합니다. [S4][S6]\n\n직접고용 시 사용사업주의 동종·유사업무 근로자에게 적용되는 취업규칙 등의 근로조건이 적용되고, 그러한 근로자가 없으면 기존 근로조건보다 낮아져서는 안 됩니다. [S6]\n\n대법원은 사용사업주가 직접고용의무에 따라 근로계약을 체결할 때 특별한 사정이 없는 한 기간을 정하지 않은 근로계약을 체결해야 한다고 판단했습니다. 근로자가 기간제 계약을 희망했거나, 동종·유사업무 근로자 대부분이 기간제여서 기간 없는 계약을 기대하기 어려웠던 경우 등 특별한 사정이 있을 때만 기간제 계약이 가능하며, 그 특별한 사정은 사용사업주가 증명해야 합니다. [S12]\n\n따라서 질문처럼 기간제 계약을 원하지 않았고 특별한 사정도 없다면, 1년의 계약기간을 정한 부분은 직접고용의무를 완전히 이행한 것으로 보기 어렵고 무효가 될 수 있습니다. [S12]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "원칙적으로 기간 없는 계약이어야 합니다. 파견근로자 보호 등에 관한 법률 제6조의2제1항제3호에 따라 2년을 초과해 계속 파견근로자를 사용한 사용사업주는 그 근로자를 직접 고용해야 하지만, 조문은 직접 고용의 계약 기간 유무를 정하지 않습니다. 대법원은 직접고용의무에 따라 기간제 근로계약을 체결한 사안에서, 사용사업주는 특별한 사정이 없는 한 기간을 정하지 않은 근로계약을 체결해야 하고, 근로자가 기간제를 희망한 경우 등 특별한 사정의 존재는 사용사업주가 증명해야 하며, 특별한 사정 없이 체결한 기간제 근로계약 중 기간을 정한 부분은 무효가 될 수 있다고 판단했습니다(대법원 2022. 1. 27. 선고 2018다207847 판결). 기간제를 원한 적이 없다면 계약기간 1년 부분은 무효가 될 수 있으나, 결론은 동종 업무 근로자의 계약 형태 등 구체적 사실관계에 따라 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "따라서 질문처럼 기간제 계약을 원하지 않았고 특별한 사정도 없다면, 1년의 계약기간을 정한 부분은 직접고용의무를 완전히 이행한 것으로 보기 어렵고 무효가 될 수 있습니다. [S12]", "reason": "특별한 사정 없이 정한 계약기간 부분이 무효가 될 수 있다고 명시함."}, "codex": {"ok": true, "quote": "따라서 질문처럼 기간제 계약을 원하지 않았고 특별한 사정도 없다면, 1년의 계약기간을 정한 부분은 직접고용의무를 완전히 이행한 것으로 보기 어렵고 무효가 될 수 있습니다. [S12]", "reason": "앞서 설명한 판례에 따라 특별한 사정 없이 정한 계약기간 부분이 무효가 될 수 있음을 명시했습니다."}}}, {"key": "n17-kp1", "id": "n17", "level": "L4", "question": "노동법 위반 사건의 현장조사나 심문 같은 수사는 지금 누가 전담하나요? 검사는 빠지게 된다는 얘기를 들었어요.", "kp_index": 1, "all_kps": ["2026-10-01 현재 근로기준법상 노동 관계 법령 위반 수사는 검사와 근로감독관이 전담함", "검사를 제외하고 근로감독관 전담으로 바꾸는 개정(2026.8.4 공포)은 2026-10-02 시행 예정으로 아직 미시행"], "answer": "현재(2026년 10월 1일 기준) 노동관계 법령 위반에 관한 현장조사·서류 제출·심문 등의 수사는 검사와 근로감독관이 전담합니다. 따라서 현재는 검사가 빠진 상태가 아닙니다. [S1]\n\n다만 2026년 10월 2일부터는 해당 수사를 근로감독관이 전담하고, 근로감독관의 직무에 관한 범죄 수사는 예외로 합니다. [S1]\n\n근로감독관은 사업장 등을 현장조사하고 장부·서류 제출을 요구하거나 사용자와 근로자를 심문할 수 있으며, 노동관계 법령 위반죄에 대해서는 법률이 정하는 바에 따라 사법경찰관의 직무를 수행합니다. [S3]\n\n따라서 들으신 내용은 2026년 10월 2일 시행 예정인 개정 내용에 해당합니다.", "reference": "2026년 10월 1일 현재 근로기준법 제105조에 따라 노동 관계 법령 위반에 관한 현장조사·서류 제출·심문 등의 수사는 검사와 근로감독관이 전담합니다. 검사를 빼고 근로감독관이 전담하도록 한 개정(2026.8.4 공포)은 2026년 10월 2일부터 시행되므로, 기준일 현재는 아직 검사가 빠지지 않았습니다.", "judges": {"opus": {"ok": true, "quote": "현재(2026년 10월 1일 기준) 노동관계 법령 위반에 관한 현장조사·서류 제출·심문 등의 수사는 검사와 근로감독관이 전담합니다.", "reason": "답변은 2026-10-01 기준 수사를 검사와 근로감독관이 전담한다고 명시해 정답 포인트와 일치합니다."}, "codex": {"ok": true, "quote": "현재(2026년 10월 1일 기준) 노동관계 법령 위반에 관한 현장조사·서류 제출·심문 등의 수사는 검사와 근로감독관이 전담합니다.", "reason": "기준일과 수사 전담 주체가 정답 포인트와 일치합니다."}}}, {"key": "n29-kp1", "id": "n29", "level": "L3", "question": "1년 계약으로 뽑은 신입 직원이 수습 기간 중입니다. 수습 기간에는 최저임금보다 적게 줘도 되나요? 얼마까지 깎을 수 있나요?", "kp_index": 1, "all_kps": ["1년 이상 기간으로 근로계약을 체결한 수습 근로자로서 수습 시작일부터 3개월 이내인 사람만 감액 대상", "감액 수준(시행령): 시간급 최저임금액에서 100분의 10을 뺀 금액", "단순노무업무로 고용노동부장관이 고시한 직종 종사자는 감액 대상에서 제외"], "answer": "가능합니다. 다만 다음 요건을 모두 충족해야 합니다.\n\n- 근로계약 기간이 **1년 이상**이어야 합니다. [S2]\n- 수습을 시작한 날부터 **3개월 이내**인 근로자여야 합니다. [S2]\n- 단순노무업무로 고용노동부장관이 정한 직종에 종사하는 근로자는 제외됩니다. [S2]\n\n위 요건을 충족하면 수습 시작일부터 3개월 이내에는 해당 시간급 최저임금액에서 **10%를 뺀 금액**, 즉 최저임금의 **90%**까지 지급할 수 있습니다. [S1]\n\n사용자는 최저임금 적용 근로자에게 원칙적으로 최저임금액 이상을 지급해야 하며, 최저임금보다 낮게 정한 근로계약 부분은 무효이고 최저임금액을 지급하기로 한 것으로 봅니다. [S3]\n\n따라서 3개월이 지나거나 위 요건을 충족하지 못하면 최저임금의 90%를 적용할 수 없고, 최저임금액 이상을 지급해야 합니다. [S1] [S2]", "reference": "최저임금법 제5조제2항에 따라 1년 이상의 기간을 정해 근로계약을 맺은 수습 근로자로서 수습 시작일부터 3개월 이내인 사람에게는 다른 최저임금액을 정할 수 있고, 시행령 제3조는 그 금액을 시간급 최저임금액에서 100분의 10을 뺀 금액으로 정합니다. 다만 단순노무업무로 고용노동부장관이 고시한 직종에 종사하는 근로자는 감액할 수 없습니다.", "judges": {"opus": {"ok": true, "quote": "- 근로계약 기간이 **1년 이상**이어야 합니다. [S2]\n- 수습을 시작한 날부터 **3개월 이내**인 근로자여야 합니다. [S2]", "reason": "답변은 두 요건(1년 이상 근로계약, 수습 시작일부터 3개월 이내)을 감액의 필수 요건으로 모두 명시해 정답 포인트와 일치합니다."}, "codex": {"ok": true, "quote": "- 근로계약 기간이 **1년 이상**이어야 합니다. [S2]\n- 수습을 시작한 날부터 **3개월 이내**인 근로자여야 합니다. [S2]", "reason": "계약 기간이 1년 이상이고 수습 시작일부터 3개월 이내인 근로자여야 한다는 조건을 모두 명시했습니다."}}}, {"key": "g042-kp1", "id": "g042", "level": "L2", "question": "임신 10주 만에 유산한 직원에게는 유산휴가를 며칠 줘야 하나요?", "kp_index": 1, "all_kps": ["임신기간 15주 이내 유산은 유산한 날부터 10일까지 휴가"], "answer": "임신기간이 15주 이내인 경우, 사업주는 유산한 날부터 10일까지 유산휴가를 주어야 합니다. 따라서 임신 10주 만에 유산한 직원에게는 유산한 날부터 10일의 유산휴가를 부여해야 합니다. [S1]\n\n직원이 유산·사산휴가를 청구하려면 휴가 청구 사유, 유산 발생일 및 임신기간 등을 적은 신청서에 의료기관의 진단서를 첨부하여 사업주에게 제출해야 합니다. [S1]\n\n다만, 근로기준법상 인공 임신중절 수술에 따른 유산은 원칙적으로 유산·사산휴가 대상에서 제외되며, 모자보건법 제14조제1항에 따른 경우는 제외됩니다. [S2]", "reference": "임신기간이 15주 이내이므로 유산한 날부터 10일까지 유산휴가를 주어야 합니다(근로기준법 시행령 제43조제3항제1호).", "judges": {"opus": {"ok": true, "quote": "임신기간이 15주 이내인 경우, 사업주는 유산한 날부터 10일까지 유산휴가를 주어야 합니다.", "reason": "답변은 임신기간 15주 이내라는 조건과 유산한 날부터 10일까지라는 휴가 기간을 모두 명시하여 정답 포인트와 의미가 일치한다."}, "codex": {"ok": true, "quote": "임신기간이 15주 이내인 경우, 사업주는 유산한 날부터 10일까지 유산휴가를 주어야 합니다.", "reason": "임신기간 15주 이내라는 조건과 유산한 날부터 10일까지의 휴가 부여 의무를 모두 명시하고 있습니다."}}}, {"key": "s02-kp4", "id": "s02", "level": "SUM", "question": "직장 내 괴롭힘이 무엇인지, 신고가 들어오면 회사가 해야 할 일을 관련 규정에 따라 요약해 주세요.", "kp_index": 4, "all_kps": ["직장 내 괴롭힘은 지위·관계 등의 우위를 이용해 업무상 적정범위를 넘어 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위", "신고 접수·인지 시 지체 없이 객관적으로 조사", "조사 기간 피해근로자등 보호를 위한 근무장소 변경·유급휴가 등 조치(피해자 의사에 반하지 않게)", "괴롭힘이 확인되면 행위자에 대해 징계 등 필요한 조치", "신고 근로자와 피해근로자등에게 해고나 불리한 처우 금지"], "answer": "직장 내 괴롭힘은 사용자 또는 근로자가 직장에서의 지위나 관계 등의 우위를 이용하여 업무상 적정범위를 넘어 다른 근로자에게 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위입니다. [S2]\n\n신고가 접수되거나 회사가 발생 사실을 인지하면, 회사는 지체 없이 당사자 등을 대상으로 객관적인 사실조사를 해야 합니다. [S1]\n\n조사 기간에는 피해근로자 또는 피해를 주장하는 근로자를 보호하기 위해 필요한 경우 근무장소 변경, 유급휴가 명령 등 적절한 조치를 해야 하며, 피해근로자 등의 의사에 반하는 조치는 할 수 없습니다. [S1]\n\n조사 결과 직장 내 괴롭힘이 확인되면, 피해근로자가 요청한 경우 근무장소 변경, 배치전환, 유급휴가 명령 등 적절한 조치를 해야 합니다. [S1]\n\n또한 회사는 지체 없이 행위자에게 징계, 근무장소 변경 등 필요한 조치를 해야 하며, 조치 전에 피해근로자의 의견을 들어야 합니다. [S1]\n\n신고자와 피해근로자 등에게 해고나 그 밖의 불리한 처우를 해서는 안 됩니다. [S1]\n\n조사자, 조사 내용을 보고받은 사람 및 조사 과정 참여자는 피해근로자 등의 의사에 반하여 조사 중 알게 된 비밀을 다른 사람에게 누설해서는 안 됩니다. 다만 사용자에게 조사 관련 내용을 보고하거나 관계 기관의 요청에 따라 필요한 정보를 제공하는 경우는 제외됩니다. [S1]\n\n상시 10명 이상의 근로자를 사용하는 사용자는 직장 내 괴롭힘의 예방 및 발생 시 조치 등에 관한 사항을 취업규칙에 작성하여 고용노동부장관에게 신고해야 합니다. [S10]\n\n사용자가 직장 내 괴롭힘을 한 경우에는 1천만원 이하의 과태료가 부과될 수 있고, 조사·보호·후속조치·비밀유지 관련 규정을 위반한 경우에는 500만원 이하의 과태료가 부과될 수 있습니다. [S4]\n\n다만 과태료 규정은 2026년 10월 8일, 2026년 12월 8일 및 2027년 1월 1일에 각각 개정 시행될 예정입니다. [S4]", "reference": "직장 내 괴롭힘은 지위·관계 등의 우위를 이용해 업무상 적정범위를 넘어 다른 근로자에게 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위입니다(제76조의2). 신고를 받거나 인지하면 지체 없이 객관적으로 조사하고, 조사 기간에는 피해근로자등의 의사에 반하지 않는 범위에서 근무장소 변경·유급휴가 등 보호조치를 해야 합니다. 괴롭힘이 확인되면 행위자를 징계하는 등 필요한 조치를 하고, 신고자와 피해자에게 불리한 처우를 해서는 안 됩니다(제76조의3).", "judges": {"opus": {"ok": true, "quote": "또한 회사는 지체 없이 행위자에게 징계, 근무장소 변경 등 필요한 조치를 해야 하며, 조치 전에 피해근로자의 의견을 들어야 합니다.", "reason": "앞 문장의 '조사 결과 직장 내 괴롭힘이 확인되면'에 이어 행위자에 대한 징계 등 필요한 조치 의무를 명시함."}, "codex": {"ok": true, "quote": "조사 결과 직장 내 괴롭힘이 확인되면, 피해근로자가 요청한 경우 근무장소 변경, 배치전환, 유급휴가 명령 등 적절한 조치를 해야 합니다. [S1]\n\n또한 회사는 지체 없이 행위자에게 징계, 근무장소 변경 등 필요한 조치를 해야 하며, 조치 전에 피해근로자의 의견을 들어야 합니다.", "reason": "괴롭힘 확인 후 행위자에게 징계 등 필요한 조치를 해야 한다고 명시했습니다."}}}, {"key": "l5b09-kp3", "id": "l5b09", "level": "L5b", "question": "계약직으로 2년 넘게 같은 업무를 계속해서 무기계약 근로자로 간주됐습니다. 그런데 회사는 제 임금과 수당은 예전 계약직 기준 그대로라고 합니다. 같은 일을 하는 기간 없는 계약 직원들에게 적용되는 취업규칙의 임금 기준을 저도 적용받을 수 있나요?", "kp_index": 3, "all_kps": ["예외 사유 없이 2년을 초과해 사용된 기간제근로자는 기간의 정함이 없는 근로계약을 체결한 근로자로 봄(기간제법 제4조제2항)", "판례: 무기계약으로 간주된 근로자에게는 동종·유사 업무의 기간 없는 계약 근로자가 있으면 달리 정함이 없는 한 그 근로자에게 적용되는 취업규칙 등이 동일하게 적용됨", "취업규칙 기준에 미달하는 근로계약 부분은 무효이고 취업규칙 기준에 따름(근로기준법 제97조)"], "answer": "기간제근로자를 2년을 초과하여 사용하면 기간의 정함이 없는 근로계약을 체결한 근로자로 간주됩니다. [S13]\n\n이 경우 같은 사업 또는 사업장에서 동종·유사 업무에 종사하는 기간의 정함이 없는 근로자에게 적용되는 취업규칙 등이 달리 정해져 있지 않다면 원칙적으로 동일하게 적용됩니다. 따라서 회사가 별도의 특별한 사정을 제시하지 못한다면, 같은 일을 하는 기간의 정함이 없는 근로자에게 적용되는 취업규칙의 임금·수당 기준을 적용받을 수 있습니다. [S13]\n\n또한 기간제근로자라는 이유로 동종·유사 업무의 기간의 정함이 없는 근로자보다 차별적 처우를 해서는 안 됩니다. [S3]\n\n취업규칙의 기준보다 낮은 임금·수당을 정한 근로계약 부분은 무효이고, 그 부분은 취업규칙의 기준에 따릅니다. [S1] 근로자와 사용자는 취업규칙과 근로계약을 지키고 성실히 이행할 의무가 있습니다. [S6]\n\n대법원은 기간의 정함이 없는 근로계약을 체결한 것으로 간주된 근로자에게 동종·유사 업무의 무기계약 근로자에게 적용되는 취업규칙 등을 원칙적으로 동일하게 적용해야 한다고 판단했습니다(대법원 2019. 12. 24. 선고 2015다254873 판결) [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "적용받을 수 있습니다. 기간제법 제4조제2항에 따라 예외 사유 없이 2년을 초과해 사용된 기간제근로자는 기간의 정함이 없는 근로계약을 체결한 근로자로 보지만, 이 조항은 간주된 뒤의 임금 등 근로조건을 정하지 않습니다. 대법원은 무기계약으로 간주된 근로자의 임금이 문제 된 사안에서, 해당 사업장에 동종 또는 유사한 업무에 종사하는 기간의 정함이 없는 근로계약 근로자가 있으면 달리 정함이 없는 한 그 근로자에게 적용되는 취업규칙 등이 동일하게 적용된다고 판단했습니다(대법원 2019. 12. 24. 선고 2015다254873 판결). 이때 근로기준법 제97조에 따라 취업규칙에서 정한 기준에 미달하는 근로계약 부분은 무효가 되고 취업규칙 기준에 따릅니다. 다만 동종·유사 업무인지, 달리 정한 사정이 있는지 등 구체적 사실관계에 따라 결론이 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "취업규칙의 기준보다 낮은 임금·수당을 정한 근로계약 부분은 무효이고, 그 부분은 취업규칙의 기준에 따릅니다.", "reason": "취업규칙 기준에 미달하는 근로계약 부분은 무효이고 취업규칙 기준에 따른다는 내용을 단언하므로 true이나, 근로기준법 제97조라는 조문 명칭은 언급하지 않았습니다."}, "codex": {"ok": true, "quote": "취업규칙의 기준보다 낮은 임금·수당을 정한 근로계약 부분은 무효이고, 그 부분은 취업규칙의 기준에 따릅니다.", "reason": "취업규칙 기준에 미달하는 근로계약 부분의 무효와 해당 부분에 대한 취업규칙 기준의 적용을 모두 명시했습니다."}}}, {"key": "g037-kp3", "id": "g037", "level": "L4", "question": "직장 내 성희롱 예방교육은 법인 대표나 상급자도 의무적으로 들어야 하나요?", "kp_index": 3, "all_kps": ["현행 제13조제2항은 사업주 및 근로자가 성희롱 예방 교육을 받아야 한다고 규정", "법인의 대표자·상급자를 수강 의무자로 명시하는 개정이 공포됨", "그 개정은 2026-11-27 시행 예정"], "answer": "네. 현재 시행 중인 조문에 따르면 사업주와 근로자는 직장 내 성희롱 예방교육을 받아야 합니다. [S1]\n\n따라서 법인의 대표자가 사업주에 해당하거나 근로자인 경우에는 교육 대상입니다. 다만, 2026년 11월 27일부터는 법인 대표자와 상급자도 명시적으로 교육 대상에 포함됩니다. [S1]\n\n교육은 연 1회 이상 실시해야 하며, 법령, 성희롱 발생 시 처리 절차와 조치 기준, 피해 근로자의 상담·구제 절차 등을 포함해야 합니다. [S2]\n\n2026년 11월 27일 시행 예정인 개정 내용은 공포일인 2026년 5월 26일에 따라 시행됩니다. [S1]", "reference": "현행 조문은 사업주와 근로자에게 수강 의무를 두고 있습니다. 법인의 대표자와 상급자를 명시하는 개정이 공포됐으며 2026년 11월 27일부터 시행됩니다.", "judges": {"opus": {"ok": true, "quote": "2026년 11월 27일 시행 예정인 개정 내용은 공포일인 2026년 5월 26일에 따라 시행됩니다.", "reason": "개정의 시행 예정일을 2026-11-27로 명시해 정답 포인트와 일치한다."}, "codex": {"ok": true, "quote": "2026년 11월 27일 시행 예정인 개정 내용은 공포일인 2026년 5월 26일에 따라 시행됩니다.", "reason": "개정의 시행 예정일을 2026년 11월 27일로 명시했습니다."}}}, {"key": "l5a03-kp1", "id": "l5a03", "level": "L5a", "question": "퇴사하면서 회사와 '퇴직금은 두 달 뒤에 주겠다'는 합의서를 썼습니다. 그런데 두 달이 지나도 퇴직금이 들어오지 않습니다. 회사는 지급 기한을 연장하기로 합의했으니 법 위반은 아니라고 하는데, 정말 그런가요?", "kp_index": 1, "all_kps": ["사용자는 퇴직 시 지급사유 발생일부터 14일 이내에 퇴직금을 지급해야 함(근로자퇴직급여 보장법 제9조 제1항)", "특별한 사정이 있으면 당사자 합의로 지급기일을 연장할 수 있음(제9조 제1항 단서)", "연장한 지급기일까지 지급하지 않으면 제9조 제1항 위반으로 형사처벌 대상(제43조 제1호)"], "answer": "아닙니다. 사용자는 퇴직금 지급 사유가 발생한 날부터 14일 이내에 지급해야 하며, 특별한 사정이 있으면 당사자 간 합의로 지급기일을 연장할 수 있습니다. [S6]\n\n다만 연장한 지급기일까지 퇴직금을 지급하지 않으면, 지급기일 연장 합의가 있었다는 이유만으로 법 위반이 없어지는 것은 아닙니다. 대법원은 사용자가 14일 이내에 지급기일을 연장하기로 합의했더라도 연장된 기일까지 퇴직금을 지급하지 않으면 퇴직급여 보장법 위반죄가 성립한다고 판단했습니다(대법원 2023. 7. 13. 선고 2023도188 판결). [S13]\n\n따라서 질문의 경우 회사는 합의한 두 달의 지급기일까지 지급하지 않았으므로 법 위반이 될 수 있습니다. 퇴직금 미지급자는 5년 이하의 징역 또는 5천만 원 이하의 벌금에 처할 수 있습니다. [S8]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "법 위반입니다. 근로자퇴직급여 보장법 제9조제1항에 따라 퇴직금은 지급사유 발생일부터 14일 이내에 지급해야 하고, 특별한 사정이 있으면 당사자 합의로 지급기일을 연장할 수 있습니다. 그러나 연장하기로 합의한 기일까지도 지급하지 않았다면 제9조제1항 위반이며 제43조제1호에 따른 처벌 대상입니다.", "judges": {"opus": {"ok": true, "quote": "사용자는 퇴직금 지급 사유가 발생한 날부터 14일 이내에 지급해야 하며", "reason": "지급사유 발생일부터 14일 이내 지급 의무를 명시함."}, "codex": {"ok": true, "quote": "사용자는 퇴직금 지급 사유가 발생한 날부터 14일 이내에 지급해야 하며, 특별한 사정이 있으면 당사자 간 합의로 지급기일을 연장할 수 있습니다.", "reason": "사용자의 퇴직금 지급 의무와 지급사유 발생일부터 14일 이내라는 기한을 명시했습니다."}}}, {"key": "l5a05-kp1", "id": "l5a05", "level": "L5a", "question": "회사가 작년에 쓰지 못한 연차에 대한 수당을 정해진 지급일에 주지 않았습니다. 회사는 연차수당은 매달 주는 월급이 아니라서 임금체불이 아니라고 하는데, 연차수당을 지급일에 주지 않은 것도 근로기준법 위반인가요?", "kp_index": 1, "all_kps": ["임금은 직접 근로자에게 그 전액을 지급해야 함(근로기준법 제43조 제1항)", "연차휴가미사용수당도 근로의 대가로 지급하는 임금(제2조제1항제5호)이므로 지급기일에 전액 지급하지 않으면 제43조 위반"], "answer": "네. 연차휴가미사용수당도 지급일에 전액 지급하지 않으면 근로기준법 위반이 될 수 있습니다. [S13]\n\n근로기준법은 임금을 통화로 직접 근로자에게 전액 지급하고, 임금 지급일을 정한 경우 그날 지급하도록 정하고 있습니다. [S5] 또한 연차휴가 기간의 임금은 휴가를 주기 전이나 준 직후의 임금지급일에 지급해야 합니다. [S3]\n\n대법원은 연차휴가미사용수당이 매월 정기적으로 지급되는 임금이 아니더라도, 사용자가 지급기일에 그 전액을 지급하지 않으면 근로기준법 제43조 제1항 및 제109조 제1항 위반죄가 성립한다고 판단했습니다(대법원 2017. 7. 11. 선고 2013도7896 판결). [S13] 따라서 회사가 “월급이 아니므로 임금체불이 아니다”라고 주장하는 것만으로는 지급 지연이 정당화되지 않습니다. [S13]\n\n지급기일을 넘긴 경우, 제36조에 따른 지급 사유가 발생한 날부터 14일이 되는 날까지 지급해야 하는 임금에는 그 다음 날부터 지급일까지 연 20%의 지연이자가 발생할 수 있습니다. [S1] [S9] 다만 법령상 자금 확보 곤란, 법원이나 노동위원회에서 임금의 존부를 다투는 것이 적절한 경우 등에는 지연이자 적용이 제외될 수 있습니다. [S7]\n\n근로기준법 제109조 위반은 3년 이하의 징역 또는 3천만원 이하의 벌금 대상입니다. [S2] 다만 제109조의 개정 내용은 2026년 10월 8일부터 시행될 예정입니다. [S2]\n\n대법원은 위 사안에서 연차휴가미사용수당의 지급기일 미지급도 근로기준법 위반이라고 판단했습니다(대법원 2017. 7. 11. 선고 2013도7896 판결). [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "위반입니다. 연차휴가미사용수당도 근로의 대가로 지급하는 임금(근로기준법 제2조제1항제5호)이므로, 정해진 지급일에 전액을 지급하지 않으면 임금 전액 지급 원칙(제43조제1항) 위반입니다.", "judges": {"opus": {"ok": true, "quote": "근로기준법은 임금을 통화로 직접 근로자에게 전액 지급하고, 임금 지급일을 정한 경우 그날 지급하도록 정하고 있습니다.", "reason": "임금을 직접 근로자에게 전액 지급해야 한다는 의무를 명시했고, 이후 문장에서 제43조 제1항도 언급하므로 핵심 사실이 일치한다."}, "codex": {"ok": true, "quote": "근로기준법은 임금을 통화로 직접 근로자에게 전액 지급하고, 임금 지급일을 정한 경우 그날 지급하도록 정하고 있습니다. [S5]", "reason": "임금을 근로자에게 직접 전액 지급해야 한다는 의무를 명시했습니다."}}}, {"key": "s06-kp4", "id": "s06", "level": "SUM", "question": "근로자파견은 어떤 업무에 얼마 동안 쓸 수 있는지, 이를 어기면 회사가 어떤 의무를 지는지 요약해 주세요.", "kp_index": 4, "all_kps": ["제조업의 직접생산공정업무를 제외하고 대통령령으로 정하는 업무를 대상으로 함", "출산·질병·부상 등으로 결원이 생기거나 일시적·간헐적으로 인력이 필요한 경우에는 대상 업무 외에도 파견 가능", "건설공사현장 업무, 선원 업무, 유해·위험 업무 등은 파견 금지", "파견기간은 1년 이내이며 3자 합의로 연장하더라도 총 2년을 초과할 수 없음", "대상 외 업무·금지 업무 사용이나 2년 초과 계속 사용 등 위반 시 사용사업주는 파견근로자를 직접 고용해야 함"], "answer": "- **대상 업무:** 제조업의 직접생산공정업무를 제외하고, 전문지식·기술·경험 또는 업무 성질 등을 고려해 적합하다고 판단되어 대통령령으로 정한 업무에 사용할 수 있습니다. 대통령령상 대상 업무는 별표 1의 업무입니다. [S2][S11]  \n- **예외적 사용:** 출산·질병·부상 등으로 결원이 생긴 경우 또는 일시적·간헐적으로 인력을 확보할 필요가 있는 경우에도 사용할 수 있습니다. 다만 사용사업주는 사전에 노동조합 또는 근로자 과반수 대표자와 성실하게 협의해야 합니다. [S2]  \n- **사용 금지 업무:** 건설공사현장 업무, 일부 하역업무, 선원의 업무, 유해·위험한 업무 및 대통령령으로 정한 업무에는 파견근로자를 사용할 수 없습니다. 대통령령상 금지 업무에는 분진작업, 건강관리카드 발급대상 업무, 의료인·간호조무사·의료기사 업무, 여객자동차·화물자동차 운전업무 등이 포함됩니다. [S2][S11]  \n- **파견기간:** 일반적인 파견은 1년을 초과할 수 없습니다. 파견사업주·사용사업주·파견근로자 간 합의가 있으면 1회에 한해 1년 이내로 연장할 수 있지만, 총 파견기간은 2년을 초과할 수 없습니다. 다만 고령자인 파견근로자는 2년을 초과하여 연장할 수 있습니다. [S1]  \n- **예외적 파견기간:** 출산·질병·부상 등 객관적으로 명백한 사유가 있는 경우에는 그 사유가 없어지는 데 필요한 기간까지 사용할 수 있습니다. 일시적·간헐적 인력 확보의 경우에는 3개월 이내이며, 사유가 없어지지 않고 3자 간 합의가 있으면 3개월 범위에서 한 차례 연장할 수 있습니다. [S1]  \n- **위반 시 직접고용의무:** 사용사업주가 대상 업무가 아닌 업무에 사용하거나, 금지 업무에 사용하거나, 합의에 따른 총 파견기간 2년을 초과하여 계속 사용하거나, 예외적 파견에 관한 협의를 하지 않은 경우 등에는 해당 파견근로자를 직접 고용해야 합니다. [S4]  \n- **직접고용 시 근로조건:** 같은 종류 또는 유사한 업무를 하는 사용사업주 근로자가 있으면 그 근로자에게 적용되는 취업규칙 등의 근로조건을 적용하고, 그런 근로자가 없으면 기존 근로조건 수준보다 낮아져서는 안 됩니다. [S4]  \n- **제재:** 직접고용의무를 이행하지 않으면 3천만원 이하의 과태료가 부과될 수 있습니다. 파견기간 제한 등을 위반하여 파견사업을 하거나 파견 역무를 제공받은 경우에는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처할 수 있습니다. [S5][S9]  \n- **대법원 판단:** 대법원은 계약 명칭이나 형식보다 제3자의 구속력 있는 지휘·명령, 사업에의 실질적 편입, 원고용주의 독자적 인사·근로관리 권한, 업무의 구별성과 전문성, 독립적 조직·설비 등을 종합해 근로자파견 여부를 판단해야 한다고 보았습니다(대법원 ", "reference": "근로자파견은 제조업의 직접생산공정업무를 제외하고 대통령령으로 정하는 업무를 대상으로 하며, 출산·질병·부상 등으로 결원이 생기거나 일시적·간헐적으로 인력이 필요한 경우에는 예외적으로 허용됩니다. 다만 건설공사현장 업무, 선원 업무, 유해·위험 업무 등은 파견할 수 없습니다(제5조). 파견기간은 1년을 넘을 수 없고, 3자 합의로 연장하더라도 총 2년을 넘을 수 없습니다(제6조). 대상이 아닌 업무나 금지 업무에 파견근로자를 쓰거나 2년을 넘겨 계속 사용하는 등 위반이 있으면 사용사업주는 그 파견근로자를 직접 고용해야 합니다(제6조의2).", "judges": {"opus": {"ok": true, "quote": "일반적인 파견은 1년을 초과할 수 없습니다. 파견사업주·사용사업주·파견근로자 간 합의가 있으면 1회에 한해 1년 이내로 연장할 수 있지만, 총 파견기간은 2년을 초과할 수 없습니다.", "reason": "1년 이내 원칙, 3자 합의에 의한 연장, 총 2년 상한을 모두 담고 있습니다."}, "codex": {"ok": true, "quote": "일반적인 파견은 1년을 초과할 수 없습니다. 파견사업주·사용사업주·파견근로자 간 합의가 있으면 1회에 한해 1년 이내로 연장할 수 있지만, 총 파견기간은 2년을 초과할 수 없습니다.", "reason": "일반적인 파견기간 1년 이내, 3자 합의에 따른 연장, 총 2년 상한을 모두 명시했습니다."}}}, {"key": "g023-kp1", "id": "g023", "level": "L3", "question": "재직 중인데 월급이 정기 지급일에 안 들어왔어요. 지연이자를 받을 수 있나요? 이율은 얼마인가요?", "kp_index": 1, "all_kps": ["제43조에 따라 지급해야 하는 임금(재직 중 임금)도 지연이자 대상이며, 제43조제2항에 따라 정하는 날의 다음 날부터 기산", "지연이자 이율은 연 100분의 20"], "answer": "재직 중 월급이 정기 지급일에 지급되지 않았다면, 사용자는 지급하는 날까지의 지연 일수에 대해 연 20%의 지연이자를 지급해야 합니다. [S1][S2]\n\n월급은 매월 1회 이상 일정한 날짜를 정해 지급해야 합니다. [S6] 따라서 정기 지급일에 지급되지 않은 임금은 그 지급일 다음 날부터 지연이자가 발생합니다. [S1]\n\n다만 천재·사변, 법령상 제약으로 지급자금을 확보하기 어려운 경우, 임금의 존부를 법원이나 노동위원회에서 다투는 것이 적절한 경우 등에는 해당 사유가 존속하는 기간 지연이자가 적용되지 않을 수 있습니다. [S4]\n\n또한 명백한 고의로 임금을 지급하지 않았거나, 1년 동안 체불한 개월 수가 총 3개월 이상인 경우 등에는 근로자가 법원에 체불 임금의 3배 이내 금액을 청구할 수 있습니다. [S5]", "reference": "네. 제43조에 따른 정기 임금을 정해진 지급일까지 주지 않으면 그 다음 날부터 지급일까지 지연이자가 붙고, 이율은 연 20%입니다(근로기준법 제37조제1항, 시행령 제17조). 다만 천재·사변 등 사유가 존속하는 기간은 적용되지 않습니다.", "judges": {"opus": {"ok": true, "quote": "따라서 정기 지급일에 지급되지 않은 임금은 그 지급일 다음 날부터 지연이자가 발생합니다.", "reason": "제43조 조문 번호는 없지만, 재직 중 임금이 지연이자 대상이고 정기 지급일(제43조제2항의 정하는 날) 다음 날부터 기산된다는 핵심 사실을 단언함."}, "codex": {"ok": true, "quote": "재직 중 월급이 정기 지급일에 지급되지 않았다면, 사용자는 지급하는 날까지의 지연 일수에 대해 연 20%의 지연이자를 지급해야 합니다. [S1][S2]\n따라서 정기 지급일에 지급되지 않은 임금은 그 지급일 다음 날부터 지연이자가 발생합니다. [S1]", "reason": "재직 중 임금도 지연이자 대상이며 정기 지급일 다음 날부터 기산한다고 명시했습니다."}}}, {"key": "g008-kp2", "id": "g008", "level": "L1", "question": "17세 고등학생 아르바이트생은 하루, 일주일에 최대 몇 시간까지 일할 수 있나요?", "kp_index": 2, "all_kps": ["1일 7시간, 1주 35시간을 초과하지 못함", "당사자 합의 시 1일 1시간, 1주 5시간 한도로 연장 가능"], "answer": "17세 근로자는 1일 7시간, 1주 35시간을 초과하여 일할 수 없습니다. 다만, 당사자 간 합의가 있으면 1일 1시간, 1주 5시간을 한도로 연장할 수 있으므로 최대 1일 8시간, 1주 40시간까지 가능합니다. [S1]\n\n근로시간은 휴게시간을 제외하여 계산합니다. [S11]\n\n또한 15세 이상 18세 미만 근로자에게는 탄력적 근로시간제가 적용되지 않고, 상시 30명 미만 사업장의 추가 8시간 연장근로 규정도 적용되지 않습니다. [S6] [S7]\n\n오후 10시부터 오전 6시까지의 야간근로와 휴일근로는 원칙적으로 할 수 없으며, 18세 미만자의 동의와 고용노동부장관의 인가가 있는 경우에만 예외가 인정됩니다. [S4]", "reference": "15세 이상 18세 미만은 1일 7시간, 1주 35시간을 초과할 수 없고, 당사자 합의로 1일 1시간, 1주 5시간까지 연장할 수 있습니다(근로기준법 제69조).", "judges": {"opus": {"ok": true, "quote": "다만, 당사자 간 합의가 있으면 1일 1시간, 1주 5시간을 한도로 연장할 수 있으므로 최대 1일 8시간, 1주 40시간까지 가능합니다.", "reason": "당사자 합의 조건과 1일 1시간·1주 5시간 연장 한도를 모두 명시함."}, "codex": {"ok": true, "quote": "다만, 당사자 간 합의가 있으면 1일 1시간, 1주 5시간을 한도로 연장할 수 있으므로 최대 1일 8시간, 1주 40시간까지 가능합니다.", "reason": "당사자 합의 조건과 1일 1시간, 1주 5시간의 연장 한도를 모두 명시했습니다."}}}, {"key": "l5b07-kp2", "id": "l5b07", "level": "L5b", "question": "1년 계약직으로 입사해서 1년 뒤 한 번 재계약하고 딱 2년을 채운 뒤 계약 만료로 퇴사했습니다. 연차를 하나도 쓰지 않았는데, 미사용 연차수당은 최대 며칠분을 받을 수 있나요? 첫해 11일, 1년 지났을 때 15일, 2년 다 채웠을 때 또 15일이 생겨서 41일 아닌가요?", "kp_index": 2, "all_kps": ["1년간 80% 이상 출근 시 15일, 계속근로 1년 미만은 1개월 개근 시 1일의 유급휴가(근로기준법 제60조제1항·제2항)", "판례: 연차휴가는 전년도 1년간의 근로를 마친 다음 날 발생하므로 2년째 근로를 마치고 근로관계가 끝나면 15일이 추가로 발생하지 않음", "판례: 1년 초과 2년 이하 근로자의 최대 연차휴가일수는 11일 + 15일 = 총 26일(41일 아님)"], "answer": "근로기준법상 1개월 개근 시 1일의 유급휴가가 부여되고, 1년간 80% 이상 출근하면 15일의 유급휴가가 부여됩니다. 또한 3년 이상 계속 근로한 경우에만 가산휴가가 발생합니다. [S1]\n\n대법원은 1년을 초과하되 2년 이하의 기간 동안 근로한 경우, 최초 1년 동안의 제60조 제2항 휴가 최대 11일과 최초 1년을 마친 다음 날 발생하는 제60조 제1항 휴가 15일을 합쳐 최대 26일이라고 판단했습니다(대법원 2022. 9. 7. 선고 2022다245419 판결) [S14]\n\n따라서 질문처럼 정확히 2년 근무 후 계약이 만료되어 퇴사한 경우, 미사용 연차수당은 원칙적으로 최대 26일분입니다. 2년을 다 채운 날에 추가로 15일이 발생하여 41일이 되는 것은 아닙니다. 제60조 제1항의 15일은 최초 1년 근로를 마친 다음 날 발생하므로, 그 15일을 사용할 수 있는 다음 근로연도까지 근로관계가 유지되지 않으면 추가 15일은 발생하지 않습니다. [S14]\n\n다만, 연차휴가수당은 유급휴가를 주기 전이나 준 직후의 임금지급일에 지급해야 합니다. [S11] 또한 연차휴가를 사용하지 않아 소멸한 경우라도 사용자의 귀책사유로 사용하지 못했다면 소멸하지 않으며, 사용자가 법정 사용촉진 조치를 한 경우에는 미사용 휴가에 대한 보상 의무가 없을 수 있습니다. [S1][S2]\n\n근거 법령은 2026년 10월 1일 현재 시행 중이며, 연차휴가 분할청구·사용시기 변경·불리한 처우 금지 등을 포함한 개정 내용은 2027년 6월 10일부터 시행될 예정입니다. [S1][S2]\n\n대법원 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "41일이 아니라 최대 26일분입니다. 근로기준법 제60조제2항은 계속 근로기간이 1년 미만인 근로자에게 1개월 개근 시 1일의 유급휴가를, 제1항은 1년간 80퍼센트 이상 출근한 근로자에게 15일의 유급휴가를 주도록 정하지만, 연차휴가가 언제 발생하는지는 조문에 정함이 없습니다. 대법원은 연차수당 지급이 문제 된 사안에서, 연차휴가는 전년도 1년간의 근로에 대한 대가로서 전년도 1년간의 근로를 마친 다음 날 발생하므로, 1년을 초과하되 2년 이하의 기간 동안 근로한 근로자의 최대 연차휴가일수는 제60조제2항의 11일과 제1항의 15일을 합한 총 26일이라고 판단했습니다(대법원 2022. 9. 7. 선고 2022다245419 판결). 2년째 근로를 마친 날 근로관계가 끝났다면 두 번째 15일은 발생하지 않습니다. 다만 근로관계가 하루라도 더 유지되었는지 등 구체적 사실관계에 따라 결론이 달라질 수 있습니다.", "judges": 사용 촉진 절차와 시기가 다릅니다. [S1]\n\n### 1. 입사 1년 미만 근로자\n\n계속 근로기간이 1년 미만인 근로자는 **1개월 개근 시 1일의 유급휴가**를 받습니다. [S2]\n\n사용자가 다음 절차를 모두 서면으로 진행했는데도 근로자가 휴가를 사용하지 않아 소멸되면, 사용자는 해당 휴가에 대한 보상 의무가 없고 사용자 귀책사유로 보지 않습니다. [S1]\n\n- **최초 1년의 근로기간이 끝나기 3개월 전을 기준으로 10일 이내**: 사용하지 않은 휴가 일수를 알리고, 사용 시기를 정해 통보하도록 서면 촉구해야 합니다. [S1]\n- 위 촉구 후 **10일 이내**에 근로자가 사용 시기를 통보하지 않으면, **최초 1년의 근로기간이 끝나기 1개월 전까지** 사용자가 사용 시기를 정해 서면 통보해야 합니다. [S1]\n- 다만, 첫 번째 촉구 후 발생한 휴가는 **최초 1년의 근로기간이 끝나기 1개월 전을 기준으로 5일 이내**에 별도로 서면 촉구하고, 근로자가 통보하지 않으면 **최초 1년의 근로기간이 끝나기 10일 전까지** 사용 시기를 서면 통보해야 합니다. [S1]\n\n### 2. 1년 이상 근무한 직원\n\n제60조 제1항·제2항·제4항에 따른 연차 중, **계속 근로기간이 1년 미만인 근로자의 제60조 제2항 연차를 제외한 연차**에 대해서는 다음 절차를 적용합니다. [S1]\n\n- 연차 사용기간이 끝나기 **6개월 전을 기준으로 10일 이내**: 사용하지 않은 휴가 일수를 알리고, 사용 시기를 정해 통보하도록 서면 촉구해야 합니다. [S1]\n- 근로자가 촉구를 받은 날부터 **10일 이내**에 통보하지 않으면, 사용기간이 끝나기 **2개월 전까지** 사용자가 사용 시기를 정해 서면 통보해야 합니다. [S1]\n\n따라서 차이는 다음과 같습니다. [S1]\n\n| 구분 | 1차 서면 촉구 | 근로자가 통보하지 않을 때 사용자 지정 통보 |\n|---|---|---|\n| 입사 1년 미만 | 최초 1년 종료 3개월 전 기준 10일 이내 | 최초 1년 종료 1개월 전까지 |\n| 1년 이상 근무자 | 휴가 사용기간 종료 6개월 전 기준 10일 이내 | 휴가 사용기간 종료 2개월 전까지 |\n\n현재 위 규정은 시행 중이지만, **2027년 6월 10일부터 개정 내용이 시행될 예정**입니다. [S1] 개정 내용에도 입사 1년 미만 근로자에 대한 별도 사용 촉진 절차가 포함되어 있습니다. [S1]", "reference": "1년 이상 근무자의 연차는 사용기간이 끝나기 6개월 전을 기준으로 10일 이내에 미사용 일수를 알리고 사용 시기를 정해 통보하도록 서면 촉구해야 합니다(근로기준법 제61조제1항제1호). 1년 미만 근로자의 연차도 사용 촉진이 가능하며, 이 경우 최초 1년의 근로기간이 끝나기 3개월 전을 기준으로 10일 이내에 서면 촉구하고(서면 촉구 후 발생한 휴가는 1개월 전 기준 5일 이내), 이러한 조치에도 휴가를 쓰지 않아 소멸하면 보상 의무가 없습니다(제61조제2항).", "judges": {"opus": {"ok": true, "quote": "연차 사용기간이 끝나기 **6개월 전을 기준으로 10일 이내**: 사용하지 않은 휴가 일수를 알리고, 사용 시기를 정해 통보하도록 서면 촉구해야 합니다.", "reason": "1년 이상 근무자에 대해 사용기간 종료 6개월 전 기준 10일 이내에 미사용 일수 통지와 사용 시기 지정 서면 촉구를 명시함."}, "codex": {"ok": true, "quote": "- 연차 사용기간이 끝나기 **6개월 전을 기준으로 10일 이내**: 사용하지 않은 휴가 일수를 알리고, 사용 시기를 정해 통보하도록 서면 촉구해야 합니다. [S1]", "reason": "1년 이상 근무자의 연차에 대해 촉구 시기, 미사용 일수 고지 및 사용 시기 지정의 서면 촉구를 모두 명시합니다."}}}, {"key": "l5a08-kp2", "id": "l5a08", "level": "L5a", "question": "6개월짜리 계약직으로 일하기로 했는데 회사가 근로계약서에 임금 계산 방법이나 휴일, 연차 같은 내용을 하나도 적어주지 않았습니다. 회사는 계약직은 기간제법만 적용돼서 과태료 문제일 뿐이라고 하는데, 계약직에게도 근로기준법상 근로조건 명시 의무가 적용되나요?", "kp_index": 2, "all_kps": ["사용자는 근로계약 체결 시 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시해야 함(근로기준법 제17조 제1항)", "기간제근로자도 근로기준법상 근로자이므로 제17조가 적용됨", "기간제법이 적용된다는 이유로 근로기준법 제17조 의무가 배제되지 않음"], "answer": "네. 계약직에게도 근로기준법상 근로조건 명시 의무가 적용됩니다. 근로기준법은 근로계약 체결 시 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시하고, 임금의 구성항목·계산방법·지급방법과 소정근로시간·휴일·연차 유급휴가가 적힌 서면을 교부하도록 정합니다. [S2]\n\n기간제근로자는 근로기준법상 근로자에 해당하므로, 6개월 계약직이라는 이유만으로 근로기준법 제17조의 적용이 배제되지 않습니다. [S8]\n\n또한 기간제법도 기간제근로자와 계약을 체결할 때 근로시간, 임금의 구성항목·계산방법·지급방법, 휴일·휴가 등을 서면으로 명시하도록 정합니다. 이를 위반하면 500만원 이하의 과태료 대상입니다. [S1] [S7]\n\n대법원은 기간제 근로계약에도 근로기준법 제17조와 그 벌칙 조항이 적용되고, 기간제법이 유사한 위반행위에 과태료를 정하고 있다고 해서 근로기준법의 적용이 배제되는 것은 아니라고 판단했습니다(대법원 2024. 6. 27. 선고 2020도16541 판결). [S13]\n\n따라서 회사가 주장하는 것처럼 계약직은 기간제법상 과태료 문제에 그치는 것이 아니라, 근로기준법상 명시·서면 교부 의무도 문제될 수 있습니다. 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "적용됩니다. 근로기준법 제17조제1항은 사용자가 근로계약을 체결할 때 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시하도록 정하고 있고, 기간제근로자도 근로기준법상 근로자이므로 이 의무가 적용됩니다. 기간제법에 근로기준법 제17조의 적용을 배제하는 규정이 없으므로, 기간제법에 과태료 규정이 있다는 이유로 근로기준법상 의무와 벌칙(제114조제1호)이 사라지지 않습니다.", "judges": {"opus": {"ok": true, "quote": "기간제근로자는 근로기준법상 근로자에 해당하므로, 6개월 계약직이라는 이유만으로 근로기준법 제17조의 적용이 배제되지 않습니다.", "reason": "기간제근로자가 근로기준법상 근로자이므로 제17조가 적용된다는 점을 명시적으로 단언합니다."}, "codex": {"ok": true, "quote": "기간제근로자는 근로기준법상 근로자에 해당하므로, 6개월 계약직이라는 이유만으로 근로기준법 제17조의 적용이 배제되지 않습니다.", "reason": "기간제근로자도 근로기준법상 근로자이므로 제17조가 적용된다고 명시합니다."}}}, {"key": "n19-kp1", "id": "n19", "level": "L4", "question": "최저임금을 지키지 않는 회사를 감독하는 공무원을 이제 '노동감독관'이라고 부른다던데, 지금 최저임금법상 감독은 누가 맡고 있나요?", "kp_index": 1, "all_kps": ["현행 최저임금법상 「근로기준법」 제101조에 따른 근로감독관이 최저임금법 시행 사무를 관장하고 사업장 출입·서류 제출 요구·검사·질문을 할 수 있음", "「노동감독관 직무집행법」에 따른 노동감독관으로 바꾸는 개정은 2026-12-08 시행 예정으로 아직 미시행"], "answer": "현재 최저임금법상 감독 업무는 「근로기준법」 제101조에 따른 **근로감독관**이 담당합니다. [S2][S4]\n\n고용노동부장관은 근로감독관에게 최저임금법 시행에 관한 사무를 관장하도록 하고, 근로감독관은 사업장에 출입하여 장부·서류 제출을 요구하거나 물건을 검사하고 관계인에게 질문할 수 있습니다. [S2]\n\n근로감독관은 소속 지방고용노동관서의 장의 지휘·감독을 받습니다. [S1] 또한 최저임금 적용 제외 인가, 임금 관련 보고 요구, 과태료 부과·징수 권한은 지방고용노동관서의 장에게 위임되어 있습니다. [S3][S8][S11][S12]\n\n따라서 **2026년 10월 1일 현재 명칭과 법적 근거는 ‘근로감독관’**입니다. 다만 2026년 12월 8일부터는 관련 조문이 개정되어 ‘노동감독관’이라는 명칭과 「노동감독관 직무집행법」에 따른 규율이 시행될 예정입니다. [S2][S4]", "reference": "2026년 10월 1일 현재 최저임금법 제26조에 따라 고용노동부장관은 「근로기준법」 제101조에 따른 근로감독관에게 최저임금법 시행 사무를 맡기며, 근로감독관은 사업장 출입, 장부·서류 제출 요구, 검사와 질문을 할 수 있습니다. 명칭을 「노동감독관 직무집행법」에 따른 노동감독관으로 바꾸는 개정(2026.4.7 공포)은 2026년 12월 8일 시행 예정입니다.", "judges": {"opus": {"ok": true, "quote": "현재 최저임금법상 감독 업무는 「근로기준법」 제101조에 따른 **근로감독관**이 담당합니다. [S2][S4] 고용노동부장관은 근로감독관에게 최저임금법 시행에 관한 사무를 관장하도록 하고, 근로감독관은 사업장에 출입하여 장부·서류 제출을 요구하거나 물건을 검사하고 관계인에게 질문할 수 있습니다.", "reason": "근로기준법 제101조의 근로감독관이 사무를 관장한다는 점과 출입·서류 제출 요구·검사·질문 권한이 모두 명시되어 있다."}, "codex": {"ok": true, "quote": "현재 최저임금법상 감독 업무는 「근로기준법」 제101조에 따른 **근로감독관**이 담당합니다. [S2][S4]\n\n고용노동부장관은 근로감독관에게 최저임금법 시행에 관한 사무를 관장하도록 하고, 근로감독관은 사업장에 출입하여 장부·서류 제출을 요구하거나 물건을 검사하고 관계인에게 질문할 수 있습니다. [S2]", "reason": "법적 근거와 감독 주체, 시행 사무 관장 및 사업장 출입·서류 제출 요구·검사·질문 권한을 모두 명시했습니다."}}}, {"key": "s02-kp3", "id": "s02", "level": "SUM", "question": "직장 내 괴롭힘이 무엇인지, 신고가 들어오면 회사가 해야 할 일을 관련 규정에 따라 요약해 주세요.", "kp_index": 3, "all_kps": ["직장 내 괴롭힘은 지위·관계 등의 우위를 이용해 업무상 적정범위를 넘어 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위", "신고 접수·인지 시 지체 없이 객관적으로 조사", "조사 기간 피해근로자등 보호를 위한 근무장소 변경·유급휴가 등 조치(피해자 의사에 반하지 않게)", "괴롭힘이 확인되면 행위자에 대해 징계 등 필요한 조치", "신고 근로자와 피해근로자등에게 해고나 불리한 처우 금지"], "answer": "직장 내 괴롭힘은 사용자 또는 근로자가 직장에서의 지위나 관계 등의 우위를 이용하여 업무상 적정범위를 넘어 다른 근로자에게 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위입니다. [S2]\n\n신고가 접수되거나 회사가 발생 사실을 인지하면, 회사는 지체 없이 당사자 등을 대상으로 객관적인 사실조사를 해야 합니다. [S1]\n\n조사 기간에는 피해근로자 또는 피해를 주장하는 근로자를 보호하기 위해 필요한 경우 근무장소 변경, 유급휴가 명령 등 적절한 조치를 해야 하며, 피해근로자 등의 의사에 반하는 조치는 할 수 없습니다. [S1]\n\n조사 결과 직장 내 괴롭힘이 확인되면, 피해근로자가 요청한 경우 근무장소 변경, 배치전환, 유급휴가 명령 등 적절한 조치를 해야 합니다. [S1]\n\n또한 회사는 지체 없이 행위자에게 징계, 근무장소 변경 등 필요한 조치를 해야 하며, 조치 전에 피해근로자의 의견을 들어야 합니다. [S1]\n\n신고자와 피해근로자 등에게 해고나 그 밖의 불리한 처우를 해서는 안 됩니다. [S1]\n\n조사자, 조사 내용을 보고받은 사람 및 조사 과정 참여자는 피해근로자 등의 의사에 반하여 조사 중 알게 된 비밀을 다른 사람에게 누설해서는 안 됩니다. 다만 사용자에게 조사 관련 내용을 보고하거나 관계 기관의 요청에 따라 필요한 정보를 제공하는 경우는 제외됩니다. [S1]\n\n상시 10명 이상의 근로자를 사용하는 사용자는 직장 내 괴롭힘의 예방 및 발생 시 조치 등에 관한 사항을 취업규칙에 작성하여 고용노동부장관에게 신고해야 합니다. [S10]\n\n사용자가 직장 내 괴롭힘을 한 경우에는 1천만원 이하의 과태료가 부과될 수 있고, 조사·보호·후속조치·비밀유지 관련 규정을 위반한 경우에는 500만원 이하의 과태료가 부과될 수 있습니다. [S4]\n\n다만 과태료 규정은 2026년 10월 8일, 2026년 12월 8일 및 2027년 1월 1일에 각각 개정 시행될 예정입니다. [S4]", "reference": "직장 내 괴롭힘은 지위·관계 등의 우위를 이용해 업무상 적정범위를 넘어 다른 근로자에게 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위입니다(제76조의2). 신고를 받거나 인지하면 지체 없이 객관적으로 조사하고, 조사 기간에는 피해근로자등의 의사에 반하지 않는 범위에서 근무장소 변경·유급휴가 등 보호조치를 해야 합니다. 괴롭힘이 확인되면 행위자를 징계하는 등 필요한 조치를 하고, 신고자와 피해자에게 불리한 처우를 해서는 안 됩니다(제76조의3).", "judges": {"opus": {"ok": true, "quote": "조사 기간에는 피해근로자 또는 피해를 주장하는 근로자를 보호하기 위해 필요한 경우 근무장소 변경, 유급휴가 명령 등 적절한 조치를 해야 하며, 피해근로자 등의 의사에 반하는 조치는 할 수 없습니다.", "reason": "조사 기간 중 근무장소 변경·유급휴가 등 보호조치와 피해자 의사에 반하지 않아야 한다는 조건을 모두 명시함."}, "codex": {"ok": true, "quote": "조사 기간에는 피해근로자 또는 피해를 주장하는 근로자를 보호하기 위해 필요한 경우 근무장소 변경, 유급휴가 명령 등 적절한 조치를 해야 하며, 피해근로자 등의 의사에 반하는 조치는 할 수 없습니다.", "reason": "조사 기간의 보호조치와 근무장소 변경·유급휴가 예시 및 피해근로자등의 의사에 반해서는 안 된다는 조건을 모두 명시했습니다."}}}, {"key": "g004-kp1", "id": "g004", "level": "L1", "question": "육아기 근로시간 단축은 자녀가 몇 살까지일 때 신청할 수 있나요?", "kp_index": 1, "all_kps": ["만 12세 이하 또는 초등학교 6학년 이하 자녀를 양육하는 근로자"], "answer": "육아기 근로시간 단축은 **자녀가 만 12세 이하 또는 초등학교 6학년 이하**인 경우 신청할 수 있습니다. [S2]", "reference": "만 12세 이하 또는 초등학교 6학년 이하의 자녀를 양육하기 위해 신청할 수 있습니다(남녀고용평등법 제19조의2제1항).", "judges": {"opus": {"ok": true, "quote": "육아기 근로시간 단축은 **자녀가 만 12세 이하 또는 초등학교 6학년 이하**인 경우 신청할 수 있습니다.", "reason": "답변이 신청 가능 자녀 연령을 만 12세 이하 또는 초등학교 6학년 이하로 명시해 정답 포인트와 의미가 같다."}, "codex": {"ok": true, "quote": "육아기 근로시간 단축은 **자녀가 만 12세 이하 또는 초등학교 6학년 이하**인 경우 신청할 수 있습니다. [S2]", "reason": "육아기 근로시간 단축을 신청할 수 있는 자녀의 연령 또는 학년 조건을 정답 포인트와 동일하게 명시했습니다."}}}, {"key": "n10-kp2", "id": "n10", "level": "L2", "question": "연차 사용 촉진을 하면 못 쓴 연차를 수당으로 안 줘도 된다고 들었습니다. 입사 1년이 안 된 신입사원의 연차도 사용 촉진을 할 수 있나요? 1년 이상 근무한 직원과 서면 촉구 시기가 어떻게 다른가요?", "kp_index": 2, "all_kps": ["1년 이상 근무자의 연차는 사용기간이 끝나기 6개월 전을 기준으로 10일 이내에 미사용 일수를 알리고 사용 시기 지정을 서면 촉구함", "1년 미만 근로자의 연차도 사용 촉진이 가능하며, 최초 1년의 근로기간이 끝나기 3개월 전을 기준으로 10일 이내에 서면 촉구함"], "answer": "가능합니다. 다만 **입사 1년 미만 근로자의 연차**와 **1년 이상 근로자의 연차**는 사용 촉진 절차와 시기가 다릅니다. [S1]\n\n### 1. 입사 1년 미만 근로자\n\n계속 근로기간이 1년 미만인 근로자는 **1개월 개근 시 1일의 유급휴가**를 받습니다. [S2]\n\n사용자가 다음 절차를 모두 서면으로 진행했는데도 근로자가 휴가를 사용하지 않아 소멸되면, 사용자는 해당 휴가에 대한 보상 의무가 없고 사용자 귀책사유로 보지 않습니다. [S1]\n\n- **최초 1년의 근로기간이 끝나기 3개월 전을 기준으로 10일 이내**: 사용하지 않은 휴가 일수를 알리고, 사용 시기를 정해 통보하도록 서면 촉구해야 합니다. [S1]\n- 위 촉구 후 **10일 이내**에 근로자가 사용 시기를 통보하지 않으면, **최초 1년의 근로기간이 끝나기 1개월 전까지** 사용자가 사용 시기를 정해 서면 통보해야 합니다. [S1]\n- 다만, 첫 번째 촉구 후 발생한 휴가는 **최초 1년의 근로기간이 끝나기 1개월 전을 기준으로 5일 이내**에 별도로 서면 촉구하고, 근로자가 통보하지 않으면 **최초 1년의 근로기간이 끝나기 10일 전까지** 사용 시기를 서면 통보해야 합니다. [S1]\n\n### 2. 1년 이상 근무한 직원\n\n제60조 제1항·제2항·제4항에 따른 연차 중, **계속 근로기간이 1년 미만인 근로자의 제60조 제2항 연차를 제외한 연차**에 대해서는 다음 절차를 적용합니다. [S1]\n\n- 연차 사용기간이 끝나기 **6개월 전을 기준으로 10일 이내**: 사용하지 않은 휴가 일수를 알리고, 사용 시기를 정해 통보하도록 서면 촉구해야 합니다. [S1]\n- 근로자가 촉구를 받은 날부터 **10일 이내**에 통보하지 않으면, 사용기간이 끝나기 **2개월 전까지** 사용자가 사용 시기를 정해 서면 통보해야 합니다. [S1]\n\n따라서 차이는 다음과 같습니다. [S1]\n\n| 구분 | 1차 서면 촉구 | 근로자가 통보하지 않을 때 사용자 지정 통보 |\n|---|---|---|\n| 입사 1년 미만 | 최초 1년 종료 3개월 전 기준 10일 이내 | 최초 1년 종료 1개월 전까지 |\n| 1년 이상 근무자 | 휴가 사용기간 종료 6개월 전 기준 10일 이내 | 휴가 사용기간 종료 2개월 전까지 |\n\n현재 위 규정은 시행 중이지만, **2027년 6월 10일부터 개정 내용이 시행될 예정**입니다. [S1] 개정 내용에도 입사 1년 미만 근로자에 대한 별도 사용 촉진 절차가 포함되어 있습니다. [S1]", "reference": "1년 이상 근무자의 연차는 사용기간이 끝나기 6개월 전을 기준으로 10일 이내에 미사용 일수를 알리고 사용 시기를 정해 통보하도록 서면 촉구해야 합니다(근로기준법 제61조제1항제1호). 1년 미만 근로자의 연차도 사용 촉진이 가능하며, 이 경우 최초 1년의 근로기간이 끝나기 3개월 전을 기준으로 10일 이내에 서면 촉구하고(서면 촉구 후 발생한 휴가는 1개월 전 기준 5일 이내), 이러한 조치에도 휴가를 쓰지 않아 소멸하면 보상 의무가 없습니다(제61조제2항).", "judges": {"opus": {"ok": true, "quote": "**최초 1년의 근로기간이 끝나기 3개월 전을 기준으로 10일 이내**: 사용하지 않은 휴가 일수를 알리고, 사용 시기를 정해 통보하도록 서면 촉구해야 합니다.", "reason": "'가능합니다'로 1년 미만 근로자의 사용 촉진 가능성을 단언하고, 최초 1년 종료 3개월 전 기준 10일 이내 서면 촉구 시기도 명시함."}, "codex": {"ok": true, "quote": "가능합니다. 외에 해당하지 않음"], "answer": "원칙적으로 사업주는 근로자가 부모의 질병·사고·노령으로 돌보기 위한 가족돌봄휴직을 신청하면 허용해야 합니다. [S2]\n\n다만 사업주가 직업안정기관에 구인신청을 하고 14일 이상 대체인력을 채용하기 위해 노력했으나 채용하지 못한 경우에는 가족돌봄휴직을 허용하지 않을 수 있습니다. 다만 직업안정기관의 직업소개에도 불구하고 근로자가 정당한 이유 없이 2회 이상 채용을 거부한 경우는 제외됩니다. [S1]\n\n또한 가족돌봄휴직으로 정상적인 사업 운영에 중대한 지장이 초래되고 사업주가 이를 증명하는 경우에도 허용하지 않을 수 있습니다. [S1]\n\n허용하지 않는 경우 사업주는 그 사유를 근로자에게 서면으로 통보하고, 업무시간 조정·연장근로 제한·근로시간 조정 등 지원조치를 하도록 노력해야 합니다. [S2]", "reference": "직업안정기관에 구인신청을 하고 14일 이상 대체인력 채용을 위해 노력했는데도 채용하지 못했다면 거부할 수 있습니다. 다만 직업소개를 정당한 이유 없이 2회 이상 거부했다면 해당하지 않고, 거부 시 사유를 서면으로 알리고 근무시간 조정 등 조치를 하도록 노력해야 합니다(남녀고용평등법 제22조의2제1항·제3항, 시행령 제16조의3제1항제4호).", "judges": {"opus": {"ok": true, "quote": "다만 사업주가 직업안정기관에 구인신청을 하고 14일 이상 대체인력을 채용하기 위해 노력했으나 채용하지 못한 경우에는 가족돌봄휴직을 허용하지 않을 수 있습니다.", "reason": "직업안정기관 구인신청, 14일 이상 채용 노력, 채용 실패 시 거부 가능이라는 핵심 사실이 모두 일치합니다."}, "codex": {"ok": true, "quote": "다만 사업주가 직업안정기관에 구인신청을 하고 14일 이상 대체인력을 채용하기 위해 노력했으나 채용하지 못한 경우에는 가족돌봄휴직을 허용하지 않을 수 있습니다.", "reason": "구인신청, 14일 이상의 채용 노력, 채용 실패 및 거부 가능성을 모두 명시합니다."}}}, {"key": "g035-kp3", "id": "g035", "level": "L4", "question": "난임치료휴가 중 유급으로 보장되는 날은 며칠인가요? 곧 늘어난다던데요.", "kp_index": 3, "all_kps": ["2026-10-01 현재 연간 6일 이내 난임치료휴가 중 최초 2일이 유급", "최초 4일 유급으로 늘리는 개정이 공포됨", "그 개정은 2026-11-27 시행 예정"], "answer": "현재 난임치료휴가는 연간 6일 이내이며, 최초 2일이 유급입니다. [S1]\n\n2026년 11월 27일부터는 연간 6일 이내라는 기준은 같지만, 최초 4일이 유급으로 늘어날 예정입니다. [S1]\n\n따라서 기준일인 2026년 10월 1일에는 최초 2일이 유급이고, 2026년 11월 27일부터 최초 4일이 유급입니다. [S1]", "reference": "현재는 연간 6일 이내의 난임치료휴가 중 최초 2일이 유급입니다. 유급 기간을 최초 4일로 늘리는 개정이 2026년 11월 27일 시행될 예정입니다.", "judges": {"opus": {"ok": true, "quote": "2026년 11월 27일부터는 연간 6일 이내라는 기준은 같지만, 최초 4일이 유급으로 늘어날 예정입니다.", "reason": "최초 4일 유급으로의 변경이 2026-11-27부터 적용될 예정이라고 명시해 시행 예정일이 일치한다."}, "codex": {"ok": true, "quote": "2026년 11월 27일부터는 연간 6일 이내라는 기준은 같지만, 최초 4일이 유급으로 늘어날 예정입니다. [S1]", "reason": "최초 4일 유급으로 확대되는 시행 예정일을 2026년 11월 27일로 명시했습니다."}}}, {"key": "n02-kp2", "id": "n02", "level": "L3", "question": "직원 6명으로 1년 전에 새로 창업한 회사입니다. 확정급여형이나 확정기여형 퇴직연금을 따로 만들지 않고, 직원 동의를 받아 각자의 개인형퇴직연금(IRP)에 돈을 넣어줘도 퇴직급여제도를 갖춘 것이 되나요? 얼마씩 넣어야 하나요?", "kp_index": 2, "all_kps": ["새로 성립된 사업은 원칙적으로 성립 후 1년 이내에 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 함", "상시 10명 미만 사업은 개별 근로자의 동의를 받아 개인형퇴직연금제도를 설정하면 퇴직급여제도를 설정한 것으로 봄", "사용자는 가입자별 연간 임금총액의 12분의 1 이상을 현금으로 매년 1회 이상 IRP 계정에 납입해야 함"], "answer": "상시 근로자 10명 미만인 사업에서 사용자가 개별 근로자의 동의를 받아 개인형퇴직연금제도를 설정하면 해당 근로자에 대하여 퇴직급여제도를 설정한 것으로 봅니다. 따라서 직원 6명 모두에 대해 개별 동의를 받고 각자의 IRP를 설정하는 방식이 가능합니다. [S1]\n\n이 경우 사용자는 각 가입자의 연간 임금총액의 12분의 1 이상을 현금으로 해당 가입자의 IRP 계정에 납입해야 합니다. 또한 부담금은 매년 1회 이상 정기적으로 납입해야 합니다. [S1]\n\n직원이 퇴직할 때까지 부담금을 납입하지 않은 경우에는 퇴직일부터 14일 이내에 미납 부담금과 지연이자를 납입해야 하며, 특별한 사정이 있으면 당사자 간 합의로 납입기일을 연장할 수 있습니다. [S1][S6]\n\n따라서 1년간 납입할 최소액은 직원별로 그 1년간의 임금총액을 12로 나눈 금액입니다. 예를 들어 연간 임금총액이 3,600만 원이면 최소 300만 원입니다. [S1]\n\n사용자가 퇴직연금사업자를 선정하는 경우에는 직원별 동의를 받아야 하고, 직원이 요구하면 직원이 직접 퇴직연금사업자를 선정할 수 있습니다. [S1]\n\n참고로 개인형퇴직연금제도는 급여 수준이나 부담금 수준이 확정되지 않은 제도이고, 이 특례에서는 사용자가 부담금을 납입하는 구조입니다. [S7]", "reference": "새로 성립된 사업은 원칙적으로 1년 이내에 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 하지만(근로자퇴직급여 보장법 제5조), 상시 10명 미만 사업은 제25조제1항에 따라 개별 근로자의 동의를 받거나 근로자의 요구로 개인형퇴직연금제도를 설정하면 퇴직급여제도를 설정한 것으로 봅니다. 이 경우 사용자는 가입자별 연간 임금총액의 12분의 1 이상을 현금으로 매년 1회 이상 정기적으로 IRP 계정에 납입해야 합니다(제25조제2항).", "judges": {"opus": {"ok": true, "quote": "상시 근로자 10명 미만인 사업에서 사용자가 개별 근로자의 동의를 받아 개인형퇴직연금제도를 설정하면 해당 근로자에 대하여 퇴직급여제도를 설정한 것으로 봅니다.", "reason": "상시 10명 미만, 개별 근로자 동의, IRP 설정 시 퇴직급여제도 설정 간주라는 내용이 모두 명시됨."}, "codex": {"ok": true, "quote": "상시 근로자 10명 미만인 사업에서 사용자가 개별 근로자의 동의를 받아 개인형퇴직연금제도를 설정하면 해당 근로자에 대하여 퇴직급여제도를 설정한 것으로 봅니다.", "reason": "상시 10명 미만 사업의 개별 근로자 동의와 개인형퇴직연금제도 설정에 따른 퇴직급여제도 설정 간주를 명시합니다."}}}, {"key": "g020-kp2", "id": "g020", "level": "L2", "question": "퇴직금을 제 통장으로 바로 받을 수 있나요?", "kp_index": 2, "all_kps": ["퇴직금은 원칙적으로 근로자가 지정한 개인형퇴직연금제도(IRP) 계정 또는 제23조의8 계정으로 이전하는 방법으로 지급", "55세 이후 퇴직 등 대통령령으로 정한 사유가 있으면 예외", "계정을 지정하지 않으면 근로자 명의의 개인형퇴직연금제도 계정으로 이전"], "answer": "원칙적으로 퇴직금은 근로자가 지정한 개인형퇴직연금제도(IRP) 계정 또는 중소기업퇴직연금기금제도 계정으로 이전하는 방법으로 지급해야 합니다. [S1]\n\n근로자가 계정을 지정하지 않으면 근로자 명의의 개인형퇴직연금제도 계정으로 이전합니다. [S1]\n\n다만 다음과 같은 경우에는 본인 통장으로 직접 지급될 수 있습니다: ① 55세 이후 퇴직하여 급여를 받는 경우, ② 급여가 고용노동부장관이 정한 금액 이하인 경우, ③ 근로자가 사망한 경우, ④ 퇴직 후 국외로 출국한 경우, ⑤ 다른 법령에 따라 급여의 전부 또는 일부를 공제하는 경우입니다. [S2]\n\n퇴직금은 지급사유가 발생한 날부터 14일 이내에 지급해야 하며, 특별한 사정이 있으면 당사자 간 합의로 지급기일을 연장할 수 있습니다. [S1]\n\n대법원은 지급기일을 연장하기로 합의했더라도 연장된 지급기일까지 퇴직금을 지급하지 않으면 퇴직급여 보장법 위반죄가 성립한다고 판단했습니다(대법원 2023. 7. 13. 선고 2023도188 판결). [S14] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "원칙적으로 퇴직금은 근로자가 지정한 개인형퇴직연금제도 계정 등으로 이전하는 방식으로 지급되며, 지정하지 않으면 본인 명의 IRP 계정으로 이전됩니다. 다만 55세 이후 퇴직, 고시 금액 이하 급여, 사망 등 시행령 사유가 있으면 예외입니다(근로자퇴직급여 보장법 제9조제2항·제3항, 시행령 제3조의2).", "judges": {"opus": {"ok": true, "quote": "다만 다음과 같은 경우에는 본인 통장으로 직접 지급될 수 있습니다: ① 55세 이후 퇴직하여 급여를 받는 경우,", "reason": "55세 이후 퇴직 등 사유가 있으면 예외라는 점을 단언했습니다. '대통령령으로 정한 사유'라는 근거 법령 표현은 없지만 예외의 의미는 같습니다."}, "codex": {"ok": true, "quote": "다만 다음과 같은 경우에는 본인 통장으로 직접 지급될 수 있습니다: ① 55세 이후 퇴직하여 급여를 받는 경우, ② 급여가 고용노동부장관이 정한 금액 이하인 경우, ③ 근로자가 사망한 경우, ④ 퇴직 후 국외로 출국한 경우, ⑤ 다른 법령에 따라 급여의 전부 또는 일부를 공제하는 경우입니다. [S2]", "reason": "55세 이후 퇴직 등을 계정 이전 원칙의 예외로 명시했습니다."}}}, {"key": "n08-kp1", "id": "n08", "level": "L3", "question": "회사 사정이 어려워 직원들 임금 3억 원이 밀렸습니다. 사업주로서 정부의 체불임금 지급 융자를 받으려는데 한도가 2억 원이라고 들었습니다. 2억 원을 넘게 융자받을 방법은 없나요?", "kp_index": 1, "all_kps": ["일반 체불 임금등 융자는 사업주당 총 2억원(근로자 1명당 2천만원) 범위임", "요건을 모두 갖춘 특별융자대상사업주는 2억원을 초과하는 체불 임금등에 대한 특별융자를 신청할 수 있음(최근 3개월 내 미청산 체불 2억원 초과, 신청액 120% 이상 부동산 담보 등)", "특별융자는 근로자 1명당 2천만원, 사업주당 총 10억원 범위임"], "answer": "가능합니다. 일반 체불임금 융자는 사업주당 총 2억 원까지이고, 근로자 1명당 신청액은 2천만 원까지입니다. [S3]\n\n다만 다음 요건을 모두 갖춘 사업주는 2억 원을 초과하는 특별융자를 신청할 수 있습니다. [S4]\n\n- 법 적용 대상 사업 또는 사업장을 6개월 이상 운영한 사업주여야 합니다. [S5]\n- 대상 근로자가 확인 신청일까지 6개월 이상 계속 근로 중이거나, 6개월 이상 계속 근로 후 확인 신청일 전 1년 이내 퇴직한 사람이어야 합니다. [S7]\n- 확인 신청일 기준 최근 3개월 이내 발생하여 청산되지 않은 체불임금이 2억 원을 초과해야 합니다. [S4]\n- 특별융자 신청액의 120% 이상에 해당하는 부동산을 담보로 제공해야 합니다. [S4]\n- 융자 상환계획과 취약근로자 우선 지원계획이 구체적이고 타당해야 합니다. [S4]\n\n특별융자는 근로자 1명당 2천만 원까지, 사업주당 총 10억 원까지 신청할 수 있습니다. 다만 일반융자를 이미 받은 금액이 있으면 10억 원에서 그 금액을 공제한 범위에서 신청할 수 있습니다. [S4]\n\n신청하려면 특별융자대상사업주 확인신청서와 일반 확인자료, 담보 부동산 자료, 상환계획서 및 취약근로자 우선 지원계획서를 관할 지방고용노동관서의 장에게 제출해야 합니다. [S4] 확인 결과 적합하면 통지서를 받은 날부터 45일 이내에 근로복지공단에 특별융자를 신청해야 합니다. [S4][S13]\n\n공단은 예산 범위에서 융자대상자를 결정하며, 담보 부동산 가액 평가 등을 통해 융자금 회수가 어렵다고 판단하면 융자계약 체결을 거부할 수 있습니다. [S6] 특별융자의 상환기간은 2년 또는 3년 거치 후 4년 또는 5년 분할상환이고, 금리는 연 5%를 초과하지 않는 범위에서 정해집니다. [S1]\n\n따라서 체불액 3억 원인 경우에도 최근 3개월 내 발생·미청산 체불액이 2억 원을 초과하고 담보·계획 요건 등을 충족하면 특별융자를 통해 2억 원을 초과하여 신청할 수 있습니다. [S4] 다만 실제 융자액은 공단의 심사와 담보 부동산 가액 평가 결과에 따라 결정됩니다. [S1][S6]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "일반 체불 임금등 융자는 사업주당 총 2억원, 근로자 1명당 2천만원 범위에서 신청할 수 있습니다(임금채권보장법 시행규칙 제8조의8제4항). 다만 제8조의8제4항 전단에도 불구하고 최근 3개월 이내 발생한 미청산 체불액이 2억원을 초과하고 신청 금액의 120% 이상 부동산을 담보로 제공하는 등 요건을 모두 갖춘 사업주는 2억원을 초과하는 특별융자를 근로자 1명당 2천만원, 사업주당 총 10억원 범위에서 신청할 수 있습니다(제8조의9제1항·제5항).", "judges": {"opus": {"ok": true, "quote": "일반 체불임금 융자는 사업주당 총 2억 원까지이고, 근로자 1명당 신청액은 2천만 원까지입니다.", "reason": "사업주당 총 2억원과 근로자 1명당 2천만원 한도를 모두 명시함."}, "codex": {"ok": true, "quote": "일반 체불임금 융자는 사업주당 총 2억 원까지이고, 근로자 1명당 신청액은 2천만 원까지입니다.", "reason": "일반융자의 사업주당 총 한도와 근로자 1명당 한도를 모두 명시했습니다."}}}, {"key": "g016-kp2", "id": "g016", "level": "L2", "question": "아이가 출산 예정일보다 일찍 태어났는데, 육아휴직을 30일 전이 아니라 더 임박해서 신청해도 되나요?", "kp_index": 2, "all_kps": ["출산 예정일 이전에 자녀가 출생한 경우는 예외 사유에 해당", "휴직개시예정일 7일 전까지 신청 가능"], "answer": "네. 출산 예정일 이전에 자녀가 출생한 경우에는 휴직개시예정일 7일 전까지 육아휴직을 신청할 수 있습니다. [S1]\n\n육아휴직 신청서에는 신청인의 인적사항, 자녀의 성명·생년월일, 휴직개시예정일과 종료예정일, 신청 연월일 등을 적어 사업주에게 제출해야 합니다. [S1]\n\n사업주는 해당 신청을 받은 경우 신청일부터 3일 이내에 육아휴직을 허용한 사실을 서면 또는 전자적 방식으로 알려야 합니다. [S1] 사업주가 그 기간 내에 허용 사실을 알리지 않으면, 근로자가 신청한 대로 육아휴직을 허용한 것으로 봅니다. [S1]\n\n다만 휴직개시예정일 전날까지 해당 사업에서 계속 근로한 기간이 6개월 미만인 근로자는 육아휴직 적용 대상에서 제외될 수 있습니다. [S5]", "reference": "네. 출산 예정일 이전에 자녀가 출생한 경우에는 휴직개시예정일 7일 전까지 육아휴직을 신청할 수 있습니다(남녀고용평등법 시행령 제11조제3항제2호).", "judges": {"opus": {"ok": true, "quote": "네. 출산 예정일 이전에 자녀가 출생한 경우에는 휴직개시예정일 7일 전까지 육아휴직을 신청할 수 있습니다. [S1]", "reason": "휴직개시예정일 7일 전까지 신청할 수 있다는 기간과 기준일을 명시적으로 단언한다."}, "codex": {"ok": true, "quote": "출산 예정일 이전에 자녀가 출생한 경우에는 휴직개시예정일 7일 전까지 육아휴직을 신청할 수 있습니다.", "reason": "휴직개시예정일 7일 전까지 신청할 수 있다고 명시하고 있습니다."}}}, {"key": "n11-kp2", "id": "n11", "level": "L2", "question": "건설현장에서 재하도급 받은 업체 소속으로 일했는데 그 업체가 임금을 주지 않아 확정된 지급명령까지 받았습니다. 바로 위 하청업체나 원청 건설사에 직접 임금을 달라고 할 수 있나요?", "kp_index": 2, "all_kps": ["확정된 지급명령 등 집행권원이 있으면 직상 수급인은 하도급 대금 채무 범위에서 근로자가 청구하면 해당 공사에서 발생한 임금 상당액을 직접 지급해야 함", "도급이 2차례 이상 이루어진 경우 집행권원이 있는 근로자는 원수급인에게도 직접 지급을 요구할 수 있음"], "answer": "네. 다음 요건에 따라 청구할 수 있습니다.\n\n1. **바로 위 하청업체에 대한 청구**  \n건설업에서 2차례 이상 도급이 이루어졌고, 재하도급 업체가 건설사업자가 아니며 임금을 지급하지 못한 경우, 바로 위 수급인은 재하도급 업체와 연대하여 해당 근로자의 임금을 지급할 책임이 있습니다. [S2]  \n대법원은 이 책임이 직상 수급인의 귀책사유나 하도급대금 지급 여부와 관계없이 인정되는 강행규정이라고 판단했습니다(대법원 2021. 6. 10. 선고 2021다217370 판결). [S13]  \n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n2. **확정된 지급명령에 따른 직접 지급 청구**  \n재하도급 업체에 대한 확정된 지급명령이 있으면, 근로자는 바로 위 수급인에게 재하도급 업체가 지급해야 할 임금 상당액을 직접 지급하라고 청구할 수 있습니다. [S1]  \n바로 위 수급인이 그 금액을 지급하면, 재하도급 업체에 대한 하도급대금 채무는 그 지급 범위에서 소멸합니다. [S1]\n\n3. **원청 건설사에 대한 청구**  \n공사도급이 2차례 이상 이루어졌고 재하도급 업체에 대한 집행권원이 있는 경우, 근로자는 원수급인에게도 임금 상당액의 직접 지급을 요구할 수 있습니다. 다만 원수급인은 근로자가 민법상 채권자대위권을 행사할 수 있는 금액 범위에서 따라야 합니다. [S1]\n\n따라서 확정된 지급명령을 근거로 **바로 위 하청업체뿐 아니라 원청 건설사에도 직접 지급을 요구할 수 있지만**, 원청에 대한 청구는 채권자대위권을 행사할 수 있는 금액 범위로 제한됩니다. [S1]", "reference": "확정된 지급명령 등 집행권원이 있으면 직상 수급인은 하수급인에게 줄 하도급 대금 채무 범위에서 근로자가 청구하면 해당 건설공사에서 발생한 임금 상당액을 직접 지급해야 합니다(근로기준법 제44조의3제1항제2호). 또한 공사도급이 2차례 이상 이루어진 경우 집행권원이 있는 근로자는 원수급인에게도 직접 지급을 요구할 수 있으며(채권자대위권 행사 가능 금액 범위), 지급된 범위에서 하도급 대금 채무는 소멸합니다(제44조의3제2항·제3항).", "judges": {"opus": {"ok": true, "quote": "공사도급이 2차례 이상 이루어졌고 재하도급 업체에 대한 집행권원이 있는 경우, 근로자는 원수급인에게도 임금 상당액의 직접 지급을 요구할 수 있습니다.", "reason": "도급이 2차례 이상이고 집행권원이 있으면 원수급인에게 직접 지급을 요구할 수 있다는 내용을 명시적으로 단언합니다."}, "codex": {"ok": true, "quote": "공사도급이 2차례 이상 이루어졌고 재하도급 업체에 대한 집행권원이 있는 경우, 근로자는 원수급인에게도 임금 상당액의 직접 지급을 요구할 수 있습니다.", "reason": "도급이 2차례 이상 이루어지고 집행권원이 있는 근로자는 원수급인에게도 직접 지급을 요구할 수 있다고 명시했습니다."}}}, {"key": "g018-kp2", "id": "g018", "level": "L2", "question": "체불 사업주 정보가 신용정보기관에 넘어가는 기준이 뭔가요?", "kp_index": 2, "all_kps": ["제공일 이전 3년 이내 임금등 체불로 2회 이상 유죄 확정", "제공일 이전 1년 이내 체불총액 2천만원 이상", "또는 제43조의4의 상습체불사업주"], "answer": "체불사업주 정보가 신용정보기관에 제공되는 기준은 다음과 같습니다.\n\n1. **최근 3년 이내 임금등 체불로 2회 이상 유죄가 확정**되어야 합니다. [S1]  \n2. **자료 제공일 이전 1년 이내 체불총액이 2천만 원 이상**이어야 합니다. [S1]  \n3. 위 요건에 해당하더라도 고용노동부장관이 임금체불 예방을 위해 필요하다고 인정해야 하며, 체불사업주의 사망·회생절차·파산 등 자료 제공의 실효성이 없는 경우에는 제공하지 않습니다. [S1] [S4]  \n4. **상습체불사업주**로 정해진 경우에도 제공될 수 있습니다. 상습체불사업주는 직전 1년간 ① 3개월분 임금 이상을 체불했거나, ② 5회 이상 체불하면서 체불총액이 3천만 원 이상인 사업주입니다. [S3] [S13]  \n5. 상습체불사업주에 대한 자료 제공기간은 자료 제공일부터 **1년**입니다. [S8]  \n\n자료를 제공받은 신용정보기관은 해당 자료를 체불사업주의 신용도·신용거래능력 판단과 관련한 업무 외의 목적으로 이용하거나 누설해서는 안 됩니다. [S1]", "reference": "임금등 체불자료 제공일 이전 3년 이내 2회 이상 유죄가 확정되고 1년 이내 체불총액이 2천만원 이상인 체불사업주, 또는 상습체불사업주의 자료를 종합신용정보집중기관 요구 시 제공할 수 있습니다(근로기준법 제43조의3제1항).", "judges": {"opus": {"ok": true, "quote": "자료 제공일 이전 1년 이내 체불총액이 2천만 원 이상이어야 합니다.", "reason": "기준 시점(제공일 이전), 기간(1년), 금액(2천만 원 이상)이 모두 일치합니다."}, "codex": {"ok": true, "quote": "2. **자료 제공일 이전 1년 이내 체불총액이 2천만 원 이상**이어야 합니다. [S1]", "reason": "제공일 이전 1년이라는 기간과 체불총액 2천만 원 이상이라는 금액 요건을 모두 명시합니다."}}}, {"key": "l5a06-kp3", "id": "l5a06", "level": "L5a", "question": "저는 회사 노사협의회 근로자위원입니다. 사측 위원인 의장이 '논의할 안건이 없다'며 1년 가까이 정기회의를 한 번도 열지 않았습니다. 안건이 없으면 정기회의를 열지 않아도 되는 건가요?", "kp_index": 3, "all_kps": ["노사협의회는 3개월마다 정기적으로 회의를 개최해야 함(근로자참여법 제12조 제1항)", "구체적 안건이 있는지와 관계없이 정기회의 개최 의무가 있음", "정기회의를 개최하지 않으면 벌칙 대상(제32조)"], "answer": "안건이 없어도 정기회의를 열어야 합니다. 노사협의회는 3개월마다 정기적으로 회의를 개최해야 하며, 임시회의는 필요에 따라 개최할 수 있습니다. [S1]\n\n대법원은 구체적인 협의·의결 안건의 존재 여부와 관계없이 노사협의회가 3개월마다 정기회의를 개최해야 하고, 사용자는 정기회의에서 경영계획·실적, 분기별 생산계획·실적, 인력계획, 기업의 경제적·재정적 상황을 성실하게 보고하거나 설명해야 한다고 판단했습니다(대법원 2025. 5. 1. 선고 2025도2059 판결). [S11]\n\n따라서 의장이 ‘논의할 안건이 없다’는 이유로 1년 가까이 정기회의를 개최하지 않은 것은 제12조제1항 위반에 해당할 수 있습니다. 사용자가 정기회의를 정기적으로 개최하지 않으면 200만원 이하의 벌금에 처해질 수 있습니다. [S3]\n\n노사 일방의 대표자가 회의 목적을 문서로 밝혀 소집을 요구하면 의장은 그 요구에 따라야 하며, 의장은 원칙적으로 회의 개최 7일 전에 회의 일시·장소·의제 등을 각 위원에게 통보해야 합니다. [S2]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "아닙니다. 근로자참여 및 협력증진에 관한 법률 제12조제1항에 따라 노사협의회는 3개월마다 정기적으로 회의를 열어야 하며, 논의할 안건이 있는지와 관계없이 이 의무가 있습니다. 정기회의를 개최하지 않으면 제32조에 따른 벌칙 대상입니다.", "judges": {"opus": {"ok": true, "quote": "사용자가 정기회의를 정기적으로 개최하지 않으면 200만원 이하의 벌금에 처해질 수 있습니다.", "reason": "정기회의를 열지 않으면 벌칙(벌금) 대상이라고 단언하므로 핵심 사실은 충족하지만, 근거 조문인 제32조는 명시하지 않았습니다."}, "codex": {"ok": true, "quote": "사용자가 정기회의를 정기적으로 개최하지 않으면 200만원 이하의 벌금에 처해질 수 있습니다.", "reason": "정기회의를 개최하지 않으면 벌칙 대상이 된다는 사실을 명시했습니다."}}}, {"key": "g001-kp1", "id": "g001", "level": "L1", "question": "미숙아를 출산한 경우 출산전후휴가는 며칠인가요?", "kp_index": 1, "all_kps": ["미숙아를 출산한 경우 출산전후휴가는 100일"], "answer": "미숙아를 출산한 경우 출산전후휴가는 출산 전과 출산 후를 통하여 **100일**입니다. [S2]\n\n미숙아는 임신 37주 미만에 출생했거나 출생 시 체중이 2,500그램 미만이면서, 특별한 의료적 관리를 위해 출생 후 24시간 이내에 신생아중환자실에 입원한 영유아를 말합니다. [S1]\n\n휴가기간 중 출산 후 기간은 45일 이상이어야 합니다. [S2]", "reference": "미숙아를 출산한 경우 출산전후휴가는 100일입니다(근로기준법 제74조제1항). 미숙아의 범위 등은 고용노동부령으로 정합니다.", "judges": {"opus": {"ok": true, "quote": "미숙아를 출산한 경우 출산전후휴가는 출산 전과 출산 후를 통하여 **100일**입니다.", "reason": "답변이 미숙아 출산 시 출산전후휴가가 100일이라고 명시적으로 단언하여 정답 포인트와 일치함."}, "codex": {"ok": true, "quote": "미숙아를 출산한 경우 출산전후휴가는 출산 전과 출산 후를 통하여 **100일**입니다. [S2]", "reason": "미숙아를 출산한 경우 출산전후휴가가 100일이라고 명시적으로 단언했습니다."}}}, {"key": "n12-kp2", "id": "n12", "level": "L2", "question": "팀장에게 성희롱을 당해 회사에 신고했고 지금 조사가 진행 중입니다. 조사 기간 동안 팀장과 떨어져 일할 수 있게 해 달라고 요구할 수 있나요? 또 신고한 뒤 성과평가에서 불이익을 받으면 문제가 되나요?", "kp_index": 2, "all_kps": ["사업주는 조사 기간 동안 피해근로자등 보호를 위해 필요하면 근무장소 변경, 유급휴가 명령 등 적절한 조치를 해야 하며 피해근로자등의 의사에 반하는 조치는 금지됨", "신고 근로자·피해근로자등에게 성과평가·동료평가 등에서의 차별 등 불리한 처우를 해서는 안 됨"], "answer": "네. 조사 기간 동안 회사에 팀장과 분리되는 근무장소 변경, 유급휴가 명령 등 필요한 보호조치를 요구할 수 있습니다. 다만 회사는 피해근로자등의 의사에 반하는 조치를 해서는 안 됩니다. [S1]\n\n조사 결과 성희롱이 확인되면, 피해근로자가 요청할 경우 회사는 근무장소 변경, 배치전환, 유급휴가 명령 등 적절한 조치를 해야 합니다. [S1]\n\n신고한 뒤 성과평가에서 차별을 받거나 그에 따른 임금·상여금이 차별 지급되는 것은 금지되는 불리한 처우에 해당할 수 있습니다. 신고자와 피해근로자등에게는 성과평가·동료평가에서의 차별 및 그에 따른 임금·상여금 등의 차별 지급을 해서는 안 됩니다. [S1]\n\n신고자 또는 피해근로자등에 대한 불리한 처우는 3년 이하의 징역 또는 3천만원 이하의 벌금 대상이 될 수 있습니다. [S8]\n\n대법원은 성희롱 피해자 또는 피해를 주장하는 근로자에 대한 불리한 조치가 성희롱 문제 제기와 무관하거나 별도의 정당한 사유가 있다는 점을 사업주가 증명해야 하고, 문제 제기와 조치 사이의 시기, 조치 경위와 과정, 기존 사유의 존재 여부, 종전 관행이나 동종 사안과 비교한 차별성 등을 종합해 위법성을 판단한다고 했습니다(대법원 2017. 12. 22. 선고 2016다202947 판결) [S12] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "사업주는 조사 기간 동안 피해근로자등을 보호하기 위해 필요한 경우 근무장소의 변경, 유급휴가 명령 등 적절한 조치를 해야 하며, 피해근로자등의 의사에 반하는 조치를 해서는 안 됩니다(남녀고용평등과 일·가정 양립 지원에 관한 법률 제14조제3항). 또한 신고한 근로자와 피해근로자등에게 성과평가 또는 동료평가 등에서의 차별과 같은 불리한 처우를 해서는 안 됩니다(제14조제6항제4호).", "judges": {"opus": {"ok": true, "quote": "신고자와 피해근로자등에게는 성과평가·동료평가에서의 차별 및 그에 따른 임금·상여금 등의 차별 지급을 해서는 안 됩니다.", "reason": "신고자와 피해근로자등에 대한 성과평가·동료평가 차별 등 불리한 처우 금지를 명시적으로 단언했습니다."}, "codex": {"ok": true, "quote": "신고자와 피해근로자등에게는 성과평가·동료평가에서의 차별 및 그에 따른 임금·상여금 등의 차별 지급을 해서는 안 됩니다. [S1]", "reason": "신고자와 피해근로자등에 대한 성과평가·동료평가 차별 등 불리한 처우의 금지를 명시했습니다."}}}, {"key": "l5b01-kp2", "id": "l5b01", "level": "L5b", "question": "저희 회사는 두 달마다 기본급의 100%를 정기상여금으로 주는데, '지급일에 재직 중인 사람에게만 준다'는 조건이 붙어 있습니다. 회사는 이 조건 때문에 상여금이 통상임금이 아니어서 올해 연장근로수당 계산에서 빠진다고 합니다. 맞나요?", "kp_index": 2, "all_kps": ["통상임금은 근로자에게 정기적이고 일률적으로 소정근로 또는 총 근로에 대하여 지급하기로 정한 금액임(근로기준법 시행령 제6조제1항)", "판례: 특정 시점 재직 조건이 붙었다는 사정만으로 통상임금성이 부정되지 않음", "판례: 새 법리는 2024. 12. 19. 이후 제공한 연장근로 등의 법정수당 산정부터 적용됨(올해 연장근로수당에 적용)"], "answer": "아닙니다. 통상임금은 소정근로의 대가로 정기적·일률적으로 지급하기로 정한 임금입니다. [S1]\n\n대법원은 지급일 현재 재직 중이어야 한다는 조건만으로 통상임금성이 부정되지 않는다고 판단했습니다. 따라서 두 달마다 기본급의 100%를 정기적으로 지급하는 상여금이 소정근로의 대가이고 정기적·일률적으로 지급된다면, 재직조건이 붙어 있어도 통상임금에 해당할 수 있습니다(대법원 2025. 1. 23. 선고 2018다296472 판결). [S11]\n\n통상임금에 해당한다면 연장근로수당은 그 통상임금의 50% 이상을 가산하여 지급해야 하므로, 해당 상여금을 연장근로수당 산정에서 일률적으로 제외할 수 없습니다. [S2]\n\n다만 실제 통상임금 해당 여부는 상여금이 소정근로의 대가인지, 정기적·일률적으로 지급되는지 등 구체적인 지급 조건에 따라 판단됩니다. 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "회사 주장은 맞지 않을 가능성이 큽니다. 근로기준법 시행령 제6조제1항은 통상임금을 '근로자에게 정기적이고 일률적으로 소정근로 또는 총 근로에 대하여 지급하기로 정한' 금액으로 정의하고, 연장근로에는 통상임금의 100분의 50 이상을 가산해야 합니다(근로기준법 제56조제1항). 다만 '지급일 재직자에게만 준다'는 조건이 붙은 상여금이 이 정의에 해당하는지는 조문에 기준이 없습니다. 대법원은 정기상여금 등의 통상임금성이 문제 된 사안에서, 특정 시점에 재직 중이어야 한다는 조건이 부가되어 있다는 사정만으로 그 임금의 통상임금성이 부정되지 않으며, 이 새로운 법리는 2024. 12. 19. 이후 제공한 연장근로 등에 대한 법정수당 산정부터 적용된다고 판단했습니다(대법원 2024. 12. 19. 선고 2020다247190 전원합의체 판결). 따라서 올해 연장근로수당 계산에는 두 달마다 지급되는 정기상여금이 통상임금으로 포함될 수 있습니다. 다만 판례의 결론은 상여금의 실제 지급 조건 등 구체적 사실관계에 따라 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "대법원은 지급일 현재 재직 중이어야 한다는 조건만으로 통상임금성이 부정되지 않는다고 판단했습니다.", "reason": "특정 시점 재직 조건만으로 통상임금성이 부정되지 않는다는 판례 내용을 명시적으로 단언합니다."}, "codex": {"ok": true, "quote": "대법원은 지급일 현재 재직 중이어야 한다는 조건만으로 통상임금성이 부정되지 않는다고 판단했습니다.", "reason": "특정 시점의 재직 조건만으로 통상임금성이 부정되지 않는다는 판례 내용을 명시했습니다."}}}, {"key": "s07-kp3", "id": "s07", "level": "SUM", "question": "최저임금은 누구에게 적용되고, 회사가 최저임금보다 적게 정한 계약은 어떻게 되며, 최저임금을 깎아서 줄 수 있는 경우가 있는지 요약해 주세요.", "kp_index": 3, "all_kps": ["근로자를 사용하는 모든 사업에 적용하되, 동거하는 친족만 사용하는 사업과 가사 사용인은 제외", "사용자는 최저임금액 이상의 임금을 지급해야 하고 최저임금을 이유로 종전 임금수준을 낮출 수 없음", "최저임금액에 못 미치는 임금을 정한 부분은 무효이며 최저임금액과 같은 임금을 지급하기로 한 것으로 봄", "1년 이상 계약을 맺은 수습 근로자는 수습 시작 후 3개월 이내에 시간급 최저임금액의 10%를 감액할 수 있음(단순노무업무 직종 제외)"], "answer": "- **적용 대상:** 최저임금법은 근로자를 사용하는 모든 사업 또는 사업장에 적용됩니다. 다만 동거하는 친족만 사용하는 사업, 가사사용인, 선원법 적용을 받는 선원과 그 선박 소유자에게는 적용되지 않습니다. [S3]\n\n- **최저임금보다 낮은 계약:** 사용자는 적용 대상 근로자에게 최저임금액 이상을 지급해야 합니다. 근로계약에서 최저임금보다 낮은 금액을 정한 부분은 무효이고, 그 부분은 최저임금액과 같은 임금을 지급하기로 한 것으로 봅니다. [S1] 또한 최저임금을 이유로 종전의 임금수준을 낮출 수 없습니다. [S1]\n\n- **깎아서 지급할 수 있는 경우:**  \n  1. 1년 이상의 기간을 정한 근로계약을 체결하고 수습 중이며 수습 시작일부터 3개월 이내인 근로자는 대통령령에 따라 최저임금액의 90%를 적용할 수 있습니다. 다만 단순노무업무 종사자는 제외됩니다. [S2][S8]  \n  2. 정신장애나 신체장애로 근로능력이 현저히 낮은 사람 등은 사용자가 대통령령에 따라 고용노동부장관의 인가를 받은 경우 최저임금 적용에서 제외할 수 있습니다. [S7] 시행령상 인가 기준은 정신 또는 신체의 장애가 업무 수행에 직접적으로 현저한 지장을 주는 것이 명백하다고 인정되는 사람입니다. [S4]\n\n위 규정은 기준일인 2026년 10월 1일 현재 시행 중입니다. [S1][S2][S3][S4][S7][S8]", "reference": "최저임금법은 근로자를 사용하는 모든 사업에 적용되지만, 동거하는 친족만을 사용하는 사업과 가사 사용인에게는 적용되지 않습니다(제3조). 사용자는 최저임금액 이상의 임금을 지급해야 하고 최저임금을 이유로 종전 임금수준을 낮출 수 없으며, 최저임금액에 못 미치는 금액을 정한 계약 부분은 무효로 되어 최저임금액과 같은 임금을 지급하기로 한 것으로 봅니다(제6조). 예외적으로 1년 이상 근로계약을 맺고 수습을 시작한 날부터 3개월 이내인 근로자는 시간급 최저임금액에서 10%를 뺀 금액을 최저임금으로 할 수 있으나, 단순노무업무 직종은 제외됩니다(제5조제2항, 시행령 제3조).", "judges": {"opus": {"ok": true, "quote": "근로계약에서 최저임금보다 낮은 금액을 정한 부분은 무효이고, 그 부분은 최저임금액과 같은 임금을 지급하기로 한 것으로 봅니다.", "reason": "미달 부분의 무효와 최저임금액과 같은 임금을 지급하기로 한 것으로 보는 효과를 모두 명시했습니다."}, "codex": {"ok": true, "quote": "근로계약에서 최저임금보다 낮은 금액을 정한 부분은 무효이고, 그 부분은 최저임금액과 같은 임금을 지급하기로 한 것으로 봅니다.", "reason": "최저임금 미달 약정 부분의 무효와 최저임금액으로의 대체를 모두 명시했습니다."}}}, {"key": "l5b08-kp1", "id": "l5b08", "level": "L5b", "question": "시내버스 기사입니다. 단체협약에는 연차를 쓰려면 정해진 기한 전까지 신청하라고 되어 있는데, 개인 사정으로 그 기한을 넘겨 연차를 신청했더니 회사가 반려했습니다. 연차는 근로자가 원하는 날에 줘야 하는 것 아닌가요? 회사가 근로기준법을 위반한 건가요?", "kp_index": 1, "all_kps": ["연차휴가는 근로자가 청구한 시기에 주어야 하나, 사업 운영에 막대한 지장이 있으면 사용자가 시기를 변경할 수 있음(근로기준법 제60조제5항)", "판례: 노선버스처럼 정시성이 중요한 사업에서 근로자가 불가피한 사유 없이 단체협약상 휴가 청구 기한을 지키지 않으면, 사용자는 특별한 사정이 없는 한 적법하게 시기변경권을 행사할 수 있음", "판례: 제60조제5항 위반죄는 사용자가 적법한 시기변경권을 행사하지 않은 채 연차휴가를 방해한 경우에 성립함(적법한 시기변경이면 위반 아님)"], "answer": "근로자의 연차유급휴가권은 법정 요건을 충족하면 발생하지만, 사용자는 근로자가 청구한 시기에 휴가를 주는 것이 원칙이고 사업 운영에 막대한 지장이 있는 경우에는 그 시기를 변경할 수 있습니다. [S1]\n\n대법원은 노선 여객자동차운송사업처럼 운영의 정시성이 중요한 사업에서 단체협약이 연차 신청기한을 정하고 있는데도 근로자가 불가피한 사유 없이 그 기한을 지키지 않고 신청한 경우, 지정된 시기까지 대체근로자를 확보하기 어려워 사업 운영에 막대한 지장이 발생한다고 보아 사용자가 시기변경권을 행사할 수 있다고 판단했습니다(대법원 2025. 7. 17. 선고 2021도11886 판결). [S13]\n\n따라서 개인 사정이 불가피한 사유에 해당하지 않고, 단체협약상 신청기한을 넘긴 신청으로 대체근로자 확보 등 버스 운행에 막대한 지장이 발생하는 경우라면 회사의 반려가 곧바로 근로기준법 위반이라고 단정하기 어렵습니다. [S13]\n\n반대로 불가피한 사유가 있었거나 회사가 사업 운영에 막대한 지장이 있다는 사정 없이 연차 사용을 거부한 경우라면, 회사는 적법한 시기변경권을 행사한 것으로 보기 어려울 수 있습니다. [S1][S13]\n\n현재 관련 조문은 시행 중이나, 2027년 6월 10일부터 연차휴가 분할청구, 청구 시기 부여 및 불리한 처우 금지 등에 관한 개정 내용이 시행될 예정입니다. [S1] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "근로기준법 위반이 아닐 가능성이 큽니다. 근로기준법 제60조제5항은 연차 유급휴가를 근로자가 청구한 시기에 주도록 하면서, 청구한 시기에 휴가를 주는 것이 사업 운영에 막대한 지장이 있는 경우에는 사용자가 그 시기를 변경할 수 있다고 정하지만, 단체협약상 청구 기한을 넘긴 신청이 이에 해당하는지는 조문에 기준이 없습니다. 대법원은 시내버스 회사가 단체협약상 기한을 넘겨 지정한 연차를 반려한 사안에서, 제60조제5항 위반죄는 사용자가 적법한 시기변경권을 행사하지 않은 채 연차휴가를 방해한 경우에 성립하는데, 노선버스처럼 운영의 정시성이 중요한 사업에서 근로자가 불가피한 사유 없이 단체협약상 휴가 청구 기한을 지키지 않았다면 사용자는 특별한 사정이 없는 한 적법하게 시기변경권을 행사할 수 있다고 판단했습니다(대법원 2025. 7. 17. 선고 2021도11886 판결). 다만 기한을 넘긴 개인 사정이 불가피한 사유였는지 등 구체적 사실관계에 따라 결론이 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "사용자는 근로자가 청구한 시기에 휴가를 주는 것이 원칙이고 사업 운영에 막대한 지장이 있는 경우에는 그 시기를 변경할 수 있습니다.", "reason": "청구 시기 부여 원칙과 막대한 지장 시 시기변경 가능을 명시했으나, 근거 조문(제60조제5항)은 밝히지 않았습니다."}, "codex": {"ok": true, "quote": "근로자의 연차유급휴가권은 법정 요건을 충족하면 발생하지만, 사용자는 근로자가 청구한 시기에 휴가를 주는 것이 원칙이고 사업 운영에 막대한 지장이 있는 경우에는 그 시기를 변경할 수 있습니다.", "reason": "근로자가 청구한 시기에 휴가를 부여하는 원칙과 사업 운영에 막대한 지장이 있는 경우 사용자가 시기를 변경할 수 있다는 예외를 모두 명시했습니다."}}}, {"key": "s08-kp4", "id": "s08", "level": "SUM", "question": "근로시간, 연장근로, 휴게시간, 주휴일에 관한 근로기준법의 기본 원칙을 요약해 주세요.", "kp_index": 4, "all_kps": ["근로시간은 휴게시간을 제외하고 1주 40시간, 1일 8시간을 초과할 수 없음", "당사자 간 합의하면 1주 12시간을 한도로 연장근로 가능", "근로시간 4시간이면 30분 이상, 8시간이면 1시간 이상의 휴게시간을 근로시간 도중에 부여", "휴게시간은 근로자가 자유롭게 이용할 수 있음", "1주에 평균 1회 이상의 유급휴일 보장"], "answer": "- **근로시간**: 휴게시간을 제외한 1주 근로시간은 40시간, 1일 근로시간은 8시간을 초과할 수 없습니다. 사용자의 지휘·감독 아래 대기하는 시간 등은 근로시간으로 봅니다. [S1]  \n- **연장근로**: 당사자 간 합의가 있으면 1주 12시간을 한도로 제50조의 근로시간을 연장할 수 있습니다. 다만 3개월 이내 또는 3개월 초과 6개월 이내의 탄력적 근로시간제 등 법정 요건을 갖춘 경우에는 별도 기준이 적용됩니다. [S3][S6][S7]  \n- **연장근로수당**: 연장근로에는 통상임금의 50% 이상을 가산하여 지급해야 합니다. 야간근로는 오후 10시부터 다음 날 오전 6시까지의 근로이며, 이에 대해서도 통상임금의 50% 이상을 가산해야 합니다. 휴일근로는 8시간 이내에는 50% 이상, 8시간 초과분에는 100% 이상을 가산합니다. [S2]  \n- **휴게시간**: 사용자는 근로시간이 4시간인 경우 30분 이상, 8시간인 경우 1시간 이상의 휴게시간을 근로시간 도중에 주어야 하며, 휴게시간은 근로자가 자유롭게 이용할 수 있어야 합니다. [S8]  \n- **주휴일**: 사용자는 근로자에게 1주에 평균 1회 이상의 유급휴일을 보장해야 합니다. 대통령령으로 정하는 휴일도 유급으로 보장해야 하나, 근로자대표와 서면 합의가 있으면 특정 근로일로 대체할 수 있습니다. [S9]  \n- **특례**: 육상운송·수상운송·항공운송·기타 운송 관련 서비스업 및 보건업은 근로자대표와 서면 합의가 있으면 주 12시간을 초과하여 연장근로를 하게 하거나 휴게시간을 변경할 수 있습니다. 이 경우 근로일 종료 후 다음 근로일 개시 전까지 연속 11시간 이상의 휴식시간을 보장해야 합니다. [S4]  \n\n대법원은 1주 연장근로 12시간 초과 여부를 판단할 때 1일 8시간 초과 여부와 관계없이 1주간 근로시간 중 40시간을 초과한 시간을 기준으로 판단하고, 1일 8시간을 초과하여 4시간 연장근로를 하는 경우에도 연장근로 중 30분 이상의 휴게시간을 부여해야 한다고 판단했습니다(대법원 2023. 12. 7. 선고 2020도15393 판결) [S14]  \n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "근로시간은 휴게시간을 제외하고 1주 40시간, 1일 8시간을 넘을 수 없습니다(제50조). 당사자 간에 합의하면 1주 12시간을 한도로 연장근로를 할 수 있습니다(제53조제1항). 근로시간이 4시간이면 30분 이상, 8시간이면 1시간 이상의 휴게시간을 근로시간 도중에 주어야 하고, 휴게시간은 근로자가 자유롭게 이용할 수 있습니다(제54조). 사용자는 1주에 평균 1회 이상의 유급휴일을 보장해야 합니다(제55조제1항).", "judges": {"opus": {"ok": true, "quote": "휴게시간은 근로자가 자유롭게 이용할 수 있어야 합니다.", "reason": "휴게시간의 자유로운 이용이 명시되어 있다."}, "codex": {"ok": true, "quote": "사용자는 근로시간이 4시간인 경우 30분 이상, 8시간인 경우 1시간 이상의 휴게시간을 근로시간 도중에 주어야 하며, 휴게시간은 근로자가 자유롭게 이용할 수 있어야 합니다.", "reason": "근로자가 휴게시간을 자유롭게 이용할 수 있어야 한다고 명시했습니다."}}}, {"key": "g026-kp1", "id": "g026", "level": "L3", "question": "회사가 육아기 근로시간 단축을 거부할 수 있는 경우는 언제이고, 거부하면 회사는 무엇을 해야 하나요?", "kp_index": 1, "all_kps": ["단축개시예정일 전날까지 계속 근로기간 6개월 미만 근로자의 신청", "업무 성격상 근로시간 분할이 곤란하거나 정상적 사업 운영에 중대한 지장이 있음을 사업주가 증명하는 경우", "거부 시 사유를 서면 통보하고 육아휴직 사용이나 출퇴근 시간 조정 등 지원 가능 여부를 근로자와 협의"], "answer": "회사는 다음 경우 육아기 근로시간 단축을 거부할 수 있습니다.\n\n1. 단축개시예정일 전날까지 해당 사업에서 계속 근로한 기간이 6개월 미만인 근로자가 신청한 경우입니다. [S3]  \n2. 근로자의 업무 성격상 근로시간을 분할하여 수행하기 곤란하거나, 그 밖에 육아기 근로시간 단축이 정상적인 사업 운영에 중대한 지장을 초래하는 경우로서 회사가 이를 증명하는 경우입니다. [S3]\n\n그 밖에는 근로자가 만 12세 이하 또는 초등학교 6학년 이하의 자녀를 양육하기 위해 신청하면 회사는 원칙적으로 허용해야 합니다. [S1]\n\n회사가 거부하려면 해당 근로자에게 거부 사유를 서면으로 통보해야 합니다. [S1] 또한 육아휴직을 사용하게 하거나 출근·퇴근 시간 조정 등 다른 조치로 지원할 수 있는지를 근로자와 협의해야 합니다. [S1]\n\n참고로 육아기 근로시간 단축을 허용하는 경우 단축 후 근로시간은 주 15시간 이상 35시간 이하여야 합니다. [S1]", "reference": "계속 근로기간 6개월 미만 근로자가 신청한 경우, 또는 업무 성격상 근로시간 분할이 곤란하는 등 중대한 지장을 사업주가 증명하는 경우에만 거부할 수 있습니다(시행령 제15조의2). 거부하면 사유를 서면으로 알리고 육아휴직이나 출퇴근 시간 조정 등 다른 지원이 가능한지 협의해야 합니다(남녀고용평등법 제19조의2제2항).", "judges": {"opus": {"ok": true, "quote": "단축개시예정일 전날까지 해당 사업에서 계속 근로한 기간이 6개월 미만인 근로자가 신청한 경우입니다.", "reason": "단축개시예정일 전날 기준 계속 근로기간 6개월 미만 근로자의 신청이라는 거부 사유를 그대로 단언함."}, "codex": {"ok": true, "quote": "단축개시예정일 전날까지 해당 사업에서 계속 근로한 기간이 6개월 미만인 근로자가 신청한 경우입니다. [S3]", "reason": "계속 근로기간의 기준일과 6개월 미만이라는 거부 조건을 모두 명시했습니다."}}}, {"key": "s03-kp3", "id": "s03", "level": "SUM", "question": "임신한 직원을 보호하기 위해
