rue, "quote": "근로자가 1년간 80퍼센트 이상 출근하면 15일의 유급휴가를 받고, 3년 이상 계속 근로한 경우에는 최초 1년을 초과하는 계속 근로 연수 매 2년에 1일을 가산하며, 총 휴가 일수는 25일을 한도로 합니다. [S1]\n\n입사 후 만 6년을 계속 근무한 경우에는 기본 15일에 3년 이상 계속 근로에 따른 가산 2일을 더하여 **17일**의 연차 유급휴가를 받습니다. [S1]", "reason": "기본 15일, 최초 1년 초과 근로 연수 매 2년당 1일 가산, 25일 한도 및 만 6년 근무 시 17일이라는 결과를 모두 명시했습니다."}}}, {"key": "s01-kp3", "id": "s01", "level": "SUM", "question": "회사가 직원을 해고할 때 법적으로 지켜야 하는 제한과 절차를 요약해 주세요.", "kp_index": 3, "all_kps": ["정당한 이유 없이 해고할 수 없음", "업무상 부상·질병 요양 휴업 기간과 그 후 30일, 산전·산후 휴업 기간과 그 후 30일은 해고 금지", "적어도 30일 전에 해고를 예고하고, 예고하지 않으면 30일분 이상의 통상임금을 지급", "해고사유와 해고시기를 서면으로 통지해야 해고의 효력이 있음"], "answer": "회사가 직원을 해고할 때에는 다음 제한과 절차를 지켜야 합니다.\n\n1. **정당한 이유가 있어야 합니다.** 사용자는 정당한 이유 없이 해고할 수 없습니다. 업무상 부상·질병의 요양으로 휴업한 기간과 그 후 30일, 산전·산후 휴업 기간과 그 후 30일에는 원칙적으로 해고할 수 없습니다. [S1]\n\n2. **경영상 해고라면 추가 요건이 필요합니다.** 긴박한 경영상 필요가 있어야 하고, 해고 회피 노력을 다해야 하며, 합리적이고 공정한 기준으로 대상자를 선정해야 합니다. 또한 해고 예정일 50일 전까지 근로자대표에게 관련 사항을 통보하고 성실하게 협의해야 합니다. [S2]\n\n3. **대규모 경영상 해고는 신고해야 합니다.** 1개월 동안 해고하는 인원이 사업장 규모별 기준에 해당하면, 최초 해고일 30일 전까지 고용노동부장관에게 신고해야 합니다. 신고에는 해고 사유, 예정 인원, 근로자대표와 협의한 내용 및 해고 일정을 포함해야 합니다. [S5] 신고서는 관련 서류를 첨부하여 관할 지방고용노동관서의 장에게 제출합니다. [S8]\n\n4. **해고를 예고해야 합니다.** 해고하려면 적어도 30일 전에 예고해야 하며, 예고하지 않으면 30일분 이상의 통상임금을 지급해야 합니다. 다만 계속 근로기간이 3개월 미만인 경우, 천재·사변 등으로 사업 계속이 불가능한 경우, 근로자의 고의로 중대한 손해가 발생한 경우 등은 예외입니다. [S3] 근로자의 귀책사유에 관한 구체적인 예외 사유는 근로기준법 시행규칙 별표 1에 따릅니다. [S6]\n\n5. **해고사유와 해고시기를 서면으로 통지해야 합니다.** 서면통지가 없으면 해고는 효력이 없습니다. 해고 예고를 해고사유와 해고시기를 명시하여 서면으로 한 경우에는 별도의 서면통지를 한 것으로 봅니다. [S4]\n\n6. **경영상 해고 후 재고용 의무가 발생할 수 있습니다.** 경영상 이유로 해고한 근로자가 원하고, 해고 후 3년 이내에 해고 당시 업무와 같은 업무의 근로자를 채용하려는 경우에는 그 근로자를 우선 고용해야 합니다. [S7]\n\n7. **근로자는 구제를 신청할 수 있습니다.** 부당해고라고 판단되면 노동위원회에 구제를 신청할 수 있으며, 해고가 있었던 날부터 3개월 이내에 신청해야 합니다. [S9]\n\n대법원은 경영상 해고에서 긴박한 경영상 필요가 반드시 도산 회피에 한정되지 않고 객관적으로 인원감축의 합리성이 있는 경우도 포함될 수 있지만, 해고 회피 노력과 대상자 선정기준의 합리성·공정성은 사용자가 증명해야 한다고 판단했습니다(대법원 2021. 7. 29. 선고 2016두64876 판결) [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n대법원은 근무성적이나 근무능력 부족을 이유로 한 해고도 평가가 공정하고 객관적이어야 하며", "reference": "정당한 이유 없이 해고할 수 없고(제23조①), 업무상 부상·질병 요양 휴업 기간과 그 후 30일 및 산전·산후 휴업 기간과 그 후 30일에는 해고하지 못합니다(제23조②). 해고하려면 적어도 30일 전에 예고하거나 30일분 이상의 통상임금을 지급해야 하며(제26조), 해고사유와 해고시기를 서면으로 통지해야 효력이 있습니다(제27조).", "judges": {"opus": {"ok": true, "quote": "해고하려면 적어도 30일 전에 예고해야 하며, 예고하지 않으면 30일분 이상의 통상임금을 지급해야 합니다.", "reason": "30일 전 예고 의무와 미예고 시 30일분 이상 통상임금 지급을 모두 명시함."}, "codex": {"ok": true, "quote": "해고하려면 적어도 30일 전에 예고해야 하며, 예고하지 않으면 30일분 이상의 통상임금을 지급해야 합니다.", "reason": "30일 전 예고 의무와 미예고 시 30일분 이상의 통상임금 지급 의무를 모두 명시했습니다."}}}, {"key": "n14-kp2", "id": "n14", "level": "L2", "question": "파견회사 소속으로 다른 회사에 파견돼 일하고 있습니다. 주휴일 같은 유급휴일의 임금은 파견회사와 실제 일하는 회사 중 누가 줘야 하나요? 또 두 회사가 근로기준법에 어긋나는 내용으로 파견계약을 맺어 법 위반이 생기면 누가 처벌받나요?", "kp_index": 2, "all_kps": ["사용사업주가 유급휴일·유급휴가를 주는 경우 그 유급 임금은 파견사업주가 지급해야 함", "근로기준법 위반 내용의 파견계약에 따라 위반이 발생하면 파견사업주와 사용사업주 모두를 사용자로 보아 벌칙을 적용함"], "answer": "주휴일 등 유급휴일에 대해 사용사업주가 파견근로자에게 휴일을 부여하더라도, 그 휴일에 지급되는 임금은 **파견사업주가 지급해야 합니다**. [S1]\n\n파견사업주와 사용사업주가 근로기준법 위반 내용을 포함한 파견계약을 체결하고 그 계약에 따라 파견근로자를 근로하게 하여 법 위반이 발생하면, **두 계약 당사자 모두를 근로기준법상 사용자로 보아 해당 벌칙규정을 적용합니다**. [S1]\n\n따라서 위반 내용이 파견근로자 임금 미지급이고 사용사업주의 귀책사유로 파견사업주가 임금을 지급하지 못한 경우에는, 사용사업주도 파견사업주와 **연대하여 책임**을 집니다. 사용사업주의 귀책사유에는 정당한 사유 없이 파견계약을 해지하거나, 정당한 사유 없이 파견계약상 파견 대가를 지급하지 않은 경우가 포함됩니다. [S1] [S11]\n\n특히 파견사업주가 사용사업주의 귀책사유로 임금을 지급하지 못한 경우의 법 위반에는 **3년 이하의 징역 또는 3천만원 이하의 벌금**이 규정되어 있습니다. [S2]", "reference": "근로기준법 제55조 등에 따라 사용사업주가 파견근로자에게 유급휴일이나 유급휴가를 주는 경우 그 유급 임금은 파견사업주가 지급해야 합니다(파견근로자 보호 등에 관한 법률 제34조제3항). 또한 파견사업주와 사용사업주가 근로기준법 위반 내용을 포함한 파견계약을 맺고 그에 따라 근로하게 해 법을 위반한 경우에는 계약 당사자 모두를 사용자로 보아 벌칙을 적용합니다(제34조제4항).", "judges": {"opus": {"ok": true, "quote": "파견사업주와 사용사업주가 근로기준법 위반 내용을 포함한 파견계약을 체결하고 그 계약에 따라 파견근로자를 근로하게 하여 법 위반이 발생하면, **두 계약 당사자 모두를 근로기준법상 사용자로 보아 해당 벌칙규정을 적용합니다**.", "reason": "위반 내용의 파견계약에 따라 위반이 생기면 파견사업주와 사용사업주 모두를 사용자로 보아 벌칙을 적용한다고 명시하여 정답 포인트와 일치한다."}, "codex": {"ok": true, "quote": "파견사업주와 사용사업주가 근로기준법 위반 내용을 포함한 파견계약을 체결하고 그 계약에 따라 파견근로자를 근로하게 하여 법 위반이 발생하면, **두 계약 당사자 모두를 근로기준법상 사용자로 보아 해당 벌칙규정을 적용합니다**.", "reason": "위법한 파견계약에 따라 위반이 발생하면 양 사업주 모두를 사용자로 보아 벌칙을 적용한다고 명시했습니다."}}}, {"key": "l5b06-kp1", "id": "l5b06", "level": "L5b", "question": "팀장으로 일하다 1년 육아휴직을 다녀왔더니, 그사이 조직개편이 있었다며 팀원도 없는 다른 영업 담당으로 발령을 냈습니다. 월급은 그대로인데 팀장 직책과 결재 권한은 없어졌습니다. 임금이 같으면 법 위반이 아닌가요?", "kp_index": 1, "all_kps": ["육아휴직을 마친 근로자는 휴직 전과 같은 업무 또는 같은 수준의 임금을 지급하는 직무에 복귀시켜야 하고, 육아휴직을 이유로 한 불리한 처우는 금지됨(남녀고용평등법 제19조제3항·제4항)", "판례: '같은 업무'이려면 직책이나 직위의 성격과 내용·범위 및 권한·책임 등에서 사회통념상 차이가 없어야 함", "판례: 같은 수준의 임금을 지급하는 다른 직무로 복귀시키더라도 실질적인 불이익이 있어서는 안 되며, 직무 부여 필요성·업무상 불이익·사전 협의 노력 등을 종합해 판단함(임금만 같다고 적법한 것 아님)"], "answer": "임금이 같더라도 육아휴직 후 팀장 직책과 결재 권한을 없애고 다른 업무로 발령한 것이 곧바로 적법하다고 단정할 수는 없습니다. [S1]\n\n남녀고용평등법 제19조에 관한 위반 여부는 제공된 근거에 해당 조문 내용이 없어 판단할 수 없습니다. [정보 부족]", "reference": "임금이 같다는 이유만으로 법 위반이 아니라고 볼 수는 없습니다. 남녀고용평등법 제19조제4항은 육아휴직을 마친 근로자를 '휴직 전과 같은 업무 또는 같은 수준의 임금을 지급하는 직무'에 복귀시키도록 정하고, 제3항은 육아휴직을 이유로 한 불리한 처우를 금지합니다. 대법원은 육아휴직 후 다른 직무로 복귀시킨 사안에서, 복귀 업무가 '같은 업무'이려면 직책이나 직위의 성격과 내용·범위 및 권한·책임 등에서 사회통념상 차이가 없어야 하고, 조직 변화 등을 이유로 같은 수준의 임금을 지급하는 다른 직무로 복귀시키더라도 근로자에게 실질적인 불이익이 있어서는 안 되며, 이는 직무 부여의 필요성, 업무상·생활상 불이익, 사전 협의 노력 등을 종합해 판단해야 한다고 했습니다(대법원 2022. 6. 30. 선고 2017두76005 판결). 팀장 직책과 결재 권한이 사라졌다면 '같은 업무'로 보기 어렵고 실질적 불이익이 문제 될 수 있으나, 위반 여부는 조직개편의 필요성과 협의 경과 등 구체적 사실관계에 따라 달라질 수 있습니다.", "judges": {"opus": {"ok": false, "quote": "남녀고용평등법 제19조에 관한 위반 여부는 제공된 근거에 해당 조문 내용이 없어 판단할 수 없습니다.", "reason": "같은 업무 또는 같은 수준 임금 직무로의 복귀 의무와 불리한 처우 금지를 단언하지 않고 정보 부족으로 판단을 유보함."}, "codex": {"ok": false, "quote": "남녀고용평등법 제19조에 관한 위반 여부는 제공된 근거에 해당 조문 내용이 없어 판단할 수 없습니다. [정보 부족]", "reason": "휴직 전과 같은 업무 또는 같은 수준의 임금을 지급하는 직무로의 복귀 의무와 육아휴직을 이유로 한 불리한 처우 금지를 명시하지 않았습니다."}}}, {"key": "s05-kp3", "id": "s05", "level": "SUM", "question": "퇴직금 제도의 핵심 내용을 요약해 주세요.", "kp_index": 3, "all_kps": ["계속근로기간 1년 미만이거나 4주 평균 1주 소정근로시간 15시간 미만인 근로자는 퇴직급여제도 설정 의무 대상 아님", "계속근로기간 1년에 대하여 30일분 이상의 평균임금을 퇴직금으로 지급", "퇴직 시 지급사유 발생일부터 14일 이내 지급(특별한 사정이 있으면 합의로 연장)"], "answer": "- 사용자는 퇴직하는 근로자에게 급여를 지급하기 위해 하나 이상의 퇴직급여제도를 설정해야 합니다. 다만 계속근로기간이 1년 미만이거나 4주간 평균 1주간 소정근로시간이 15시간 미만인 근로자는 예외입니다. [S5]\n\n- 퇴직급여제도에는 확정급여형·확정기여형·중소기업퇴직연금기금제도 및 퇴직금제도가 포함됩니다. [S3]\n\n- 퇴직금제도를 설정한 경우 계속근로기간 1년에 대해 30일분 이상의 평균임금을 퇴직금으로 지급해야 합니다. [S1]\n\n- 퇴직급여제도나 개인형퇴직연금제도를 설정하지 않은 경우에도 퇴직금제도를 설정한 것으로 봅니다. [S2]\n\n- 퇴직금은 근로자가 퇴직한 날부터 14일 이내에 지급해야 하며, 특별한 사정이 있으면 당사자 합의로 지급기일을 연장할 수 있습니다. [S10]\n\n- 퇴직금은 원칙적으로 근로자가 지정한 개인형퇴직연금제도의 계정 등으로 이전하여 지급해야 하며, 근로자가 계정을 지정하지 않으면 근로자 명의의 개인형퇴직연금제도 계정으로 이전합니다. [S10]\n\n- 근로자가 요구하고 대통령령으로 정한 사유가 있는 경우에는 퇴직 전에 퇴직금을 중간정산할 수 있습니다. 중간정산 후 계속근로기간은 정산 시점부터 새로 계산합니다. [S1] 주택 구입·전세금 부담, 일정한 의료비 부담, 파산·개인회생, 임금 감소 제도 시행 등이 중간정산 사유에 해당합니다. [S12]\n\n- 퇴직급여제도를 설정하거나 다른 종류로 변경하려면 근로자대표의 동의가 필요하고, 제도의 내용을 근로자에게 불리하게 변경하려면 근로자대표의 동의가 필요합니다. [S5]\n\n- 퇴직연금제도가 폐지되거나 운영이 중단된 기간에는 퇴직금제도를 적용합니다. [S9]\n\n- 대법원은 월급이나 일당에 퇴직금을 포함해 미리 지급하기로 한 약정은 유효한 중간정산으로 인정되지 않는 한 원칙적으로 무효이고, 그 명목으로 지급한 금원도 퇴직금 지급의 효력이 없다고 판단했습니다(대법원 2011. 10. 13. 선고 2009도8248 판결). [S14] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "계속근로기간 1년에 대하여 30일분 이상의 평균임금을 퇴직금으로 지급하며(제8조①), 계속근로기간 1년 미만이거나 4주 평균 주 15시간 미만인 근로자는 퇴직급여제도 설정 의무 대상이 아닙니다(제4조①). 퇴직하면 지급사유 발생일부터 14일 이내에 지급해야 하고, 특별한 사정이 있으면 당사자 합의로 지급기일을 연장할 수 있습니다(제9조①).", "judges": {"opus": {"ok": true, "quote": "퇴직금은 근로자가 퇴직한 날부터 14일 이내에 지급해야 하며, 특별한 사정이 있으면 당사자 합의로 지급기일을 연장할 수 있습니다.", "reason": "정답 포인트가 '퇴직 시 지급사유 발생일'로 기산점을 정하므로 답변의 '퇴직한 날'과 의미가 같고, 14일 이내 지급과 합의 연장도 모두 담고 있다."}, "codex": {"ok": true, "quote": "퇴직금은 근로자가 퇴직한 날부터 14일 이내에 지급해야 하며, 특별한 사정이 있으면 당사자 합의로 지급기일을 연장할 수 있습니다.", "reason": "퇴직 시 지급사유 발생일을 퇴직한 날로 표현하여 14일 이내 지급 의무와 특별한 사정이 있을 때 합의로 연장할 수 있음을 모두 명시합니다."}}}, {"key": "g032-kp3", "id": "g032", "level": "L4", "question": "하루 4시간 근무하는 직원이 30분 휴게 없이 바로 퇴근하고 싶다고 하면 휴게를 안 줘도 되나요?", "kp_index": 3, "all_kps": ["현행 제54조제1항: 근로시간 4시간이면 30분 이상 휴게를 근로시간 도중에 주어야 함", "근로자가 명시적으로 요청하면 4시간 근로의 휴게를 생략할 수 있는 단서가 신설됨", "그 단서는 2026-12-10 시행 예정으로 현재 미시행"], "answer": "현재 근로기준법상 사용자는 근로시간이 4시간인 경우 근로시간 도중에 30분 이상의 휴게시간을 주어야 합니다. 휴게시간은 근로자가 자유롭게 이용할 수 있어야 합니다. [S1]\n\n따라서 하루 4시간 근무자가 30분 휴게 없이 바로 퇴근하고 싶다고 하더라도, 현재 조문상 사용자가 휴게를 부여하지 않아도 된다고 볼 수 없습니다. [S1]\n\n다만 2026년 12월 10일부터는 근로시간이 4시간인 경우 근로자가 휴게시간을 이용하지 않을 것을 명시적으로 요청하면 휴게시간을 주지 않을 수 있도록 개정될 예정입니다. [S1]\n\n대법원은 근로계약상 휴식시간이라도 사용자의 지휘·감독에서 벗어나 자유롭게 이용할 수 없으면 근로시간에 해당한다고 판단했습니다(대법원 2021. 7. 21. 선고 2021다225845 판결). [S14] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "현재는 안 됩니다. 4시간 근로 시 30분 이상의 휴게를 근로시간 도중에 주어야 합니다. 근로자가 명시적으로 요청하면 휴게를 생략할 수 있게 하는 단서가 신설됐지만 2026년 12월 10일부터 시행됩니다.", "judges": {"opus": {"ok": true, "quote": "다만 2026년 12월 10일부터는 근로시간이 4시간인 경우 근로자가 휴게시간을 이용하지 않을 것을 명시적으로 요청하면 휴게시간을 주지 않을 수 있도록 개정될 예정입니다.", "reason": "시행일 2026-12-10과 '개정될 예정'이라는 표현, 그리고 '현재 조문상' 휴게 생략이 불가하다는 서술로 현재 미시행임을 명시합니다."}, "codex": {"ok": true, "quote": "다만 2026년 12월 10일부터는 근로시간이 4시간인 경우 근로자가 휴게시간을 이용하지 않을 것을 명시적으로 요청하면 휴게시간을 주지 않을 수 있도록 개정될 예정입니다. [S1]", "reason": "해당 예외가 2026년 12월 10일부터 적용될 예정이라는 표현으로 시행일과 현재 미시행 상태를 명시했습니다."}}}, {"key": "n01-kp2", "id": "n01", "level": "L3", "question": "작년 3월에 회사를 새로 차렸는데 1년이 넘도록 퇴직연금(확정급여형·확정기여형)을 설정하지 못했습니다. 이 경우 직원들 퇴직급여는 어떻게 처리되나요?", "kp_index": 2, "all_kps": ["새로 성립된 사업의 사용자는 사업 성립 후 1년 이내에 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 함", "퇴직급여제도를 설정하지 않은 경우 퇴직금제도를 설정한 것으로 봄"], "answer": "새로 성립한 사업의 사용자는 사업 성립 후 1년 이내에 근로자대표의 의견을 들어 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 합니다. [S1]\n\n그러나 1년 이내에 퇴직급여제도나 개인형퇴직연금제도를 설정하지 않았다면, 법에 따라 퇴직금제도를 설정한 것으로 봅니다. [S2] 따라서 직원들의 퇴직급여는 퇴직금제도에 따라 처리됩니다. [S2]\n\n퇴직연금제도를 새로 설정하려면 근로자대표의 동의 또는 의견을 반영한 퇴직연금규약을 작성하여 고용노동부장관에게 신고해야 합니다. 확정급여형은 근로자대표의 동의를 얻거나 의견을 들어야 하고, 확정기여형도 같은 절차가 적용됩니다. [S5][S6] 신고 시에는 퇴직연금규약과 근로자대표의 동의 또는 의견 청취를 증명하는 자료 등을 제출해야 합니다. [S11]\n\n따라서 현재까지 퇴직연금제도를 설정하지 못했다면, 그 기간에는 퇴직금제도가 적용되는 것으로 처리해야 합니다. [S2]", "reference": "새로 성립된 사업의 사용자는 근로자대표의 의견을 들어 사업 성립 후 1년 이내에 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 합니다(근로자퇴직급여 보장법 제5조). 그럼에도 퇴직급여제도나 개인형퇴직연금제도를 설정하지 않았다면 제11조에 따라 퇴직금제도를 설정한 것으로 보므로, 직원들은 퇴직금(계속근로 1년당 30일분 평균임금)을 받게 됩니다.", "judges": {"opus": {"ok": true, "quote": "그러나 1년 이내에 퇴직급여제도나 개인형퇴직연금제도를 설정하지 않았다면, 법에 따라 퇴직금제도를 설정한 것으로 봅니다.", "reason": "퇴직급여제도를 설정하지 않은 경우 퇴직금제도를 설정한 것으로 본다는 간주 규정을 명시적으로 단언함."}, "codex": {"ok": true, "quote": "그러나 1년 이내에 퇴직급여제도나 개인형퇴직연금제도를 설정하지 않았다면, 법에 따라 퇴직금제도를 설정한 것으로 봅니다. [S2]", "reason": "퇴직급여제도를 설정하지 않은 경우 퇴직금제도를 설정한 것으로 본다고 명시했습니다."}}}, {"key": "s06-kp1", "id": "s06", "level": "SUM", "question": "근로자파견은 어떤 업무에 얼마 동안 쓸 수 있는지, 이를 어기면 회사가 어떤 의무를 지는지 요약해 주세요.", "kp_index": 1, "all_kps": ["제조업의 직접생산공정업무를 제외하고 대통령령으로 정하는 업무를 대상으로 함", "출산·질병·부상 등으로 결원이 생기거나 일시적·간헐적으로 인력이 필요한 경우에는 대상 업무 외에도 파견 가능", "건설공사현장 업무, 선원 업무, 유해·위험 업무 등은 파견 금지", "파견기간은 1년 이내이며 3자 합의로 연장하더라도 총 2년을 초과할 수 없음", "대상 외 업무·금지 업무 사용이나 2년 초과 계속 사용 등 위반 시 사용사업주는 파견근로자를 직접 고용해야 함"], "answer": "- **대상 업무:** 제조업의 직접생산공정업무를 제외하고, 전문지식·기술·경험 또는 업무 성질 등을 고려해 적합하다고 판단되어 대통령령으로 정한 업무에 파견할 수 있습니다. [S2] 시행령상 별표 1의 업무가 이에 해당합니다. [S11]  \n- **예외적 파견:** 출산·질병·부상 등으로 결원이 생긴 경우 또는 일시적·간헐적으로 인력을 확보할 필요가 있는 경우에도 파견할 수 있습니다. 다만 건설공사현장 업무, 선원 업무, 유해·위험 업무 등 법에서 금지한 업무에는 파견할 수 없습니다. [S2]  \n- **파견기간:** 일반적인 파견은 1년을 초과할 수 없습니다. [S1]  \n- **기간 연장:** 파견사업주·사용사업주·파견근로자 사이에 합의하면 1회 연장할 수 있고, 연장기간은 1년 이내이며 총 파견기간은 2년 이내입니다. 다만 고령자인 파견근로자는 2년을 초과해 연장할 수 있습니다. [S1]  \n- **예외적 사유의 기간:** 출산·질병·부상 등 객관적으로 명백한 사유는 그 사유가 없어지는 데 필요한 기간까지, 일시적·간헐적 인력 확보는 3개월 이내로 사용할 수 있습니다. 후자의 경우 사유가 없어지지 않고 3자 합의가 있으면 3개월 범위에서 한 차례 연장할 수 있습니다. [S1]  \n- **사용 제한:** 경영상 이유로 해고한 뒤에는 시행령이 정한 기간이 지나기 전 해당 업무에 파견근로자를 사용할 수 없으며, 그 기간은 원칙적으로 2년입니다. 과반수 노동조합 또는 근로자 과반수 대표자의 동의가 있으면 6개월입니다. [S6][S3]  \n- **회사의 직접고용의무:** 사용사업주가 허용되지 않은 업무에 파견근로자를 사용하거나, 금지 업무에 사용하거나, 합의된 총 파견기간 2년을 초과해 계속 사용하거나, 예외적 파견 절차를 위반한 경우 등에는 해당 파견근로자를 직접 고용해야 합니다. [S4]  \n- **직접고용 시 근로조건:** 같은 종류 또는 유사한 업무를 하는 사용사업주 근로자가 있으면 그 근로자에게 적용되는 취업규칙 등의 근로조건을 적용하고, 그런 근로자가 없으면 기존 근로조건 수준보다 낮아져서는 안 됩니다. [S4]  \n- **제재:** 직접고용의무를 이행하지 않으면 3천만원 이하의 과태료가 부과될 수 있습니다. [S9] 파견기간 제한 등을 위반해 파견사업을 하거나 파견 역무를 제공받으면 3년 이하의 징역 또는 3천만원 이하의 벌금 대상이 될 수 있습니다. [S5] 경영상 해고 후 사용 제한을 위반하면 1년 이하의 징역 또는 1천만원 이하의 벌금 대상입니다. [S10]  \n- **판례:** 대법원은 계약 형식보다 실제 지휘·명령, 사업 편입 여부, 원고용주의 독립적 인사·노무 권한, 업무의 구체성·전문성, 독립적 조직·설비 등을 종합해 근로자파견 여부", "reference": "근로자파견은 제조업의 직접생산공정업무를 제외하고 대통령령으로 정하는 업무를 대상으로 하며, 출산·질병·부상 등으로 결원이 생기거나 일시적·간헐적으로 인력이 필요한 경우에는 예외적으로 허용됩니다. 다만 건설공사현장 업무, 선원 업무, 유해·위험 업무 등은 파견할 수 없습니다(제5조). 파견기간은 1년을 넘을 수 없고, 3자 합의로 연장하더라도 총 2년을 넘을 수 없습니다(제6조). 대상이 아닌 업무나 금지 업무에 파견근로자를 쓰거나 2년을 넘겨 계속 사용하는 등 위반이 있으면 사용사업주는 그 파견근로자를 직접 고용해야 합니다(제6조의2).", "judges": {"opus": {"ok": true, "quote": "제조업의 직접생산공정업무를 제외하고, 전문지식·기술·경험 또는 업무 성질 등을 고려해 적합하다고 판단되어 대통령령으로 정한 업무에 파견할 수 있습니다.", "reason": "제조업 직접생산공정업무 제외와 대통령령으로 정하는 업무라는 대상 범위를 명시했습니다."}, "codex": {"ok": true, "quote": "제조업의 직접생산공정업무를 제외하고, 전문지식·기술·경험 또는 업무 성질 등을 고려해 적합하다고 판단되어 대통령령으로 정한 업무에 파견할 수 있습니다.", "reason": "제조업 직접생산공정업무의 제외와 대통령령으로 정한 업무라는 대상 요건을 모두 명시했습니다."}}}, {"key": "g009-kp2", "id": "g009", "level": "L1", "question": "재난 등에 따른 연장이 없는 경우, 가족이 아파서 급하게 돌봐야 할 때 쓰는 가족돌봄휴가는 1년에 며칠까지 쓸 수 있나요?", "kp_index": 2, "all_kps": ["가족돌봄휴가는 연간 최장 10일", "일 단위로 사용 가능"], "answer": "재난 등에 따른 연장이 없는 경우 가족돌봄휴가는 **연간 최장 10일**까지 사용할 수 있습니다. 일 단위로 사용할 수 있으며, 가족돌봄휴가 기간은 가족돌봄휴직 기간에 포함됩니다. [S1]", "reference": "가족돌봄휴가는 연간 최장 10일이며 일 단위로 사용할 수 있고, 그 기간은 가족돌봄휴직 기간(연간 최장 90일)에 포함됩니다(남녀고용평등법 제22조의2제4항).", "judges": {"opus": {"ok": true, "quote": "일 단위로 사용할 수 있으며, 가족돌봄휴가 기간은 가족돌봄휴직 기간에 포함됩니다.", "reason": "일 단위로 사용할 수 있다고 명시적으로 단언하여 정답 포인트와 일치한다."}, "codex": {"ok": true, "quote": "일 단위로 사용할 수 있으며, 가족돌봄휴가 기간은 가족돌봄휴직 기간에 포함됩니다.", "reason": "가족돌봄휴가를 일 단위로 사용할 수 있다고 명시했습니다."}}}, {"key": "n13-kp2", "id": "n13", "level": "L2", "question": "대학 부설 연구소에서 박사학위를 가진 연구원과 실험을 보조하는 직원을 계약직으로 쓰고 있습니다. 두 사람 모두 기간제 사용기간 2년 제한의 예외에 해당해 2년을 넘겨 계약직으로 쓸 수 있나요?", "kp_index": 2, "all_kps": ["박사 학위를 소지하고 해당 분야에 종사하는 경우는 사용기간 제한의 예외임", "기업 또는 대학의 부설 연구기관에서 연구업무에 직접 종사하거나 실험·조사 등 연구업무에 직접 관여하여 지원하는 업무에 종사하는 경우도 예외임"], "answer": "박사학위를 가진 연구원은 해당 분야에 종사하는 경우 기간제 사용기간 2년 제한의 예외에 해당하므로, 2년을 초과하여 기간제근로자로 사용할 수 있습니다. [S1][S2]\n\n대학 부설 연구소에서 연구업무에 직접 종사하는 사람은 기간제 사용기간 2년 제한의 예외에 해당합니다. [S1][S2]\n\n실험을 보조하는 직원은 실험·조사 등을 수행하는 등 연구업무에 직접 관여하여 지원하는 업무에 종사하는 경우에 한하여 예외에 해당합니다. [S1] 따라서 단순히 대학 부설 연구소에서 근무한다는 사정만으로는 부족하고, 실제 업무가 연구업무에 직접 관여하여 지원하는지 확인해야 합니다. [S1]\n\n예외 사유가 없거나 소멸되었는데도 2년을 초과하여 기간제근로자로 사용하면 기간의 정함이 없는 근로계약을 체결한 근로자로 봅니다. [S2]\n\n대법원은 기간제근로자의 업무 성격이 시행령상 예외 업무에 해당하면 2년 초과 사용 예외가 적용될 수 있다고 판단했습니다(대법원 2017. 11. 9. 선고 2015두57611 판결) [S12]. 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "박사 학위를 소지하고 해당 분야에 종사하는 경우는 기간제근로자 사용기간 제한의 예외에 해당합니다(기간제 및 단시간근로자 보호 등에 관한 법률 시행령 제3조제1항제1호). 또한 기업 또는 대학의 부설 연구기관에서 연구업무에 직접 종사하거나 실험·조사 등 연구업무에 직접 관여하여 지원하는 업무에 종사하는 경우도 예외이므로(제3조제3항제8호바목), 두 사람 모두 2년을 초과하여 기간제로 사용할 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "대학 부설 연구소에서 연구업무에 직접 종사하는 사람은 기간제 사용기간 2년 제한의 예외에 해당합니다. [S1][S2] 실험을 보조하는 직원은 실험·조사 등을 수행하는 등 연구업무에 직접 관여하여 지원하는 업무에 종사하는 경우에 한하여 예외에 해당합니다.", "reason": "부설 연구기관에서 연구업무에 직접 종사하는 경우와 실험·조사 등 연구업무에 직접 관여하여 지원하는 경우가 모두 예외라고 단언함. 다만 '기업' 부설 연구기관은 언급하지 않았으나, 질문이 대학 부설 연구소에 관한 것이어서 핵심 사실은 충족된 것으로 봄."}, "codex": {"ok": true, "quote": "대학 부설 연구소에서 연구업무에 직접 종사하는 사람은 기간제 사용기간 2년 제한의 예외에 해당합니다. [S1][S2]\n\n실험을 보조하는 직원은 실험·조사 등을 수행하는 등 연구업무에 직접 관여하여 지원하는 업무에 종사하는 경우에 한하여 예외에 해당합니다. [S1]", "reason": "질문의 대학 부설 연구소에서 연구업무에 직접 종사하거나 실험·조사 등 연구업무에 직접 관여하여 지원하는 경우 모두 예외임을 명시했습니다."}}}, {"key": "n20-kp2", "id": "n20", "level": "L4", "question": "회사가 임금채권보장법을 위반하고 있는 것 같은데, 근로자가 누구에게 신고해서 시정을 요구할 수 있나요? 담당이 노동감독관으로 바뀐다고 하던데요.", "kp_index": 2, "all_kps": ["현행 임금채권보장법상 근로자는 위반 사실을 근로감독관에게 신고하여 시정 조치를 요구할 수 있음", "신고 대상을 노동감독관으로 바꾸는 개정은 2026-12-08 시행 예정으로 2026-10-01 현재 미시행"], "answer": "근로자는 사업주가 임금채권보장법 또는 그에 따른 명령을 위반한 사실이 있으면 근로감독관에게 신고하여 시정을 위한 조치를 요구할 수 있습니다. [S1]\n\n현재 조문은 ‘근로감독관’이라고 규정하고 있으며, 2026년 12월 8일부터는 ‘노동감독관’으로 개정될 예정입니다. [S1]\n\n따라서 기준일인 2026년 10월 1일에는 근로감독관에게 신고하면 되고, 2026년 12월 8일부터는 노동감독관에게 신고하게 됩니다. [S1]\n\n임금채권보장법 위반과 관련하여 대지급금의 부정수급 사실을 신고하려는 경우에는 지방고용노동관서에 신고해야 하며, 신고자는 대통령령으로 정하는 기준에 따라 포상금을 받을 수 있습니다. [S3] [S6]\n\n또한 근로자는 임금채권보장법 위반 사실을 통보했다는 이유로 해고나 그 밖의 불리한 처우를 받아서는 안 됩니다. 다만 이 보호 규정은 근로기준법 위반 사실을 통보한 경우에 관한 규정입니다. [S2]", "reference": "2026년 10월 1일 현재 임금채권보장법 제25조에 따라 근로자는 사업주의 위반 사실을 근로감독관에게 신고하여 시정 조치를 요구할 수 있습니다. 신고 상대를 노동감독관으로 바꾸는 개정(2026.4.7 공포)은 2026년 12월 8일부터 시행됩니다.", "judges": {"opus": {"ok": true, "quote": "따라서 기준일인 2026년 10월 1일에는 근로감독관에게 신고하면 되고, 2026년 12월 8일부터는 노동감독관에게 신고하게 됩니다.", "reason": "노동감독관으로의 개정이 2026-12-08 시행 예정이고, 2026-10-01 기준으로는 아직 근로감독관 규정이 적용된다는 점(미시행)을 모두 담고 있음."}, "codex": {"ok": true, "quote": "따라서 기준일인 2026년 10월 1일에는 근로감독관에게 신고하면 되고, 2026년 12월 8일부터는 노동감독관에게 신고하게 됩니다.", "reason": "신고 대상 변경이 2026년 12월 8일부터 적용되며 2026년 10월 1일에는 아직 적용되지 않음을 명시했습니다."}}}, {"key": "s07-kp2", "id": "s07", "level": "SUM", "question": "최저임금은 누구에게 적용되고, 회사가 최저임금보다 적게 정한 계약은 어떻게 되며, 최저임금을 깎아서 줄 수 있는 경우가 있는지 요약해 주세요.", "kp_index": 2, "all_kps": ["근로자를 사용하는 모든 사업에 적용하되, 동거하는 친족만 사용하는 사업과 가사 사용인은 제외", "사용자는 최저임금액 이상의 임금을 지급해야 하고 최저임금을 이유로 종전 임금수준을 낮출 수 없음", "최저임금액에 못 미치는 임금을 정한 부분은 무효이며 최저임금액과 같은 임금을 지급하기로 한 것으로 봄", "1년 이상 계약을 맺은 수습 근로자는 수습 시작 후 3개월 이내에 시간급 최저임금액의 10%를 감액할 수 있음(단순노무업무 직종 제외)"], "answer": "- **적용 대상:** 최저임금법은 근로자를 사용하는 모든 사업 또는 사업장에 적용됩니다. 다만 동거하는 친족만 사용하는 사업, 가사사용인, 선원법 적용을 받는 선원과 그 선박 소유자에게는 적용되지 않습니다. [S3]\n\n- **최저임금보다 적은 계약:** 사용자는 적용 대상 근로자에게 최저임금액 이상을 지급해야 하며, 최저임금을 이유로 종전 임금수준을 낮출 수 없습니다. [S1] 근로계약에서 최저임금보다 적은 금액을 정한 부분은 무효이고, 그 부분은 최저임금액과 같은 임금을 지급하기로 정한 것으로 봅니다. [S1]\n\n- **깎아서 지급할 수 있는 경우:** 1년 이상의 기간을 정한 근로계약을 체결하고 수습 중이며 수습 시작일부터 3개월 이내인 근로자는 대통령령에 따라 최저임금액의 90%를 적용할 수 있습니다. [S2] 다만 단순노무업무에 종사하는 근로자는 이 예외에서 제외됩니다. [S2] [S8] 또한 정신장애나 신체장애로 근로능력이 현저히 낮은 사람 등은 사용자가 고용노동부장관의 인가를 받은 경우 최저임금 적용이 제외될 수 있습니다. [S7] 시행령상 인가 기준은 장애가 업무 수행에 직접적으로 현저한 지장을 주는 것이 명백하다고 인정되는 사람입니다. [S4]", "reference": "최저임금법은 근로자를 사용하는 모든 사업에 적용되지만, 동거하는 친족만을 사용하는 사업과 가사 사용인에게는 적용되지 않습니다(제3조). 사용자는 최저임금액 이상의 임금을 지급해야 하고 최저임금을 이유로 종전 임금수준을 낮출 수 없으며, 최저임금액에 못 미치는 금액을 정한 계약 부분은 무효로 되어 최저임금액과 같은 임금을 지급하기로 한 것으로 봅니다(제6조). 예외적으로 1년 이상 근로계약을 맺고 수습을 시작한 날부터 3개월 이내인 근로자는 시간급 최저임금액에서 10%를 뺀 금액을 최저임금으로 할 수 있으나, 단순노무업무 직종은 제외됩니다(제5조제2항, 시행령 제3조).", "judges": {"opus": {"ok": true, "quote": "사용자는 적용 대상 근로자에게 최저임금액 이상을 지급해야 하며, 최저임금을 이유로 종전 임금수준을 낮출 수 없습니다.", "reason": "최저임금액 이상 지급 의무와 종전 임금수준 인하 금지가 모두 명시되어 있습니다."}, "codex": {"ok": true, "quote": "사용자는 적용 대상 근로자에게 최저임금액 이상을 지급해야 하며, 최저임금을 이유로 종전 임금수준을 낮출 수 없습니다.", "reason": "최저임금액 이상 지급 의무와 최저임금을 이유로 한 종전 임금수준 인하 금지를 모두 명시했습니다."}}}, {"key": "g029-kp2", "id": "g029", "level": "L3", "question": "아이가 다니는 어린이집이 「영유아보육법」에 따라 갑자기 휴원하게 돼서 1주일만 육아휴직을 쓰고 싶은데, 언제까지 신청해야 하나요?", "kp_index": 2, "all_kps": ["어린이집 휴원은 고용노동부령이 정한 긴급한 사유에 해당", "긴급한 사유면 휴직개시예정일까지 신청 가능"], "answer": "어린이집이 「영유아보육법」에 따라 휴원한 경우는 1주 또는 2주 단위 육아휴직의 신청 사유에 해당합니다. [S4]\n\n이 경우 1주일 육아휴직은 휴직개시예정일까지 신청할 수 있습니다. [S1] 신청서에는 신청인 정보, 자녀의 성명·생년월일, 휴직개시·종료예정일 및 신청 연월일 등을 적어 사업주에게 제출해야 합니다. [S1]\n\n사업주는 신청일부터 지체 없이 육아휴직을 허용한 사실을 서면 또는 전자적 방식으로 알려야 하며, 알리지 않으면 신청한 대로 허용한 것으로 봅니다. [S1]\n\n위 규정들은 기준일인 2026년 10월 1일 현재 시행 중입니다. [S1][S4]", "reference": "자녀가 다니는 어린이집의 휴원은 1주 또는 2주 단위 육아휴직(1년 1회) 사유이면서 고용노동부령상 긴급한 사유에 해당하므로 휴직개시예정일까지 신청할 수 있고, 사업주는 지체 없이 허용 사실을 알려야 합니다(남녀고용평등법 제19조제6항·제7항, 시행령 제11조제4항·제5항, 시행규칙 제15조).", "judges": {"opus": {"ok": true, "quote": "이 경우 1주일 육아휴직은 휴직개시예정일까지 신청할 수 있습니다.", "reason": "어린이집 휴원이라는 해당 사유가 있을 때 휴직개시예정일까지 신청할 수 있다고 명시해, 신청 기한이 정답과 같습니다."}, "codex": {"ok": true, "quote": "이 경우 1주일 육아휴직은 휴직개시예정일까지 신청할 수 있습니다.", "reason": "질문의 어린이집 휴원 상황에서 휴직개시예정일까지 신청 가능하다고 명시했습니다."}}}, {"key": "n08-kp2", "id": "n08", "level": "L3", "question": "회사 사정이 어려워 직원들 임금 3억 원이 밀렸습니다. 사업주로서 정부의 체불임금 지급 융자를 받으려는데 한도가 2억 원이라고 들었습니다. 2억 원을 넘게 융자받을 방법은 없나요?", "kp_index": 2, "all_kps": ["일반 체불 임금등 융자는 사업주당 총 2억원(근로자 1명당 2천만원) 범위임", "요건을 모두 갖춘 특별융자대상사업주는 2억원을 초과하는 체불 임금등에 대한 특별융자를 신청할 수 있음(최근 3개월 내 미청산 체불 2억원 초과, 신청액 120% 이상 부동산 담보 등)", "특별융자는 근로자 1명당 2천만원, 사업주당 총 10억원 범위임"], "answer": "가능합니다. 일반 체불임금 융자는 사업주당 총 2억 원까지이고, 근로자 1명당 신청액은 2천만 원까지입니다. [S3]\n\n다만 다음 요건을 모두 갖춘 사업주는 2억 원을 초과하는 특별융자를 신청할 수 있습니다. [S4]\n\n- 법 적용 대상 사업 또는 사업장을 6개월 이상 운영한 사업주여야 합니다. [S5]\n- 대상 근로자가 확인 신청일까지 6개월 이상 계속 근로 중이거나, 6개월 이상 계속 근로 후 확인 신청일 전 1년 이내 퇴직한 사람이어야 합니다. [S7]\n- 확인 신청일 기준 최근 3개월 이내 발생하여 청산되지 않은 체불임금이 2억 원을 초과해야 합니다. [S4]\n- 특별융자 신청액의 120% 이상에 해당하는 부동산을 담보로 제공해야 합니다. [S4]\n- 융자 상환계획과 취약근로자 우선 지원계획이 구체적이고 타당해야 합니다. [S4]\n\n특별융자는 근로자 1명당 2천만 원까지, 사업주당 총 10억 원까지 신청할 수 있습니다. 다만 일반융자를 이미 받은 금액이 있으면 10억 원에서 그 금액을 공제한 범위에서 신청할 수 있습니다. [S4]\n\n신청하려면 특별융자대상사업주 확인신청서와 일반 확인자료, 담보 부동산 자료, 상환계획서 및 취약근로자 우선 지원계획서를 관할 지방고용노동관서의 장에게 제출해야 합니다. [S4] 확인 결과 적합하면 통지서를 받은 날부터 45일 이내에 근로복지공단에 특별융자를 신청해야 합니다. [S4][S13]\n\n공단은 예산 범위에서 융자대상자를 결정하며, 담보 부동산 가액 평가 등을 통해 융자금 회수가 어렵다고 판단하면 융자계약 체결을 거부할 수 있습니다. [S6] 특별융자의 상환기간은 2년 또는 3년 거치 후 4년 또는 5년 분할상환이고, 금리는 연 5%를 초과하지 않는 범위에서 정해집니다. [S1]\n\n따라서 체불액 3억 원인 경우에도 최근 3개월 내 발생·미청산 체불액이 2억 원을 초과하고 담보·계획 요건 등을 충족하면 특별융자를 통해 2억 원을 초과하여 신청할 수 있습니다. [S4] 다만 실제 융자액은 공단의 심사와 담보 부동산 가액 평가 결과에 따라 결정됩니다. [S1][S6]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "일반 체불 임금등 융자는 사업주당 총 2억원, 근로자 1명당 2천만원 범위에서 신청할 수 있습니다(임금채권보장법 시행규칙 제8조의8제4항). 다만 제8조의8제4항 전단에도 불구하고 최근 3개월 이내 발생한 미청산 체불액이 2억원을 초과하고 신청 금액의 120% 이상 부동산을 담보로 제공하는 등 요건을 모두 갖춘 사업주는 2억원을 초과하는 특별융자를 근로자 1명당 2천만원, 사업주당 총 10억원 범위에서 신청할 수 있습니다(제8조의9제1항·제5항).", "judges": {"opus": {"ok": true, "quote": "다만 다음 요건을 모두 갖춘 사업주는 2억 원을 초과하는 특별융자를 신청할 수 있습니다.", "reason": "요건을 모두 갖춘 사업주의 2억원 초과 특별융자 신청 가능성을 단언하고, 최근 3개월 이내 미청산 체불 2억원 초과와 신청액 120% 이상 부동산 담보 요건도 함께 명시함."}, "codex": {"ok": true, "quote": "다만 다음 요건을 모두 갖춘 사업주는 2억 원을 초과하는 특별융자를 신청할 수 있습니다. [S4]\n\n- 법 적용 대상 사업 또는 사업장을 6개월 이상 운영한 사업주여야 합니다. [S5]\n- 대상 근로자가 확인 신청일까지 6개월 이상 계속 근로 중이거나, 6개월 이상 계속 근로 후 확인 신청일 전 1년 이내 퇴직한 사람이어야 합니다. [S7]\n- 확인 신청일 기준 최근 3개월 이내 발생하여 청산되지 않은 체불임금이 2억 원을 초과해야 합니다. [S4]\n- 특별융자 신청액의 120% 이상에 해당하는 부동산을 담보로 제공해야 합니다. [S4]\n- 융자 상환계획과 취약근로자 우선 지원계획이 구체적이고 타당해야 합니다. [S4]", "reason": "최근 3개월 내 미청산 체불액 2억 원 초과와 신청액 120% 이상 부동산 담보 등 모든 요건을 갖추면 2억 원 초과 특별융자를 신청할 수 있다고 명시했습니다."}}}, {"key": "l5b05-kp2", "id": "l5b05", "level": "L5b", "question": "파견으로 2년 넘게 일한 회사가 저를 직접 고용하겠다며 근로계약서를 줬는데 '계약기간 1년'으로 되어 있습니다. 저는 기간제를 원한 적이 없습니다. 직접고용이라면 기간 없는 계약이어야 하는 것 아닌가요?", "kp_index": 2, "all_kps": ["2년을 초과해 계속 파견근로자를 사용한 사용사업주는 해당 파견근로자를 직접 고용해야 함(파견법 제6조의2제1항제3호)", "판례: 직접고용 시 특별한 사정이 없는 한 기간을 정하지 않은 근로계약을 체결해야 함이 원칙이고, 특별한 사정은 사용사업주가 증명해야 함", "판례: 특별한 사정 없이 체결한 기간제 근로계약 중 기간을 정한 부분은 무효가 될 수 있음"], "answer": "파견사업주·사용사업주·파견근로자 간 합의 없이 파견기간을 연장한 경우에도 총 파견기간은 원칙적으로 2년을 초과할 수 없습니다. [S4] 사용사업주가 제6조제2항을 위반하여 2년을 초과해 계속 파견근로자를 사용하면 해당 파견근로자를 직접 고용해야 합니다. [S6]\n\n직접고용 시 사용사업주의 동종·유사업무 근로자가 있으면 그 근로자에게 적용되는 취업규칙 등의 근로조건을 따르고, 그러한 근로자가 없으면 기존 근로조건보다 낮아져서는 안 됩니다. [S6]\n\n대법원은 사용사업주가 직접고용의무에 따라 근로계약을 체결할 때 특별한 사정이 없는 한 기간을 정하지 않은 근로계약을 체결해야 한다고 판단했습니다. [S12] 근로자가 직접고용의무를 알면서도 기간제 계약을 희망했거나, 동종·유사업무 근로자 대부분이 기간제여서 기간 없는 계약을 기대하기 어려웠던 경우 등 특별한 사정이 있으면 기간제 계약이 가능하지만, 그 특별한 사정은 사용사업주가 증명해야 합니다. [S12]\n\n따라서 질문처럼 기간제 계약을 원한 적이 없고 위와 같은 특별한 사정도 없다면, ‘계약기간 1년’ 부분은 직접고용의무를 완전히 이행한 것으로 보기 어렵고 무효가 될 수 있습니다. [S12] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "원칙적으로 기간 없는 계약이어야 합니다. 파견근로자 보호 등에 관한 법률 제6조의2제1항제3호에 따라 2년을 초과해 계속 파견근로자를 사용한 사용사업주는 그 근로자를 직접 고용해야 하지만, 조문은 직접 고용의 계약 기간 유무를 정하지 않습니다. 대법원은 직접고용의무에 따라 기간제 근로계약을 체결한 사안에서, 사용사업주는 특별한 사정이 없는 한 기간을 정하지 않은 근로계약을 체결해야 하고, 근로자가 기간제를 희망한 경우 등 특별한 사정의 존재는 사용사업주가 증명해야 하며, 특별한 사정 없이 체결한 기간제 근로계약 중 기간을 정한 부분은 무효가 될 수 있다고 판단했습니다(대법원 2022. 1. 27. 선고 2018다207847 판결). 기간제를 원한 적이 없다면 계약기간 1년 부분은 무효가 될 수 있으나, 결론은 동종 업무 근로자의 계약 형태 등 구체적 사실관계에 따라 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "대법원은 사용사업주가 직접고용의무에 따라 근로계약을 체결할 때 특별한 사정이 없는 한 기간을 정하지 않은 근로계약을 체결해야 한다고 판단했습니다. [S12] 근로자가 직접고용의무를 알면서도 기간제 계약을 희망했거나, 동종·유사업무 근로자 대부분이 기간제여서 기간 없는 계약을 기대하기 어려웠던 경우 등 특별한 사정이 있으면 기간제 계약이 가능하지만, 그 특별한 사정은 사용사업주가 증명해야 합니다.", "reason": "기간의 정함이 없는 근로계약 체결 원칙과 특별한 사정에 대한 사용사업주의 증명책임을 모두 명시함."}, "codex": {"ok": true, "quote": "대법원은 사용사업주가 직접고용의무에 따라 근로계약을 체결할 때 특별한 사정이 없는 한 기간을 정하지 않은 근로계약을 체결해야 한다고 판단했습니다. [S12] 근로자가 직접고용의무를 알면서도 기간제 계약을 희망했거나, 동종·유사업무 근로자 대부분이 기간제여서 기간 없는 계약을 기대하기 어려웠던 경우 등 특별한 사정이 있으면 기간제 계약이 가능하지만, 그 특별한 사정은 사용사업주가 증명해야 합니다. [S12]", "reason": "판례에 따른 기간 없는 근로계약 체결 원칙과 특별한 사정에 대한 사용사업주의 증명책임을 모두 명시했습니다."}}}, {"key": "l5a07-kp1", "id": "l5a07", "level": "L5a", "question": "건설현장에서 건설업 등록이 없는 하청업체 소속으로 일했는데 rue, "quote": "네. 한부모 근로자는 같은 자녀에 대해 기본 육아휴직 1년 이내에 더하여 6개월 이내에서 추가로 육아휴직을 사용할 수 있습니다.", "reason": "기본 육아휴직 기간이 1년 이내임을 명시하고 있어 정답 포인트와 의미가 같다."}, "codex": {"ok": true, "quote": "네. 한부모 근로자는 같은 자녀에 대해 기본 육아휴직 1년 이내에 더하여 6개월 이내에서 추가로 육아휴직을 사용할 수 있습니다.", "reason": "기본 육아휴직 기간이 1년 이내임을 명시했습니다."}}}, {"key": "l5a02-kp3", "id": "l5a02", "level": "L5a", "question": "2024년에 월급제로 입사해 5개월째 일하고 있습니다. 사장님이 오늘 갑자기 내일부터 나오지 말라고 했는데, 미리 말해준 것도 없고 따로 돈을 준다는 얘기도 없습니다. 입사 6개월이 안 된 월급제 직원은 해고예고를 안 해도 된다고 하던데, 저는 받을 수 있는 게 없나요?", "kp_index": 3, "all_kps": ["해고하려면 적어도 30일 전에 예고해야 하고, 예고하지 않았으면 30일분 이상의 통상임금(해고예고수당)을 지급해야 함(근로기준법 제26조)", "현행 예외는 계속 근로기간 3개월 미만 등 제26조 단서 각 호뿐이며 '6개월 미만 월급근로자' 예외는 없음", "근속 5개월 월급근로자는 해고예고 또는 30일분 통상임금 지급 대상"], "answer": "입사 후 계속 근로한 기간이 3개월 이상이므로, 사용자는 해고일 30일 전에 예고하거나 30일분 이상의 통상임금을 지급해야 합니다. 3개월 미만인 경우에만 해고예고 의무의 예외가 됩니다. [S1]\n\n따라서 5개월째 근무한 사실이 맞다면, “6개월이 안 됐다”는 이유만으로 해고예고를 하지 않아도 되는 것은 아닙니다. 다만 천재·사변 등으로 사업을 계속할 수 없거나, 근로자가 고의로 사업에 막대한 지장 또는 재산상 손해를 끼쳐 시행규칙상 사유에 해당하는 경우에는 예외가 될 수 있습니다. [S1] [S3]\n\n해고에는 정당한 이유가 있어야 하고, 사용자는 해고사유와 해고시기를 서면으로 통지해야 하며, 서면 통지가 없으면 해고의 효력이 없습니다. [S2] [S4]\n\n부당해고라고 판단되면 해고일로부터 3개월 이내에 노동위원회에 구제를 신청할 수 있습니다. 노동위원회가 부당해고로 판정하면 원직복직 명령을 하거나, 원직복직을 원하지 않는 경우 해고기간 동안 받을 수 있었던 임금 상당액 이상의 금품 지급을 명할 수 있습니다. [S7] [S8]\n\n다만 실제 해고가 정당한지와 해고예고 예외에 해당하는지는 구체적인 사실관계에 따라 달라질 수 있습니다.", "reference": "받을 수 있습니다. 근로기준법 제26조에 따라 사용자는 해고 30일 전에 예고하거나, 예고하지 않았다면 30일분 이상의 통상임금(해고예고수당)을 지급해야 합니다. 현행 예외는 계속 근로기간 3개월 미만 등 제26조 단서 각 호뿐이고 '6개월 미만 월급근로자' 예외는 없으므로, 근속 5개월이면 해고예고수당 지급 대상입니다.", "judges": {"opus": {"ok": true, "quote": "입사 후 계속 근로한 기간이 3개월 이상이므로, 사용자는 해고일 30일 전에 예고하거나 30일분 이상의 통상임금을 지급해야 합니다.", "reason": "5개월 근속 근로자가 해고예고 또는 30일분 통상임금 지급 대상이라는 점을 단언했습니다."}, "codex": {"ok": true, "quote": "입사 후 계속 근로한 기간이 3개월 이상이므로, 사용자는 해고일 30일 전에 예고하거나 30일분 이상의 통상임금을 지급해야 합니다. 3개월 미만인 경우에만 해고예고 의무의 예외가 됩니다. [S1]\n\n따라서 5개월째 근무한 사실이 맞다면, “6개월이 안 됐다”는 이유만으로 해고예고를 하지 않아도 되는 것은 아닙니다.", "reason": "질문자의 5개월 근속을 전제로 해고예고 또는 30일분 이상의 통상임금 지급 대상임을 명시했습니다."}}}, {"key": "g018-kp3", "id": "g018", "level": "L2", "question": "체불 사업주 정보가 신용정보기관에 넘어가는 기준이 뭔가요?", "kp_index": 3, "all_kps": ["제공일 이전 3년 이내 임금등 체불로 2회 이상 유죄 확정", "제공일 이전 1년 이내 체불총액 2천만원 이상", "또는 제43조의4의 상습체불사업주"], "answer": "신용정보기관에 체불사업주 정보가 제공되는 기준은 다음과 같습니다.\n\n1. **일반 체불사업주**  \n고용노동부장관은 다음 요건을 모두 충족한 체불사업주에 관한 자료를 종합신용정보집중기관에 제공할 수 있습니다. [S1]\n\n- 자료 제공일 이전 3년 이내에 임금 등을 체불하여 **2회 이상 유죄가 확정**되었을 것 [S1]\n- 자료 제공일 이전 1년 이내의 **체불총액이 2천만 원 이상**일 것 [S1]\n- 다만 사망·폐업 등 자료 제공의 실효성이 없는 경우에는 제공하지 않습니다. [S1][S4]\n\n자료를 제공받은 기관은 해당 자료를 체불사업주의 신용도·신용거래능력 판단 관련 업무 외의 목적으로 이용하거나 누설할 수 없습니다. [S1]\n\n2. **상습체불사업주**  \n상습체불사업주로 정해진 경우에도 자료 제공 대상이 될 수 있습니다. 상습체불사업주는 다음 중 하나에 해당하는 사업주입니다. [S3]\n\n- 직전 연도 1년간 근로자에게 **3개월분 임금 이상**을 체불한 경우 [S3]\n- 직전 연도 1년간 근로자에게 **5회 이상** 임금 등을 체불하고, 체불총액이 **3천만 원 이상**인 경우 [S3]\n\n상습체불사업주에 대한 자료 제공은 위원회의 심의를 거쳐 정해지며, 중앙행정기관·지방자치단체·대통령령으로 정하는 공공기관의 보조·지원 제한이나 입찰 관련 불이익 조치를 위한 목적으로 제공될 수 있습니다. [S3][S10]\n\n상습체불사업주에 대한 자료 제공기간은 자료 제공일부터 **1년**입니다. [S8][S10]\n\n다만, 상습체불사업주가 자료 제공 전에 체불 임금 등을 전액 지급하고 직전 연도에 지급된 대지급금도 전액 변제한 경우 등에는 자료를 제공하지 않을 수 있습니다. [S4][S10]\n\n참고로 위 기준은 2026년 10월 1일 현재 시행 중입니다. [S1][S3]", "reference": "임금등 체불자료 제공일 이전 3년 이내 2회 이상 유죄가 확정되고 1년 이내 체불총액이 2천만원 이상인 체불사업주, 또는 상습체불사업주의 자료를 종합신용정보집중기관 요구 시 제공할 수 있습니다(근로기준법 제43조의3제1항).", "judges": {"opus": {"ok": true, "quote": "상습체불사업주로 정해진 경우에도 자료 제공 대상이 될 수 있습니다.", "reason": "상습체불사업주도 별도(또는) 제공 대상이라고 단언했으나, 제43조의4 조문 번호는 없고 이어지는 보조·지원 제한 목적 설명이 다른 제공처와 섞여 있습니다."}, "codex": {"ok": true, "quote": "상습체불사업주로 정해진 경우에도 자료 제공 대상이 될 수 있습니다.", "reason": "조문 번호는 없지만 상습체불사업주도 별도의 자료 제공 대상이 될 수 있다고 명시했습니다."}}}, {"key": "s04-kp3", "id": "s04", "level": "SUM", "question": "육아휴직 제도의 주요 내용을 요약해 주세요.", "kp_index": 3, "all_kps": ["만 8세 이하 또는 초등학교 2학년 이하 자녀 양육을 위해 신청 가능", "기간은 1년 이내(요건 충족 시 6개월 추가)", "육아휴직을 이유로 한 불리한 처우 금지, 휴직 기간 중 해고 금지", "휴직 후 같은 업무 또는 같은 수준의 임금을 지급하는 직무로 복귀", "3회에 한정하여 나누어 사용 가능"], "answer": "- 사업주는 임신 중인 여성 근로자의 모성 보호, 유산·조산 등 위험이 있는 임신 중인 배우자를 돌보려는 남성 근로자, 또는 만 8세 이하·초등학교 2학년 이하 자녀를 양육하려는 근로자의 육아휴직 신청을 허용해야 합니다. 다만 휴직개시예정일 전날까지 계속 근로기간이 6개월 미만인 근로자가 신청한 경우에는 적용되지 않습니다. [S1][S6]\n- 육아휴직 기간은 원칙적으로 1년 이내이며, 부모가 같은 자녀에 대해 각각 3개월 이상 사용한 경우의 부 또는 모, 한부모, 고용노동부령상 장애아동의 부모는 6개월 이내에서 추가 사용할 수 있습니다. [S1][S12]\n- 육아휴직은 3회까지 나누어 사용할 수 있으며, 임신 중 모성 보호나 위험이 있는 임신 중 배우자 돌봄을 위한 휴직 및 법 제19조제6항에 따른 1주·2주 육아휴직은 분할 사용 횟수에 포함되지 않습니다. [S4]\n- 자녀가 다니는 기관의 휴업·휴교·휴원, 방학, 질병·사고에 따른 입원, 감염병 관련 격리·등교 중지 등의 사유가 있으면 1년에 1회, 1주 또는 2주 단위의 육아휴직을 사용할 수 있고, 이 기간은 통상 육아휴직 기간에 포함됩니다. [S1][S2]\n- 방학기간에 신청이 집중되어 사업 운영에 막대한 지장이 있으면 사업주는 근로자와 협의하여 사용 시기를 변경할 수 있으며, 시기변경 사유와 변경 기간을 서면으로 알려야 합니다. [S1]\n- 육아휴직 신청은 원칙적으로 휴직개시예정일 30일 전까지 해야 하고, 유산·조산·사산 위험, 임신 중 배우자 돌봄, 조산 전 출생, 배우자의 사망·질병 등 특별한 사유가 있으면 7일 전까지 신청할 수 있습니다. 법 제19조제6항의 긴급한 사유인 기관의 휴업·휴교·휴원, 자녀의 입원, 감염병 관련 조치의 경우에는 휴직개시예정일까지 신청할 수 있습니다. [S2][S3]\n- 사업주는 신청을 허용한 사실을 원칙적으로 신청일부터 14일 이내, 특별한 사유에 따른 신청은 3일 이내, 긴급 신청은 지체 없이 서면 또는 전자적 방식으로 알려야 합니다. 정해진 기간 내 알리지 않으면 신청한 대로 허용한 것으로 봅니다. [S3]\n- 사업주는 육아휴직을 이유로 해고나 불리한 처우를 해서는 안 되며, 육아휴직 기간에는 원칙적으로 해고할 수 없습니다. 육아휴직 후에는 휴직 전과 같은 업무 또는 같은 수준의 임금을 지급하는 직무로 복귀시켜야 하고, 육아휴직 기간은 근속기간에 포함됩니다. [S1]\n- 신청자는 휴직개시예정일 7일 전까지 신청을 철회할 수 있으며, 긴급 신청의 경우에는 휴직개시예정일 전날까지 철회할 수 있습니다. [S5]\n- 육아휴직 중 자녀의 사망 등 법정 사유가 발생하면 근로자는 7일 이내에 사업주에게 알려야", "reference": "만 8세 이하 또는 초등학교 2학년 이하 자녀를 양육하기 위해 신청할 수 있고, 기간은 1년 이내이며 부모 각 3개월 이상 사용·한부모 등 요건을 갖추면 6개월을 추가할 수 있습니다. 육아휴직을 이유로 불리한 처우를 할 수 없고 휴직 기간에는 해고하지 못하며, 마친 뒤에는 같은 업무 또는 같은 수준의 임금을 지급하는 직무로 복귀시켜야 합니다. 3회에 한정하여 나누어 쓸 수 있습니다(남녀고용평등법 제19조, 제19조의4).", "judges": {"opus": {"ok": true, "quote": "사업주는 육아휴직을 이유로 해고나 불리한 처우를 해서는 안 되며, 육아휴직 기간에는 원칙적으로 해고할 수 없습니다.", "reason": "불리한 처우 금지와 휴직 기간 중 해고 금지를 모두 명시한다."}, "codex": {"ok": true, "quote": "사업주는 육아휴직을 이유로 해고나 불리한 처우를 해서는 안 되며, 육아휴직 기간에는 원칙적으로 해고할 수 없습니다.", "reason": "육아휴직을 이유로 한 불리한 처우 금지와 휴직 기간 중 해고 금지를 모두 명시합니다."}}}, {"key": "n06-kp2", "id": "n06", "level": "L3", "question": "우리 공장 생산라인 직원이 출산휴가에 들어가 그 자리를 파견근로자로 채우려고 합니다. 제조업 생산공정에는 파견을 쓸 수 없다고 들었는데 가능한가요? 가능하다면 파견기간은 얼마나 되나요?", "kp_index": 2, "all_kps": ["원칙적으로 제조업의 직접생산공정업무는 파견 대상이 아니지만, 출산·질병·부상 등으로 결원이 생긴 경우에는 파견 가능함", "결원 대체 파견의 기간은 해당 사유가 없어지는 데 필요한 기간임", "사용사업주는 과반수 노조 또는 근로자 과반수 대표와 사전에 성실하게 협의해야 함"], "answer": "제조업의 직접생산공정업무에는 원칙적으로 근로자파견을 할 수 없습니다. [S1]\n\n다만 출산으로 결원이 생긴 경우에는 예외적으로 근로자파견을 할 수 있습니다. 따라서 생산라인 직원의 출산전후휴가로 결원이 발생한 경우에는 해당 결원을 메우기 위한 파견이 가능합니다. [S1]\n\n이 경우 파견기간은 출산이라는 사유가 없어지는 데 필요한 기간까지입니다. [S2] 출산전후휴가는 원칙적으로 출산 전후 90일이고, 미숙아 출산은 100일, 한 번에 둘 이상 자녀를 임신한 경우는 120일이며, 출산 후 휴가는 각각 45일, 45일, 60일 이상이어야 합니다. [S5]\n\n따라서 파견기간은 출산휴가로 발생한 결원이 없어지는 데 필요한 기간을 넘길 수 없고, 출산휴가 기간에 맞추어 정해야 합니다. [S2] 파견근로자를 사용하려면 해당 사업장에 과반수 노동조합이 있으면 그 노동조합과, 없으면 근로자 과반수를 대표하는 자와 사전에 성실하게 협의해야 합니다. [S1]", "reference": "근로자파견은 원칙적으로 제조업의 직접생산공정업무를 제외한 업무에서만 가능하지만, 제1항에도 불구하고 출산·질병·부상 등으로 결원이 생긴 경우에는 파견을 쓸 수 있으며 이때 과반수 노동조합 또는 근로자 과반수 대표와 사전에 성실히 협의해야 합니다(파견근로자 보호 등에 관한 법률 제5조제2항·제4항). 이 경우 파견기간은 1년 상한이 아니라 해당 사유가 없어지는 데 필요한 기간입니다(제6조제1항·제4항제1호).", "judges": {"opus": {"ok": true, "quote": "이 경우 파견기간은 출산이라는 사유가 없어지는 데 필요한 기간까지입니다.", "reason": "파견기간이 해당 사유가 없어지는 데 필요한 기간이라고 명시했다."}, "codex": {"ok": true, "quote": "이 경우 파견기간은 출산이라는 사유가 없어지는 데 필요한 기간까지입니다.", "reason": "결원 대체 파견기간이 해당 사유가 없어지는 데 필요한 기간임을 명시했습니다."}}}, {"key": "n28-kp3", "id": "n28", "level": "L3", "question": "직원이 400명인 회사에서 확정급여형 퇴직연금을 운용하고 있습니다. 적립금운용위원회는 몇 명으로 꾸려야 하고, 위원장은 누가 맡아야 하나요?", "kp_index": 3, "all_kps": ["상시 300명 이상 사용 사업의 사용자는 적립금운용위원회를 구성해야 함", "위원회는 위원장 1명 포함 5명 이상 7명 이하로 구성", "위원장은 해당 사업에서 퇴직연금업무를 담당하는 임원이 맡음"], "answer": "상시 300명 이상의 근로자를 사용하는 사업의 사용자는 적립금운용위원회를 구성해야 합니다. 직원이 400명인 회사는 이에 해당합니다. [S2]\n\n적립금운용위원회는 위원장 1명을 포함하여 **5명 이상 7명 이하**로 구성해야 합니다. [S1]\n\n위원장은 해당 사업에서 **퇴직연금업무를 담당하는 임원**이 맡아야 합니다. [S1]", "reference": "퇴직급여법 제18조의2제1항에 따라 상시 300명 이상을 사용하는 사업의 사용자는 적립금운용위원회를 구성해야 하므로 400명 규모 회사는 의무 대상입니다. 시행령 제9조의2에 따라 위원회는 위원장 1명을 포함해 5명 이상 7명 이하로 구성하고, 위원장은 퇴직연금업무를 담당하는 임원이 맡으며, 회의는 연 1회 이상 열어야 합니다.", "judges": {"opus": {"ok": true, "quote": "위원장은 해당 사업에서 **퇴직연금업무를 담당하는 임원**이 맡아야 합니다.", "reason": "위원장을 해당 사업의 퇴직연금업무 담당 임원으로 동일하게 명시함."}, "codex": {"ok": true, "quote": "위원장은 해당 사업에서 **퇴직연금업무를 담당하는 임원**이 맡아야 합니다.", "reason": "해당 사업의 퇴직연금업무 담당 임원이 위원장을 맡아야 함을 명시했습니다."}}}, {"key": "s08-kp5", "id": "s08", "level": "SUM", "question": "근로시간, 연장근로, 휴게시간, 주휴일에 관한 근로기준법의 기본 원칙을 요약해 주세요.", "kp_index": 5, "all_kps": ["근로시간은 휴게시간을 제외하고 1주 40시간, 1일 8시간을 초과할 수 없음", "당사자 간 합의하면 1주 12시간을 한도로 연장근로 가능", "근로시간 4시간이면 30분 이상, 8시간이면 1시간 이상의 휴게시간을 근로시간 도중에 부여", "휴게시간은 근로자가 자유롭게 이용할 수 있음", "1주에 평균 1회 이상의 유급휴일 보장"], "answer": "- **근로시간**: 휴게시간을 제외한 1주 근로시간은 40시간, 1일 근로시간은 8시간을 초과할 수 없습니다. 사용자의 지휘·감독 아래 대기하는 시간 등은 근로시간으로 봅니다. [S1]  \n- **연장근로**: 당사자 간 합의가 있으면 1주 12시간을 한도로 제50조의 근로시간을 연장할 수 있습니다. 다만 탄력적 근로시간제나 근로시간 특례 등 별도 요건이 적용될 수 있습니다. [S3] [S4] [S6] [S7]  \n- **연장근로수당**: 연장근로에는 통상임금의 50% 이상을 가산하여 지급해야 합니다. 야간근로는 오후 10시부터 다음 날 오전 6시까지이며, 이 시간의 근로에도 통상임금의 50% 이상을 가산해야 합니다. [S2]  \n- **휴게시간**: 사용자는 근로시간이 4시간인 경우 30분 이상, 8시간인 경우 1시간 이상의 휴게시간을 근로시간 도중에 주어야 하며, 휴게시간은 근로자가 자유롭게 이용할 수 있어야 합니다. [S8] 2026년 12월 10일부터는 근로시간이 4시간인 경우 근로자가 휴게시간을 이용하지 않겠다고 명시적으로 요청하면 30분 이상 휴게시간을 주지 않을 수 있도록 개정될 예정입니다. [S8]  \n- **주휴일**: 사용자는 근로자에게 1주에 평균 1회 이상의 유급휴일을 보장해야 합니다. 대통령령으로 정하는 휴일도 유급으로 보장해야 하지만, 근로자대표와 서면으로 합의하면 특정 근로일로 대체할 수 있습니다. [S9]  \n- **판례**: 대법원은 1주간 연장근로 12시간 초과 여부를 판단할 때 1일 8시간 초과 여부와 관계없이 1주간 근로시간 중 40시간을 초과한 시간을 기준으로 판단한다고 보았고, 1일 8시간을 초과하여 4시간 연장근로를 하는 경우에도 연장근로 도중 30분 이상의 휴게시간을 부여해야 한다고 판단했습니다(대법원 2023. 12. 7. 선고 2020도15393 판결) [S14] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "근로시간은 휴게시간을 제외하고 1주 40시간, 1일 8시간을 넘을 수 없습니다(제50조). 당사자 간에 합의하면 1주 12시간을 한도로 연장근로를 할 수 있습니다(제53조제1항). 근로시간이 4시간이면 30분 이상, 8시간이면 1시간 이상의 휴게시간을 근로시간 도중에 주어야 하고, 휴게시간은 근로자가 자유롭게 이용할 수 있습니다(제54조). 사용자는 1주에 평균 1회 이상의 유급휴일을 보장해야 합니다(제55조제1항).", "judges": {"opus": {"ok": true, "quote": "사용자는 근로자에게 1주에 평균 1회 이상의 유급휴일을 보장해야 합니다.", "reason": "1주 평균 1회 이상 유급휴일 보장을 명시함."}, "codex": {"ok": true, "quote": "사용자는 근로자에게 1주에 평균 1회 이상의 유급휴일을 보장해야 합니다.", "reason": "1주 평균 1회 이상의 유급휴일 보장 의무를 명시했습니다."}}}, {"key": "g013-kp1", "id": "g013", "level": "L2", "question": "매주 12시간만 일하는 아르바이트생에게도 주휴일과 연차휴가를 줘야 하나요?", "kp_index": 1, "all_kps": ["4주 평균 1주 소정근로시간이 15시간 미만이면 제55조(휴일)와 제60조(연차 유급휴가)를 적용하지 않음"], "answer": "주 12시간 근무자는 4주 평균 1주 소정근로시간이 15시간 미만인 단시간근로자이므로, 근로기준법 제55조의 주휴일과 제60조의 연차유급휴가가 적용되지 않습니다. [S3]\n\n따라서 매주 12시간만 근무한다는 전제에서는 법정 주휴일과 연차휴가를 부여할 의무가 없습니다. [S3]\n\n다만 단시간근로자의 근로조건은 같은 종류의 업무에 종사하는 통상근로자의 근로시간을 기준으로 한 비율에 따라 결정되어야 합니다. [S3]", "reference": "4주 평균 1주 소정근로시간이 15시간 미만인 근로자에게는 유급휴일(제55조)과 연차 유급휴가(제60조) 규정이 적용되지 않으므로 의무가 없습니다(근로기준법 제18조제3항).", "judges": {"opus": {"ok": true, "quote": "주 12시간 근무자는 4주 평균 1주 소정근로시간이 15시간 미만인 단시간근로자이므로, 근로기준법 제55조의 주휴일과 제60조의 연차유급휴가가 적용되지 않습니다.", "reason": "답변이 4주 평균 1주 소정근로시간 15시간 미만이라는 조건과 제55조(휴일)·제60조(연차 유급휴가)가 적용되지 않는다는 내용을 모두 명시적으로 단언함."}, "codex": {"ok": true, "quote": "주 12시간 근무자는 4주 평균 1주 소정근로시간이 15시간 미만인 단시간근로자이므로, 근로기준법 제55조의 주휴일과 제60조의 연차유급휴가가 적용되지 않습니다. [S3]", "reason": "4주 평균 1주 소정근로시간이 15시간 미만이라는 조건과 제55조의 휴일 및 제60조의 연차 유급휴가가 적용되지 않는다는 사실을 모두 명시했습니다."}}}, {"key": "g034-kp1", "id": "g034", "level": "L4", "question": "근로계약 기간은 1년을 넘을 수 없다는 근로기준법 조항이 아직 유효한가요? 계약직은 최대 얼마나 쓸 수 있나요?", "kp_index": 1, "all_kps": ["근로기준법 제16조(계약기간 1년 초과 금지)는 2007-06-30까지만 효력을 가져 현재 효력 상실", "기간제근로자는 2년을 초과하지 않는 범위에서 사용 가능", "예외 사유 없이 2년 초과 사용 시 기간의 정함이 없는 근로계약을 체결한 근로자로 봄"], "answer": "근로계약 기간을 1년 이내로 제한하던 근로기준법 제16조는 2007년 6월 30일까지 유효했고, 현재는 효력을 상실했습니다. [S1]\n\n현재 기간제근로자는 원칙적으로 계속근로한 총기간이 2년을 초과하지 않는 범위에서 사용할 수 있습니다. [S2] 사용자가 예외 사유 없이 2년을 초과하여 사용하면 해당 근로자는 기간의 정함이 없는 근로계약을 체결한 근로자로 봅니다. [S2]\n\n다만 사업 완료·특정 업무 완성, 휴직자 등의 업무 대체, 학업·직업훈련 이수에 필요한 기간, 고령자와의 근로계약 등 법에서 정한 예외 사유가 있으면 2년을 초과하여 사용할 수 있습니다. [S2] 전문자격·박사학위 보유자, 일부 정부 일자리 사업, 연구기관의 연구업무, 뚜렷하게 짧은 단시간근로자 등도 시행령상 예외에 포함됩니다. [S11]\n\n대법원은 정당한 계약갱신 기대권이 인정되는 경우, 사용자의 부당한 갱신 거절로 실제 근로를 제공하지 못한 기간도 그 기대권이 존속하는 범위에서는 2년의 사용제한기간에 포함된다고 판단했습니다(대법원 2018. 6. 19. 선고 2013다85523 판결). [S12] 또한 기간제법상 2년 제한이 있더라도 정당한 갱신기대권이 형성되는 것 자체가 제한되지는 않는다고 판단했습니다(대법원 2017. 10. 12. 선고 2015두59907 판결). [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "유효하지 않습니다. 근로기준법 제16조는 부칙에 따라 2007년 6월 30일까지만 효력이 있었습니다. 현재는 기간제법 제4조에 따라 기간제근로자를 2년을 초과하지 않는 범위에서 사용할 수 있고, 예외 사유 없이 2년을 넘기면 기간의 정함이 없는 근로자로 봅니다.", "judges": {"opus": {"ok": true, "quote": "근로계약 기간을 1년 이내로 제한하던 근로기준법 제16조는 2007년 6월 30일까지 유효했고, 현재는 효력을 상실했습니다.", "reason": "제16조가 2007-06-30까지만 유효했고 현재 효력을 상실했다는 날짜와 내용을 모두 명시함."}, "codex": {"ok": true, "quote": "근로계약 기간을 1년 이내로 제한하던 근로기준법 제16조는 2007년 6월 30일까지 유효했고, 현재는 효력을 상실했습니다.", "reason": "제16조의 1년 제한 내용, 효력 종료 날짜 및 현재 효력 상실을 모두 명시했습니다."}}}, {"key": "n16-kp1", "id": "n16", "level": "L2", "question": "건설업 등록이 없는 하청업체에서 일하다 퇴직했는데 임금을 못 받았습니다. 노동청에서 체불 임금등·사업주 확인서는 받았는데, 그 하청업체는 사업을 시작한 지 4개월밖에 안 됐습니다. 사업 기간이 6개월이 안 돼도 대지급금을 받을 수 있나요?", "kp_index": 1, "all_kps": ["체불 확인서에 의한 대지급금은 원칙적으로 사업주가 근로자 퇴직일까지 6개월 이상 사업을 했어야 함", "건설사업자가 아닌 하수급인이 6개월 미만 사업한 경우에는 직상 수급인(또는 상위 수급인 중 최하위 건설사업자)이 퇴직일까지 6개월 이상 사업을 했으면 요건을 충족함"], "answer": "원칙적으로, 체불 임금등·사업주 확인서로 미지급 임금등이 확인된 퇴직 근로자가 간이대지급금을 받으려면 사업주가 해당 근로자의 퇴직일까지 6개월 이상 사업을 했어야 합니다. [S2]\n\n다만 건설업 공사도급의 하수급인인 사업주가 건설사업자가 아니어서 6개월 이상 사업을 하지 않은 경우에는, 그 하수급인의 직상 수급인 또는 요건에 해당하는 상위 수급인이 근로자의 퇴직일까지 6개월 이상 사업을 했다면 사업주 기준을 충족한 것으로 봅니다. [S2]\n\n따라서 하청업체가 건설업 등록이 없고 사업 기간이 4개월이어도, 해당 업체가 「근로기준법」 제44조의2제1항에 따른 건설업 공사도급의 하수급인에 해당하며 직상 수급인 또는 요건에 해당하는 상위 수급인이 6개월 이상 사업을 했다면 대지급금을 받을 수 있습니다. [S2]\n\n그 밖에도 체불 임금등·사업주 확인서로 미지급 임금등이 확인되어야 하고, 퇴직 다음 날부터 1년 이내에 진정 등을 제기했으며, 확인서가 최초 발급된 날부터 6개월 이내에 대지급금을 청구해야 합니다. [S2][S6][S3]\n\n간이대지급금 청구는 체불 임금등·사업주 확인서 원본 또는 사본을 첨부하여 근로복지공단에 제출합니다. [S10]", "reference": "체불 임금등·사업주 확인서에 따른 대지급금은 원칙적으로 사업주가 근로자의 퇴직일까지 6개월 이상 해당 사업을 했어야 합니다(임금채권보장법 시행령 제8조제3항제1호). 다만 건설사업자가 아닌 하수급인이 6개월 이상 사업을 하지 않은 경우에는 그 직상 수급인(직상 수급인이 건설사업자가 아니면 상위 수급인 중 최하위 건설사업자)이 퇴직일까지 6개월 이상 사업을 했으면 요건을 갖춘 것으로 봅니다(제8조제5항).", "judges": {"opus": {"ok": true, "quote": "원칙적으로, 체불 임금등·사업주 확인서로 미지급 임금등이 확인된 퇴직 근로자가 간이대지급금을 받으려면 사업주가 해당 근로자의 퇴직일까지 6개월 이상 사업을 했어야 합니다.", "reason": "체불 확인서에 의한 대지급금은 사업주가 퇴직일까지 6개월 이상 사업을 했어야 한다는 원칙을 명시적으로 단언함."}, "codex": {"ok": true, "quote": "원칙적으로, 체불 임금등·사업주 확인서로 미지급 임금등이 확인된 퇴직 근로자가 간이대지급금을 받으려면 사업주가 해당 근로자의 퇴직일까지 6개월 이상 사업을 했어야 합니다.", "reason": "확인서에 의한 대지급금의 원칙적인 사업 기간 요건과 기준일을 명시했습니다."}}}, {"key": "g021-kp3", "id": "g021", "level": "L3", "question": "우리 회사가 5인 이상 사업장인지 판단할 때 상시 근로자 수는 어떻게 계산하나요?", "kp_index": 3, "all_kps": ["상시 근로자 수 산정 방법은 대통령령에 위임", "법 적용 사유 발생일 전 1개월 동안 사용한 근로자 연인원을 같은 기간 가동 일수로 나누어 산정", "파견근로자는 연인원에서 제외"], "answer": "근로기준법은 상시 5명 이상의 근로자를 사용하는 모든 사업 또는 사업장에 적용되고, 상시 4명 이하인 경우에는 대통령령으로 정하는 일부 규정만 적용될 수 있습니다. [S2]\n\n상시 근로자 수는 원칙적으로 법 적용 사유가 발생한 날 전 1개월 동안 사용한 근로자의 연인원을 같은 기간의 가동 일수로 나누어 계산합니다. 사업 성립 후 1개월이 지나지 않았다면 성립일부터 법 적용 사유 발생일까지를 산정기간으로 합니다. [S1]\n\n이때 통상근로자, 기간제근로자, 단시간근로자 등 고용형태와 관계없이 해당 사업 또는 사업장에서 근로하는 모든 근로자를 포함합니다. 다만 파견근로자는 제외합니다. 동거하는 친족도 해당 사업장에서 근로하는 근로자가 1명이라도 있으면 포함합니다. [S1]\n\n계산 결과 5명 미만이더라도 산정기간의 일별 근로자 수를 보아 5명 미만인 날이 절반 미만이면 5명 이상 사업장으로 봅니다. 반대로 계산 결과 5명 이상이더라도 5명 미만인 날이 절반 이상이면 5명 이상 사업장으로 보지 않습니다. [S1]\n\n다만 취업규칙 작성·신고 의무를 판단할 때는 법 적용 기준이 10명입니다. 이 경우에도 위와 같은 산정 방법을 적용합니다. [S1][S11]\n\n주휴일 등 근로의무가 없는 날에 실제 근무하지 않은 근로자는 연인원과 일별 근로자 수에 포함하지 않는다는 대법원 판단이 있습니다(대법원 2024. 1. 25. 선고 2023다275998 판결). [S14] 외국기업의 경우에는 원칙적으로 국내에서 사용하는 근로자 수를 기준으로 판단한다는 대법원 판단도 있습니다(대법원 2024. 10. 25. 선고 2023두37391 판결). [S15]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "근로기준법 제11조제3항의 위임에 따라, 법 적용 사유 발생일 전 1개월 동안 사용한 근로자의 연인원을 같은 기간의 가동 일수로 나누어 산정합니다. 파견근로자는 연인원에서 제외됩니다(시행령 제7조의2).", "judges": {"opus": {"ok": true, "quote": "다만 파견근로자는 제외합니다.", "reason": "파견근로자를 연인원 산정에서 제외한다는 점이 명시되어 있습니다."}, "codex": {"ok": true, "quote": "다만 파견근로자는 제외합니다.", "reason": "상시 근로자 수 산정에 포함하는 근로자를 설명하면서 파견근로자를 제외한다고 명시합니다."}}}, {"key": "g030-kp1", "id": "g030", "level": "L3", "question": "직원이 부모님 간병으로 가족돌봄휴직을 신청했는데, 대체인력을 구하지 못하면 거부할 수 있나요?", "kp_index": 1, "all_kps": ["대체인력 채용이 불가능한 경우 등 대통령령 사유는 허용 의무의 예외", "직업안정기관에 구인신청을 하고 14일 이상 대체인력 채용 노력을 했으나 채용하지 못한 경우 거부 가능", "직업소개에도 정당한 이유 없이 2회 이상 채용을 거부했다면 예외에 해당하지 않음"], "answer": "원칙적으로 사업주는 부모의 질병·사고·노령으로 돌보기 위한 가족돌봄휴직 신청을 허용해야 합니다. [S2]\n\n다만 사업주가 직업안정기관에 구인신청을 하고 14일 이상 대체인력을 채용하기 위해 노력했으나 채용하지 못한 경우에는 가족돌봄휴직을 허용하지 않을 수 있습니다. 다만 직업안정기관의 직업소개에도 불구하고 정당한 이유 없이 2회 이상 채용을 거부한 경우는 제외됩니다. [S1]\n\n또한 가족돌봄휴직으로 정상적인 사업 운영에 중대한 지장이 초래되고 사업주가 이를 증명하는 경우에도 허용하지 않을 수 있습니다. [S1]\n\n허용하지 않는 경우 사업주는 그 사유를 근로자에게 서면으로 통보하고, 업무 시작·종료 시각 조정, 연장근로 제한, 근로시간 조정 등 지원조치를 하도록 노력해야 합니다. [S2]\n\n따라서 단순히 대체인력을 구하지 못했다는 사정만으로는 부족하고, 직업안정기관에 구인신청을 한 뒤 14일 이상 채용을 위해 노력했으나 채용하지 못했다는 요건을 충족해야 합니다. [S1]", "reference": "직업안정기관에 구인신청을 하고 14일 이상 대체인력 채용을 위해 노력했는데도 채용하지 못했다면 거부할 수 있습니다. 다만 직업소개를 정당한 이유 없이 2회 이상 거부했다면 해당하지 않고, 거부 시 사유를 서면으로 알리고 근무시간 조정 등 조치를 하도록 노력해야 합니다(남녀고용평등법 제22조의2제1항·제3항, 시행령 제16조의3제1항제4호).", "judges": {"opus": {"ok": true, "quote": "원칙적으로 사업주는 부모의 질병·사고·노령으로 돌보기 위한 가족돌봄휴직 신청을 허용해야 합니다. [S2] 다만 사업주가 직업안정기관에 구인신청을 하고 14일 이상 대체인력을 채용하기 위해 노력했으나 채용하지 못한 경우에는 가족돌봄휴직을 허용하지 않을 수 있습니다.", "reason": "허용 의무가 원칙이고 대체인력을 채용하지 못한 경우가 그 예외라는 핵심은 명시했으나, 예외 사유가 '대통령령'으로 정해진다는 근거 규범은 언급하지 않았습니다."}, "codex": {"ok": true, "quote": "다만 사업주가 직업안정기관에 구인신청을 하고 14일 이상 대체인력을 채용하기 위해 노력했으나 채용하지 못한 경우에는 가족돌봄휴직을 허용하지 않을 수 있습니다.", "reason": "대체인력을 채용하지 못한 경우가 허용 의무의 예외임을 명시합니다."}}}, {"key": "g032-kp1", "id": "g032", "level": "L4", "question": "하루 4시간 근무하는 직원이 30분 휴게 없이 바로 퇴근하고 싶다고 하면 휴게를 안 줘도 되나요?", "kp_index": 1, "all_kps": ["현행 제54조제1항: 근로시간 4시간이면 30분 이상 휴게를 근로시간 도중에 주어야 함", "근로자가 명시적으로 요청하면 4시간 근로의 휴게를 생략할 수 있는 단서가 신설됨", "그 단서는 2026-12-10 시행 예정으로 현재 미시행"], "answer": "현재 근로기준법상 사용자는 근로시간이 4시간인 경우 근로시간 도중에 30분 이상의 휴게시간을 주어야 합니다. 휴게시간은 근로자가 자유롭게 이용할 수 있어야 합니다. [S1]\n\n따라서 하루 4시간 근무자가 30분 휴게 없이 바로 퇴근하고 싶다고 하더라도, 현재 조문상 사용자가 휴게를 부여하지 않아도 된다고 볼 수 없습니다. [S1]\n\n다만 2026년 12월 10일부터는 근로시간이 4시간인 경우 근로자가 휴게시간을 이용하지 않을 것을 명시적으로 요청하면 휴게시간을 주지 않을 수 있도록 개정될 예정입니다. [S1]\n\n대법원은 근로계약상 휴식시간이라도 사용자의 지휘·감독에서 벗어나 자유롭게 이용할 수 없으면 근로시간에 해당한다고 판단했습니다(대법원 2021. 7. 21. 선고 2021다225845 판결). [S14] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "현재는 안 됩니다. 4시간 근로 시 30분 이상의 휴게를 근로시간 도중에 주어야 합니다. 근로자가 명시적으로 요청하면 휴게를 생략할 수 있게 하는 단서가 신설됐지만 2026년 12월 10일부터 시행됩니다.", "judges": {"opus": {"ok": true, "quote": "현재 근로기준법상 사용자는 근로시간이 4시간인 경우 근로시간 도중에     by: "user", at: new Date().toISOString()};
  dec[c.key] = next;
  if (db) { try { await db.collection("kp_blind_v1").doc(c.key).set(next); notice(""); } catch { notice("저장하지 못했습니다. 다시 눌러 주세요."); } }
  else { try { localStorage.setItem("kp-blind-v1", JSON.stringify(dec)); } catch {} }
}
function go(d) { const n = idx + d; if (n >= 0 && n < list.length) { idx = n; render(); window.scrollTo({top: 0}); } }
async function decide(v) {
  const c = list[idx], first = !(dec[c.key] || {}).decision;
  const patch = {decision: v, note: document.getElementById("note").value};
  if (first) patch.revealed_before = true;  // judges are shown by default (user's choice, 2026-10-04): non-blind
  await save(patch);
  render();  // stay: the Opus·Codex verdicts appear for comparison, → moves on
}
document.getElementById("card").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.show) { shown.add(list[idx].key); render(); }
  else if (b.dataset.d) decide(b.dataset.d);
});
let nt; document.getElementById("card").addEventListener("input", e => {
  if (e.target.id !== "note") return; clearTimeout(nt); nt = setTimeout(() => save({note: e.target.value}), 800);
});
document.getElementById("prev").addEventListener("click", () => go(-1));
document.getElementById("next").addEventListener("click", () => go(1));
document.getElementById("filter").addEventListener("change", () => { applyFilter(); render(); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "1") decide("yes"); else if (e.key === "2") decide("no"); else if (e.key === "3") decide("relax");
});
let startKey = null;
try { const s = JSON.parse(localStorage.getItem("kp-blind-pos") || "{}"); startKey = s.k; if (s.f) document.getElementById("filter").value = s.f; } catch {}
if (location.hash === "#todo") document.getElementById("filter").value = "todo";
applyFilter(startKey); render();
let firstSnap = true;
(async () => {
  db = window.claude ? await window.claude.use("db") : null;
  if (!db) { try { Object.assign(dec, JSON.parse(localStorage.getItem("kp-blind-v1") || "{}")); } catch {} notice("판단이 이 브라우저에만 저장됩니다. claude.ai에서 열어 주세요."); render(); return; }
  db.collection("kp_blind_v1").onSnapshot(snap => {
    let ch = false;
    for (const x of snap.docChanges()) { const v = x.doc.data() || {}; if (!dec[x.doc.id] || dec[x.doc.id].at !== v.at) { dec[x.doc.id] = v; ch = true; } }
    if (firstSnap && document.getElementById("filter").value === "todo") { applyFilter(); firstSnap = false; render(); return; }
    firstSnap = false;
    if (ch && document.activeElement?.id !== "note") render();
  }, () => notice("저장소 연결이 끊겼습니다. 새로 고쳐 주세요."));
})();
</script>
