<title>정답 포인트 일치 판정 검토</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky progress bar → one card per key point (question, key point, answer; no judge verdicts) → decision bar */
:root {
  --bg: #f6f7f5; --panel: #ffffff; --line: #dde1dc; --fg: #1d2420; --muted: #5d6862; --accent: #2f5d50; --accent-soft: #e3ece8;
  --ok: #2e7d4f; --ok-soft: #e2f1e7; --bad: #b3372e; --bad-soft: #f7e3e0; --warn: #9a6a12; --warn-soft: #f6ecd6; --mark: #fbe9a7;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141917; --panel: #1b2220; --line: #2e3834; --fg: #e4ebe7; --muted: #a2aea8; --accent: #8cc4b2; --accent-soft: #243631;
  --ok: #6fcf95; --ok-soft: #1d3326; --bad: #f08a80; --bad-soft: #3b2220; --warn: #e2b55a; --warn-soft: #3a3020; --mark: #5a4a17; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141917; --panel: #1b2220; --line: #2e3834; --fg: #e4ebe7; --muted: #a2aea8; --accent: #8cc4b2; --accent-soft: #243631;
  --ok: #6fcf95; --ok-soft: #1d3326; --bad: #f08a80; --bad-soft: #3b2220; --warn: #e2b55a; --warn-soft: #3a3020; --mark: #5a4a17; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.6 }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; display: grid; gap: 14px }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center }
h1 { font-size: 17px; margin: 0; flex: 1 1 200px }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.prog { color: var(--muted); font-size: 13px }
select, button, textarea { font: inherit; color: var(--fg) }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px }
.nav { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 12px; cursor: pointer }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.intro { color: var(--muted); font-size: 13px; margin: 6px 0 0 }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0 }
.head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted) }
.pill { font-size: 12px; border-radius: 4px; padding: 1px 8px; font-weight: 500; background: var(--warn-soft); color: var(--warn) }
.q { font-size: 15px; font-weight: 500 }
.kps { display: grid; gap: 4px; padding: 0; margin: 0; list-style: none; font-size: 13px }
.kps li { color: var(--muted); padding: 4px 8px; border-radius: 6px }
.kps li.on { color: var(--fg); background: var(--accent-soft); font-weight: 600; font-size: 14px }
.note { background: var(--warn-soft); border-radius: 6px; padding: 8px 12px; font-size: 13px }
.judges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
.judge { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; min-width: 0 }
.judge b { font-size: 13px } .v { font-weight: 700 } .v.ok { color: var(--ok) } .v.bad { color: var(--bad) }
.judge .quote { font-size: 12.5px; border-left: 2px solid var(--line); padding-left: 8px; color: var(--muted) }
.judge .reason { font-size: 12.5px }
.runs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted) }
.runs button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12px }
.runs button[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent) }
.answer { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-size: 13.5px; max-height: 360px; overflow: auto }
mark { background: var(--mark); color: inherit; border-radius: 2px }
details.ref summary { cursor: pointer; color: var(--muted); font-size: 13px } details.ref p { font-size: 13px; margin: 6px 0 0 }
.decide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.decide button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 8px; cursor: pointer; text-align: left; display: grid; gap: 2px }
.decide button small { color: var(--muted); font-size: 12px }
.decide button[data-d="yes"][aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok) }
.decide button[data-d="no"][aria-pressed="true"] { background: var(--bad-soft); border-color: var(--bad) }
.decide button[data-d="relax"][aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn) }
textarea { width: 100%; min-height: 56px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel); resize: vertical }
.status { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap }
#notice { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 6px 10px; font-size: 13px }
@media (max-width: 720px) { .judges, .decide { grid-template-columns: 1fr } }
</style>

<script>
const DATA = {"items": [{"key": "n28-kp2", "id": "n28", "level": "L3", "question": "직원이 400명인 회사에서 확정급여형 퇴직연금을 운용하고 있습니다. 적립금운용위원회는 몇 명으로 꾸려야 하고, 위원장은 누가 맡아야 하나요?", "kp_index": 2, "all_kps": ["상시 300명 이상 사용 사업의 사용자는 적립금운용위원회를 구성해야 함", "위원회는 위원장 1명 포함 5명 이상 7명 이하로 구성", "위원장은 해당 사업에서 퇴직연금업무를 담당하는 임원이 맡음"], "answer": "상시 300명 이상의 근로자를 사용하는 사업의 사용자는 적립금운용위원회를 구성해야 합니다. 직원이 400명인 회사는 이에 해당합니다. [S2]\n\n적립금운용위원회는 위원장 1명을 포함하여 **5명 이상 7명 이하**로 구성해야 합니다. [S1]\n\n위원장은 해당 사업에서 **퇴직연금업무를 담당하는 임원**이 맡아야 합니다. [S1]", "reference": "퇴직급여법 제18조의2제1항에 따라 상시 300명 이상을 사용하는 사업의 사용자는 적립금운용위원회를 구성해야 하므로 400명 규모 회사는 의무 대상입니다. 시행령 제9조의2에 따라 위원회는 위원장 1명을 포함해 5명 이상 7명 이하로 구성하고, 위원장은 퇴직연금업무를 담당하는 임원이 맡으며, 회의는 연 1회 이상 열어야 합니다.", "judges": {"opus": {"ok": true, "quote": "적립금운용위원회는 위원장 1명을 포함하여 **5명 이상 7명 이하**로 구성해야 합니다.", "reason": "위원장 1명 포함 5명 이상 7명 이하라는 구성 인원을 정확히 명시함."}, "codex": {"ok": true, "quote": "적립금운용위원회는 위원장 1명을 포함하여 **5명 이상 7명 이하**로 구성해야 합니다.", "reason": "위원장 1명을 포함한 위원 수가 5명 이상 7명 이하임을 명시했습니다."}}}, {"key": "n25-kp2", "id": "n25", "level": "L3", "question": "하청업체 직원인데 하청 사장이 월급을 못 줬습니다. 원청이 공사대금을 제때 안 줘서 그렇다는데, 원청에도 임금 책임을 물을 수 있나요? 어떤 경우에 원청 책임이 인정되나요?", "kp_index": 2, "all_kps": ["직상 수급인(원청)의 귀책사유로 하수급인이 임금을 지급하지 못한 경우 직상 수급인이 하수급인과 연대책임을 짐", "귀책사유 범위(시행령): 정당한 사유 없이 도급계약상 지급일에 도급 금액을 지급하지 않은 경우", "그 밖에 원자재 공급 지연·미공급, 도급계약 조건 불이행으로 정상 수행이 불가능하게 된 경우도 포함"], "answer": "원칙적으로, 일반 도급사업에서는 하청업체가 원청 등 직상 수급인의 귀책사유로 임금을 지급하지 못한 경우 직상 수급인이 하청업체와 연대하여 임금 지급 책임을 집니다. 다만 직상 수급인의 귀책사유가 상위 수급인의 귀책사유로 발생했다면 상위 수급인도 연대책임을 질 수 있습니다. [S1]\n\n귀책사유는 다음과 같습니다. [S4]  \n- 정당한 사유 없이 도급계약상 공사대금 지급일에 도급대금을 지급하지 않은 경우 [S4]  \n- 정당한 사유 없이 원자재 공급을 늦추거나 공급하지 않은 경우 [S4]  \n- 정당한 사유 없이 도급계약 조건을 이행하지 않아 하청업체가 사업을 정상적으로 수행하지 못한 경우 [S4]\n\n따라서 원청이 공사대금을 정당한 사유 없이 지급기일에 지급하지 않았고, 그로 인해 하청업체가 직원에게 임금을 지급하지 못했다면, 원청이 하청업체의 직상 수급인인 경우 연대책임을 물을 수 있습니다. [S1] [S4]\n\n건설업에서 공사도급이 2차례 이상 이루어지고, 임금을 지급하지 않은 하청업체가 건설사업자가 아니라면, 직상 수급인은 자신의 귀책사유나 하청업체에 대한 대금 지급 여부와 관계없이 하청업체와 연대하여 해당 근로자의 임금을 지급할 책임을 집니다. [S2] [S11]\n\n다만 건설업에서 직상 수급인이 건설사업자가 아닌 경우에는 상위 수급인 중 최하위 건설사업자를 직상 수급인으로 봅니다. [S2] 대법원은 이 경우 직상 수급인이 하청업체에 대금을 지급했는지 또는 자신에게 직접적인 귀책사유가 있는지는 임금 지급 책임에 영향을 주지 않는다고 판단했습니다(대법원 2021. 7. 8. 선고 2020다296321 판결) [S11]\n\n또한 대법원은 건설업에서 직상 수급인의 형사책임은 그 직상 수급인이 된 이후 하청업체가 근로자에게 부담한 임금에 한정된다고 판단했습니다(대법원 2023. 12. 14. 선고 2023도8158 판결) [S12]\n\n건설공사에서는 일정한 경우 직상 수급인이 하청업체의 임금을 근로자에게 직접 지급해야 합니다. 예를 들어 직상 수급인과 하청업체가 직접 지급에 합의한 경우, 확정된 지급명령 등 집행권원이 있는 경우, 또는 하청업체가 임금채무를 알리고 직상 수급인이 파산 등으로 하청업체가 지급할 수 없는 명백한 사유를 인정한 경우입니다. [S3]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "근로기준법 제44조제1항에 따라 직상 수급인의 귀책사유로 하수급인이 임금을 지급하지 못하면 직상 수급인은 하수급인과 연대하여 임금 책임을 집니다. 그 귀책사유는 시행령 제24조가 정한 정당한 사유 없는 도급 금액 지급일 미지급, 원자재 공급 지연·미공급, 도급계약 조건 불이행의 세 가지이므로, 원청이 공사대금을 정당한 사유 없이 제때 주지 않았다면 원청에도 책임을 물을 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "정당한 사유 없이 도급계약상 공사대금 지급일에 도급대금을 지급하지 않은 경우 [S4]", "reason": "정당한 사유 없이 도급계약상 지급일에 도급 금액을 지급하지 않은 경우를 귀책사유로 명시해 정답 포인트와 일치한다."}, "codex": {"ok": true, "quote": "정당한 사유 없이 도급계약상 공사대금 지급일에 도급대금을 지급하지 않은 경우 [S4]", "reason": "정당한 사유 없이 계약상 지급일에 도급대금을 지급하지 않는 경우를 귀책사유로 명시했습니다."}}}, {"key": "g025-kp1", "id": "g025", "level": "L3", "question": "체불사업주 명단 공개 대상이 됐는데, 소명 기간 안에 밀린 임금을 다 주면 공개를 피할 수 있나요?", "kp_index": 1, "all_kps": ["명단 공개 시 체불사업주에게 3개월 이상의 소명 기회 부여", "소명 기간 종료 전까지 체불 임금등을 전액 지급하면 명단 공개 제외"], "answer": "네. 체불사업주가 소명 기간 종료 전까지 체불 임금등을 전액 지급하면 명단 공개 대상에서 제외됩니다. [S3]\n\n다만 고용노동부장관은 명단 공개 전에 체불사업주에게 3개월 이상의 소명 기간을 부여해야 합니다. [S1] 따라서 그 기간이 끝나기 전에 전액 지급해야 합니다. [S1][S3]\n\n명단 공개 대상에서 제외되면 성명·나이·상호·주소 및 명단 공개 기준일 이전 3년간의 체불액이 3년간 공개되는 절차를 피할 수 있습니다. [S2]\n\n참고로 명단 공개 여부는 임금체불정보심의위원회의 심의 대상입니다. [S1]", "reference": "네. 고용노동부장관은 3개월 이상의 소명 기간을 주어야 하고, 그 소명 기간 종료 전까지 체불 임금등을 전액 지급하면 명단 공개 대상에서 제외됩니다(근로기준법 제43조의2제2항, 시행령 제23조의2제2호).", "judges": {"opus": {"ok": true, "quote": "다만 고용노동부장관은 명단 공개 전에 체불사업주에게 3개월 이상의 소명 기간을 부여해야 합니다. [S1]", "reason": "명단 공개 전 체불사업주에게 3개월 이상의 소명 기간을 부여해야 한다고 명시해 정답 포인트와 의미가 같다."}, "codex": {"ok": true, "quote": "다만 고용노동부장관은 명단 공개 전에 체불사업주에게 3개월 이상의 소명 기간을 부여해야 합니다. [S1]", "reason": "명단 공개 전 체불사업주에게 3개월 이상의 소명 기회를 부여해야 한다고 명시했습니다."}}}, {"key": "g009-kp1", "id": "g009", "level": "L1", "question": "재난 등에 따른 연장이 없는 경우, 가족이 아파서 급하게 돌봐야 할 때 쓰는 가족돌봄휴가는 1년에 며칠까지 쓸 수 있나요?", "kp_index": 1, "all_kps": ["가족돌봄휴가는 연간 최장 10일", "일 단위로 사용 가능"], "answer": "재난 등에 따른 연장이 없는 경우 가족돌봄휴가는 **연간 최장 10일**까지 사용할 수 있습니다. 일 단위로 사용할 수 있으며, 가족돌봄휴가 기간은 가족돌봄휴직 기간에 포함됩니다. [S1]", "reference": "가족돌봄휴가는 연간 최장 10일이며 일 단위로 사용할 수 있고, 그 기간은 가족돌봄휴직 기간(연간 최장 90일)에 포함됩니다(남녀고용평등법 제22조의2제4항).", "judges": {"opus": {"ok": true, "quote": "재난 등에 따른 연장이 없는 경우 가족돌봄휴가는 **연간 최장 10일**까지 사용할 수 있습니다.", "reason": "답변이 가족돌봄휴가를 연간 최장 10일까지 쓸 수 있다고 명시적으로 단언하므로 정답 포인트와 일치한다."}, "codex": {"ok": true, "quote": "재난 등에 따른 연장이 없는 경우 가족돌봄휴가는 **연간 최장 10일**까지 사용할 수 있습니다.", "reason": "연장이 없는 경우 가족돌봄휴가가 연간 최장 10일임을 명시했습니다."}}}, {"key": "l5b07-kp1", "id": "l5b07", "level": "L5b", "question": "1년 계약직으로 입사해서 1년 뒤 한 번 재계약하고 딱 2년을 채운 뒤 계약 만료로 퇴사했습니다. 연차를 하나도 쓰지 않았는데, 미사용 연차수당은 최대 며칠분을 받을 수 있나요? 첫해 11일, 1년 지났을 때 15일, 2년 다 채웠을 때 또 15일이 생겨서 41일 아닌가요?", "kp_index": 1, "all_kps": ["1년간 80% 이상 출근 시 15일, 계속근로 1년 미만은 1개월 개근 시 1일의 유급휴가(근로기준법 제60조제1항·제2항)", "판례: 연차휴가는 전년도 1년간의 근로를 마친 다음 날 발생하므로 2년째 근로를 마치고 근로관계가 끝나면 15일이 추가로 발생하지 않음", "판례: 1년 초과 2년 이하 근로자의 최대 연차휴가일수는 11일 + 15일 = 총 26일(41일 아님)"], "answer": "근로기준법상 1년 미만 근로자는 1개월 개근 시 1일의 유급휴가를 받으므로 첫해에는 최대 11일이 발생합니다. 1년간 80% 이상 출근하면 15일의 유급휴가가 발생하고, 3년 이상 계속 근로한 경우에만 가산휴가가 적용됩니다. [S1]\n\n따라서 1년 계약 후 재계약하여 총 2년을 근무한 경우, 대법원은 최초 1년의 근로에 대해 제60조 제2항의 최대 11일과, 최초 1년을 마친 다음 날 제60조 제1항의 15일이 발생하여 최대 총 26일이라고 판단했습니다(대법원 2022. 9. 7. 선고 2022다245419 판결). [S14]\n\n2년째 근로를 마친 뒤에는 근로관계가 계약 만료로 종료되므로, 그 2년째 근로에 대한 15일은 원칙적으로 발생하지 않습니다. 대법원은 연차휴가 사용권 또는 연차휴가수당 청구권이 전년도 1년간의 근로를 마친 다음 날 발생하고, 그 전에 퇴직 등으로 근로관계가 종료되면 연차휴가수당을 청구할 수 없다고 판단했습니다(대법원 2021. 10. 14. 선고 2021다227100 판결). [S15]\n\n따라서 질문의 사실관계에서는 미사용 연차수당이 최대 **26일분**이며, **41일분은 아닙니다**. 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n참고로 현재 제60조는 시행 중이나, 2027년 6월 10일부터 일부 조항이 개정될 예정입니다(공포 2026년 6월 9일). [S1]", "reference": "41일이 아니라 최대 26일분입니다. 근로기준법 제60조제2항은 계속 근로기간이 1년 미만인 근로자에게 1개월 개근 시 1일의 유급휴가를, 제1항은 1년간 80퍼센트 이상 출근한 근로자에게 15일의 유급휴가를 주도록 정하지만, 연차휴가가 언제 발생하는지는 조문에 정함이 없습니다. 대법원은 연차수당 지급이 문제 된 사안에서, 연차휴가는 전년도 1년간의 근로에 대한 대가로서 전년도 1년간의 근로를 마친 다음 날 발생하므로, 1년을 초과하되 2년 이하의 기간 동안 근로한 근로자의 최대 연차휴가일수는 제60조제2항의 11일과 제1항의 15일을 합한 총 26일이라고 판단했습니다(대법원 2022. 9. 7. 선고 2022다245419 판결). 2년째 근로를 마친 날 근로관계가 끝났다면 두 번째 15일은 발생하지 않습니다. 다만 근로관계가 하루라도 더 유지되었는지 등 구체적 사실관계에 따라 결론이 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "근로기준법상 1년 미만 근로자는 1개월 개근 시 1일의 유급휴가를 받으므로 첫해에는 최대 11일이 발생합니다. 1년간 80% 이상 출근하면 15일의 유급휴가가 발생하고, 3년 이상 계속 근로한 경우에만 가산휴가가 적용됩니다.", "reason": "1년간 80% 이상 출근 시 15일과 1년 미만 근로자의 1개월 개근 시 1일을 모두 명시하고, 다음 문단에서 제60조 제1항·제2항도 언급합니다."}, "codex": {"ok": true, "quote": "근로기준법상 1년 미만 근로자는 1개월 개근 시 1일의 유급휴가를 받으므로 첫해에는 최대 11일이 발생합니다. 1년간 80% 이상 출근하면 15일의 유급휴가가 발생하고, 3년 이상 계속 근로한 경우에만 가산휴가가 적용됩니다. [S1]", "reason": "1년 미만 근로자의 1개월 개근 시 1일과 1년간 80% 이상 출근 시 15일이라는 조건 및 휴가일수를 모두 명시했습니다."}}}, {"key": "n26-kp2", "id": "n26", "level": "L3", "question": "파견업체에서 근로자를 받아 쓰려고 합니다. 파견계약을 맺을 때 우리 회사가 파견업체에 어떤 정보를 줘야 하고, 말로만 알려줘도 되나요?", "kp_index": 2, "all_kps": ["사용사업주는 파견계약 체결 시 사용사업주 사업에서 파견근로자와 같은 종류 또는 유사한 업무를 하는 근로자에 대한 정보를 제공해야 함", "제공 정보: 근로자 유무·수, 임금 및 구성항목, 업무 시작·종료 시각과 휴게, 휴일·휴가, 연장·야간·휴일근로, 안전·보건, 복리후생시설 이용 등", "정보는 서면으로 제공해야 함"], "answer": "사용사업주는 파견계약을 체결할 때 파견사업주에게 차별적 처우 방지에 필요한 정보를 제공해야 합니다. 제공 대상은 같은 종류 또는 유사한 업무를 수행하는 근로자에 관한 다음 정보입니다. [S1][S3]\n\n- 근로자 유무 및 근로자 수 [S3]\n- 임금 및 임금의 구성항목 [S3]\n- 업무 시작·종료 시각 및 휴게시간 [S3]\n- 휴일·휴가 [S3]\n- 연장·야간·휴일근로 [S3]\n- 안전·보건 [S3]\n- 복리후생시설 이용 [S3]\n- 위 항목에 포함되지 않는 차별적 처우 대상 근로조건 [S3]\n\n이 정보는 서면으로 제공해야 하므로 말로만 알려서는 안 됩니다. [S3] 또한 근로자파견계약 자체도 서면으로 체결해야 하며, 계약서에는 파견근로자의 수, 업무 내용, 근로 장소, 지휘·명령자, 파견기간, 근로시간, 휴일·휴가, 연장·야간·휴일근로, 안전·보건, 파견 대가 등의 사항을 포함해야 합니다. [S1]", "reference": "파견법 제20조제2항에 따라 사용사업주는 파견계약을 체결할 때 차별 금지 준수에 필요한 정보를 파견사업주에게 제공해야 하며, 시행령 제4조의2는 그 정보를 같은 종류 또는 유사한 업무를 하는 자사 근로자의 유무·수, 임금 및 구성항목, 근로시간·휴게, 휴일·휴가, 연장·야간·휴일근로, 안전·보건, 복리후생시설 이용 등으로 정합니다. 이 정보는 서면으로 제공해야 하므로 말로만 알려주는 것은 허용되지 않습니다.", "judges": {"opus": {"ok": true, "quote": "근로자 유무 및 근로자 수 [S3]\n- 임금 및 임금의 구성항목 [S3]\n- 업무 시작·종료 시각 및 휴게시간 [S3]\n- 휴일·휴가 [S3]\n- 연장·야간·휴일근로 [S3]\n- 안전·보건 [S3]\n- 복리후생시설 이용 [S3]", "reason": "정답 포인트의 제공 정보 항목(근로자 유무·수, 임금 및 구성항목, 시업·종업 시각과 휴게, 휴일·휴가, 연장·야간·휴일근로, 안전·보건, 복리후생시설 이용)이 모두 나열되어 있습니다."}, "codex": {"ok": true, "quote": "- 근로자 유무 및 근로자 수 [S3]\n- 임금 및 임금의 구성항목 [S3]\n- 업무 시작·종료 시각 및 휴게시간 [S3]\n- 휴일·휴가 [S3]\n- 연장·야간·휴일근로 [S3]\n- 안전·보건 [S3]\n- 복리후생시설 이용 [S3]", "reason": "정답 포인트에 제시된 제공 정보 항목을 모두 명시합니다."}}}, {"key": "l5b08-kp2", "id": "l5b08", "level": "L5b", "question": "시내버스 기사입니다. 단체협약에는 연차를 쓰려면 정해진 기한 전까지 신청하라고 되어 있는데, 개인 사정으로 그 기한을 넘겨 연차를 신청했더니 회사가 반려했습니다. 연차는 근로자가 원하는 날에 줘야 하는 것 아닌가요? 회사가 근로기준법을 위반한 건가요?", "kp_index": 2, "all_kps": ["연차휴가는 근로자가 청구한 시기에 주어야 하나, 사업 운영에 막대한 지장이 있으면 사용자가 시기를 변경할 수 있음(근로기준법 제60조제5항)", "판례: 노선버스처럼 정시성이 중요한 사업에서 근로자가 불가피한 사유 없이 단체협약상 휴가 청구 기한을 지키지 않으면, 사용자는 특별한 사정이 없는 한 적법하게 시기변경권을 행사할 수 있음", "판례: 제60조제5항 위반죄는 사용자가 적법한 시기변경권을 행사하지 않은 채 연차휴가를 방해한 경우에 성립함(적법한 시기변경이면 위반 아님)"], "answer": "근로자의 연차유급휴가권은 법정 요건을 충족하면 발생하지만, 사용자는 근로자가 청구한 시기에 휴가를 주는 것이 원칙이고 사업 운영에 막대한 지장이 있는 경우에는 그 시기를 변경할 수 있습니다. [S1]\n\n대법원은 노선 여객자동차운송사업처럼 운영의 정시성이 중요한 사업에서 단체협약이 연차 신청기한을 정하고 있는데도 근로자가 불가피한 사유 없이 그 기한을 지키지 않고 신청한 경우, 지정된 시기까지 대체근로자를 확보하기 어려워 사업 운영에 막대한 지장이 발생한다고 보아 사용자가 시기변경권을 행사할 수 있다고 판단했습니다(대법원 2025. 7. 17. 선고 2021도11886 판결). [S13]\n\n따라서 개인 사정이 불가피한 사유에 해당하지 않고, 단체협약상 신청기한을 넘긴 신청으로 대체근로자 확보 등 버스 운행에 막대한 지장이 발생하는 경우라면 회사의 반려가 곧바로 근로기준법 위반이라고 단정하기 어렵습니다. [S13]\n\n반대로 불가피한 사유가 있었거나 회사가 사업 운영에 막대한 지장이 있다는 사정 없이 연차 사용을 거부한 경우라면, 회사는 적법한 시기변경권을 행사한 것으로 보기 어려울 수 있습니다. [S1][S13]\n\n현재 관련 조문은 시행 중이나, 2027년 6월 10일부터 연차휴가 분할청구, 청구 시기 부여 및 불리한 처우 금지 등에 관한 개정 내용이 시행될 예정입니다. [S1] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "근로기준법 위반이 아닐 가능성이 큽니다. 근로기준법 제60조제5항은 연차 유급휴가를 근로자가 청구한 시기에 주도록 하면서, 청구한 시기에 휴가를 주는 것이 사업 운영에 막대한 지장이 있는 경우에는 사용자가 그 시기를 변경할 수 있다고 정하지만, 단체협약상 청구 기한을 넘긴 신청이 이에 해당하는지는 조문에 기준이 없습니다. 대법원은 시내버스 회사가 단체협약상 기한을 넘겨 지정한 연차를 반려한 사안에서, 제60조제5항 위반죄는 사용자가 적법한 시기변경권을 행사하지 않은 채 연차휴가를 방해한 경우에 성립하는데, 노선버스처럼 운영의 정시성이 중요한 사업에서 근로자가 불가피한 사유 없이 단체협약상 휴가 청구 기한을 지키지 않았다면 사용자는 특별한 사정이 없는 한 적법하게 시기변경권을 행사할 수 있다고 판단했습니다(대법원 2025. 7. 17. 선고 2021도11886 판결). 다만 기한을 넘긴 개인 사정이 불가피한 사유였는지 등 구체적 사실관계에 따라 결론이 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "대법원은 노선 여객자동차운송사업처럼 운영의 정시성이 중요한 사업에서 단체협약이 연차 신청기한을 정하고 있는데도 근로자가 불가피한 사유 없이 그 기한을 지키지 않고 신청한 경우, 지정된 시기까지 대체근로자를 확보하기 어려워 사업 운영에 막대한 지장이 발생한다고 보아 사용자가 시기변경권을 행사할 수 있다고 판단했습니다", "reason": "정시성이 중요한 노선버스 사업, 불가피한 사유 없는 기한 미준수, 사용자의 시기변경권 행사 가능이라는 판례 요지가 모두 담겨 있습니다."}, "codex": {"ok": true, "quote": "대법원은 노선 여객자동차운송사업처럼 운영의 정시성이 중요한 사업에서 단체협약이 연차 신청기한을 정하고 있는데도 근로자가 불가피한 사유 없이 그 기한을 지키지 않고 신청한 경우, 지정된 시기까지 대체근로자를 확보하기 어려워 사업 운영에 막대한 지장이 발생한다고 보아 사용자가 시기변경권을 행사할 수 있다고 판단했습니다(대법원 2025. 7. 17. 선고 2021도11886 판결).", "reason": "정시성이 중요한 노선버스 사업에서 불가피한 사유 없이 단체협약상 신청기한을 어긴 경우 사용자의 시기변경권 행사가 허용된다는 판례의 핵심 내용을 명시했습니다."}}}, {"key": "g032-kp2", "id": "g032", "level": "L4", "question": "하루 4시간 근무하는 직원이 30분 휴게 없이 바로 퇴근하고 싶다고 하면 휴게를 안 줘도 되나요?", "kp_index": 2, "all_kps": ["현행 제54조제1항: 근로시간 4시간이면 30분 이상 휴게를 근로시간 도중에 주어야 함", "근로자가 명시적으로 요청하면 4시간 근로의 휴게를 생략할 수 있는 단서가 신설됨", "그 단서는 2026-12-10 시행 예정으로 현재 미시행"], "answer": "현재 근로기준법상 사용자는 근로시간이 4시간인 경우 근로시간 도중에 30분 이상의 휴게시간을 주어야 합니다. 휴게시간은 근로자가 자유롭게 이용할 수 있어야 합니다. [S1]\n\n따라서 하루 4시간 근무자가 30분 휴게 없이 바로 퇴근하고 싶다고 하더라도, 현재 조문상 사용자가 휴게를 부여하지 않아도 된다고 볼 수 없습니다. [S1]\n\n다만 2026년 12월 10일부터는 근로시간이 4시간인 경우 근로자가 휴게시간을 이용하지 않을 것을 명시적으로 요청하면 휴게시간을 주지 않을 수 있도록 개정될 예정입니다. [S1]\n\n대법원은 근로계약상 휴식시간이라도 사용자의 지휘·감독에서 벗어나 자유롭게 이용할 수 없으면 근로시간에 해당한다고 판단했습니다(대법원 2021. 7. 21. 선고 2021다225845 판결). [S14] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "현재는 안 됩니다. 4시간 근로 시 30분 이상의 휴게를 근로시간 도중에 주어야 합니다. 근로자가 명시적으로 요청하면 휴게를 생략할 수 있게 하는 단서가 신설됐지만 2026년 12월 10일부터 시행됩니다.", "judges": {"opus": {"ok": true, "quote": "다만 2026년 12월 10일부터는 근로시간이 4시간인 경우 근로자가 휴게시간을 이용하지 않을 것을 명시적으로 요청하면 휴게시간을 주지 않을 수 있도록 개정될 예정입니다.", "reason": "근로자가 명시적으로 요청하면 4시간 근로의 휴게를 생략할 수 있도록 개정된다는 단서 내용을 명시합니다."}, "codex": {"ok": true, "quote": "다만 2026년 12월 10일부터는 근로시간이 4시간인 경우 근로자가 휴게시간을 이용하지 않을 것을 명시적으로 요청하면 휴게시간을 주지 않을 수 있도록 개정될 예정입니다. [S1]", "reason": "4시간 근로자가 명시적으로 요청하면 휴게를 생략할 수 있다는 개정 내용을 명시했습니다."}}}, {"key": "g017-kp2", "id": "g017", "level": "L2", "question": "휴직 시작 30일 전에 육아휴직 신청서를 냈는데 회사가 2주가 지나도록 아무 답이 없어요. 어떻게 되나요?", "kp_index": 2, "all_kps": ["사업주는 신청일부터 14일 이내에 허용 사실을 서면 또는 전자적 방식으로 알려야 함", "기간 내 알리지 않으면 신청한 대로 육아휴직을 허용한 것으로 봄"], "answer": "육아휴직 신청서를 휴직개시예정일 30일 전까지 제출했다면, 사업주는 신청일부터 14일 이내에 육아휴직을 허용한 사실을 서면 또는 전자적 방식으로 알려야 합니다. [S1]\n\n사업주가 그 기간 안에 허용 사실을 알리지 않으면, 근로자가 신청한 대로 육아휴직을 허용한 것으로 봅니다. [S1]\n\n따라서 신청일부터 14일이 지났는데 회사의 서면 또는 전자적 통지가 없다면, 신청서에 적은 내용대로 육아휴직이 허용된 것으로 봅니다. [S1]", "reference": "30일 전 기한을 지켜 신청했다면 사업주는 신청일부터 14일 이내에 허용 사실을 알려야 하고, 이 기간 안에 알리지 않으면 신청한 대로 육아휴직을 허용한 것으로 봅니다(남녀고용평등법 시행령 제11조제5항·제6항).", "judges": {"opus": {"ok": true, "quote": "사업주가 그 기간 안에 허용 사실을 알리지 않으면, 근로자가 신청한 대로 육아휴직을 허용한 것으로 봅니다.", "reason": "기간 내 통지가 없으면 신청한 대로 허용한 것으로 본다는 간주 효과를 명시적으로 단언함."}, "codex": {"ok": true, "quote": "사업주가 그 기간 안에 허용 사실을 알리지 않으면, 근로자가 신청한 대로 육아휴직을 허용한 것으로 봅니다.", "reason": "기간 내 통지하지 않으면 근로자가 신청한 대로 육아휴직을 허용한 것으로 본다고 명시했습니다."}}}, {"key": "s04-kp5", "id": "s04", "level": "SUM", "question": "육아휴직 제도의 주요 내용을 요약해 주세요.", "kp_index": 5, "all_kps": ["만 8세 이하 또는 초등학교 2학년 이하 자녀 양육을 위해 신청 가능", "기간은 1년 이내(요건 충족 시 6개월 추가)", "육아휴직을 이유로 한 불리한 처우 금지, 휴직 기간 중 해고 금지", "휴직 후 같은 업무 또는 같은 수준의 임금을 지급하는 직무로 복귀", "3회에 한정하여 나누어 사용 가능"], "answer": "- 사업주는 임신 중인 여성 근로자의 모성 보호, 유산·조산 등 위험이 있는 임신 중인 배우자를 돌보려는 남성 근로자, 또는 만 8세 이하·초등학교 2학년 이하 자녀를 양육하려는 근로자의 육아휴직 신청을 허용해야 합니다. 다만 휴직개시예정일 전날까지 계속 근로기간이 6개월 미만인 근로자가 신청한 경우에는 적용되지 않습니다. [S1][S6]\n- 육아휴직 기간은 원칙적으로 1년 이내이며, 부모가 같은 자녀에 대해 각각 3개월 이상 사용한 경우의 부 또는 모, 한부모, 고용노동부령상 장애아동의 부모는 6개월 이내에서 추가 사용할 수 있습니다. [S1][S12]\n- 육아휴직은 3회까지 나누어 사용할 수 있으며, 임신 중 모성 보호나 위험이 있는 임신 중 배우자 돌봄을 위한 휴직 및 법 제19조제6항에 따른 1주·2주 육아휴직은 분할 사용 횟수에 포함되지 않습니다. [S4]\n- 자녀가 다니는 기관의 휴업·휴교·휴원, 방학, 질병·사고에 따른 입원, 감염병 관련 격리·등교 중지 등의 사유가 있으면 1년에 1회, 1주 또는 2주 단위의 육아휴직을 사용할 수 있고, 이 기간은 통상 육아휴직 기간에 포함됩니다. [S1][S2]\n- 방학기간에 신청이 집중되어 사업 운영에 막대한 지장이 있으면 사업주는 근로자와 협의하여 사용 시기를 변경할 수 있으며, 시기변경 사유와 변경 기간을 서면으로 알려야 합니다. [S1]\n- 육아휴직 신청은 원칙적으로 휴직개시예정일 30일 전까지 해야 하고, 유산·조산·사산 위험, 임신 중 배우자 돌봄, 조산 전 출생, 배우자의 사망·질병 등 특별한 사유가 있으면 7일 전까지 신청할 수 있습니다. 법 제19조제6항의 긴급한 사유인 기관의 휴업·휴교·휴원, 자녀의 입원, 감염병 관련 조치의 경우에는 휴직개시예정일까지 신청할 수 있습니다. [S2][S3]\n- 사업주는 신청을 허용한 사실을 원칙적으로 신청일부터 14일 이내, 특별한 사유에 따른 신청은 3일 이내, 긴급 신청은 지체 없이 서면 또는 전자적 방식으로 알려야 합니다. 정해진 기간 내 알리지 않으면 신청한 대로 허용한 것으로 봅니다. [S3]\n- 사업주는 육아휴직을 이유로 해고나 불리한 처우를 해서는 안 되며, 육아휴직 기간에는 원칙적으로 해고할 수 없습니다. 육아휴직 후에는 휴직 전과 같은 업무 또는 같은 수준의 임금을 지급하는 직무로 복귀시켜야 하고, 육아휴직 기간은 근속기간에 포함됩니다. [S1]\n- 신청자는 휴직개시예정일 7일 전까지 신청을 철회할 수 있으며, 긴급 신청의 경우에는 휴직개시예정일 전날까지 철회할 수 있습니다. [S5]\n- 육아휴직 중 자녀의 사망 등 법정 사유가 발생하면 근로자는 7일 이내에 사업주에게 알려야", "reference": "만 8세 이하 또는 초등학교 2학년 이하 자녀를 양육하기 위해 신청할 수 있고, 기간은 1년 이내이며 부모 각 3개월 이상 사용·한부모 등 요건을 갖추면 6개월을 추가할 수 있습니다. 육아휴직을 이유로 불리한 처우를 할 수 없고 휴직 기간에는 해고하지 못하며, 마친 뒤에는 같은 업무 또는 같은 수준의 임금을 지급하는 직무로 복귀시켜야 합니다. 3회에 한정하여 나누어 쓸 수 있습니다(남녀고용평등법 제19조, 제19조의4).", "judges": {"opus": {"ok": true, "quote": "육아휴직은 3회까지 나누어 사용할 수 있으며", "reason": "3회 한도의 분할 사용을 명시해 정답 포인트와 같은 의미이다."}, "codex": {"ok": true, "quote": "육아휴직은 3회까지 나누어 사용할 수 있으며, 임신 중 모성 보호나 위험이 있는 임신 중 배우자 돌봄을 위한 휴직 및 법 제19조제6항에 따른 1주·2주 육아휴직은 분할 사용 횟수에 포함되지 않습니다.", "reason": "육아휴직을 3회까지 나누어 사용할 수 있다고 명시합니다."}}}, {"key": "n18-kp1", "id": "n18", "level": "L4", "question": "근로감독관이 회사에 와서 장부와 서류를 내라고 하면 응해야 하나요? 근로기준법의 근로감독관 권한 조항이 없어진다던데 지금은 어떤가요?", "kp_index": 1, "all_kps": ["현행 근로기준법상 근로감독관은 사업장 현장조사, 장부·서류 제출 요구, 사용자·근로자 심문 권한이 있음", "해당 조문 삭제 개정(2026.4.7 공포)은 2026-12-08 시행 예정으로 2026-10-01 현재는 현행 조문이 유효함"], "answer": "현재 근로감독관은 사업장에 현장조사를 하고 장부·서류의 제출을 요구하거나 사용자와 근로자를 심문할 수 있습니다. [S2]\n\n따라서 근로감독관이 적법하게 장부와 서류의 제출을 요구하면 이에 응해야 합니다. 사용자는 근로감독관의 요구가 있으면 필요한 사항을 지체 없이 보고하거나 출석해야 합니다. [S2][S7]\n\n현장조사 때 근로감독관은 신분증명서와 고용노동부장관의 현장조사 지령서를 제시해야 하며, 지령서에는 조사 일시·장소·범위가 적혀 있어야 합니다. [S2]\n\n근로감독관은 노동 관계 법령 위반의 죄에 관하여 사법경찰관의 직무도 수행합니다. [S2] 대법원은 근로감독관이 특별사법경찰관으로서 수사하는 경우에는 원칙적으로 형사소송법 등에 따른 수사절차라고 판단했습니다(대법원 2022. 1. 13. 선고 2015도6326 판결) [S15] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n근로기준법 제102조는 현재 시행 중이므로 근로감독관의 장부·서류 제출 요구 권한이 지금 없어지는 것은 아닙니다. 다만 2026년 12월 8일부터 제102조가 삭제될 예정입니다. [S2]\n\n또한 2026년 10월 2일부터 제105조가 개정되어, 노동 관계 법령에 따른 현장조사·서류 제출·심문 등의 수사는 근로감독관이 전담하게 될 예정입니다. [S3] 기준일인 2026년 10월 1일 현재는 아직 시행 전입니다. [S3]", "reference": "2026년 10월 1일 현재 근로기준법 제102조제1항에 따라 근로감독관은 사업장 등을 현장조사하고 장부와 서류의 제출을 요구하며 사용자와 근로자를 심문할 수 있으므로 회사는 이에 응해야 합니다. 제102조를 삭제하는 개정(2026.4.7 공포)은 2026년 12월 8일 시행 예정이어서 아직 효력이 없습니다.", "judges": {"opus": {"ok": true, "quote": "현재 근로감독관은 사업장에 현장조사를 하고 장부·서류의 제출을 요구하거나 사용자와 근로자를 심문할 수 있습니다.", "reason": "답변이 현행법상 현장조사, 장부·서류 제출 요구, 사용자·근로자 심문 권한을 모두 명시적으로 단언함."}, "codex": {"ok": true, "quote": "현재 근로감독관은 사업장에 현장조사를 하고 장부·서류의 제출을 요구하거나 사용자와 근로자를 심문할 수 있습니다. [S2]", "reason": "현장조사, 장부·서류 제출 요구, 사용자·근로자 심문 권한을 모두 명시했습니다."}}}, {"key": "l5b03-kp2", "id": "l5b03", "level": "L5b", "question": "의원과 '위탁진료계약'을 맺고 2년간 봉직의로 일했습니다. 주중과 토요일 대부분을 그 의원에서 진료했고, 진료 실적과 상관없이 매달 고정된 금액을 받았으며 매달 진료 현황을 보고했습니다. 계약서가 위탁계약이라 퇴직금이 없다고 하는데, 저도 퇴직금을 받을 수 있나요?", "kp_index": 2, "all_kps": ["퇴직금 대상 근로자는 직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람임(근로기준법 제2조제1항제1호, 퇴직급여법 제2조제1호)", "판례: 근로자 여부는 계약 형식보다 실질에 비추어 임금을 목적으로 종속적 관계에서 근로를 제공했는지로 판단함", "판례: 위탁진료계약 형식이라도 정해진 시간·장소 근무, 실적 무관 고정 보수, 진료 현황 보고 등이 있으면 근로기준법상 근로자(퇴직금 지급 대상)에 해당함"], "answer": "계약서의 명칭이 ‘위탁진료계약’인지보다, 실질적으로 임금을 목적으로 종속적인 관계에서 근로를 제공했는지가 근로자 해당 여부의 기준입니다. [S14]\n\n질문하신 사정처럼 ① 주중과 토요일 대부분 의원에서 근무하고, ② 진료 실적과 관계없이 매월 고정된 금액을 받으며, ③ 매월 진료 현황을 보고했다면, 근무시간·근무장소에 대한 관리와 업무에 대한 지휘·감독, 근로 자체의 대가인 고정 보수 등이 인정될 가능성이 있습니다. [S14]\n\n대법원은 이와 유사하게 위탁진료계약을 체결한 의사가 정해진 시간과 장소에서 진료하고 매월 고정 보수를 받으며 진료 현황을 보고한 사안에서, 계약 형식과 관계없이 근로기준법상 근로자에 해당한다고 판단했습니다(대법원 2023. 9. 21. 선고 2021도11675 판결). [S14]\n\n근로자에 해당한다면 사용자는 계속근로기간 1년에 대하여 30일분 이상의 평균임금을 퇴직금으로 지급하는 제도를 설정해야 하므로, 2년간 근무한 경우 퇴직금 청구 대상이 될 수 있습니다. [S3]\n\n따라서 계약서에 퇴직금이 없다는 이유만으로 퇴직금 지급이 배제된다고 단정할 수 없습니다. [S14][S3]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "받을 수 있을 가능성이 큽니다. 퇴직금을 받는 '근로자'는 근로기준법 제2조제1항제1호에 따라 '직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람'이고, 근로자퇴직급여 보장법도 이 정의를 따릅니다(제2조제1호). 위탁진료계약을 맺은 의사가 이 근로자에 해당하는지는 조문에 판단 기준이 없습니다. 대법원은 의원과 위탁진료계약을 맺고 진료한 의사의 퇴직금이 문제 된 사안에서, 근로자 여부는 계약 형식보다 실질에 비추어 임금을 목적으로 종속적인 관계에서 근로를 제공했는지로 판단해야 한다고 하면서, 계약 형식이 위탁진료계약이더라도 주중과 토요일 대부분을 그 의원에서 근무하고 진료 현황을 보고했으며 실적과 관계없이 고정 보수를 받았다면 근로기준법상 근로자에 해당한다고 판단했습니다(대법원 2023. 9. 21. 선고 2021도11675 판결). 근로자라면 사용자는 퇴직일부터 14일 이내에 퇴직금을 지급해야 합니다(근로자퇴직급여 보장법 제9조제1항). 다만 근로자성은 구체적 근무 실태에 따라 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "계약서의 명칭이 ‘위탁진료계약’인지보다, 실질적으로 임금을 목적으로 종속적인 관계에서 근로를 제공했는지가 근로자 해당 여부의 기준입니다.", "reason": "계약 형식보다 실질적으로 임금 목적의 종속적 근로 제공 여부로 판단한다는 기준을 명시했습니다."}, "codex": {"ok": true, "quote": "계약서의 명칭이 ‘위탁진료계약’인지보다, 실질적으로 임금을 목적으로 종속적인 관계에서 근로를 제공했는지가 근로자 해당 여부의 기준입니다. [S14]", "reason": "계약 형식보다 실질적인 임금 목적과 종속적 근로 제공 여부로 근로자성을 판단한다고 명시했습니다."}}}, {"key": "s06-kp2", "id": "s06", "level": "SUM", "question": "근로자파견은 어떤 업무에 얼마 동안 쓸 수 있는지, 이를 어기면 회사가 어떤 의무를 지는지 요약해 주세요.", "kp_index": 2, "all_kps": ["제조업의 직접생산공정업무를 제외하고 대통령령으로 정하는 업무를 대상으로 함", "출산·질병·부상 등으로 결원이 생기거나 일시적·간헐적으로 인력이 필요한 경우에는 대상 업무 외에도 파견 가능", "건설공사현장 업무, 선원 업무, 유해·위험 업무 등은 파견 금지", "파견기간은 1년 이내이며 3자 합의로 연장하더라도 총 2년을 초과할 수 없음", "대상 외 업무·금지 업무 사용이나 2년 초과 계속 사용 등 위반 시 사용사업주는 파견근로자를 직접 고용해야 함"], "answer": "- **대상 업무:** 제조업의 직접생산공정업무를 제외하고, 전문지식·기술·경험 또는 업무 성질 등을 고려해 적합하다고 판단되어 대통령령으로 정한 업무에 사용할 수 있습니다. 대통령령상 대상 업무는 별표 1의 업무입니다. [S2][S11]  \n- **예외적 사용:** 출산·질병·부상 등으로 결원이 생긴 경우 또는 일시적·간헐적으로 인력을 확보할 필요가 있는 경우에도 사용할 수 있습니다. 다만 사용사업주는 사전에 노동조합 또는 근로자 과반수 대표자와 성실하게 협의해야 합니다. [S2]  \n- **사용 금지 업무:** 건설공사현장 업무, 일부 하역업무, 선원의 업무, 유해·위험한 업무 및 대통령령으로 정한 업무에는 파견근로자를 사용할 수 없습니다. 대통령령상 금지 업무에는 분진작업, 건강관리카드 발급대상 업무, 의료인·간호조무사·의료기사 업무, 여객자동차·화물자동차 운전업무 등이 포함됩니다. [S2][S11]  \n- **파견기간:** 일반적인 파견은 1년을 초과할 수 없습니다. 파견사업주·사용사업주·파견근로자 간 합의가 있으면 1회에 한해 1년 이내로 연장할 수 있지만, 총 파견기간은 2년을 초과할 수 없습니다. 다만 고령자인 파견근로자는 2년을 초과하여 연장할 수 있습니다. [S1]  \n- **예외적 파견기간:** 출산·질병·부상 등 객관적으로 명백한 사유가 있는 경우에는 그 사유가 없어지는 데 필요한 기간까지 사용할 수 있습니다. 일시적·간헐적 인력 확보의 경우에는 3개월 이내이며, 사유가 없어지지 않고 3자 간 합의가 있으면 3개월 범위에서 한 차례 연장할 수 있습니다. [S1]  \n- **위반 시 직접고용의무:** 사용사업주가 대상 업무가 아닌 업무에 사용하거나, 금지 업무에 사용하거나, 합의에 따른 총 파견기간 2년을 초과하여 계속 사용하거나, 예외적 파견에 관한 협의를 하지 않은 경우 등에는 해당 파견근로자를 직접 고용해야 합니다. [S4]  \n- **직접고용 시 근로조건:** 같은 종류 또는 유사한 업무를 하는 사용사업주 근로자가 있으면 그 근로자에게 적용되는 취업규칙 등의 근로조건을 적용하고, 그런 근로자가 없으면 기존 근로조건 수준보다 낮아져서는 안 됩니다. [S4]  \n- **제재:** 직접고용의무를 이행하지 않으면 3천만원 이하의 과태료가 부과될 수 있습니다. 파견기간 제한 등을 위반하여 파견사업을 하거나 파견 역무를 제공받은 경우에는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처할 수 있습니다. [S5][S9]  \n- **대법원 판단:** 대법원은 계약 명칭이나 형식보다 제3자의 구속력 있는 지휘·명령, 사업에의 실질적 편입, 원고용주의 독자적 인사·근로관리 권한, 업무의 구별성과 전문성, 독립적 조직·설비 등을 종합해 근로자파견 여부를 판단해야 한다고 보았습니다(대법원 ", "reference": "근로자파견은 제조업의 직접생산공정업무를 제외하고 대통령령으로 정하는 업무를 대상으로 하며, 출산·질병·부상 등으로 결원이 생기거나 일시적·간헐적으로 인력이 필요한 경우에는 예외적으로 허용됩니다. 다만 건설공사현장 업무, 선원 업무, 유해·위험 업무 등은 파견할 수 없습니다(제5조). 파견기간은 1년을 넘을 수 없고, 3자 합의로 연장하더라도 총 2년을 넘을 수 없습니다(제6조). 대상이 아닌 업무나 금지 업무에 파견근로자를 쓰거나 2년을 넘겨 계속 사용하는 등 위반이 있으면 사용사업주는 그 파견근로자를 직접 고용해야 합니다(제6조의2).", "judges": {"opus": {"ok": true, "quote": "출산·질병·부상 등으로 결원이 생긴 경우 또는 일시적·간헐적으로 인력을 확보할 필요가 있는 경우에도 사용할 수 있습니다.", "reason": "결원 발생이나 일시적·간헐적 인력 필요 시 대상 업무 외에도 파견할 수 있다는 예외를 명시하고 있습니다."}, "codex": {"ok": true, "quote": "- **예외적 사용:** 출산·질병·부상 등으로 결원이 생긴 경우 또는 일시적·간헐적으로 인력을 확보할 필요가 있는 경우에도 사용할 수 있습니다.", "reason": "결원 발생 또는 일시적·간헐적 인력 필요 시의 파견을 대상 업무에 대한 예외적 사용으로 명시했습니다."}}}, {"key": "n28-kp1", "id": "n28", "level": "L3", "question": "직원이 400명인 회사에서 확정급여형 퇴직연금을 운용하고 있습니다. 적립금운용위원회는 몇 명으로 꾸려야 하고, 위원장은 누가 맡아야 하나요?", "kp_index": 1, "all_kps": ["상시 300명 이상 사용 사업의 사용자는 적립금운용위원회를 구성해야 함", "위원회는 위원장 1명 포함 5명 이상 7명 이하로 구성", "위원장은 해당 사업에서 퇴직연금업무를 담당하는 임원이 맡음"], "answer": "상시 300명 이상의 근로자를 사용하는 사업의 사용자는 적립금운용위원회를 구성해야 합니다. [S2]\n\n위원회는 위원장 1명을 포함하여 **5명 이상 7명 이하**로 구성해야 합니다. [S1]\n\n위원장은 해당 사업에서 **퇴직연금업무를 담당하는 임원**이 맡아야 합니다. [S1]", "reference": "퇴직급여법 제18조의2제1항에 따라 상시 300명 이상을 사용하는 사업의 사용자는 적립금운용위원회를 구성해야 하므로 400명 규모 회사는 의무 대상입니다. 시행령 제9조의2에 따라 위원회는 위원장 1명을 포함해 5명 이상 7명 이하로 구성하고, 위원장은 퇴직연금업무를 담당하는 임원이 맡으며, 회의는 연 1회 이상 열어야 합니다.", "judges": {"opus": {"ok": true, "quote": "상시 300명 이상의 근로자를 사용하는 사업의 사용자는 적립금운용위원회를 구성해야 합니다.", "reason": "적용 대상(상시 300명 이상)과 구성 의무 주체(사용자)가 정답 포인트와 일치함."}, "codex": {"ok": true, "quote": "상시 300명 이상의 근로자를 사용하는 사업의 사용자는 적립금운용위원회를 구성해야 합니다. [S2]", "reason": "상시 300명 이상 근로자를 사용하는 사업의 사용자에게 위원회 구성 의무가 있음을 명시했습니다."}}}, {"key": "g037-kp1", "id": "g037", "level": "L4", "question": "직장 내 성희롱 예방교육은 법인 대표나 상급자도 의무적으로 들어야 하나요?", "kp_index": 1, "all_kps": ["현행 제13조제2항은 사업주 및 근로자가 성희롱 예방 교육을 받아야 한다고 규정", "법인의 대표자·상급자를 수강 의무자로 명시하는 개정이 공포됨", "그 개정은 2026-11-27 시행 예정"], "answer": "네. 현재 시행 중인 조문에 따르면 사업주와 근로자는 직장 내 성희롱 예방교육을 받아야 합니다. [S1]\n\n따라서 법인의 대표자가 사업주에 해당하거나 근로자인 경우에는 교육 대상입니다. 다만, 2026년 11월 27일부터는 법인 대표자와 상급자도 명시적으로 교육 대상에 포함됩니다. [S1]\n\n교육은 연 1회 이상 실시해야 하며, 법령, 성희롱 발생 시 처리 절차와 조치 기준, 피해 근로자의 상담·구제 절차 등을 포함해야 합니다. [S2]\n\n2026년 11월 27일 시행 예정인 개정 내용은 공포일인 2026년 5월 26일에 따라 시행됩니다. [S1]", "reference": "현행 조문은 사업주와 근로자에게 수강 의무를 두고 있습니다. 법인의 대표자와 상급자를 명시하는 개정이 공포됐으며 2026년 11월 27일부터 시행됩니다.", "judges": {"opus": {"ok": true, "quote": "네. 현재 시행 중인 조문에 따르면 사업주와 근로자는 직장 내 성희롱 예방교육을 받아야 합니다. [S1]", "reason": "현행 조문상 사업주와 근로자가 교육을 받아야 한다는 핵심 내용은 단언했으나, 조문 번호(제13조제2항)는 명시하지 않았습니다."}, "codex": {"ok": true, "quote": "현재 시행 중인 조문에 따르면 사업주와 근로자는 직장 내 성희롱 예방교육을 받아야 합니다.", "reason": "조문 번호는 없지만 현행 규정상 사업주와 근로자의 교육 수강 의무를 명시합니다."}}}, {"key": "g025-kp2", "id": "g025", "level": "L3", "question": "체불사업주 명단 공개 대상이 됐는데, 소명 기간 안에 밀린 임금을 다 주면 공개를 피할 수 있나요?", "kp_index": 2, "all_kps": ["명단 공개 시 체불사업주에게 3개월 이상의 소명 기회 부여", "소명 기간 종료 전까지 체불 임금등을 전액 지급하면 명단 공개 제외"], "answer": "네. 체불사업주가 소명 기간 종료 전까지 체불 임금등을 전액 지급하면 명단 공개 대상에서 제외됩니다. [S3]\n\n다만 명단 공개 전에는 고용노동부장관이 체불사업주에게 3개월 이상의 소명 기간을 부여해야 합니다. [S1]\n\n명단 공개 대상에서 제외되더라도, 근로자가 퇴직한 경우 사용자는 원칙적으로 지급 사유 발생일부터 14일 이내에 임금 등 금품을 지급해야 하며, 특별한 사정이 있으면 당사자 합의로 지급기일을 연장할 수 있습니다. [S13]", "reference": "네. 고용노동부장관은 3개월 이상의 소명 기간을 주어야 하고, 그 소명 기간 종료 전까지 체불 임금등을 전액 지급하면 명단 공개 대상에서 제외됩니다(근로기준법 제43조의2제2항, 시행령 제23조의2제2호).", "judges": {"opus": {"ok": true, "quote": "네. 체불사업주가 소명 기간 종료 전까지 체불 임금등을 전액 지급하면 명단 공개 대상에서 제외됩니다. [S3]", "reason": "소명 기간 종료 전 전액 지급 시 명단 공개 대상에서 제외된다는 조건과 효과를 모두 명시했다."}, "codex": {"ok": true, "quote": "체불사업주가 소명 기간 종료 전까지 체불 임금등을 전액 지급하면 명단 공개 대상에서 제외됩니다. [S3]", "reason": "소명 기간 종료 전 체불 임금등을 전액 지급하면 명단 공개 대상에서 제외된다고 명시했습니다."}}}, {"key": "l5a06-kp1", "id": "l5a06", "level": "L5a", "question": "저는 회사 노사협의회 근로자위원입니다. 사측 위원인 의장이 '논의할 안건이 없다'며 1년 가까이 정기회의를 한 번도 열지 않았습니다. 안건이 없으면 정기회의를 열지 않아도 되는 건가요?", "kp_index": 1, "all_kps": ["노사협의회는 3개월마다 정기적으로 회의를 개최해야 함(근로자참여법 제12조 제1항)", "구체적 안건이 있는지와 관계없이 정기회의 개최 의무가 있음", "정기회의를 개최하지 않으면 벌칙 대상(제32조)"], "answer": "안건이 없어도 정기회의를 열어야 합니다. 노사협의회는 3개월마다 정기적으로 회의를 개최해야 하며, 임시회의는 필요에 따라 개최할 수 있습니다. [S1]\n\n대법원은 구체적인 협의·의결 안건의 존재 여부와 관계없이 노사협의회가 3개월마다 정기회의를 개최해야 하고, 사용자는 정기회의에서 경영계획·실적, 분기별 생산계획·실적, 인력계획, 기업의 경제적·재정적 상황을 성실하게 보고하거나 설명해야 한다고 판단했습니다(대법원 2025. 5. 1. 선고 2025도2059 판결). [S11]\n\n따라서 의장이 ‘논의할 안건이 없다’는 이유로 1년 가까이 정기회의를 개최하지 않은 것은 제12조제1항 위반에 해당할 수 있습니다. 사용자가 정기회의를 정기적으로 개최하지 않으면 200만원 이하의 벌금에 처해질 수 있습니다. [S3]\n\n노사 일방의 대표자가 회의 목적을 문서로 밝혀 소집을 요구하면 의장은 그 요구에 따라야 하며, 의장은 원칙적으로 회의 개최 7일 전에 회의 일시·장소·의제 등을 각 위원에게 통보해야 합니다. [S2]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "아닙니다. 근로자참여 및 협력증진에 관한 법률 제12조제1항에 따라 노사협의회는 3개월마다 정기적으로 회의를 열어야 하며, 논의할 안건이 있는지와 관계없이 이 의무가 있습니다. 정기회의를 개최하지 않으면 제32조에 따른 벌칙 대상입니다.", "judges": {"opus": {"ok": true, "quote": "노사협의회는 3개월마다 정기적으로 회의를 개최해야 하며, 임시회의는 필요에 따라 개최할 수 있습니다.", "reason": "답변이 3개월마다 정기회의를 개최해야 한다고 명시하고, 뒤에서 제12조제1항 위반도 언급합니다."}, "codex": {"ok": true, "quote": "노사협의회는 3개월마다 정기적으로 회의를 개최해야 하며, 임시회의는 필요에 따라 개최할 수 있습니다.", "reason": "노사협의회의 3개월마다 정기회의 개최 의무를 명시했습니다."}}}, {"key": "s08-kp2", "id": "s08", "level": "SUM", "question": "근로시간, 연장근로, 휴게시간, 주휴일에 관한 근로기준법의 기본 원칙을 요약해 주세요.", "kp_index": 2, "all_kps": ["근로시간은 휴게시간을 제외하고 1주 40시간, 1일 8시간을 초과할 수 없음", "당사자 간 합의하면 1주 12시간을 한도로 연장근로 가능", "근로시간 4시간이면 30분 이상, 8시간이면 1시간 이상의 휴게시간을 근로시간 도중에 부여", "휴게시간은 근로자가 자유롭게 이용할 수 있음", "1주에 평균 1회 이상의 유급휴일 보장"], "answer": "- **근로시간**: 휴게시간을 제외한 1주 근로시간은 40시간, 1일 근로시간은 8시간을 초과할 수 없습니다. 사용자의 지휘·감독 아래 대기하는 시간 등은 근로시간으로 봅니다. [S1]  \n- **연장근로**: 당사자 간 합의가 있으면 1주 12시간을 한도로 제50조의 근로시간을 연장할 수 있습니다. 다만 3개월 이내 또는 3개월 초과 6개월 이내의 탄력적 근로시간제 등 법정 요건을 갖춘 경우에는 별도 기준이 적용됩니다. [S3] [S6] [S7]  \n- **연장근로수당**: 연장근로에 대해서는 통상임금의 50% 이상을 가산하여 지급해야 합니다. 야간근로는 오후 10시부터 다음 날 오전 6시까지의 근로이며, 이에 대해서도 통상임금의 50% 이상을 가산해야 합니다. [S2]  \n- **휴게시간**: 사용자는 근로시간이 4시간인 경우 30분 이상, 8시간인 경우 1시간 이상의 휴게시간을 근로시간 도중에 주어야 하며, 휴게시간은 근로자가 자유롭게 이용할 수 있습니다. 이 조항은 2026년 12월 10일부터, 4시간 근로의 경우 근로자가 휴게시간을 이용하지 않겠다고 명시적으로 요청하면 예외를 두는 내용으로 개정될 예정입니다. [S8]  \n- **주휴일**: 사용자는 근로자에게 1주에 평균 1회 이상의 유급휴일을 보장해야 합니다. 대통령령으로 정하는 휴일도 유급으로 보장해야 하지만, 근로자대표와 서면으로 합의하면 특정 근로일로 대체할 수 있습니다. [S9]  \n- **특례**: 육상운송·수상운송·항공운송·기타 운송 관련 서비스업 및 보건업은 근로자대표와 서면 합의가 있으면 주 12시간을 초과하여 연장근로를 하게 하거나 휴게시간을 변경할 수 있습니다. 이 경우 근로일 종료 후 다음 근로일 개시 전까지 연속 11시간 이상의 휴식시간을 주어야 합니다. [S4]  \n\n대법원은 1주 연장근로 12시간 초과 여부를 판단할 때 1일 8시간 초과 여부와 관계없이 1주간 근로시간 중 40시간을 초과하는 시간을 기준으로 판단하고, 1일 8시간을 초과하여 연장근로를 하는 경우에도 휴게시간을 부여해야 한다고 판단했습니다(대법원 2023. 12. 7. 선고 2020도15393 판결) [S14] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "근로시간은 휴게시간을 제외하고 1주 40시간, 1일 8시간을 넘을 수 없습니다(제50조). 당사자 간에 합의하면 1주 12시간을 한도로 연장근로를 할 수 있습니다(제53조제1항). 근로시간이 4시간이면 30분 이상, 8시간이면 1시간 이상의 휴게시간을 근로시간 도중에 주어야 하고, 휴게시간은 근로자가 자유롭게 이용할 수 있습니다(제54조). 사용자는 1주에 평균 1회 이상의 유급휴일을 보장해야 합니다(제55조제1항).", "judges": {"opus": {"ok": true, "quote": "당사자 간 합의가 있으면 1주 12시간을 한도로 제50조의 근로시간을 연장할 수 있습니다.", "reason": "당사자 간 합의를 조건으로 1주 12시간 한도의 연장근로가 가능하다는 내용이 일치함."}, "codex": {"ok": true, "quote": "당사자 간 합의가 있으면 1주 12시간을 한도로 제50조의 근로시간을 연장할 수 있습니다.", "reason": "당사자 간 합의 조건과 주 12시간 한도의 연장근로 가능 여부를 명시했습니다."}}}, {"key": "n20-kp1", "id": "n20", "level": "L4", "question": "회사가 임금채권보장법을 위반하고 있는 것 같은데, 근로자가 누구에게 신고해서 시정을 요구할 수 있나요? 담당이 노동감독관으로 바뀐다고 하던데요.", "kp_index": 1, "all_kps": ["현행 임금채권보장법상 근로자는 위반 사실을 근로감독관에게 신고하여 시정 조치를 요구할 수 있음", "신고 대상을 노동감독관으로 바꾸는 개정은 2026-12-08 시행 예정으로 2026-10-01 현재 미시행"], "answer": "근로자는 사업주가 임금채권보장법 또는 그에 따른 명령을 위반한 사실이 있으면 근로감독관에게 신고하여 시정을 위한 조치를 요구할 수 있습니다. [S1]\n\n현재 조문은 ‘근로감독관’이라고 규정하고 있으며, 2026년 12월 8일부터는 ‘노동감독관’으로 개정될 예정입니다. [S1]\n\n따라서 기준일인 2026년 10월 1일에는 근로감독관에게 신고하면 되고, 2026년 12월 8일부터는 노동감독관에게 신고하게 됩니다. [S1]\n\n임금채권보장법 위반과 관련하여 대지급금의 부정수급 사실을 신고하려는 경우에는 지방고용노동관서에 신고해야 하며, 신고자는 대통령령으로 정하는 기준에 따라 포상금을 받을 수 있습니다. [S3] [S6]\n\n또한 근로자는 임금채권보장법 위반 사실을 통보했다는 이유로 해고나 그 밖의 불리한 처우를 받아서는 안 됩니다. 다만 이 보호 규정은 근로기준법 위반 사실을 통보한 경우에 관한 규정입니다. [S2]", "reference": "2026년 10월 1일 현재 임금채권보장법 제25조에 따라 근로자는 사업주의 위반 사실을 근로감독관에게 신고하여 시정 조치를 요구할 수 있습니다. 신고 상대를 노동감독관으로 바꾸는 개정(2026.4.7 공포)은 2026년 12월 8일부터 시행됩니다.", "judges": {"opus": {"ok": true, "quote": "근로자는 사업주가 임금채권보장법 또는 그에 따른 명령을 위반한 사실이 있으면 근로감독관에게 신고하여 시정을 위한 조치를 요구할 수 있습니다.", "reason": "현행법상 근로감독관에게 신고하여 시정 조치를 요구할 수 있다는 내용을 명시적으로 단언함."}, "codex": {"ok": true, "quote": "근로자는 사업주가 임금채권보장법 또는 그에 따른 명령을 위반한 사실이 있으면 근로감독관에게 신고하여 시정을 위한 조치를 요구할 수 있습니다.", "reason": "근로자가 임금채권보장법 위반 사실을 근로감독관에게 신고하여 시정 조치를 요구할 수 있다고 명시했습니다."}}}, {"key": "l5a02-kp1", "id": "l5a02", "level": "L5a", "question": "2024년에 월급제로 입사해 5개월째 일하고 있습니다. 사장님이 오늘 갑자기 내일부터 나오지 말라고 했는데, 미리 말해준 것도 없고 따로 돈을 준다는 얘기도 없습니다. 입사 6개월이 안 된 월급제 직원은 해고예고를 안 해도 된다고 하던데, 저는 받을 수 있는 게 없나요?", "kp_index": 1, "all_kps": ["해고하려면 적어도 30일 전에 예고해야 하고, 예고하지 않았으면 30일분 이상의 통상임금(해고예고수당)을 지급해야 함(근로기준법 제26조)", "현행 예외는 계속 근로기간 3개월 미만 등 제26조 단서 각 호뿐이며 '6개월 미만 월급근로자' 예외는 없음", "근속 5개월 월급근로자는 해고예고 또는 30일분 통상임금 지급 대상"], "answer": "입사 후 계속 근로한 기간이 3개월 이상이므로, 사용자는 해고일 30일 전에 예고하거나 30일분 이상의 통상임금을 지급해야 합니다. 3개월 미만인 경우에만 해고예고 의무의 예외가 됩니다. [S1]\n\n따라서 5개월째 근무 중이라는 이유만으로 해고예고를 하지 않아도 되는 것은 아닙니다. 다만 천재·사변 등으로 사업을 계속할 수 없거나, 근로자가 고의로 사업에 막대한 지장을 초래하거나 재산상 손해를 끼친 경우에는 예외가 될 수 있습니다. [S1] 근로자의 귀책사유에 관한 구체적인 사유는 근로기준법 시행규칙 제4조가 별표 1에 따른다고 정하고 있으나, 별표 1의 내용은 제공된 근거에 없습니다. [S3]\n\n또한 사용자는 정당한 이유 없이 해고할 수 없고, 해고하려면 해고사유와 해고시기를 서면으로 통지해야 하며, 서면 통지가 없으면 해고는 효력이 없습니다. [S2] [S4]\n\n해고가 부당하다고 판단되면 해고일로부터 3개월 이내에 노동위원회에 구제를 신청할 수 있습니다. [S7] 노동위원회가 부당해고라고 판정하면 구제명령을 하며, 원직복직을 원하지 않는 경우 해고기간에 받을 수 있었던 임금 상당액 이상의 금품 지급을 명할 수 있습니다. [S8]", "reference": "받을 수 있습니다. 근로기준법 제26조에 따라 사용자는 해고 30일 전에 예고하거나, 예고하지 않았다면 30일분 이상의 통상임금(해고예고수당)을 지급해야 합니다. 현행 예외는 계속 근로기간 3개월 미만 등 제26조 단서 각 호뿐이고 '6개월 미만 월급근로자' 예외는 없으므로, 근속 5개월이면 해고예고수당 지급 대상입니다.", "judges": {"opus": {"ok": true, "quote": "사용자는 해고일 30일 전에 예고하거나 30일분 이상의 통상임금을 지급해야 합니다.", "reason": "30일 전 예고 의무와 미예고 시 30일분 이상 통상임금 지급 의무를 명시적으로 단언하고 있음(조문 번호는 [S1] 인용으로 대체됨)."}, "codex": {"ok": true, "quote": "입사 후 계속 근로한 기간이 3개월 이상이므로, 사용자는 해고일 30일 전에 예고하거나 30일분 이상의 통상임금을 지급해야 합니다.", "reason": "30일 전 해고예고 또는 30일분 이상의 통상임금 지급 의무를 명시했습니다."}}}, {"key": "g018-kp1", "id": "g018", "level": "L2", "question": "체불 사업주 정보가 신용정보기관에 넘어가는 기준이 뭔가요?", "kp_index": 1, "all_kps": ["제공일 이전 3년 이내 임금등 체불로 2회 이상 유죄 확정", "제공일 이전 1년 이내 체불총액 2천만원 이상", "또는 제43조의4의 상습체불사업주"], "answer": "신용정보기관에 체불사업주 정보가 제공되는 기준은 다음과 같습니다.\n\n1. **일반 체불사업주**  \n고용노동부장관은 다음 요건을 모두 충족한 체불사업주의 인적사항과 체불액 등을 종합신용정보집중기관에 제공할 수 있습니다.  \n- 자료 제공일 이전 3년 이내 임금 등을 체불하여 **2회 이상 유죄가 확정**되었을 것  \n- 자료 제공일 이전 1년 이내 체불총액이 **2천만 원 이상**일 것[S1]\n\n2. **상습체불사업주**  \n상습체불사업주로 정해진 경우에도 자료 제공 대상이 될 수 있습니다. 상습체불사업주는 다음 중 하나에 해당하는 사업주입니다.  \n- 직전 연도 1년간 근로자에게 임금 등을 **3개월분 이상 체불**한 경우  \n- 직전 연도 1년간 임금 등을 **5회 이상 체불**하고 체불총액이 **3천만 원 이상**인 경우[S3]\n\n상습체불사업주로 정할 때에는 임금체불정보심의위원회의 심의를 거치고, 해당 사업주에게 **3개월 이상의 소명 기회**를 주어야 합니다.[S3]\n\n다만, 사망·실종선고, 회생절차개시 결정 또는 파산선고, 도산등사실인정 등의 사유가 있으면 자료를 제공하지 않을 수 있습니다.[S4] 또한 일반 체불사업주가 자료 제공 전까지 체불 임금 등을 전액 지급한 경우에도 제공 제외 대상이 됩니다.[S4]\n\n제공된 자료는 체불사업주의 **신용도·신용거래능력 판단과 관련한 업무 외의 목적으로 이용하거나 누설할 수 없습니다**.[S1] 상습체불사업주 관련 자료의 제공기간은 자료 제공일부터 **1년**입니다.[S8]", "reference": "임금등 체불자료 제공일 이전 3년 이내 2회 이상 유죄가 확정되고 1년 이내 체불총액이 2천만원 이상인 체불사업주, 또는 상습체불사업주의 자료를 종합신용정보집중기관 요구 시 제공할 수 있습니다(근로기준법 제43조의3제1항).", "judges": {"opus": {"ok": true, "quote": "자료 제공일 이전 3년 이내 임금 등을 체불하여 **2회 이상 유죄가 확정**되었을 것", "reason": "기간(제공일 이전 3년 이내)과 요건(2회 이상 유죄 확정)이 정답 포인트와 같습니다."}, "codex": {"ok": true, "quote": "- 자료 제공일 이전 3년 이내 임금 등을 체불하여 **2회 이상 유죄가 확정**되었을 것", "reason": "제공일 이전 3년 이내 임금등 체불로 2회 이상 유죄가 확정되어야 한다는 요건을 명시했습니다."}}}, {"key": "n25-kp1", "id": "n25", "level": "L3", "question": "하청업체 직원인데 하청 사장이 월급을 못 줬습니다. 원청이 공사대금을 제때 안 줘서 그렇다는데, 원청에도 임금 책임을 물을 수 있나요? 어떤 경우에 원청 책임이 인정되나요?", "kp_index": 1, "all_kps": ["직상 수급인(원청)의 귀책사유로 하수급인이 임금을 지급하지 못한 경우 직상 수급인이 하수급인과 연대책임을 짐", "귀책사유 범위(시행령): 정당한 사유 없이 도급계약상 지급일에 도급 금액을 지급하지 않은 경우", "그 밖에 원자재 공급 지연·미공급, 도급계약 조건 불이행으로 정상 수행이 불가능하게 된 경우도 포함"], "answer": "원청의 책임은 공사 형태와 원청의 귀책사유에 따라 달라집니다.\n\n1. **일반적인 도급사업**에서는 하청업체가 원청 등 직상 수급인의 귀책사유로 임금을 지급하지 못한 경우, 직상 수급인이 하청업체와 연대하여 임금 지급 책임을 집니다. [S1]  \n   원청의 귀책사유에는 정당한 사유 없이 도급계약상 공사대금을 지급일에 지급하지 않은 경우, 원자재 공급을 지연하거나 하지 않은 경우, 도급계약 조건을 이행하지 않아 하청업체가 사업을 정상적으로 수행하지 못한 경우가 포함됩니다. [S4]  \n   따라서 원청이 정당한 사유 없이 공사대금을 제때 지급하지 않아 하청업체가 임금을 지급하지 못했다면, 원청의 연대책임이 인정될 수 있습니다. [S1][S4]\n\n2. **건설업에서 공사도급이 2차례 이상 이루어진 경우**에는 별도 규정이 적용됩니다. 건설사업자가 아닌 하청업체가 근로자에게 해당 건설공사에서 발생한 임금을 지급하지 못하면, 직상 수급인은 하청업체와 연대하여 임금을 지급할 책임을 집니다. [S2]  \n   이 경우 직상 수급인이 건설사업자가 아니면, 상위 수급인 중 최하위 건설사업자를 직상 수급인으로 봅니다. [S2]\n\n대법원은 건설업에서 2차례 이상 도급이 이루어지고 건설사업자가 아닌 하청업체가 임금을 지급하지 못한 경우, 직상 수급인은 자신의 귀책사유가 있는지 또는 하청업체에 공사대금을 지급했는지와 관계없이 연대하여 임금을 지급할 책임이 있다고 판단했습니다(대법원 2021. 7. 8. 선고 2020다296321 판결). [S11]  \n다만 이 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n또한 대법원은 직상 수급인이 된 이후 하청업체가 근로자에게 부담하게 된 임금에 대해서만 해당 처벌조항상 책임을 부담하고, 직상 수급인이 되기 전에 이미 발생한 임금 미지급까지 형사책임을 지는 것은 아니라고 판단했습니다(대법원 2023. 12. 14. 선고 2023도8158 판결). [S12]  \n다만 이 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n건설업의 경우, 일정한 요건이 있으면 직상 수급인이 하청업체에 지급할 하도급대금 범위에서 근로자에게 임금을 직접 지급해야 할 수도 있습니다. 예를 들어 원청과 하청업체가 임금 직접 지급에 합의한 경우, 확정된 지급명령 등 집행권원이 있는 경우, 또는 하청업체가 임금채무를 알리고 원청이 하청업체의 파산 등으로 지급할 수 없는 명백한 사유를 인정한 경우입니다. [S3]  \n따라서 질문의 경우에는 ① 건설업인지, ② 도급이 2차례 이상인지, ③ 하청업체가 건설사업자인지, ④ 원청이 직상 수급인인지, ⑤ 임금이 해당 공사에서 발생한 것인지, ⑥ 원청의 공사", "reference": "근로기준법 제44조제1항에 따라 직상 수급인의 귀책사유로 하수급인이 임금을 지급하지 못하면 직상 수급인은 하수급인과 연대하여 임금 책임을 집니다. 그 귀책사유는 시행령 제24조가 정한 정당한 사유 없는 도급 금액 지급일 미지급, 원자재 공급 지연·미공급, 도급계약 조건 불이행의 세 가지이므로, 원청이 공사대금을 정당한 사유 없이 제때 주지 않았다면 원청에도 책임을 물을 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "일반적인 도급사업에서는 하청업체가 원청 등 직상 수급인의 귀책사유로 임금을 지급하지 못한 경우, 직상 수급인이 하청업체와 연대하여 임금 지급 책임을 집니다.", "reason": "직상 수급인의 귀책사유로 하수급인이 임금을 못 준 경우 연대책임을 진다고 명시해 정답 포인트와 의미가 같다."}, "codex": {"ok": true, "quote": "**일반적인 도급사업**에서는 하청업체가 원청 등 직상 수급인의 귀책사유로 임금을 지급하지 못한 경우, 직상 수급인이 하청업체와 연대하여 임금 지급 책임을 집니다.", "reason": "직상 수급인의 귀책사유로 인한 임금 미지급 시 하청업체와의 연대책임을 명시했습니다."}}}, {"key": "n29-kp3", "id": "n29", "level": "L3", "question": "1년 계약으로 뽑은 신입 직원이 수습 기간 중입니다. 수습 기간에는 최저임금보다 적게 줘도 되나요? 얼마까지 깎을 수 있나요?", "kp_index": 3, "all_kps": ["1년 이상 기간으로 근로계약을 체결한 수습 근로자로서 수습 시작일부터 3개월 이내인 사람만 감액 대상", "감액 수준(시행령): 시간급 최저임금액에서 100분의 10을 뺀 금액", "단순노무업무로 고용노동부장관이 고시한 직종 종사자는 감액 대상에서 제외"], "answer": "가능합니다. 다만 다음 요건을 모두 충족해야 합니다.\n\n- 근로계약 기간이 **1년 이상**이어야 합니다. [S2]\n- 수습을 시작한 날부터 **3개월 이내**인 근로자여야 합니다. [S2]\n- 단순노무업무로 고용노동부장관이 정하여 고시한 직종에 종사하는 근로자는 제외됩니다. [S2]\n\n위 요건을 충족하면 수습 시작일부터 3개월 이내에는 해당 시간급 최저임금에서 **10%를 뺀 금액**, 즉 최저임금의 **90% 이상**을 지급할 수 있습니다. [S1]\n\n따라서 1년 계약이라는 사실만으로 항상 감액할 수 있는 것은 아니며, 위 요건을 충족해야 합니다. [S1][S2]\n\n최저임금보다 적은 금액으로 정한 근로계약 부분은 무효이고, 그 부분은 최저임금액과 동일한 임금을 지급하기로 한 것으로 봅니다. [S3]\n\n참고로 수습기간 중이라도 사용자는 적용되는 최저임금액 이상의 임금을 지급해야 하며, 최저임금을 이유로 종전 임금수준을 낮출 수 없습니다. [S3]", "reference": "최저임금법 제5조제2항에 따라 1년 이상의 기간을 정해 근로계약을 맺은 수습 근로자로서 수습 시작일부터 3개월 이내인 사람에게는 다른 최저임금액을 정할 수 있고, 시행령 제3조는 그 금액을 시간급 최저임금액에서 100분의 10을 뺀 금액으로 정합니다. 다만 단순노무업무로 고용노동부장관이 고시한 직종에 종사하는 근로자는 감액할 수 없습니다.", "judges": {"opus": {"ok": true, "quote": "- 단순노무업무로 고용노동부장관이 정하여 고시한 직종에 종사하는 근로자는 제외됩니다. [S2]", "reason": "고용노동부장관이 고시한 단순노무업무 직종 종사자를 감액 대상에서 제외한다고 명시했다."}, "codex": {"ok": true, "quote": "- 단순노무업무로 고용노동부장관이 정하여 고시한 직종에 종사하는 근로자는 제외됩니다. [S2]", "reason": "고용노동부장관이 고시한 단순노무업무 직종 종사자를 감액 대상에서 제외한다고 명시했습니다."}}}, {"key": "l5b01-kp1", "id": "l5b01", "level": "L5b", "question": "저희 회사는 두 달마다 기본급의 100%를 정기상여금으로 주는데, '지급일에 재직 중인 사람에게만 준다'는 조건이 붙어 있습니다. 회사는 이 조건 때문에 상여금이 통상임금이 아니어서 올해 연장근로수당 계산에서 빠진다고 합니다. 맞나요?", "kp_index": 1, "all_kps": ["통상임금은 근로자에게 정기적이고 일률적으로 소정근로 또는 총 근로에 대하여 지급하기로 정한 금액임(근로기준법 시행령 제6조제1항)", "판례: 특정 시점 재직 조건이 붙었다는 사정만으로 통상임금성이 부정되지 않음", "판례: 새 법리는 2024. 12. 19. 이후 제공한 연장근로 등의 법정수당 산정부터 적용됨(올해 연장근로수당에 적용)"], "answer": "아닙니다. 통상임금은 소정근로의 대가로 정기적·일률적으로 지급하기로 정한 임금입니다. [S1]\n\n대법원은 지급일 현재 재직 중이어야 한다는 조건만으로 통상임금성이 부정되지는 않는다고 판단했습니다. [S11] 따라서 두 달마다 기본급의 100%를 정기적으로 지급하는 상여금이 소정근로의 대가이고 정기적·일률적으로 지급된다면, 재직조건이 있다는 이유만으로 통상임금에서 제외할 수 없습니다. [S1][S11]\n\n통상임금에 해당하는 상여금은 연장근로수당 산정에 포함되어야 하며, 연장근로에 대해서는 통상임금의 50% 이상을 가산해야 합니다. [S2]\n\n다만 해당 상여금이 실제로 소정근로의 대가인지, 정기적·일률적으로 지급되는지는 구체적인 지급 규정과 지급 실태에 따라 판단해야 합니다. 대법원은 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "회사 주장은 맞지 않을 가능성이 큽니다. 근로기준법 시행령 제6조제1항은 통상임금을 '근로자에게 정기적이고 일률적으로 소정근로 또는 총 근로에 대하여 지급하기로 정한' 금액으로 정의하고, 연장근로에는 통상임금의 100분의 50 이상을 가산해야 합니다(근로기준법 제56조제1항). 다만 '지급일 재직자에게만 준다'는 조건이 붙은 상여금이 이 정의에 해당하는지는 조문에 기준이 없습니다. 대법원은 정기상여금 등의 통상임금성이 문제 된 사안에서, 특정 시점에 재직 중이어야 한다는 조건이 부가되어 있다는 사정만으로 그 임금의 통상임금성이 부정되지 않으며, 이 새로운 법리는 2024. 12. 19. 이후 제공한 연장근로 등에 대한 법정수당 산정부터 적용된다고 판단했습니다(대법원 2024. 12. 19. 선고 2020다247190 전원합의체 판결). 따라서 올해 연장근로수당 계산에는 두 달마다 지급되는 정기상여금이 통상임금으로 포함될 수 있습니다. 다만 판례의 결론은 상여금의 실제 지급 조건 등 구체적 사실관계에 따라 달라질 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "통상임금은 소정근로의 대가로 정기적·일률적으로 지급하기로 정한 임금입니다.", "reason": "정기성·일률성과 소정근로에 대한 지급이라는 핵심 정의를 단언하므로 true로 보되, '또는 총 근로' 부분과 근로기준법 시행령 제6조제1항 근거는 빠져 있음."}, "codex": {"ok": true, "quote": "통상임금은 소정근로의 대가로 정기적·일률적으로 지급하기로 정한 임금입니다.", "reason": "소정근로의 대가로 정기적이고 일률적으로 지급하기로 정한 임금이라는 정의를 명시했습니다."}}}, {"key": "n06-kp3", "id": "n06", "level": "L3", "question": "우리 공장 생산라인 직원이 출산휴가에 들어가 그 자리를 파견근로자로 채우려고 합니다. 제조업 생산공정에는 파견을 쓸 수 없다고 들었는데 가능한가요? 가능하다면 파견기간은 얼마나 되나요?", "kp_index": 3, "all_kps": ["원칙적으로 제조업의 직접생산공정업무는 파견 대상이 아니지만, 출산·질병·부상 등으로 결원이 생긴 경우에는 파견 가능함", "결원 대체 파견의 기간은 해당 사유가 없어지는 데 필요한 기간임", "사용사업주는 과반수 노조 또는 근로자 과반수 대표와 사전에 성실하게 협의해야 함"], "answer": "제조업의 직접생산공정업무에는 원칙적으로 근로자파견을 할 수 없습니다. [S1]\n\n다만 출산으로 결원이 생긴 경우에는 예외적으로 근로자파견을 할 수 있습니다. 따라서 생산라인 직원의 출산전후휴가로 결원이 발생한 경우에는 해당 결원을 메우기 위한 파견이 가능합니다. 연간 임금총액의 12분의 1에 DC형 설정 비율을 곱한 금액 이상으로 정할 수 있습니다. [S1]\n\n다만 DB형 설정 비율과 DC형 설정 비율의 합이 1 이상이 되도록 퇴직연금규약을 정해야 합니다. [S1]\n\n따라서 DC형에 설정 비율을 100% 미만으로 배분하면 DC형 부담금은 연간 임금총액의 12분의 1 전액이 아니라 그 비율에 해당하는 금액이 됩니다. [S1] 예를 들어 DC형 설정 비율이 40%라면 DC형 부담금은 연간 임금총액의 12분의 1에 40%를 곱한 금액입니다. [S1]\n\n이와 같은 혼합형 퇴직연금규약은 근로자대표의 동의 또는 의견을 거쳐 신고해야 합니다. [S11]", "reference": "확정기여형만 설정한 경우에는 연간 임금총액의 12분의 1 이상을 납입해야 하지만(근로자퇴직급여 보장법 제20조제1항), 확정급여형과 함께 설정하면 제6조제1항에 따라 DC 부담금은 그 부담 수준에 확정기여형퇴직연금규약으로 정한 설정 비율을 곱한 금액이 됩니다. 다만 DB와 DC 설정 비율의 합은 1 이상이 되도록 퇴직연금규약을 정해야 합니다(제6조제2항).", "judges": {"opus": {"ok": true, "quote": "DB형과 DC형을 함께 설정하는 경우, DC형 부담금은 연간 임금총액의 12분의 1에 DC형 설정 비율을 곱한 금액 이상으로 정할 수 있습니다.", "reason": "제20조제1항이라는 조문 번호는 없지만, 그 부담 수준인 연간 임금총액의 12분의 1에 규약상 설정 비율을 곱한 금액이라는 핵심 내용이 같다."}, "codex": {"ok": true, "quote": "DB형과 DC형을 함께 설정하는 경우, DC형 부담금은 연간 임금총액의 12분의 1에 DC형 설정 비율을 곱한 금액 이상으로 정할 수 있습니다. [S1]\n\n다만 DB형 설정 비율과 DC형 설정 비율의 합이 1 이상이 되도록 퇴직연금규약을 정해야 합니다. [S1]", "reason": "혼합 설정 시 법정 부담 수준에 규약상 DC형 설정 비율을 곱하여 부담금을 정한다는 내용을 담고 있습니다."}}}, {"key": "g023-kp2", "id": "g023", "level": "L3", "question": "재직 중인데 월급이 정기 지급일에 안 들어왔어요. 지연이자를 받을 수 있나요? 이율은 얼마인가요?", "kp_index": 2, "all_kps": ["제43조에 따라 지급해야 하는 임금(재직 중 임금)도 지연이자 대상이며, 제43조제2항에 따라 정하는 날의 다음 날부터 기산", "지연이자 이율은 연 100분의 20"], "answer": "재직 중 월급이 정기 지급일에 지급되지 않았다면, 사용자는 지급하는 날까지의 지연 일수에 대해 연 20%의 지연이자를 지급해야 합니다. [S1][S2]\n\n월급은 매월 1회 이상 일정한 날짜를 정해 지급해야 합니다. [S6] 따라서 정기 지급일에 지급되지 않은 임금은 그 지급일 다음 날부터 지연이자가 발생합니다. [S1]\n\n다만 천재·사변, 법령상 제약으로 지급자금을 확보하기 어려운 경우, 임금의 존부를 법원이나 노동위원회에서 다투는 것이 적절한 경우 등에는 해당 사유가 존속하는 기간 지연이자가 적용되지 않을 수 있습니다. [S4]\n\n또한 명백한 고의로 임금을 지급하지 않았거나, 1년 동안 체불한 개월 수가 총 3개월 이상인 경우 등에는 근로자가 법원에 체불 임금의 3배 이내 금액을 청구할 수 있습니다. [S5]", "reference": "네. 제43조에 따른 정기 임금을 정해진 지급일까지 주지 않으면 그 다음 날부터 지급일까지 지연이자가 붙고, 이율은 연 20%입니다(근로기준법 제37조제1항, 시행령 제17조). 다만 천재·사변 등 사유가 존속하는 기간은 적용되지 않습니다.", "judges": {"opus": {"ok": true, "quote": "사용자는 지급하는 날까지의 지연 일수에 대해 연 20%의 지연이자를 지급해야 합니다.", "reason": "연 20%는 연 100분의 20과 같은 이율임."}, "codex": {"ok": true, "quote": "재직 중 월급이 정기 지급일에 지급되지 않았다면, 사용자는 지급하는 날까지의 지연 일수에 대해 연 20%의 지연이자를 지급해야 합니다. [S1][S2]", "reason": "지연이자 이율을 연 100분의 20과 같은 의미인 연 20%로 명시했습니다."}}}, {"key": "g019-kp2", "id": "g019", "level": "L2", "question": "육아기 근로시간 단축을 나눠 쓸 때 한 번에 최소 얼마 이상 써야 하나요? 계약 만료가 얼마 안 남은 기간제 직원은요?", "kp_index": 2, "all_kps": ["육아기 근로시간 단축은 나누어 사용할 수 있음", "1회 기간은 1개월 이상", "계약 만료로 1개월 이상 쓸 수 없는 기간제근로자는 남은 근로계약기간"], "answer": "육아기 근로시간 단축을 나누어 사용하는 경우, 1회 기간은 원칙적으로 **1개월 이상**이어야 합니다. [S1]\n\n다만 기간제근로자가 근로계약기간 만료로 1개월 이상 사용할 수 없는 경우에는 **남은 근로계약기간 이상**이면 됩니다. [S1]", "reference": "육아기 근로시간 단축은 나누어 쓸 수 있고 1회 기간은 1개월 이상이어야 합니다. 다만 근로계약기간 만료로 1개월 이상 쓸 수 없는 기간제근로자는 남은 근로계약기간 동안 쓸 수 있습니다(남녀고용평등법 제19조의4제2항).", "judges": {"opus": {"ok": true, "quote": "1회 기간은 원칙적으로 **1개월 이상**이어야 합니다.", "reason": "1회 사용 기간이 1개월 이상이라는 수치와 조건이 정답 포인트와 같습니다."}, "codex": {"ok": true, "quote": "육아기 근로시간 단축을 나누어 사용하는 경우, 1회 기간은 원칙적으로 **1개월 이상**이어야 합니다.", "reason": "1회 사용 기간이 1개월 이상이어야 한다고 명시하고 있습니다."}}}, {"key": "s03-kp4", "id": "s03", "level": "SUM", "question": "임신한 직원을 보호하기 위해 근로기준법이 정한 제도를 요약해 주세요.", "kp_index": 4, "all_kps": ["출산전후휴가 90일(미숙아 100일, 다태아 120일)이며 출산 후 45일(다태아 60일) 이상 배정", "휴가 중 최초 60일(다태아 75일)은 유급", "임신 중 시간외근로 금지, 요구 시 쉬운 종류의 근로로 전환", "임신 12주 이내 또는 32주 이후 1일 2시간 근로시간 단축 허용(임금 삭감 금지)"], "answer": "임신한 근로자를 보호하기 위한 주요 제도는 다음과 같습니다.\n\n1. **출산전후휴가**  \n   사용자는 출산 전후 90일의 휴가를 부여해야 하며, 미숙아 출산 시 100일, 다태임신 시 120일로 연장됩니다. 출산 후 휴가 기간은 원칙적으로 45일 이상이어야 하고, 다태임신은 60일 이상이어야 합니다. 최초 60일은 유급이며, 다태임신은 최초 75일이 유급입니다. [S1]  \n   미숙아는 임신 37주 미만 출생 또는 출생 시 체중 2,500그램 미만이면서 출생 후 24시간 이내 신생아중환자실에 입원한 영유아를 말합니다. [S11]\n\n2. **출산전후휴가의 분할 사용**  \n   유산·사산 경험, 출산 당시 만 40세 이상, 유산·사산 위험에 대한 의료기관 진단 등 사유가 있으면 출산 전 휴가를 나누어 사용할 수 있습니다. 다만 출산 후 휴가는 연속하여 45일 이상, 다태임신은 60일 이상이어야 합니다. [S1] [S13]\n\n3. **유산·사산휴가**  \n   임신 중 유산 또는 사산한 근로자가 청구하면 유산·사산휴가를 부여해야 합니다. 임신기간에 따라 유산 또는 사산일부터 10일, 30일, 60일 또는 90일까지 부여합니다. [S1] [S13]\n\n4. **임신 중 시간외근로 및 업무 전환 제한**  \n   사용자는 임신 중인 여성 근로자에게 시간외근로를 시킬 수 없으며, 근로자가 요구하면 쉬운 종류의 근로로 전환해야 합니다. [S1]\n\n5. **임신기 근로시간 단축**  \n   임신 12주 이내 또는 32주 이후인 근로자가 신청하면 1일 2시간의 근로시간 단축을 허용해야 합니다. 유산·조산 등 위험이 있는 근로자는 임신 전 기간에 이를 신청할 수 있습니다. [S1] [S4]  \n   근로시간 단축을 이유로 임금을 삭감할 수 없습니다. 신청하려면 원칙적으로 개시 예정일 3일 전까지 관련 사항을 적은 문서와 의사의 진단서를 제출해야 합니다. [S1] [S2]\n\n6. **업무 시작·종료 시각 변경**  \n   임신 중인 근로자가 1일 소정근로시간을 유지하면서 업무의 시작 및 종료 시각 변경을 신청하면 사용자는 이를 허용해야 합니다. 다만 정상적인 사업 운영에 중대한 지장이 있거나 근로자의 안전·건강 관련 법령을 위반하게 되는 경우에는 예외가 인정됩니다. [S1] [S6]  \n   신청은 원칙적으로 변경 예정일 3일 전까지 문서와 임신 사실을 증명하는 의사의 진단서를 제출해야 합니다. [S6]\n\n7. **태아검진 시간**  \n   임산부 정기건강진단에 필요한 시간을 청구하면 사용자는 이를 허용해야 하며, 그 시간을 이유로 임금을 삭감할 수 없습니다. [S3]\n\n8. **탄력적 근로시간제 적용 제외**  \n   15세 이상 18세 미만 근로자와 임신 중인 여성 근로자에게는 2주 이내", "reference": "출산 전후를 통틀어 90일(미숙아 100일, 다태아 120일)의 출산전후휴가를 주되 출산 후 45일(다태아 60일) 이상이 되어야 하고, 최초 60일(다태아 75일)은 유급입니다. 임신 중에는 시간외근로를 시킬 수 없고 요구하면 쉬운 근로로 전환해야 하며, 임신 12주 이내 또는 32주 이후에는 1일 2시간 근로시간 단축을 허용하고 임금을 삭감할 수 없습니다(근로기준법 제74조).", "judges": {"opus": {"ok": true, "quote": "임신 12주 이내 또는 32주 이후인 근로자가 신청하면 1일 2시간의 근로시간 단축을 허용해야 합니다. ... 근로시간 단축을 이유로 임금을 삭감할 수 없습니다.", "reason": "12주 이내·32주 이후 1일 2시간 단축 허용과 임금 삭감 금지가 모두 명시되어 있다."}, "codex": {"ok": true, "quote": "임신 12주 이내 또는 32주 이후인 근로자가 신청하면 1일 2시간의 근로시간 단축을 허용해야 합니다. 유산·조산 등 위험이 있는 근로자는 임신 전 기간에 이를 신청할 수 있습니다. [S1] [S4]  \n   근로시간 단축을 이유로 임금을 삭감할 수 없습니다.", "reason": "해당 임신 주수의 1일 2시간 근로시간 단축 허용 의무와 임금 삭감 금지를 모두 명시했습니다."}}}, {"key": "g036-kp2", "id": "g036", "level": "L4", "question": "공공기관이 발주한 도급 사업에서 임금에 해당하는 비용을 따로 구분해 매월 지급해야 하는 의무가 지금 시행 중인가요?", "kp_index": 2, "all_kps": ["2027-01-01 시행 예정으로 2026-10-01 현재 미시행", "시행 후 국가·지방자치단체·공공기관 등 도급인은 임금비용을 구분하여 매월 지급"], "answer": "아니요. 해당 의무를 정한 근로기준법 제44조의4는 기준일인 2026년 10월 1일 현재 아직 시행 전이며, 2027년 1월 1일부터 시행될 예정입니다. [S1]\n\n제44조의4가 시행되면 국가·지방자치단체·공공기관 등이 대통령령으로 정하는 업종, 금액 규모 및 기간에 해당하는 사업을 도급하는 경우, 도급금액 중 수급인이 근로자에게 지급해야 할 임금비용을 구분하여 매월 지급해야 합니다. [S1]", "reference": "아직 시행 전입니다. 임금비용 구분지급 의무(근로기준법 제44조의4)는 2026년 3월 17일 공포된 개정으로 신설됐고 2027년 1월 1일부터 시행됩니다. 시행되면 공공기관 등 도급인은 대통령령으로 정하는 사업에서 임금비용을 구분해 매월 지급해야 합니다.", "judges": {"opus": {"ok": true, "quote": "제44조의4가 시행되면 국가·지방자치단체·공공기관 등이 대통령령으로 정하는 업종, 금액 규모 및 기간에 해당하는 사업을 도급하는 경우, 도급금액 중 수급인이 근로자에게 지급해야 할 임금비용을 구분하여 매월 지급해야 합니다.", "reason": "시행 후 국가·지방자치단체·공공기관 등 도급인이 임금비용을 구분하여 매월 지급해야 한다는 의무를 주체와 내용 모두 일치하게 명시함."}, "codex": {"ok": true, "quote": "제44조의4가 시행되면 국가·지방자치단체·공공기관 등이 대통령령으로 정하는 업종, 금액 규모 및 기간에 해당하는 사업을 도급하는 경우, 도급금액 중 수급인이 근로자에게 지급해야 할 임금비용을 구분하여 매월 지급해야 합니다.", "reason": "시행 후 국가·지방자치단체·공공기관 등 도급인이 임금비용을 구분하여 매월 지급해야 한다는 의무를 명시했습니다."}}}, {"key": "g010-kp1", "id": "g010", "level": "L1", "question": "가족 돌봄이나 학업 때문에 근로시간 단축을 하면, 단축 후 근로시간은 주 몇 시간 범위여야 하나요?", "kp_index": 1, "all_kps": ["단축 후 근로시간은 주당 15시간 이상 30시간 이하"], "answer": "가족돌봄이나 학업을 위한 근로시간 단축의 경우, 단축 후 근로시간은 **주 15시간 이상 30시간 이하**여야 합니다. [S1]", "reference": "가족돌봄 등을 위한 근로시간 단축 시 단축 후 근로시간은 주당 15시간 이상이어야 하고 30시간을 넘어서는 안 됩니다(남녀고용평등법 제22조의3제3항).", "judges": {"opus": {"ok": true, "quote": "가족돌봄이나 학업을 위한 근로시간 단축의 경우, 단축 후 근로시간은 **주 15시간 이상 30시간 이하**여야 합니다.", "reason": "답변이 단축 후 근로시간을 주 15시간 이상 30시간 이하로 명시해 정답 포인트의 하한·상한이 모두 일치합니다."}, "codex": {"ok": true, "quote": "가족돌봄이나 학업을 위한 근로시간 단축의 경우, 단축 후 근로시간은 **주 15시간 이상 30시간 이하**여야 합니다. [S1]", "reason": "단축 후 근로시간이 주당 15시간 이상 30시간 이하이어야 한다고 명시적으로 단언합니다."}}}, {"key": "s04-kp2", "id": "s04", "level": "SUM", "question": "육아휴직 제도의 주요 내용을 요약해 주세요.", "kp_index": 2, "all_kps": ["만 8세 이하 또는 초등학교 2학년 이하 자녀 양육을 위해 신청 가능", "기간은 1년 이내(요건 충족 시 6개월 추가)", "육아휴직을 이유로 한 불리한 처우 금지, 휴직 기간 중 해고 금지", "휴직 후 같은 업무 또는 같은 수준의 임금을 지급하는 직무로 복귀", "3회에 한정하여 나누어 사용 가능"], "answer": "- 사업주는 임신 중인 여성 근로자의 모성 보호, 유산·조산 등 위험이 있는 임신 중인 배우자를 돌보려는 남성 근로자, 또는 만 8세 이하·초등학교 2학년 이하 자녀를 양육하려는 근로자의 육아휴직 신청을 허용해야 합니다. 다만 휴직개시예정일 전날까지 계속 근로기간이 6개월 미만인 근로자가 신청한 경우에는 적용되지 않습니다. [S1][S6]\n- 육아휴직 기간은 원칙적으로 1년 이내이며, 부모가 같은 자녀에 대해 각각 3개월 이상 사용한 경우의 부 또는 모, 한부모, 고용노동부령상 장애아동의 부모는 6개월 이내에서 추가 사용할 수 있습니다. [S1][S12]\n- 육아휴직은 3회까지 나누어 사용할 수 있으며, 임신 중 모성 보호나 위험이 있는 임신 중 배우자 돌봄을 위한 휴직 및 법 제19조제6항에 따른 1주·2주 육아휴직은 분할 사용 횟수에 포함되지 않습니다. [S4]\n- 자녀가 다니는 기관의 휴업·휴교·휴원, 방학, 질병·사고에 따른 입원, 감염병 관련 격리·등교 중지 등의 사유가 있으면 1년에 1회, 1주 또는 2주 단위의 육아휴직을 사용할 수 있고, 이 기간은 통상 육아휴직 기간에 포함됩니다. [S1][S2]\n- 방학기간에 신청이 집중되어 사업 운영에 막대한 지장이 있으면 사업주는 근로자와 협의하여 사용 시기를 변경할 수 있으며, 시기변경 사유와 변경 기간을 서면으로 알려야 합니다. [S1]\n- 육아휴직 신청은 원칙적으로 휴직개시예정일 30일 전까지 해야 하고, 유산·조산·사산 위험, 임신 중 배우자 돌봄, 조산 전 출생, 배우자의 사망·질병 등 특별한 사유가 있으면 7일 전까지 신청할 수 있습니다. 법 제19조제6항의 긴급한 사유인 기관의 휴업·휴교·휴원, 자녀의 입원, 감염병 관련 조치의 경우에는 휴직개시예정일까지 신청할 수 있습니다. [S2][S3]\n- 사업주는 신청을 허용한 사실을 원칙적으로 신청일부터 14일 이내, 특별한 사유에 따른 신청은 3일 이내, 긴급 신청은 지체 없이 서면 또는 전자적 방식으로 알려야 합니다. 정해진 기간 내 알리지 않으면 신청한 대로 허용한 것으로 봅니다. [S3]\n- 사업주는 육아휴직을 이유로 해고나 불리한 처우를 해서는 안 되며, 육아휴직 기간에는 원칙적으로 해고할 수 없습니다. 육아휴직 후에는 휴직 전과 같은 업무 또는 같은 수준의 임금을 지급하는 직무로 복귀시켜야 하고, 육아휴직 기간은 근속기간에 포함됩니다. [S1]\n- 신청자는 휴직개시예정일 7일 전까지 신청을 철회할 수 있으며, 긴급 신청의 경우에는 휴직개시예정일 전날까지 철회할 수 있습니다. [S5]\n- 육아휴직 중 자녀의 사망 등 법정 사유가 발생하면 근로자는 7일 이내에 사업주에게 알려야", "reference": "만 8세 이하 또는 초등학교 2학년 이하 자녀를 양육하기 위해 신청할 수 있고, 기간은 1년 이내이며 부모 각 3개월 이상 사용·한부모 등 요건을 갖추면 6개월을 추가할 수 있습니다. 육아휴직을 이유로 불리한 처우를 할 수 없고 휴직 기간에는 해고하지 못하며, 마친 뒤에는 같은 업무 또는 같은 수준의 임금을 지급하는 직무로 복귀시켜야 합니다. 3회에 한정하여 나누어 쓸 수 있습니다(남녀고용평등법 제19조, 제19조의4).", "judges": {"opus": {"ok": true, "quote": "육아휴직 기간은 원칙적으로 1년 이내이며, 부모가 같은 자녀에 대해 각각 3개월 이상 사용한 경우의 부 또는 모, 한부모, 고용노동부령상 장애아동의 부모는 6개월 이내에서 추가 사용할 수 있습니다.", "reason": "1년 이내 기간과 요건 충족 시 6개월 추가 사용을 모두 명시한다."}, "codex": {"ok": true, "quote": "육아휴직 기간은 원칙적으로 1년 이내이며, 부모가 같은 자녀에 대해 각각 3개월 이상 사용한 경우의 부 또는 모, 한부모, 고용노동부령상 장애아동의 부모는 6개월 이내에서 추가 사용할 수 있습니다.", "reason": "기본 기간 1년 이내와 요건 충족 시 6개월 추가 사용을 모두 명시합니다."}}}, {"key": "l5a03-kp2", "id": "l5a03", "level": "L5a", "question": "퇴사하면서 회사와 '퇴직금은 두 달 뒤에 주겠다'는 합의서를 썼습니다. 그런데 두 달이 지나도 퇴직금이 들어오지 않습니다. 회사는 지급 기한을 연장하기로 합의했으니 법 위반은 아니라고 하는데, 정말 그런가요?", "kp_index": 2, "all_kps": ["사용자는 퇴직 시 지급사유 발생일부터 14일 이내에 퇴직금을 지급해야 함(근로자퇴직급여 보장법 제9조 제1항)", "특별한 사정이 있으면 당사자 합의로 지급기일을 연장할 수 있음(제9조 제1항 단서)", "연장한 지급기일까지 지급하지 않으면 제9조 제1항 위반으로 형사처벌 대상(제43조 제1호)"], "answer": "아닙니다. 사용자는 근로자가 퇴직한 날부터 14일 이내에 퇴직금을 지급해야 하지만, 특별한 사정이 있으면 당사자 간 합의로 지급기일을 연장할 수 있습니다. [S6]\n\n다만 연장한 지급기일까지 퇴직금을 지급하지 않으면, 지급기일 연장 합의가 있었다는 이유만으로 법 위반이 없어지는 것은 아닙니다. [S6]\n\n대법원도 사용자가 퇴직 후 14일 이내에 지급기일을 연장하기로 합의했더라도, 연장한 지급기일까지 퇴직금을 지급하지 않으면 퇴직급여 보장법 위반죄가 성립한다고 판단했습니다(대법원 2023. 7. 13. 선고 2023도188 판결). [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n또한 퇴직금 지급이 늦어지면, 지급 사유 발생일부터 14일이 지난 다음 날부터 지급일까지 연 20%의 지연이자가 적용될 수 있습니다. 다만 법령상 지급 지연 사유가 있는 기간에는 지연이자가 적용되지 않을 수 있습니다. [S1] [S2] [S11]\n\n퇴직금 미지급은 5년 이하의 징역 또는 5천만 원 이하의 벌금 대상이 될 수 있습니다. [S8]", "reference": "법 위반입니다. 근로자퇴직급여 보장법 제9조제1항에 따라 퇴직금은 지급사유 발생일부터 14일 이내에 지급해야 하고, 특별한 사정이 있으면 당사자 합의로 지급기일을 연장할 수 있습니다. 그러나 연장하기로 합의한 기일까지도 지급하지 않았다면 제9조제1항 위반이며 제43조제1호에 따른 처벌 대상입니다.", "judges": {"opus": {"ok": true, "quote": "특별한 사정이 있으면 당사자 간 합의로 지급기일을 연장할 수 있습니다.", "reason": "특별한 사정이 있을 때 당사자 합의로 지급기일을 연장할 수 있다는 내용을 그대로 단언합니다."}, "codex": {"ok": true, "quote": "사용자는 근로자가 퇴직한 날부터 14일 이내에 퇴직금을 지급해야 하지만, 특별한 사정이 있으면 당사자 간 합의로 지급기일을 연장할 수 있습니다.", "reason": "특별한 사정이 있을 때 당사자 합의로 지급기일을 연장할 수 있다는 조건과 내용을 명시했습니다."}}}, {"key": "n04-kp1", "id": "n04", "level": "L3", "question": "중증 장애로 작업 능력이 일반 직원보다 현저히 떨어지는 직원이 있습니다. 이 직원에게는 최저임금보다 적은 임금을 줘도 되나요?", "kp_index": 1, "all_kps": ["사용자는 원칙적으로 최저임금 적용 근로자에게 최저임금액 이상을 지급해야 함", "정신장애나 신체장애로 근로능력이 현저히 낮은 사람은 고용노동부장관의 인가를 받은 경우에만 최저임금 효력 규정(제6조) 적용이 제외됨"], "answer": "원칙적으로 사용자는 최저임금 적용 근로자에게 최저임금액 이상을 지급해야 하며, 최저임금보다 적게 정한 근로계약 부분은 무효이고 최저임금액과 같은 임금을 정한 것으로 봅니다. [S4]\n\n다만 장애가 있는 사람이라도 자동으로 최저임금 적용이 제외되는 것은 아닙니다. 정신 또는 신체의 장애가 업무 수행에 직접적으로 현저한 지장을 주는 것이 명백하다고 인정되고, 사용자가 고용노동부장관의 인가를 받은 경우에만 최저임금 적용을 제외할 수 있습니다. [S1] [S2]\n\n인가를 받으려는 사용자는 관할 지방고용노동관서의 장에게 신청서와 직전 달 사업장 전체 근로자 임금대장 사본, 장애를 증명하는 서류 등을 제출해야 합니다. [S3] 최저임금 적용 제외 인가 권한은 지방고용노동관서의 장에게 위임되어 있습니다. [S12]\n\n따라서 해당 직원의 작업 능력이 현저히 낮다는 사정만으로는 부족하고, 업무 수행에 직접적으로 현저한 지장이 명백하다는 기준을 충족하여 인가를 받아야 최저임금보다 적은 임금을 지급할 수 있습니다. 인가를 받지 않았다면 최저임금액 이상을 지급해야 합니다. [S1] [S2] [S4]", "reference": "사용자는 최저임금의 적용을 받는 근로자에게 최저임금액 이상의 임금을 지급해야 합니다(최저임금법 제6조제1항). 다만 정신장애나 신체장애로 근로능력이 현저히 낮은 사람으로서 사용자가 고용노동부장관의 인가를 받은 경우에는 제6조가 적용되지 않으므로(제7조), 인가 없이 임의로 최저임금보다 적게 줄 수는 없습니다.", "j 업무, 유해·위험 업무 등 법에서 금지한 업무에는 파견할 수 없습니다. [S2]  \n- **파견기간:** 일반적인 파견은 1년을 초과할 수 없습니다. [S1]  \n- **기간 연장:** 파견사업주·사용사업주·파견근로자 사이에 합의하면 1회 연장할 수 있고, 연장기간은 1년 이내이며 총 파견기간은 2년 이내입니다. 다만 고령자인 파견근로자는 2년을 초과해 연장할 수 있습니다. [S1]  \n- **예외적 사유의 기간:** 출산·질병·부상 등 객관적으로 명백한 사유는 그 사유가 없어지는 데 필요한 기간까지, 일시적·간헐적 인력 확보는 3개월 이내로 사용할 수 있습니다. 후자의 경우 사유가 없어지지 않고 3자 합의가 있으면 3개월 범위에서 한 차례 연장할 수 있습니다. [S1]  \n- **사용 제한:** 경영상 이유로 해고한 뒤에는 시행령이 정한 기간이 지나기 전 해당 업무에 파견근로자를 사용할 수 없으며, 그 기간은 원칙적으로 2년입니다. 과반수 노동조합 또는 근로자 과반수 대표자의 동의가 있으면 6개월입니다. [S6][S3]  \n- **회사의 직접고용의무:** 사용사업주가 허용되지 않은 업무에 파견근로자를 사용하거나, 금지 업무에 사용하거나, 합의된 총 파견기간 2년을 초과해 계속 사용하거나, 예외적 파견 절차를 위반한 경우 등에는 해당 파견근로자를 직접 고용해야 합니다. [S4]  \n- **직접고용 시 근로조건:** 같은 종류 또는 유사한 업무를 하는 사용사업주 근로자가 있으면 그 근로자에게 적용되는 취업규칙 등의 근로조건을 적용하고, 그런 근로자가 없으면 기존 근로조건 수준보다 낮아져서는 안 됩니다. [S4]  \n- **제재:** 직접고용의무를 이행하지 않으면 3천만원 이하의 과태료가 부과될 수 있습니다. [S9] 파견기간 제한 등을 위반해 파견사업을 하거나 파견 역무를 제공받으면 3년 이하의 징역 또는 3천만원 이하의 벌금 대상이 될 수 있습니다. [S5] 경영상 해고 후 사용 제한을 위반하면 1년 이하의 징역 또는 1천만원 이하의 벌금 대상입니다. [S10]  \n- **판례:** 대법원은 계약 형식보다 실제 지휘·명령, 사업 편입 여부, 원고용주의 독립적 인사·노무 권한, 업무의 구체성·전문성, 독립적 조직·설비 등을 종합해 근로자파견 여부", "reference": "근로자파견은 제조업의 직접생산공정업무를 제외하고 대통령령으로 정하는 업무를 대상으로 하며, 출산·질병·부상 등으로 결원이 생기거나 일시적·간헐적으로 인력이 필요한 경우에는 예외적으로 허용됩니다. 다만 건설공사현장 업무, 선원 업무, 유해·위험 업무 등은 파견할 수 없습니다(제5조). 파견기간은 1년을 넘을 수 없고, 3자 합의로 연장하더라도 총 2년을 넘을 수 없습니다(제6조). 대상이 아닌 업무나 금지 업무에 파견근로자를 쓰거나 2년을 넘겨 계속 사용하는 등 위반이 있으면 사용사업주는 그 파견근로자를 직접 고용해야 합니다(제6조의2).", "judges": {"opus": {"ok": true, "quote": "다만 건설공사현장 업무, 선원 업무, 유해·위험 업무 등 법에서 금지한 업무에는 파견할 수 없습니다.", "reason": "건설공사현장·선원·유해위험 업무의 파견 금지를 명시했습니다."}, "codex": {"ok": true, "quote": "다만 건설공사현장 업무, 선원 업무, 유해·위험 업무 등 법에서 금지한 업무에는 파견할 수 없습니다.", "reason": "정답 포인트에 제시된 세 가지 업무의 파견 금지를 모두 명시했습니다."}}}, {"key": "g007-kp1", "id": "g007", "level": "L1", "question": "퇴직금 중간정산을 해준 회사는 관련 증명서류를 언제까지 보관해야 하나요?", "kp_index": 1, "all_kps": ["근로자가 퇴직한 후 5년이 되는 날까지 관련 증명 서류를 보존"], "answer": "퇴직금 중간정산을 한 사용자는 근로자가 퇴직한 후 5년이 되는 날까지 관련 증명서류를 보존해야 합니다. [S1]", "reference": "중간정산 사유에 따라 퇴직금을 미리 지급한 사용자는 근로자가 퇴직한 후 5년이 되는 날까지 관련 증명 서류를 보존해야 합니다(근로자퇴직급여 보장법 시행령 제3조제2항).", "judges": {"opus": {"ok": true, "quote": "퇴직금 중간정산을 한 사용자는 근로자가 퇴직한 후 5년이 되는 날까지 관련 증명서류를 보존해야 합니다.", "reason": "보존 기한(근로자 퇴직 후 5년이 되는 날까지)과 보존 대상(관련 증명서류)이 정답 포인트와 일치합니다."}, "codex": {"ok": true, "quote": "퇴직금 중간정산을 한 사용자는 근로자가 퇴직한 후 5년이 되는 날까지 관련 증명서류를 보존해야 합니다.", "reason": "근로자가 퇴직한 후 5년이 되는 날까지 관련 증명서류를 보존해야 한다고 명시하여 정답 포인트와 일치합니다."}}}, {"key": "s08-kp1", "id": "s08", "level": "SUM", "question": "근로시간, 연장근로, 휴게시간, 주휴일에 관한 근로기준법의 기본 원칙을 요약해 주세요.", "kp_index": 1, "all_kps": ["근로시간은 휴게시간을 제외하고 1주 40시간, 1일 8시간을 초과할 수 없음", "당사자 간 합의하면 1주 12시간을 한도로 연장근로 가능", "근로시간 4시간이면 30분 이상, 8시간이면 1시간 이상의 휴게시간을 근로시간 도중에 부여", "휴게시간은 근로자가 자유롭게 이용할 수 있음", "1주에 평균 1회 이상의 유급휴일 보장"], "answer": "- **근로시간**: 휴게시간을 제외한 1주 근로시간은 40시간, 1일 근로시간은 8시간을 초과할 수 없습니다. 사용자의 지휘·감독 아래 대기하는 시간 등은 근로시간으로 봅니다. [S1]  \n- **연장근로**: 당사자 간 합의가 있으면 1주 12시간을 한도로 제50조의 근로시간을 연장할 수 있습니다. 다만 3개월 이내 또는 3개월 초과 6개월 이내의 탄력적 근로시간제 등 법정 요건을 갖춘 경우에는 별도 기준이 적용됩니다. [S3][S6][S7]  \n- **연장근로수당**: 연장근로에는 통상임금의 50% 이상을 가산하여 지급해야 합니다. 야간근로는 오후 10시부터 다음 날 오전 6시까지의 근로이며, 이에 대해서도 통상임금의 50% 이상을 가산해야 합니다. 휴일근로는 8시간 이내에는 50% 이상, 8시간 초과분에는 100% 이상을 가산합니다. [S2]  \n- **휴게시간**: 사용자는 근로시간이 4시간인 경우 30분 이상, 8시간인 경우 1시간 이상의 휴게시간을 근로시간 도중에 주어야 하며, 휴게시간은 근로자가 자유롭게 이용할 수 있어야 합니다. [S8]  \n- **주휴일**: 사용자는 근로자에게 1주에 평균 1회 이상의 유급휴일을 보장해야 합니다. 대통령령으로 정하는 휴일도 유급으로 보장해야 하나, 근로자대표와 서면 합의가 있으면 특정 근로일로 대체할 수 있습니다. [S9]  \n- **특례**: 육상운송·수상운송·항공운송·기타 운송 관련 서비스업 및 보건업은 근로자대표와 서면 합의가 있으면 주 12시간을 초과하여 연장근로를 하게 하거나 휴게시간을 변경할 수 있습니다. 이 경우 근로일 종료 후 다음 근로일 개시 전까지 연속 11시간 이상의 휴식시간을 보장해야 합니다. [S4]  \n\n대법원은 1주 연장근로 12시간 초과 여부를 판단할 때 1일 8시간 초과 여부와 관계없이 1주간 근로시간 중 40시간을 초과한 시간을 기준으로 판단하고, 1일 8시간을 초과하여 4시간 연장근로를 하는 경우에도 연장근로 중 30분 이상의 휴게시간을 부여해야 한다고 판단했습니다(대법원 2023. 12. 7. 선고 2020도15393 판결) [S14]  \n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "근로시간은 휴게시간을 제외하고 1주 40시간, 1일 8시간을 넘을 수 없습니다(제50조). 당사자 간에 합의하면 1주 12시간을 한도로 연장근로를 할 수 있습니다(제53조제1항). 근로시간이 4시간이면 30분 이상, 8시간이면 1시간 이상의 휴게시간을 근로시간 도중에 주어야 하고, 휴게시간은 근로자가 자유롭게 이용할 수 있습니다(제54조). 사용자는 1주에 평균 1회 이상의 유급휴일을 보장해야 합니다(제55조제1항).", "judges": {"opus": {"ok": true, "quote": "휴게시간을 제외한 1주 근로시간은 40시간, 1일 근로시간은 8시간을 초과할 수 없습니다.", "reason": "휴게시간 제외, 1주 40시간, 1일 8시간 상한이 모두 명시되어 있다."}, "codex": {"ok": true, "quote": "휴게시간을 제외한 1주 근로시간은 40시간, 1일 근로시간은 8시간을 초과할 수 없습니다.", "reason": "휴게시간을 제외한 주 40시간과 일 8시간의 상한을 모두 명시했습니다."}}}, {"key": "g034-kp3", "id": "g034", "level": "L4", "question": "근로계약 기간은 1년을 넘을 수 없다는 근로기준법 조항이 아직 유효한가요? 계약직은 최대 얼마나 쓸 수 있나요?", "kp_index": 3, "all_kps": ["근로기준법 제16조(계약기간 1년 초과 금지)는 2007-06-30까지만 효력을 가져 현재 효력 상실", "기간제근로자는 2년을 초과하지 않는 범위에서 사용 가능", "예외 사유 없이 2년 초과 사용 시 기간의 정함이 없는 근로계약을 체결한 근로자로 봄"], "answer": "근로계약 기간이 1년을 초과할 수 없다는 근로기준법 제16조는 2007년 6월 30일까지 유효했고, 현재는 효력을 상실했습니다. [S1]\n\n현재 기간제근로자는 원칙적으로 계속근로한 총기간이 2년을 초과하지 않는 범위에서 사용할 수 있습니다. [S2]\n\n다만 사업의 완료, 휴직자 업무 대체, 학업·직업훈련 기간, 고령자와의 근로계약, 일정한 전문적 지식·기술 활용 또는 정부의 복지정책·실업대책에 따른 일자리 제공 등 법에서 정한 예외에 해당하면 2년을 초과하여 사용할 수 있습니다. [S2] 시행령은 전문자격 보유자, 일정한 정부 일자리 사업, 일부 학교·연구기관 업무, 뚜렷하게 짧은 단시간근로자 등 구체적인 예외를 정하고 있습니다. [S11]\n\n예외 사유가 없거나 소멸했는데도 2년을 초과하여 기간제근로자로 사용하면, 해당 근로자는 기간의 정함이 없는 근로계약을 체결한 근로자로 봅니다. [S2]\n\n대법원은 사용자의 부당한 계약갱신 거절로 실제 근로를 제공하지 못한 기간도 정당한 갱신기대권이 존속하는 범위에서는 2년의 사용제한기간에 포함된다고 판단했습니다(대법원 2018. 6. 19. 선고 2013다85523 판결). [S12] 또한 대법원은 기간제법상 2년 제한이 있더라도 정당한 계약갱신기대권이 형성되는 것 자체가 제한되지는 않는다고 판단했습니다(대법원 2017. 10. 12. 선고 2015두59907 판결). [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "유효하지 않습니다. 근로기준법 제16조는 부칙에 따라 2007년 6월 30일까지만 효력이 있었습니다. 현재는 기간제법 제4조에 따라 기간제근로자를 2년을 초과하지 않는 범위에서 사용할 수 있고, 예외 사유 없이 2년을 넘기면 기간의 정함이 없는 근로자로 봅니다.", "judges": {"opus": {"ok": true, "quote": "예외 사유가 없거나 소멸했는데도 2년을 초과하여 기간제근로자로 사용하면, 해당 근로자는 기간의 정함이 없는 근로계약을 체결한 근로자로 봅니다.", "reason": "예외 사유 없이 2년을 초과해 사용하면 기간의 정함이 없는 근로계약을 체결한 근로자로 본다는 조건과 효과를 모두 명시함."}, "codex": {"ok": true, "quote": "예외 사유가 없거나 소멸했는데도 2년을 초과하여 기간제근로자로 사용하면, 해당 근로자는 기간의 정함이 없는 근로계약을 체결한 근로자로 봅니다.", "reason": "예외 사유 없이 2년을 초과하여 사용하면 기간의 정함이 없는 근로계약을 체결한 근로자로 본다고 명시했습니다."}}}, {"key": "n15-kp2", "id": "n15", "level": "L2", "question": "자녀 대학등록금을 마련하려고 제 확정기여형 퇴직연금을 담보로 대출을 받으려 합니다. 이런 사유로도 퇴직연금 수급권을 담보로 제공할 수 있나요? 적립금의 얼마까지 담보로 제공할 수 있나요?", "kp_index": 2, "all_kps": ["가입자 본인·배우자·부양가족의 대학등록금, 혼례비 또는 장례비를 가입자가 부담하는 경우 담보 제공 사유에 해당함", "이 경우 담보 제공 한도는 가입자별 적립금의 100분의 50임"], "answer": "자녀의 대학등록금 부담은 퇴직연금 수급권을 담보로 제공할 수 있는 사유에 해당합니다. 시행령은 가입자 본인·배우자·가입자 또는 배우자의 부양가족의 대학등록금을 가입자가 부담하는 경우를 담보 제공 사유로 정하고 있습니다. 자녀가 해당 부양가족에 해당해야 합니다. [S2]\n\n이 경우 담보로 제공할 수 있는 한도는 가입자별 적립금의 50%입니다. [S2]\n\n다만 확정기여형퇴직연금의 적립금 중도인출은 별도 요건이 적용되므로, 담보 제공과 중도인출은 구분됩니다. [S4][S5]", "reference": "가입자 본인, 배우자 또는 가입자나 배우자의 부양가족의 대학등록금·혼례비·장례비를 가입자가 부담하는 경우는 퇴직연금제도 수급권의 담보 제공 사유에 해당합니다(근로자퇴직급여 보장법 시행령 제2조제1항제4호의2). 이 경우 담보 제공 한도는 가입자별 적립금의 100분의 50입니다(제2조제2항제1호).", "judges": {"opus": {"ok": true, "quote": "이 경우 담보로 제공할 수 있는 한도는 가입자별 적립금의 50%입니다.", "reason": "담보 제공 한도를 가입자별 적립금의 50%(100분의 50)로 명시해 정답 포인트와 일치합니다."}, "codex": {"ok": true, "quote": "이 경우 담보로 제공할 수 있는 한도는 가입자별 적립금의 50%입니다.", "reason": "담보 제공 한도를 가입자별 적립금의 100분의 50과 같은 의미인 50%로 명시했습니다."}}}, {"key": "g012-kp1", "id": "g012", "level": "L2", "question": "휴일에 10시간 근무했다면 휴일근로 가산수당은 어떻게 계산되나요?", "kp_index": 1, "all_kps": ["8시간 이내 휴일근로는 통상임금의 100분의 50 가산", "8시간을 초과한 휴일근로(2시간)는 통상임금의 100분의 100 가산"], "answer": "휴일근로 10시간 중 8시간 이내에는 통상임금의 50%, 8시간을 초과한 2시간에는 통상임금의 100%를 가산합니다. [S1]\n\n따라서 휴일근로 가산수당은 다음과 같이 계산합니다. [S1]\n\n- 첫 8시간: 통상임금 시간급 × 8시간 × 50%\n- 초과 2시간: 통상임금 시간급 × 2시간 × 100%\n- 합계: 통상임금 시간급 × 6시간 상당액\n\n통상임금 시간급은 임금 형태에 따라 근로기준법 시행령 제6조의 산정방법으로 계산합니다. [S10]\n\n대법원은 휴일근로에 해당하는지는 단체협약이나 취업규칙 등에서 해당 날을 휴일로 정했는지 등을 종합하여 판단해야 한다고 판단했습니다(대법원 2020. 6. 25. 선고 2016다3386 판결). [S11] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "8시간까지는 통상임금의 50%, 8시간을 초과한 2시간은 통상임금의 100%를 가산해 지급해야 합니다(근로기준법 제56조제2항).", "judges": {"opus": {"ok": true, "quote": "휴일근로 10시간 중 8시간 이내에는 통상임금의 50%, 8시간을 초과한 2시간에는 통상임금의 100%를 가산합니다.", "reason": "8시간 이내 휴일근로에 통상임금의 50%(100분의 50)를 가산한다고 명시적으로 단언하고 있다."}, "codex": {"ok": true, "quote": "휴일근로 10시간 중 8시간 이내에는 통상임금의 50%, 8시간을 초과한 2시간에는 통상임금의 100%를 가산합니다. [S1]", "reason": "8시간 이내 휴일근로에 통상임금의 50%를 가산한다고 명시했습니다."}}}, {"key": "s08-kp3", "id": "s08", "level": "SUM", "question": "근로시간, 연장근로, 휴게시간, 주휴일에 관한 근로기준법의 기본 원칙을 요약해 주세요.", "kp_index": 3, "all_kps": ["근로시간은 휴게시간을 제외하고 1주 40시간, 1일 8시간을 초과할 수 없음", "당사자 간 합의하면 1주 12시간을 한도로 연장근로 가능", "근로시간 4시간이면 30분 이상, 8시간이면 1시간 이상의 휴게시간을 근로시간 도중에 부여", "휴게시간은 근로자가 자유롭게 이용할 수 있음", "1주에 평균 1회 이상의 유급휴일 보장"], "answer": "- **근로시간**: 휴게시간을 제외한 1주 근로시간은 40시간, 1일 근로시간은 8시간을 초과할 수 없습니다. 사용자의 지휘·감독 아래 대기하는 시간 등은 근로시간으로 봅니다. [S1]  \n- **연장근로**: 당사자 간 합의가 있으면 1주 12시간을 한도로 제50조의 근로시간을 연장할 수 있습니다. 다만 3개월 이내 또는 3개월 초과 6개월 이내의 탄력적 근로시간제 등 법정 요건을 갖춘 경우에는 별도 기준이 적용됩니다. [S3][S6][S7]  \n- **연장근로수당**: 연장근로에는 통상임금의 50% 이상을 가산하여 지급해야 합니다. 야간근로는 오후 10시부터 다음 날 오전 6시까지의 근로이며, 이에 대해서도 통상임금의 50% 이상을 가산해야 합니다. 휴일근로는 8시간 이내에는 50% 이상, 8시간 초과분에는 100% 이상을 가산합니다. [S2]  \n- **휴게시간**: 사용자는 근로시간이 4시간인 경우 30분 이상, 8시간인 경우 1시간 이상의 휴게시간을 근로시간 도중에 주어야 하며, 휴게시간은 근로자가 자유롭게 이용할 수 있어야 합니다. [S8]  \n- **주휴일**: 사용자는 근로자에게 1주에 평균 1회 이상의 유급휴일을 보장해야 합니다. 대통령령으로 정하는 휴일도 유급으로 보장해야 하나, 근로자대표와 서면 합의가 있으면 특정 근로일로 대체할 수 있습니다. [S9]  \n- **특례**: 육상운송·수상운송·항공운송·기타 운송 관련 서비스업 및 보건업은 근로자대표와 서면 합의가 있으면 주 12시간을 초과하여 연장근로를 하게 하거나 휴게시간을 변경할 수 있습니다. 이 경우 근로일 종료 후 다음 근로일 개시 전까지 연속 11시간 이상의 휴식시간을 보장해야 합니다. [S4]  \n\n대법원은 1주 연장근로 12시간 초과 여부를 판단할 때 1일 8시간 초과 여부와 관계없이 1주간 근로시간 중 40시간을 초과한 시간을 기준으로 판단하고, 1일 8시간을 초과하여 4시간 연장근로를 하는 경우에도 연장근로 중 30분 이상의 휴게시간을 부여해야 한다고 판단했습니다(대법원 2023. 12. 7. 선고 2020도15393 판결) [S14]  \n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "근로시간은 휴게시간을 제외하고 1주 40시간, 1일 8시간을 넘을 수 없습니다(제50조). 당사자 간에 합의하면 1주 12시간을 한도로 연장근로를 할 수 있습니다(제53조제1항). 근로시간이 4시간이면 30분 이상, 8시간이면 1시간 이상의 휴게시간을 근로시간 도중에 주어야 하고, 휴게시간은 근로자가 자유롭게 이용할 수 있습니다(제54조). 사용자는 1주에 평균 1회 이상의 유급휴일을 보장해야 합니다(제55조제1항).", "judges": {"opus": {"ok": true, "quote": "사용자는 근로시간이 4시간인 경우 30분 이상, 8시간인 경우 1시간 이상의 휴게시간을 근로시간 도중에 주어야 하며", "reason": "4시간 30분 이상, 8시간 1시간 이상, 근로시간 도중 부여가 모두 명시되어 있다."}, "codex": {"ok": true, "quote": "사용자는 근로시간이 4시간인 경우 30분 이상, 8시간인 경우 1시간 이상의 휴게시간을 근로시간 도중에 주어야 하며, 휴게시간은 근로자가 자유롭게 이용할 수 있어야 합니다.", "reason": "근로시간별 최소 휴게시간과 근로시간 도중 부여 의무를 모두 명시했습니다."}}}, {"key": "l5a04-kp1", "id": "l5a04", "level": "L5a", "question": "건설현장 일을 소개받아 일했는데, 소개해 준 사람이 '본인 계좌는 쓸 수 없다'며 임금 대리수령 위임장에 서명하게 했고, 회사는 제 임금을 제가 전혀 모르는 사람 계좌로 일괄 송금했습니다. 저는 돈을 제대로 받지 못했는데 회사는 이미 지급했다고 합니다. 회사에 다시 임금을 청구할 수 있나요?", "kp_index": 1, "all_kps": ["임금은 통화로 직접 근로자에게 그 전액을 지급해야 함(근로기준법 제43조 제1항)", "법령·단체협약에 의한 예외는 임금 일부 공제와 통화 외 지급에 관한 것이며 직접 지급 원칙에는 예외가 없음", "근로자가 위임했더라도 모르는 제3자에게 지급한 것은 직접 지급 원칙 위반으로 유효한 임금 지급이 아님", "근로자는 회사에 임금 지급을 청구할 수 있음"], "answer": "근로기준법상 임금은 통화로 근로자에게 직접 전액 지급해야 합니다. [S7]\n\n대법원은 근로자가 제3자에게 임금 수령을 위임했더라도, 원칙적으로 그 위임은 무효이고, 예외적으로 근로자 본인에게 지급하는 것과 동일시되거나 임금을 본인에게 확실히 전달할 사람만 사자로 볼 수 있다고 판단했습니다. 또한 근로자가 전혀 모르는 사람의 계좌로 임금을 일괄 송금한 경우에는 직접 지급 원칙에 위반되어 무효라고 판단했습니다(대법원 2025. 6. 12. 선고 2025다209645 판결). [S12]\n\n따라서 질문과 같은 사실관계라면 회사가 그 사람의 계좌로 송금했다는 사정만으로 임금을 적법하게 지급했다고 보기 어렵고, 회사에 임금을 다시 청구할 수 있습니다. [S7] [S12]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "청구할 수 있습니다. 근로기준법 제43조제1항은 임금을 통화로 직접 근로자에게 전액 지급하도록 정하고 있고, 법령·단체협약에 따른 예외는 임금 일부 공제와 통화 이외의 지급에 관한 것뿐입니다. 근로자가 위임장에 서명했더라도 모르는 제3자 계좌로 보낸 것은 직접 지급 원칙에 어긋나 유효한 임금 지급이 아니므로, 회사에 임금을 다시 청구할 수 있습니다.", "judges": {"opus": {"ok": true, "quote": "근로기준법상 임금은 통화로 근로자에게 직접 전액 지급해야 합니다. [S7]", "reason": "통화·직접·전액 지급 원칙을 단언했으나 조문 번호(제43조 제1항)는 명시하지 않았습니다."}, "codex": {"ok": true, "quote": "근로기준법상 임금은 통화로 근로자에게 직접 전액 지급해야 합니다.", "reason": "임금을 통화로 근로자에게 직접 전액 지급해야 한다는 의무를 명시했습니다."}}}, {"key": "g034-kp2", "id": "g034", "level": "L4", "question": "근로계약 기간은 1년을 넘을 수 없다는 근로기준법 조항이 아직 유효한가요? 계약직은 최대 얼마나 쓸 수 있나요?", "kp_index": 2, "all_kps": ["근로기준법 제16조(계약기간 1년 초과 금지)는 2007-06-30까지만 효력을 가져 현재 효력 상실", "기간제근로자는 2년을 초과하지 않는 범위에서 사용 가능", "예외 사유 없이 2년 초과 사용 시 기간의 정함이 없는 근로계약을 체결한 근로자로 봄"], "answer": "근로계약 기간이 1년을 초과할 수 없다는 근로기준법 제16조는 2007년 6월 30일까지 유효했고, 현재는 효력을 상실했습니다. [S1]\n\n현재 기간제근로자는 원칙적으로 계속근로한 총기간이 2년을 초과하지 않는 범위에서 사용할 수 있습니다. [S2]\n\n다만 사업의 완료, 휴직자 업무 대체, 학업·직업훈련 기간, 고령자와의 근로계약, 일정한 전문적 지식·기술 활용 또는 정부의 복지정책·실업대책에 따른 일자리 제공 등 법에서 정한 예외에 해당하면 2년을 초과하여 사용할 수 있습니다. [S2] 시행령은 전문자격 보유자, 일정한 정부 일자리 사업, 일부 학교·연구기관 업무, 뚜렷하게 짧은 단시간근로자 등 구체적인 예외를 정하고 있습니다. [S11]\n\n예외 사유가 없거나 소멸했는데도 2년을 초과하여 기간제근로자로 사용하면, 해당 근로자는 기간의 정함이 없는 근로계약을 체결한 근로자로 봅니다. [S2]\n\n대법원은 사용자의 부당한 계약갱신 거절로 실제 근로를 제공하지 못한 기간도 정당한 갱신기대권이 존속하는 범위에서는 2년의 사용제한기간에 포함된다고 판단했습니다(대법원 2018. 6. 19. 선고 2013다85523 판결). [S12] 또한 대법원은 기간제법상 2년 제한이 있더라도 정당한 계약갱신기대권이 형성되는 것 자체가 제한되지는 않는다고 판단했습니다(대법원 2017. 10. 12. 선고 2015두59907 판결). [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "reference": "유효하지 않습니다. 근로기준법 제16조는 부칙에 따라 2007년 6월 30일까지만 효력이 있었습니다. 현재는 기간제법 제4조에 따라 기간제근로자를 2년을 초과하지 않는 범위에서 사용할 수 있고, 예외 사유 없이 2년을 넘기면 기간의 정함이 없는 근로자로 봅니다.", "judges": {"opus": {"ok": true, "quote": "현재 기간제근로자는 원칙적으로 계속근로한 총기간이 2년을 초과하지 않는 범위에서 사용할 수 있습니다.", "reason": "기간제근로자를 2년을 초과하지 않는 범위에서 사용할 수 있다는 내용을 명시함."}, "codex": {"ok": true, "quote": "현재 기간제근로자는 원칙적으로 계속근로한 총기간이 2년을 초과하지 않는 범위에서 사용할 수 있습니다.", "reason": "기간제근로자를 2년을 초과하지 않는 범위에서 사용할 수 있다고 명시했습니다."}}}, {"key": "s01-kp2", "id": "s01", "level": "SUM", "question": "회사가 직원을 해고할 때 법적으로 지켜야 하는 제한과 절차를 요약해 주세요.", "kp_index": 2, "all_kps": ["정당한 이유 없이 해고할 수 없음", "업무상 부상·질병 요양 휴업 기간과 그 후 30일, 산전·산후 휴업 기간과 그 후 30일은 해고 금지", "적어도 30일 전에 해고를 예고하고, 예고하지 않으면 30일분 이상의 통상임금을 지급", "해고사유와 해고시기를 서면으로 통지해야 해고의 효력이 있음"], "answer": "회사가 직원을 해고할 때에는 다음 제한과 절차를 지켜야 합니다.\n\n1. **정당한 이유가 있어야 합니다.** 사용자는 정당한 이유 없이 해고할 수 없습니다. 업무상 부상·질병의 요양으로 휴업한 기간과 그 후 30일, 산전·산후 휴업 기간과 그 후 30일에는 원칙적으로 해고할 수 없습니다. [S1]\n\n2. **경영상 해고는 별도 요건을 충족해야 합니다.** 긴박한 경영상 필요가 있어야 하고, 해고를 피하기 위한 노력을 다해야 하며, 합리적이고 공정한 기준으로 대상자를 선정해야 합니다. 또한 근로자대표에게 해고 예정일 50일 전까지 관련 사항을 통보하고 성실하게 협의해야 합니다. [S2]\n\n3. **대규모 경영상 해고는 신고해야 합니다.** 1개월 동안 해고하는 인원이 사업장 규모별 기준에 해당하면, 최초 해고일 30일 전까지 고용노동부장관에게 신고해야 합니다. 기준은 상시 근로자 99명 이하 사업장에서 10명 이상, 100명 이상 999명 이하 사업장에서 상시 근로자 수의 10% 이상, 1,000명 이상 사업장에서 100명 이상입니다. [S5] 신고서는 관할 지방고용노동관서의 장에게 제출합니다. [S8]\n\n4. **해고를 예고해야 합니다.** 해고하려면 적어도 30일 전에 예고해야 하며, 예고하지 않으면 30일분 이상의 통상임금을 지급해야 합니다. 다만 계속 근로기간이 3개월 미만인 경우, 천재·사변 등으로 사업 계속이 불가능한 경우, 근로자의 고의로 사업에 막대한 지장이나 재산상 손해가 발생한 경우에는 예외가 있습니다. [S3] 근로자의 귀책사유에 관한 구체적인 예외 사유는 근로기준법 시행규칙 별표 1에 따릅니다. [S6]\n\n5. **해고사유와 해고시기를 서면으로 통지해야 합니다.** 서면통지가 없으면 해고는 효력이 없습니다. 해고 예고를 서면으로 하면서 해고사유와 해고시기를 명시한 경우에는 별도의 서면통지를 한 것으로 봅니다. [S4]\n\n6. **부당해고라면 구제신청이 가능합니다.** 근로자는 부당해고라고 판단하면 노동위원회에 구제를 신청할 수 있고, 해고가 있었던 날부터 3개월 이내에 신청해야 합니다. [S9]\n\n대법원은 경영상 해고에서 긴박한 경영상 필요가 반드시 도산 회피에 한정되지 않고 인원감축의 객관적 합리성이 있는 경우도 포함될 수 있지만, 해고 회피 노력과 대상자 선정기준의 합리성·공정성은 사용자가 증명해야 한다고 판단했습니다(대법원 2021. 7. 29. 선고 2016두64876 판결) [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n대법원은 근무성적이나 근무능력 부족을 이유로 한 해고도 정당한 이유가 있어야 하며, 평가가 공정하고 객관적이어야 하고, 상당 기간 일반적으로 기대되는 최소 수준에 미치지 못하며 개선 가능성도 인정되기 어려워 사회통념상 고용", "reference": "정당한 이유 없이 해고할 수 없고(제23조①), 업무상 부상·질병 요양 휴업 기간과 그 후 30일 및 산전·산후 휴업 기간과 그 후 30일에는 해고하지 못합니다(제23조②). 해고하려면 적어도 30일 전에 예고하거나 30일분 이상의 통상임금을 지급해야 하며(제26조), 해고사유와 해고시기를 서면으로 통지해야 효력이 있습니다(제27조).", "judges": {"opus": {"ok": true, "quote": "업무상 부상·질병의 요양으로 휴업한 기간과 그 후 30일, 산전·산후 휴업 기간과 그 후 30일에는 원칙적으로 해고할 수 없습니다.", "reason": "두 해고 금지 기간(요양 휴업과 그 후 30일, 산전·산후 휴업과 그 후 30일)을 모두 명시함."}, "codex": {"ok": true, "quote": "업무상 부상·질병의 요양으로 휴업한 기간과 그 후 30일, 산전·산후 휴업 기간과 그 후 30일에는 원칙적으로 해고할 수 없습니다.", "reason": "두 휴업 기간과 각각 그 후 30일의 해고 금지를 모두 명시했습니다."}}}, {"key": "s02-kp5", "id": "s02", "level": "SUM", "question": "직장 내 괴롭힘이 무엇인지, 신고가 들어오면 회사가 해야 할 일을 관련 규정에 따라 요약해 주세요.", "kp_index": 5, "all_kps": ["직장 내 괴롭힘은 지위·관계 등의 우위를 이용해 업무상 적정범위를 넘어 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위", "신고 접수·인지 시 지체 없이 객관적으로 조사", "조사 기간 피해근로자등 보호를 위한 근무장소 변경·유급휴가 등 조치(피해자 의사에 반하지 않게)", "괴롭힘이 확인되면 행위자에 대해 징계 등 필요한 조치", "신고 근로자와 피해근로자등에게 해고나 불리한 처우 금지"], "answer": "직장 내 괴롭힘은 사용자 또는 근로자가 직장에서의 지위 또는 관계 등의 우위를 이용하여 업무상 적정범위를 넘어 다른 근로자에게 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위입니다. [S2]\n\n신고가 들어오거나 회사가 직장 내 괴롭힘 발생 사실을 인지하면 회사는 다음과 같이 해야 합니다.\n\n1. 지체 없이 당사자 등을 대상으로 사실 확인을 위한 객관적인 조사를 실시해야 합니다. [S1]\n2. 조사 기간 중 필요한 경우 피해근로자등을 보호하기 위해 근무장소 변경, 유급휴가 명령 등 적절한 조치를 해야
