<style>
/* Layout: sticky progress bar → one card per disputed key point (question, key point, three judges, answer) → decision bar */
:root {
  --bg: #f6f7f5; --panel: #ffffff; --line: #dde1dc; --fg: #1d2420; --muted: #5d6862; --accent: #2f5d50; --accent-soft: #e3ece8;
  --ok: #2e7d4f; --ok-soft: #e2f1e7; --bad: #b3372e; --bad-soft: #f7e3e0; --warn: #9a6a12; --warn-soft: #f6ecd6; --mark: #fbe9a7;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141917; --panel: #1b2220; --line: #2e3834; --fg: #e4ebe7; --muted: #a2aea8; --accent: #8cc4b2; --accent-soft: #243631;
  --ok: #6fcf95; --ok-soft: #1d3326; --bad: #f08a80; --bad-soft: #3b2220; --warn: #e2b55a; --warn-soft: #3a3020; --mark: #5a4a17; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141917; --panel: #1b2220; --line: #2e3834; --fg: #e4ebe7; --muted: #a2aea8; --accent: #8cc4b2; --accent-soft: #243631;
  --ok: #6fcf95; --ok-soft: #1d3326; --bad: #f08a80; --bad-soft: #3b2220; --warn: #e2b55a; --warn-soft: #3a3020; --mark: #5a4a17; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.6 }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; display: grid; gap: 14px }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center }
h1 { font-size: 17px; margin: 0; flex: 1 1 200px }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.prog { color: var(--muted); font-size: 13px }
select, button, textarea { font: inherit; color: var(--fg) }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px }
.nav { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 12px; cursor: pointer }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.intro { color: var(--muted); font-size: 13px; margin: 6px 0 0 }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0 }
.head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted) }
.pill { font-size: 12px; border-radius: 4px; padding: 1px 8px; font-weight: 500; background: var(--warn-soft); color: var(--warn) }
.q { font-size: 15px; font-weight: 500 }
.kps { display: grid; gap: 4px; padding: 0; margin: 0; list-style: none; font-size: 13px }
.kps li { color: var(--muted); padding: 4px 8px; border-radius: 6px }
.kps li.on { color: var(--fg); background: var(--accent-soft); font-weight: 600; font-size: 14px }
.note { background: var(--warn-soft); border-radius: 6px; padding: 8px 12px; font-size: 13px }
.judges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
.judge { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; min-width: 0 }
.judge b { font-size: 13px } .v { font-weight: 700 } .v.ok { color: var(--ok) } .v.bad { color: var(--bad) }
.judge .quote { font-size: 12.5px; border-left: 2px solid var(--line); padding-left: 8px; color: var(--muted) }
.judge .reason { font-size: 12.5px }
.runs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted) }
.runs button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12px }
.runs button[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent) }
.answer { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-size: 13.5px; max-height: 360px; overflow: auto }
mark { background: var(--mark); color: inherit; border-radius: 2px }
details.ref summary { cursor: pointer; color: var(--muted); font-size: 13px } details.ref p { font-size: 13px; margin: 6px 0 0 }
.decide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.decide button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 8px; cursor: pointer; text-align: left; display: grid; gap: 2px }
.decide button small { color: var(--muted); font-size: 12px }
.decide button[data-d="yes"][aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok) }
.decide button[data-d="no"][aria-pressed="true"] { background: var(--bad-soft); border-color: var(--bad) }
.decide button[data-d="relax"][aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn) }
textarea { width: 100%; min-height: 56px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel); resize: vertical }
.status { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap }
#notice { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 6px 10px; font-size: 13px }
@media (max-width: 720px) { .judges, .decide { grid-template-columns: 1fr } }
</style>

<script>

ok": false, "quote": "2026년 11월 27일부터는 연간 6일 이내라는 기준은 같지만, 최초 4일이 유급으로 늘어날 예정입니다. [S1]", "reason": "최초 4일 유급으로 확대된다는 내용은 있으나 개정이 공포되었다는 사실은 명시하지 않았습니다."}}], "pattern": "luna_only_yes"}, {"key": "l5b01-kp3", "id": "l5b01", "level": "L5b", "question": "저희 회사는 두 달마다 기본급의 100%를 정기상여금으로 주는데, '지급일에 재직 중인 사람에게만 준다'는 조건이 붙어 있습니다. 회사는 이 조건 때문에 상여금이 통상임금이 아니어서 올해 연장근로수당 계산에서 빠진다고 합니다. 맞나요?", "kp_index": 3, "kp": "판례: 새 법리는 2024. 12. 19. 이후 제공한 연장근로 등의 법정수당 산정부터 적용됨(올해 연장근로수당에 적용)", "all_kps": ["통상임금은 근로자에게 정기적이고 일률적으로 소정근로 또는 총 근로에 대하여 지급하기로 정한 금액임(근로기준법 시행령 제6조제1항)", "판례: 특정 시점 재직 조건이 붙었다는 사정만으로 통상임금성이 부정되지 않음", "판례: 새 법리는 2024. 12. 19. 이후 제공한 연장근로 등의 법정수당 산정부터 적용됨(올해 연장근로수당에 적용)"], "reference": "회사 주장은 맞지 않을 가능성이 큽니다. 근로기준법 시행령 제6조제1항은 통상임금을 '근로자에게 정기적이고 일률적으로 소정근로 또는 총 근로에 대하여 지급하기로 정한' 금액으로 정의하고, 연장근로에는 통상임금의 100분의 50 이상을 가산해야 합니다(근로기준법 제56조제1항). 다만 '지급일 재직자에게만 준다'는 조건이 붙은 상여금이 이 정의에 해당하는지는 조문에 기준이 없습니다. 대법원은 정기상여금 등의 통상임금성이 문제 된 사안에서, 특정 시점에 재직 중이어야 한다는 조건이 부가되어 있다는 사정만으로 그 임금의 통상임금성이 부정되지 않으며, 이 새로운 법리는 2024. 12. 19. 이후 제공한 연장근로 등에 대한 법정수당 산정부터 적용된다고 판단했습니다(대법원 2024. 12. 19. 선고 2020다247190 전원합의체 판결). 따라서 올해 연장근로수당 계산에는 두 달마다 지급되는 정기상여금이 통상임금으로 포함될 수 있습니다. 다만 판례의 결론은 상여금의 실제 지급 조건 등 구체적 사실관계에 따라 달라질 수 있습니다.", "note": "실제로 들어간 판례는 2018다296472(2025.1.23, 같은 법리를 적용한 후속 판례)로 적용 시점 설명이 없음. 결론('올해 수당에 포함')은 적용 시점 없이도 같음 → 이 포인트를 필수로 둘지, 후속 판례도 정답 판례로 인정할지 결정 필요", "answers": [{"run": "v2-qwen3-4B-k10-r3", "answer": "아닙니다. 통상임금은 소정근로의 대가로 정기적·일률적으로 지급하기로 정한 임금입니다. [S1]\n\n대법원은 지급일 현재 재직 중이어야 한다는 조건만으로 통상임금성이 부정되지 않는다고 판단했습니다. 따라서 두 달마다 기본급의 100%를 정기적으로 지급하는 상여금이 소정근로의 대가이고 정기적·일률적으로 지급된다면, 재직조건이 붙어 있어도 통상임금에 해당할 수 있습니다(대법원 2025. 1. 23. 선고 2018다296472 판결). [S11]\n\n통상임금에 해당한다면 연장근로수당은 그 통상임금의 50% 이상을 가산하여 지급해야 하므로, 해당 상여금을 연장근로수당 산정에서 일률적으로 제외할 수 없습니다. [S2]\n\n다만 실제 통상임금 해당 여부는 상여금이 소정근로의 대가인지, 정기적·일률적으로 지급되는지 등 구체적인 지급 조건에 따라 판단됩니다. 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "통상임금에 해당한다면 연장근로수당은 그 통상임금의 50% 이상을 가산하여 지급해야 하므로, 해당 상여금을 연장근로수당 산정에서 일률적으로 제외할 수 없습니다."}, "opus": {"ok": false, "quote": "", "reason": "새 법리가 2024. 12. 19. 이후 제공한 연장근로 등의 법정수당 산정부터 적용된다는 적용 시점에 대한 언급이 없습니다."}, "codex": {"ok": false, "quote": "", "reason": "새 법리가 2024. 12. 19. 이후 제공한 연장근로 등의 법정수당 산정부터 적용된다는 시점과 올해 연장근로수당에 적용된다는 내용을 명시하지 않았습니다."}}], "pattern": "luna_only_yes"}, {"key": "l5b02-kp2", "id": "l5b02", "level": "L5b", "question": "병원 방사선사인데 야간에는 집에서 '콜 대기' 당직을 섭니다. 호출이 오면 병원에 나가 촬영을 하고, 호출이 없으면 집에서 쉬거나 잠을 잡니다. 이 콜 대기 시간 전체가 근로시간으로 인정돼서 수당을 받을 수 있나요?", "kp_index": 2, "kp": "판례: 당직이 근무 밀도가 낮은 대기성 단속적 업무이면 본래 업무에 실제로 종사한 시간만 근로시간임(본래 업무의 연장이거나 통상근무와 같으면 당직시간 전체가 근로시간)", "all_kps": ["작업을 위해 사용자의 지휘·감독 아래에 있는 대기시간 등은 근로시간으로 봄(근로기준법 제50조제3항)", "판례: 당직이 근무 밀도가 낮은 대기성 단속적 업무이면 본래 업무에 실제로 종사한 시간만 근로시간임(본래 업무의 연장이거나 통상근무와 같으면 당직시간 전체가 근로시간)", "판례: 콜대기 시간 전부를 근로시간으로 단정할 수 없고 근무 밀도·호출 빈도·출근 시한 등을 심리해 범위를 판단해야 함"], "reference": "콜 대기 시간 전체가 당연히 근로시간으로 인정되지는 않습니다. 근로기준법 제50조제3항은 작업을 위하여 근로자가 사용자의 지휘·감독 아래에 있는 대기시간 등을 근로시간으로 보므로, 호출을 받아 병원에서 실제로 촬영한 시간은 근로시간입니다. 집에서 쉬거나 잠을 자며 호출을 기다린 시간이 이 대기시간에 해당하는지는 조문에 기준이 없습니다. 대법원은 병원 방사선기사 등의 자택 당직·콜대기 근무시간이 문제 된 사안에서, 당직 중 업무가 본래 업무의 연장이거나 통상근무와 같으면 당직시간이 근로시간에 포함되지만 근무 밀도가 낮은 대기성의 단속적 업무라면 본래의 업무에 실제로 종사한 시간만을 근로시간으로 보아야 한다고 하면서, 콜대기 근무시간 전부를 근로시간으로 인정한 원심을 심리미진으로 파기했습니다(대법원 2024. 11. 14. 선고 2021다220062 등 판결). 따라서 호출 빈도, 호출 시 출근 시한, 수면 보장 여부 등에 따라 콜 대기 시간의 전부 또는 일부만 근로시간으로 인정될 수 있으며, 결론은 구체적 근무 실태에 따라 달라질 수 있습니다.", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r2", "answer": "콜 대기 시간 전체가 자동으로 근로시간으로 인정되는 것은 아닙니다. 근로자가 사용자의 지휘·감독을 받는 시간은 근로시간이고, 대기시간이라도 자유로운 이용이 보장되지 않고 실질적으로 지휘·감독을 받으면 근로시간에 포함됩니다. [S4]\n\n대법원은 방사선사의 자택 콜대기 사건에서, 자택에서의 대기시간 전부가 근로시간인지 또는 일부만 근로시간인지 판단하려면 통상근무와 콜대기 근무의 업무 내용·근무 밀도 차이, 호출 시 몇 분 안에 출근해야 하는지 등을 심리해야 한다고 판단했습니다(대법원 2024. 11. 14. 선고 2021다220062, 220079, 220086, 220093 판결). [S12] 따라서 호출이 없을 때 집에서 자유롭게 쉬거나 잘 수 있었다는 사정만으로 전체 시간이 근로시간이 아니라고 단정할 수도 없고, 반대로 콜 대기 전체가 곧바로 근로시간이라고 단정할 수도 없습니다. [S12]\n\n근로시간으로 인정되는 시간이 연장근로에 해당하면 통상임금의 50% 이상을 가산하여 지급해야 하고, 오후 10시부터 다음 날 오전 6시 사이의 근로라면 야간근로 가산도 적용됩니다. [S2] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "대법원은 방사선사의 자택 콜대기 사건에서, 자택에서의 대기시간 전부가 근로시간인지 또는 일부만 근로시간인지 판단하려면 통상근무와 콜대기 근무의 업무 내용·근무 밀도 차이, 호출 시 몇 분 안에 출근해야 하는지 등을 심리해야 한다고 판단했습니다(대법원 2024. 11. 14. 선고 2021다220062, 220079, 220086, 220093 판결)."}, "opus": {"ok": false, "quote": "", "reason": "근무 밀도가 낮은 대기성 단속적 당직이면 실제 업무 종사 시간만 근로시간이고, 본래 업무의 연장이거나 통상근무와 같으면 당직시간 전체가 근로시간이라는 판례 기준이 답변에 없습니다."}, "codex": {"ok": false, "quote": "", "reason": "대기성 단속적 당직이면 실제 본래 업무에 종사한 시간만, 본래 업무의 연장이거나 통상근무와 같으면 당직시간 전체를 근로시간으로 본다는 기준이 없습니다."}}, {"run": "v2-qwen3-4B-k10", "answer": "콜 대기 시간 전체가 자동으로 근로시간으로 인정되는 것은 아닙니다. 근로자가 사용자의 지휘·감독을 받는 시간은 근로시간이고, 집에서 쉬거나 자더라도 자유로운 이용이 보장되지 않고 실질적으로 지휘·감독을 받으면 근로시간에 포함될 수 있습니다. [S4][S12]\n\n대법원은 방사선사의 자택 콜 대기 사건에서, 통상근무와 콜 대기 근무의 업무 내용·근무 밀도 차이, 호출 시 몇 분 안에 출근해야 하는지 등을 심리하여 자택 대기시간 전부 또는 일부가 근로시간인지 판단해야 하며, 이러한 심리 없이 대기시간 전부를 근로시간으로 인정할 수는 없다고 판단했습니다(대법원 2024. 11. 14. 선고 2021다220062, 220079, 220086, 220093 판결). [S12]\n\n따라서 질문의 경우 호출이 없을 때 집에서 자유롭게 쉬거나 잘 수 있었는지, 호출 후 출근시간 제한과 대기 중 사용자의 지휘·감독 정도, 실제 촬영 업무의 내용과 빈도 등을 종합하여 전체 또는 일부가 근로시간인지 판단합니다. [S12]\n\n근로시간으로 인정되는 시간이 법정근로시간을 초과하면 연장근로에 대해 통상임금의 50% 이상을 가산하고, 오후 10시부터 다음 날 오전 6시 사이의 근로라면 야간근로에 대해서도 통상임금의 50% 이상을 가산해야 합니다. [S2][S4]\n\n다만 병원이 해당 업무를 감시적·단속적 근로로 보아 고용노동부장관의 승인을 받은 경우에는 근로시간·휴게·휴일 규정이 적용되지 않을 수 있습니다. [S3][S5]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "대법원은 방사선사의 자택 콜 대기 사건에서, 통상근무와 콜 대기 근무의 업무 내용·근무 밀도 차이, 호출 시 몇 분 안에 출근해야 하는지 등을 심리하여 자택 대기시간 전부 또는 일부가 근로시간인지 판단해야 하며, 이러한 심리 없이 대기시간 전부를 근로시간으로 인정할 수는 없다고 판단했습니다(대법원 2024. 11. 14. 선고 2021다220062, 220079, 220086, 220093 판결)."}, "opus": {"ok": false, "quote": "", "reason": "근무 밀도가 낮은 대기성 단속적 당직이면 실제 업무 종사시간만 근로시간이고, 본래 업무의 연장이거나 통상근무와 같으면 당직시간 전체가 근로시간이라는 판례 기준이 답변에 없습니다."}, "codex": {"ok": false, "quote": "", "reason": "대기성 단속적 당직이면 실제 본래 업무에 종사한 시간만, 본래 업무의 연장이거나 통상근무와 같으면 당직시간 전체를 근로시간으로 본다는 기준이 없습니다."}}, {"run": "v2-qwen3-4B-k10-r3", "answer": "콜 대기 시간 전체가 자동으로 근로시간으로 인정되는 것은 아닙니다. 근로자가 사용자의 지휘·감독을 받는 시간은 근로시간이고, 자유롭게 이용할 수 있는 휴게시간은 근로시간이 아닙니다. [S4]\n\n집에서 대기하면서 호출이 없을 때 자유롭게 쉬거나 잠을 잘 수 있었는지, 호출을 받으면 몇 분 안에 병원에 출근해야 하는지, 호출 빈도와 실제 촬영 업무의 내용·시간, 통상근무와 콜 대기 근무의 밀도 차이 등을 종합해 판단합니다. [S12]\n\n대법원은 2024. 11. 14. 선고 2021다220062 등 판결에서, 방사선사의 자택 콜 대기 시간에 대해 위와 같은 사정을 충분히 심리하지 않고 대기 시간 전부를 근로시간으로 인정한 판단은 잘못이라고 판단했습니다. [S12] 따라서 호출이 없던 시간은 근로시간이 아닐 수 있고, 호출을 받아 병원에서 촬영한 시간이나 실질적으로 사용자의 지휘·감독 아래 있던 시간은 근로시간으로 인정될 수 있습니다. [S12]\n\n근로시간으로 인정되어 1일 8시간 또는 1주 40시간을 초과한 연장근로가 되면 통상임금의 50% 이상을 가산해야 하며, 오후 10시부터 다음 날 오전 6시 사이의 야간근로에도 통상임금의 50% 이상을 가산해야 합니다. [S2][S4]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "대법원은 2024. 11. 14. 선고 2021다220062 등 판결에서, 방사선사의 자택 콜 대기 시간에 대해 위와 같은 사정을 충분히 심리하지 않고 대기 시간 전부를 근로시간으로 인정한 판단은 잘못이라고 판단했습니다."}, "opus": {"ok": false, "quote": "따라서 호출이 없던 시간은 근로시간이 아닐 수 있고, 호출을 받아 병원에서 촬영한 시간이나 실질적으로 사용자의 지휘·감독 아래 있던 시간은 근로시간으로 인정될 수 있습니다.", "reason": "실제 촬영 시간이 인정될 수 있다고 '~수 있다'로 유보적으로만 언급하고, 대기성 단속적 업무이면 실제 종사 시간만 근로시간이라는 판례 기준과 본래 업무의 연장이거나 통상근무와 같으면 당직시간 전체가 근로시간이라는 반대 경우가 모두 빠져 있습니다."}, "codex": {"ok": false, "quote": "따라서 호출이 없던 시간은 근로시간이 아닐 수 있고, 호출을 받아 병원에서 촬영한 시간이나 실질적으로 사용자의 지휘·감독 아래 있던 시간은 근로시간으로 인정될 수 있습니다. [S12]", "reason": "근무 밀도가 낮은 대기성 단속적 업무이면 실제 본래 업무에 종사한 시간만 인정하고 본래 업무의 연장이거나 통상근무와 같으면 당직시간 전체를 인정한다는 조건별 기준이 명시되어 있지 않습니다."}}], "pattern": "luna_only_yes"}, {"key": "l5b03-kp1", "id": "l5b03", "level": "L5b", "question": "의원과 '위탁진료계약'을 맺고 2년간 봉직의로 일했습니다. 주중과 토요일 대부분을 그 의원에서 진료했고, 진료 실적과 상관없이 매달 고정된 금액을 받았으며 매달 진료 현황을 보고했습니다. 계약서가 위탁계약이라 퇴직금이 없다고 하는데, 저도 퇴직금을 받을 수 있나요?", "kp_index": 1, "kp": "퇴직금 대상 근로자는 직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람임(근로기준법 제2조제1항제1호, 퇴직급여법 제2조제1호)", "all_kps": ["퇴직금 대상 근로자는 직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람임(근로기준법 제2조제1항제1호, 퇴직급여법 제2조제1호)", "판례: 근로자 여부는 계약 형식보다 실질에 비추어 임금을 목적으로 종속적 관계에서 근로를 제공했는지로 판단함", "판례: 위탁진료계약 형식이라도 정해진 시간·장소 근무, 실적 무관 고정 보수, 진료 현황 보고 등이 있으면 근로기준법상 근로자(퇴직금 지급 대상)에 해당함"], "reference": "받을 수 있을 가능성이 큽니다. 퇴직금을 받는 '근로자'는 근로기준법 제2조제1항제1호에 따라 '직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람'이고, 근로자퇴직급여 보장법도 이 정의를 따릅니다(제2조제1호). 위탁진료계약을 맺은 의사가 이 근로자에 해당하는지는 조문에 판단 기준이 없습니다. 대법원은 의원과 위탁진료계약을 맺고 진료한 의사의 퇴직금이 문제 된 사안에서, 근로자 여부는 계약 형식보다 실질에 비추어 임금을 목적으로 종속적인 관계에서 근로를 제공했는지로 판단해야 한다고 하면서, 계약 형식이 위탁진료계약이더라도 주중과 토요일 대부분을 그 의원에서 근무하고 진료 현황을 보고했으며 실적과 관계없이 고정 보수를 받았다면 근로기준법상 근로자에 해당한다고 판단했습니다(대법원 2023. 9. 21. 선고 2021도11675 판결). 근로자라면 사용자는 퇴직일부터 14일 이내에 퇴직금을 지급해야 합니다(근로자퇴직급여 보장법 제9조제1항). 다만 근로자성은 구체적 근무 실태에 따라 달라질 수 있습니다.", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r2", "answer": "계약서의 명칭이 ‘위탁진료계약’이라는 이유만으로 퇴직금 지급 대상에서 제외되지는 않습니다. 근로자퇴직급여 보장법상 근로자는 근로기준법상 근로자를 말하고, 사용자는 근로기준법상 사용자를 말합니다. [S7] 사용자는 계속근로기간 1년에 대하여 30일분 이상의 평균임금을 퇴직금으로 지급하는 제도를 설정해야 합니다. [S3]\n\n근로자 해당 여부는 계약 형식보다 실질에 따라 판단하며, 업무 내용·근무시간·근무장소를 사용자가 정하는지, 지휘·감독을 받는지, 보수가 근로 자체의 대가인지 등을 종합합니다. [S14] 질문하신 사정인 2년간의 계속 근무, 주중 및 토요일 대부분의 의원 근무, 진료 실적과 무관한 고정 보수, 매월 진료 현황 보고는 근로자성 판단에서 고려되는 사정에 해당합니다. [S14]\n\n대법원은 위탁진료계약의 형식에도 불구하고 정해진 시간과 장소에서 진료하고 매월 고정 보수를 받으며, 근무시간·근무장소 관리와 업무상 상당한 지휘·감독을 받은 의사를 근로기준법상 근로자로 판단했습니다(대법원 2023. 9. 21. 선고 2021도11675 판결). [S14] 따라서 질문의 사실관계가 판례의 사정과 같다면 퇴직금 지급 대상이 될 가능성이 있습니다. 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n퇴직금은 계속근로기간 1년에 대하여 30일분 이상의 평균임금을 기준으로 합니다. [S3]", "luna": {"ok": true, "quote": "근로자퇴직급여 보장법상 근로자는 근로기준법상 근로자를 말하고, 사용자는 근로기준법상 사용자를 말합니다."}, "opus": {"ok": false, "quote": "근로자퇴직급여 보장법상 근로자는 근로기준법상 근로자를 말하고, 사용자는 근로기준법상 사용자를 말합니다.", "reason": "퇴직급여법상 근로자가 근로기준법상 근로자라는 연결만 있고, '직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람'이라는 정의 자체가 없습니다."}, "codex": {"ok": false, "quote": "근로자퇴직급여 보장법상 근로자는 근로기준법상 근로자를 말하고, 사용자는 근로기준법상 사용자를 말합니다.", "reason": "법률 간 근로자 개념의 연결만 설명하고, 직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람이라는 정의는 제시하지 않았습니다."}}, {"run": "v2-qwen3-4B-k10", "answer": "계약서의 명칭이 ‘위탁진료계약’인지보다 실제로 임금을 목적으로 종속적인 관계에서 근로를 제공했는지가 중요합니다. 근로자퇴직급여 보장법상 ‘근로자’는 근로기준법상 근로자를 말하고, 사용자는 퇴직급여제도를 설정해야 합니다. [S7] [S3]\n\n제시하신 사정인 ① 2년간 계속 근무한 점, ② 주중과 토요일 대부분 의원에서 진료한 점, ③ 진료 실적과 무관하게 매월 고정액을 받은 점, ④ 매월 진료 현황을 보고한 점은 종속적인 관계에서 근로를 제공했는지를 판단할 때 중요한 사정입니다. [S14]\n\n대법원은 위탁진료계약의 형식에도 불구하고, 정해진 시간과 장소에서 진료하고 고정된 보수를 받으며 근무 현황을 보고한 의사를 근로기준법상 근로자로 판단했습니다(대법원 2023. 9. 21. 선고 2021도11675 판결). [S14] 따라서 질문의 사실관계가 판례 사안과 같다면 근로자로 인정되어 퇴직금을 받을 가능성이 있습니다. [S14]\n\n퇴직금제도를 설정한 사용자는 계속근로기간 1년에 대하여 30일분 이상의 평균임금을 퇴직금으로 지급하는 제도를 설정해야 합니다. [S3] 다만 실제 지급 여부와 금액은 근로자성, 계속근로기간 및 평균임금 등 구체적인 사실관계에 따라 판단됩니다. [S3] [S14]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "근로자퇴직급여 보장법상 ‘근로자’는 근로기준법상 근로자를 말하고, 사용자는 퇴직급여제도를 설정해야 합니다."}, "opus": {"ok": false, "quote": "근로자퇴직급여 보장법상 ‘근로자’는 근로기준법상 근로자를 말하고, 사용자는 퇴직급여제도를 설정해야 합니다.", "reason": "퇴직급여법상 근로자가 근로기준법상 근로자라는 점만 말하고, '직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람'이라는 법정 정의는 제시하지 않았습니다."}, "codex": {"ok": false, "quote": "근로자퇴직급여 보장법상 ‘근로자’는 근로기준법상 근로자를 말하고, 사용자는 퇴직급여제도를 설정해야 합니다.", "reason": "두 법의 근로자 개념이 같다는 설명은 있으나 직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람이라는 정의는 빠져 있습니다."}}, {"run": "v2-qwen3-4B-k10-r3", "answer": "계약서의 명칭이 ‘위탁진료계약’인지보다, 실질적으로 임금을 목적으로 종속적인 관계에서 근로를 제공했는지가 근로자 해당 여부의 기준입니다. [S14]\n\n질문하신 사정처럼 ① 주중과 토요일 대부분 의원에서 근무하고, ② 진료 실적과 관계없이 매월 고정된 금액을 받으며, ③ 매월 진료 현황을 보고했다면, 근무시간·근무장소에 대한 관리와 업무에 대한 지휘·감독, 근로 자체의 대가인 고정 보수 등이 인정될 가능성이 있습니다. [S14]\n\n대법원은 이와 유사하게 위탁진료계약을 체결한 의사가 정해진 시간과 장소에서 진료하고 매월 고정 보수를 받으며 진료 현황을 보고한 사안에서, 계약 형식과 관계없이 근로기준법상 근로자에 해당한다고 판단했습니다(대법원 2023. 9. 21. 선고 2021도11675 판결). [S14]\n\n근로자에 해당한다면 사용자는 계속근로기간 1년에 대하여 30일분 이상의 평균임금을 퇴직금으로 지급하는 제도를 설정해야 하므로, 2년간 근무한 경우 퇴직금 청구 대상이 될 수 있습니다. [S3]\n\n따라서 계약서에 퇴직금이 없다는 이유만으로 퇴직금 지급이 배제된다고 단정할 수 없습니다. [S14][S3]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "근로자에 해당한다면 사용자는 계속근로기간 1년에 대하여 30일분 이상의 평균임금을 퇴직금으로 지급하는 제도를 설정해야 하므로, 2년간 근무한 경우 퇴직금 청구 대상이 될 수 있습니다."}, "opus": {"ok": false, "quote": "", "reason": "답변은 근로자의 법정 정의(직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람)와 근거 조문(근로기준법 제2조제1항제1호, 퇴직급여법 제2조제1호)을 제시하지 않았습니다."}, "codex": {"ok": false, "quote": "", "reason": "직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람이 퇴직금 대상 근로자라는 정의가 명시되어 있지 않습니다."}}], "pattern": "luna_only_yes"}, {"key": "l5b04-kp3", "id": "l5b04", "level": "L5b", "question": "회사로부터 해고 통보를 이메일로만 받았습니다. 이메일에는 해고 사유와 해고 날짜가 구체적으로 적혀 있고 저도 메일을 열어 확인했습니다. 해고는 서면으로 통지해야 효력이 있다고 들었는데, 이메일 통보도 서면 통지로 인정되나요?", "kp_index": 3, "kp": "판례: 해고 의사가 명확하고 해고사유·시기가 구체적으로 기재되어 있으며 근로자가 이메일을 수신해 내용을 알고 있어야 함", "all_kps": ["해고는 해고사유와 해고시기를 서면으로 통지해야 효력이 있음(근로기준법 제27조)", "판례: 이메일에 의한 해고통지도 구체적 사안에 따라 서면에 의한 해고통지로서 유효할 수 있음", "판례: 해고 의사가 명확하고 해고사유·시기가 구체적으로 기재되어 있으며 근로자가 이메일을 수신해 내용을 알고 있어야 함"], "reference": "인정될 수 있습니다. 근로기준법 제27조는 사용자가 해고사유와 해고시기를 서면으로 통지해야 하고, 서면으로 통지해야 해고의 효력이 있다고 정하지만, 이메일이 '서면'에 해당하는지는 조문에 정의가 없습니다. 대법원은 이메일로 해고를 통지한 사안에서, '서면'은 이메일 등 전자문서와 구별되지만 이메일에 해고 의사가 명확하고 해고사유와 해고시기가 구체적으로 기재되어 서면 통지의 역할과 기능을 충분히 수행하고, 근로자가 이메일을 수신하는 등으로 내용을 알고 있다면 구체적 사안에 따라 서면에 의한 해고통지로서 유효하다고 보아야 할 경우가 있다고 판단했습니다(대법원 2015. 9. 10. 선고 2015두41401 판결). 다만 이는 모든 이메일 통지를 유효로 본 것이 아니므로, 결론은 이메일의 형식과 작성 경위 등 구체적 사실관계에 따라 달라질 수 있습니다.", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r2", "answer": "근로기준법상 사용자는 해고하려면 해고사유와 해고시기를 서면으로 통지해야 하며, 서면으로 통지하지 않은 해고는 효력이 없습니다. [S1]\n\n대법원은 이메일이 전자문서라는 이유만으로 서면 통지가 아니라고 볼 수는 없고, 이메일에 해고사유와 해고시기가 구체적으로 적혀 있으며 근로자가 이를 수신해 내용을 알고 해고에 적절히 대응할 수 있다면, 구체적 사안에 따라 서면에 의한 해고통지로 유효할 수 있다고 판단했습니다(대법원 2015. 9. 10. 선고 2015두41401 판결). [S12]\n\n따라서 질문처럼 이메일에 해고사유와 해고 날짜가 구체적으로 기재되어 있고 이메일을 열어 확인했다면, 이메일 통보가 서면 통지로 인정될 가능성이 있습니다. 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "대법원은 이메일이 전자문서라는 이유만으로 서면 통지가 아니라고 볼 수는 없고, 이메일에 해고사유와 해고시기가 구체적으로 적혀 있으며 근로자가 이를 수신해 내용을 알고 해고에 적절히 대응할 수 있다면, 구체적 사안에 따라 서면에 의한 해고통지로 유효할 수 있다고 판단했습니다(대법원 2015. 9. 10. 선고 2015두41401 판결)."}, "opus": {"ok": false, "quote": "이메일에 해고사유와 해고시기가 구체적으로 적혀 있으며 근로자가 이를 수신해 내용을 알고 해고에 적절히 대응할 수 있다면", "reason": "해고사유·시기의 구체적 기재와 근로자의 수신·내용 인지 요건은 있으나, '해고 의사가 명확해야 한다'는 요건이 빠져 있습니다."}, "codex": {"ok": false, "quote": "대법원은 이메일이 전자문서라는 이유만으로 서면 통지가 아니라고 볼 수는 없고, 이메일에 해고사유와 해고시기가 구체적으로 적혀 있으며 근로자가 이를 수신해 내용을 알고 해고에 적절히 대응할 수 있다면, 구체적 근로자를 '휴직 전과 같은 업무 또는 같은 수준의 임금을 지급하는 직무'에 복귀시키도록 정하고, 제3항은 육아휴직을 이유로 한 불리한 처우를 금지합니다. 대법원은 육아휴직 후 다른 직무로 복귀시킨 사안에서, 복귀 업무가 '같은 업무'이려면 직책이나 직위의 성격과 내용·범위 및 권한·책임 등에서 사회통념상 차이가 없어야 하고, 조직 변화 등을 이유로 같은 수준의 임금을 지급하는 다른 직무로 복귀시키더라도 근로자에게 실질적인 불이익이 있어서는 안 되며, 이는 직무 부여의 필요성, 업무상·생활상 불이익, 사전 협의 노력 등을 종합해 판단해야 한다고 했습니다(대법원 2022. 6. 30. 선고 2017두76005 판결). 팀장 직책과 결재 권한이 사라졌다면 '같은 업무'로 보기 어렵고 실질적 불이익이 문제 될 수 있으나, 위반 여부는 조직개편의 필요성과 협의 경과 등 구체적 사실관계에 따라 달라질 수 있습니다.", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r3", "answer": "임금이 같더라도 육아휴직 후 팀장 직책과 결재 권한을 없애고 다른 업무로 발령한 것이 항상 적법하다고 단정할 수는 없습니다. [S1]\n\n사업주는 동일한 사업 내 동일 가치 노동에 동일한 임금을 지급해야 하며, 동일 가치 노동의 기준은 기술·노력·책임·작업 조건 등입니다. [S1] 따라서 월급이 같더라도 업무의 책임과 내용이 달라졌다면 동일 가치 노동 여부를 별도로 판단해야 합니다. [S1]\n\n또한 사용자는 근로조건에 대해 성을 이유로 차별하거나, 국적·신앙 또는 사회적 신분을 이유로 차별적 처우를 해서는 안 됩니다. [S6] 근로기준법상 임금은 명칭과 관계없이 근로의 대가로 지급되는 모든 금품을 말합니다. [S7]\n\n다만 제시된 근거에는 육아휴직 후 원직 또는 같은 수준의 임금을 지급하는 직무로 복귀시켜야 하는지에 관한 조문이 일부 벌칙 규정으로만 제시되어 있고, 발령의 정당성이나 직책·결재 권한 상실이 위법한 불리한 처우인지에 관한 구체적 기준은 없습니다. 따라서 현재 근거만으로는 해당 발령이 법 위반이라고 단정할 수 없습니다. [S3]\n\n참고로 제8조제1항 위반, 즉 동일 가치 노동에 동일한 임금을 지급하지 않은 경우에는 3년 이하의 징역 또는 3천만원 이하의 벌금 대상입니다. [S3] 이 벌칙 규정은 2026년 11월 27일부터 개정될 예정입니다. [S3]", "luna": {"ok": true, "quote": "따라서 월급이 같더라도 업무의 책임과 내용이 달라졌다면 동일 가치 노동 여부를 별도로 판단해야 합니다."}, "opus": {"ok": false, "quote": "", "reason": "'같은 업무'의 판단 기준(직책·직위의 성격과 내용·범위, 권한·책임 등에서 사회통념상 차이가 없어야 함)에 관한 판례 언급이 없습니다."}, "codex": {"ok": false, "quote": "따라서 월급이 같더라도 업무의 책임과 내용이 달라졌다면 동일 가치 노동 여부를 별도로 판단해야 합니다. [S1]", "reason": "동일 가치 노동 판단만 언급했으며, 같은 업무에 해당하려면 직책·직위의 성격과 내용·범위 및 권한·책임에서 사회통념상 차이가 없어야 한다는 판례 기준은 제시하지 않았습니다."}}], "pattern": "luna_only_yes"}, {"key": "l5b06-kp3", "id": "l5b06", "level": "L5b", "question": "팀장으로 일하다 1년 육아휴직을 다녀왔더니, 그사이 조직개편이 있었다며 팀원도 없는 다른 영업 담당으로 발령을 냈습니다. 월급은 그대로인데 팀장 직책과 결재 권한은 없어졌습니다. 임금이 같으면 법 위반이 아닌가요?", "kp_index": 3, "kp": "판례: 같은 수준의 임금을 지급하는 다른 직무로 복귀시키더라도 실질적인 불이익이 있어서는 안 되며, 직무 부여 필요성·업무상 불이익·사전 협의 노력 등을 종합해 판단함(임금만 같다고 적법한 것 아님)", "all_kps": ["육아휴직을 마친 근로자는 on": "임금이 같다고 항상 적법한 것은 아니라는 취지는 있으나, 실질적인 불이익이 없어야 한다는 기준과 직무 부여 필요성·업무상 불이익·사전 협의 노력 등을 종합한다는 판단 기준이 빠졌습니다."}}], "pattern": "luna_only_yes"}, {"key": "l5b08-kp3", "id": "l5b08", "level": "L5b", "question": "시내버스 기사입니다. 단체협약에는 연차를 쓰려면 정해진 기한 전까지 신청하라고 되어 있는데, 개인 사정으로 그 기한을 넘겨 연차를 신청했더니 회사가 반려했습니다. 연차는 근로자가 원하는 날에 줘야 하는 것 아닌가요? 회사가 근로기준법을 위반한 건가요?", "kp_index": 3, "kp": "판례: 제60조제5항 위반죄는 사용자가 적법한 시기변경권을 행사하지 않은 채 연차휴가를 방해한 경우에 성립함(적법한 시기변경이면 위반 아님)", "all_kps": ["연차휴가는 근로자가 청구한 시기에 주어야 하나, 사업 운영에 막대한 지장이 있으면 사용자가 시기를 변경할 수 있음(근로기준법 제60조제5항)", "판례: 노선버스처럼 정시성이 중요한 사업에서 근로자가 불가피한 사유 없이 단체협약상 휴가 청구 기한을 지키지 않으면, 사용자는 특별한 사정이 없는 한 적법하게 시기변경권을 행사할 수 있음", "판례: 제60조제5항 위반죄는 사용자가 적법한 시기변경권을 행사하지 않은 채 연차휴가를 방해한 경우에 성립함(적법한 시기변경이면 위반 아님)"], "reference": "근로기준법 위반이 아닐 가능성이 큽니다. 근로기준법 제60조제5항은 연차 유급휴가를 근로자가 청구한 시기에 주도록 하면서, 청구한 시기에 휴가를 주는 것이 사업 운영에 막대한 지장이 있는 경우에는 사용자가 그 시기를 변경할 수 있다고 정하지만, 단체협약상 청구 기한을 넘긴 신청이 이에 해당하는지는 조문에 기준이 없습니다. 대법원은 시내버스 회사가 단체협약상 기한을 넘겨 지정한 연차를 반려한 사안에서, 제60조제5항 위반죄는 사용자가 적법한 시기변경권을 행사하지 않은 채 연차휴가를 방해한 경우에 성립하는데, 노선버스처럼 운영의 정시성이 중요한 사업에서 근로자가 불가피한 사유 없이 단체협약상 휴가 청구 기한을 지키지 않았다면 사용자는 특별한 사정이 없는 한 적법하게 시기변경권을 행사할 수 있다고 판단했습니다(대법원 2025. 7. 17. 선고 2021도11886 판결). 다만 기한을 넘긴 개인 사정이 불가피한 사유였는지 등 구체적 사실관계에 따라 결론이 달라질 수 있습니다.", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r2", "answer": "근로자의 연차유급휴가권은 법정 요건을 충족하면 발생하지만, 사용자는 근로자가 청구한 시기에 휴가를 주는 것이 원칙이고 사업 운영에 막대한 지장이 있는 경우에는 그 시기를 변경할 수 있습니다. [S1]\n\n대법원은 노선 여객자동차운송사업처럼 운영의 정시성이 중요한 사업에서 단체협약이 연차 신청기한을 정하고 있는데도 근로자가 불가피한 사유 없이 그 기한을 지키지 않고 신청한 경우, 지정된 시기까지 대체근로자를 확보하기 어려워 사업 운영에 막대한 지장이 발생한다고 보아 사용자가 시기변경권을 행사할 수 있다고 판단했습니다(대법원 2025. 7. 17. 선고 2021도11886 판결). [S13]\n\n따라서 개인 사정이 불가피한 사유에 해당하지 않고, 단체협약상 신청기한을 넘긴 신청으로 대체근로자 확보 등 버스 운행에 막대한 지장이 발생하는 경우라면 회사의 반려가 곧바로 근로기준법 위반이라고 단정하기 어렵습니다. [S13]\n\n반대로 불가피한 사유가 있었거나 회사가 사업 운영에 막대한 지장이 있다는 사정 없이 연차 사용을 거부한 경우라면, 회사는 적법한 시기변경권을 행사한 것으로 보기 어려울 수 있습니다. [S1][S13]\n\n현재 관련 조문은 시행 중이나, 2027년 6월 10일부터 연차휴가 분할청구, 청구 시기 부여 및 불리한 처우 금지 등에 관한 개정 내용이 시행될 예정입니다. [S1] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "반대로 불가피한 사유가 있었거나 회사가 사업 운영에 막대한 지장이 있다는 사정 없이 연차 사용을 거부한 경우라면, 회사는 적법한 시기변경권을 행사한 것으로 보기 어려울 수 있습니다."}, "opus": {"ok": false, "quote": "회사의 반려가 곧바로 근로기준법 위반이라고 단정하기 어렵습니다.", "reason": "위반죄가 적법한 시기변경권 없이 휴가를 방해한 경우에 성립한다는 판례 법리를 밝히지 않았고, 적법한 시기변경이면 위반이 아니라는 점도 '단정하기 어렵다'고 유보적으로만 표현했습니다."}, "codex": {"ok": false, "quote": "따라서 개인 사정이 불가피한 사유에 해당하지 않고, 단체협약상 신청기한을 넘긴 신청으로 대체근로자 확보 등 버스 운행에 막대한 지장이 발생하는 경우라면 회사의 반려가 곧바로 근로기준법 위반이라고 단정하기 어렵습니다.", "reason": "위반이라고 단정하기 어렵다고만 설명하고, 적법한 시기변경권 행사 없이 연차휴가를 방해하면 제60조제5항 위반죄가 성립하며 적법한 시기변경이면 위반이 아니라는 기준을 명시적으로 단언하지 않았습니다."}}, {"run": "v2-qwen3-4B-k10", "answer": "근로자는 연차유급휴가를 청구한 시기에 사용할 수 있지만, 사용자는 그 시기에 휴가를 주는 것이 사업 운영에 막대한 지장이 있는 경우 시기를 변경할 수 있습니다. [S1]\n\n대법원은 노선 여객자동차운송사업처럼 운행의 정시성이 중요한 사업에서 단체협약이 연차 신청기한을 정하고 있는데도 근로자가 불가피한 사유 없이 그 기한을 지키지 않고 연차를 신청한 경우, 지정된 휴가 시기까지 대체근로자를 확보하기 어려워 사업 운영에 막대한 지장이 발생한다고 보아 사용자가 원칙적으로 시기변경권을 행사할 수 있다고 판단했습니다(대법원 2025. 7. 17. 선고 2021도11886 판결). [S13]\n\n따라서 개인 사정만으로 신청기한을 넘겼고 불가피한 사유가 없었다면, 회사가 단체협약상 신청기한과 대체근로자 확보의 어려움 등을 이유로 연차를 반려한 것만으로 근로기준법 위반이라고 단정하기 어렵습니다. [S13]\n\n다만 신청기한을 지키지 못한 불가피한 사유가 있었거나, 회사가 실제로 사업 운영에 막대한 지장이 있는지 검토하지 않고 연차를 거부한 경우에는 달리 판단될 수 있습니다. [S1] [S13]\n\n현재 근거상 제60조는 시행 중이며, 2027년 6월 10일부터 연차의 분할 청구, 청구 시기 부여 원칙 및 사용을 이유로 한 불리한 처우 금지 등에 관한 제5항·제6항·제9항이 시행될 예정입니다. [S1]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "따라서 개인 사정만으로 신청기한을 넘겼고 불가피한 사유가 없었다면, 회사가 단체협약상 신청기한과 대체근로자 확보의 어려움 등을 이유로 연차를 반려한 것만으로 근로기준법 위반이라고 단정하기 어렵습니다."}, "opus": {"ok": false, "quote": "회사가 단체협약상 신청기한과 대체근로자 확보의 어려움 등을 이유로 연차를 반려한 것만으로 근로기준법 위반이라고 단정하기 어렵습니다.", "reason": "위반이라고 단정하기 어렵다고만 유보적으로 말할 뿐, 제60조제5항 위반죄가 적법한 시기변경권을 행사하지 않고 휴가를 방해한 경우에 성립한다는 요건은 명시하지 않았다."}, "codex": {"ok": false, "quote": "따라서 개인 사정만으로 신청기한을 넘겼고 불가피한 사유가 없었다면, 회사가 단체협약상 신청기한과 대체근로자 확보의 어려움 등을 이유로 연차를 반려한 것만으로 근로기준법 위반이라고 단정하기 어렵습니다.", "reason": "위반이라고 단정하기 어렵다고만 설명하며, 적법한 시기변경권 행사 없이 연차휴가를 방해한 경우 제60조제5항 위반죄가 성립한다는 판례의 성립 요건을 명시하지 않았습니다."}}, {"run": "v2-qwen3-4B-k10-r3", "answer": "근로자는 연차유급휴가를 청구한 시기에 사용할 수 있는 것이 원칙이지만, 사용자는 그 시기에 휴가를 주는 것이 사업 운영에 막대한 지장이 있는 경우 시기를 변경할 수 있습니다. [S1]\n\n대법원은 노선 여객자동차운송사업처럼 운행의 정시성이 중요한 사업에서 단체협약이 연차 신청기한을 정하고 있는데도 근로자가 불가피한 사유 없이 그 기한을 지키지 않고 연차를 신청한 경우, 지정된 휴가 시기까지 대체근로자를 확보하기 어려워 사업 운영에 막대한 지장이 발생하는 것으로 보아 사용자가 원칙적으로 적법하게 시기를 변경할 수 있다고 판단했습니다(대법원 2025. 7. 17. 선고 2021도11886 판결). [S13]\n\n따라서 개인 사정이 불가피한 사유에 해당하지 않고, 단체협약상 신청기한을 지키지 않아 대체근로자 확보 등 운행에 막대한 지장이 발생하는 사안이라면, 회사의 반려만으로 근로기준법 위반이라고 단정하기 어렵습니다. [S13]\n\n반대로 불가피한 사유가 있었거나 회사가 실제로 사업 운영에 막대한 지장이 있는지에 관한 사정이 없다면, 회사는 단순히 신청기한을 이유로 거부할 수 없고 시기변경권의 요건을 충족해야 합니다. [S1] [S13]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n현재 관련 조문은 시행 중이지만, 2027년 6월 10일부터 연차의 분할 청구, 청구 시기 부여 및 불이익 처우 금지 등에 관한 개정 내용이 시행될 예정입니다. [S1]", "luna": {"ok": true, "quote": "따라서 개인 사정이 불가피한 사유에 해당하지 않고, 단체협약상 신청기한을 지키지 않아 대체근로자 확보 등 운행에 막대한 지장이 발생하는 사안이라면, 회사의 반려만으로 근로기준법 위반이라고 단정하기 어렵습니다."}, "opus": {"ok": false, "quote": "회사의 반려만으로 근로기준법 위반이라고 단정하기 어렵습니다.", "reason": "제60조제5항 위반죄가 적법한 시기변경권을 행사하지 않은 채 연차휴가를 방해한 경우에 성립한다는 판례의 성립요건을 명시적으로 단언하지 않고, 위반이라고 단정하기 어렵다는 결론만 제시했습니다."}, "codex": {"ok": false, "quote": "따라서 개인 사정이 불가피한 사유에 해당하지 않고, 단체협약상 신청기한을 지키지 않아 대체근로자 확보 등 운행에 막대한 지장이 발생하는 사안이라면, 회사의 반려만으로 근로기준법 위반이라고 단정하기 어렵습니다. [S13]", "reason": "위반이라고 단정하기 어렵다고만 서술했으며, 적법한 시기변경권 행사 없이 연차휴가를 방해한 경우 위반죄가 성립하고 적법한 시기변경이면 위반이 아니라는 판례의 성립 기준은 명시하지 않았습니다."}}], "pattern": "luna_only_yes"}, {"key": "n02-kp1", "id": "n02", "level": "L3", "question": "직원 6명으로 1년 전에 새로 창업한 회사입니다. 확정급여형이나 확정기여형 퇴직연금을 따로 만들지 않고, 직원 동의를 받아 각자의 개인형퇴직연금(IRP)에 돈을 넣어줘도 퇴직급여제도를 갖춘 것이 되나요? 얼마씩 넣어야 하나요?", "kp_index": 1, "kp": "새로 성립된 사업은 원칙적으로 성립 후 1년 이내에 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 함", "all_kps": ["새로 성립된 사업은 원칙적으로 성립 후 1년 이내에 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 함", "상시 10명 미만 사업은 개별 근로자의 동의를 받아 개인형퇴직연금제도를 설정하면 퇴직급여제도를 설정한 것으로 봄", "사용자는 가입자별 연간 임금총액의 12분의 1 이상을 현금으로 매년 1회 이상 IRP 계정에 납입해야 함"], "reference": "새로 성립된 사업은 원칙적으로 1년 이내에 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 하지만(근로자퇴직급여 보장법 제5조), 상시 10명 미만 사업은 제25조제1항에 따라 개별 근로자의 동의를 받거나 근로자의 요구로 개인형퇴직연금제도를 설정하면 퇴직급여제도를 설정한 것으로 봅니다. 이 경우 사용자는 가입자별 연간 임금총액의 12분의 1 이상을 현금으로 매년 1회 이상 정기적으로 IRP 계정에 납입해야 합니다(제25조제2항).", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r2", "answer": "직원 6명인 사업은 상시 10명 미만 사업에 해당하므로, 사용자가 개별 근로자의 동의를 받아 개인형퇴직연금제도를 설정하면 해당 근로자에 대한 퇴직급여제도를 설정한 것으로 봅니다. [S1]\n\n따라서 확정급여형 또는 확정기여형 퇴직연금제도를 별도로 설정하지 않고 직원별 IRP를 이용하는 방식도 가능합니다. 다만 직원별 동의를 받아야 하고, 사용자가 퇴직연금사업자를 선정하는 경우에도 개별 근로자의 동의를 받아야 합니다. 근로자가 요구하면 근로자가 직접 퇴직연금사업자를 선정할 수 있습니다. [S1]\n\n사용자는 각 가입자의 연간 임금총액의 12분의 1 이상을 현금으로 해당 가입자의 IRP 계정에 납입해야 합니다. [S1] 또한 매년 1회 이상 정기적으로 납입해야 하며, 납입이 지연되면 지연이자도 납입해야 합니다. [S1]\n\n예를 들어 연간 임금총액이 3,600만 원이면 최소 부담금은 300만 원이고, 월별로 균등하게 납입한다면 월 25만 원입니다. 이는 연간 임금총액을 12로 나눈 금액이라는 계산에 따른 것입니다. [S1]\n\n가입자는 사용자 부담금 외에 추가 부담금을 납입할 수 있고, 사용자 부담금에 대한 수수료는 사용자가, 가입자가 추가로 납입한 부담금에 대한 수수료는 가입자가 부담합니다. [S6]\n\n직원이 퇴직할 때까지 부담금을 납입하지 않은 경우 사용자는 퇴직일부터 14일 이내에 미납 부담금과 지연이자를 해당 IRP 계정에 납입해야 합니다. 특별한 사정이 있으면 당사자 간 합의로 납입기일을 연장할 수 있습니다. [S1][S6]\n\n반대로 개인형퇴직연금제도를 설정하지 않으면 퇴직금제도를 설정한 것으로 봅니다. [S10]", "luna": {"ok": true, "quote": "직원 6명인 사업은 상시 10명 미만 사업에 해당하므로, 사용자가 개별 근로자의 동의를 받아 개인형퇴직연금제도를 설정하면 해당 근로자에 대한 퇴직급여제도를 설정한 것으로 봅니다."}, "opus": {"ok": false, "quote": "", "reason": "답변에는 새로 성립된 사업이 성립 후 1년 이내에 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 한다는 원칙이 없고, 1년이라는 기한도 언급되지 않음."}, "codex": {"ok": false, "quote": "", "reason": "새로 성립된 사업이 원칙적으로 성립 후 1년 이내에 확정급여형 또는 확정기여형 퇴직연금제도를 설정해야 한다는 내용이 없습니다."}}], "pattern": "luna_only_yes"}, {"key": "n03-kp1", "id": "n03", "level": "L3", "question": "직원 한 명에게 확정급여형(DB)과 확정기여형(DC) 퇴직연금을 함께 설정하려고 합니다. 이 경우에도 DC형 부담금은 연간 임금총액의 12분의 1 이상을 전부 넣어야 하나요?", "kp_index": 1, "kp": "확정기여형 단독 설정 시 사용자는 연간 임금총액의 12분의 1 이상을 부담금으로 납입해야 함", "all_kps": ["확정기여형 단독 설정 시 사용자는 연간 임금총액의 12분의 1 이상을 부담금으로 납입해야 함", "DB와 DC를 함께 설정하면 DC 부담금은 제20조제1항의 부담 수준에 규약으로 정한 설정 비율을 곱한 금액임", "DB·DC 설정 비율의 합이 1 이상이 되도록 규약을 정해야 함"], "reference": "확정기여형만 설정한 경우에는 연간 임금총액의 12분의 1 이상을 납입해야 하지만(근로자퇴직급여 보장법 제20조제1항), 확정급여형과 함께 설정하면 제6조제1항에 따라 DC 부담금은 그 부담 수준에 확정기여형퇴직연금규약으로 정한 설정 비율을 곱한 금액이 됩니다. 다만 DB와 DC 설정 비율의 합은 1 이상이 되도록 퇴직연금규약을 정해야 합니다(제6조제2항).", "note": "", "answers": [{"run": "v2-qwen3-4B-k10", "answer": "아닙니다. DB형과 DC형을 함께 설정하는 경우에는 DC형 부담금을 연간 임금총액의 12분의 1 전부 납입하는 것이 아니라, DC형 설정비율을 곱한 금액 이상으로 납입할 수 있습니다. [S1]\n\n구체적으로 DB형 급여는 법정 급여수준에 DB형 설정비율을 곱한 금액으로, DC형 부담금은 연간 임금총액의 12분의 1 이상에 DC형 설정비율을 곱한 금액으로 정합니다. [S1][S2]\n\n다만 DB형과 DC형의 설정비율 합계가 1 이상이 되도록 퇴직연금규약을 정해야 합니다. [S1]\n\n따라서 예를 들어 DB형 설정비율이 60%, DC형 설정비율이 40%라면, DC형 부담금은 연간 임금총액의 12분의 1에 40%를 곱한 금액 이상으로 정할 수 있습니다. [S1][S2]\n\n두 제도를 함께 설정하려면 각 제도의 사항을 포함한 퇴직연금규약을 작성하고, 근로자대표의 동의를 얻거나 의견을 들은 뒤 신고해야 합니다. [S3][S5][S11]", "luna": {"ok": true, "quote": "구체적으로 DB형 급여는 법정 급여수준에 DB형 설정비율을 곱한 금액으로, DC형 부담금은 연간 임금총액의 12분의 1 이상에 DC형 설정비율을 곱한 금액으로 정합니다."}, "opus": {"ok": false, "quote": "DC형 부담금을 연간 임금총액의 12분의 1 전부 납입하는 것이 아니라", "reason": "DC형만 설정할 때 사용자가 연간 임금총액의 12분의 1 이상을 납입해야 한다는 원칙은 대비로 암시될 뿐 명시적으로 단언되지 않았습니다."}, "codex": {"ok": false, "quote": "", "reason": "DC형 단독 설정 시 사용자가 연간 임금총액의 12분의 1 이상을 납입해야 한다는 의무는 명시하지 않았습니다."}}, {"run": "v2-qwen3-4B-k10-r3", "answer": "아닙니다. DB형과 DC형을 함께 설정하는 경우, DC형 부담금은 연간 임금총액의 12분의 1에 DC형 설정 비율을 곱한 금액 이상으로 정할 수 있습니다. [S1]\n\n다만 DB형 급여의 설정 비율과 DC형 부담금의 설정 비율의 합이 1 이상이 되도록 퇴직연금규약을 정해야 합니다. [S1]\n\n따라서 DC형 설정 비율이 40%라면, DC형 부담금은 원칙적으로 연간 임금총액의 12분의 1에 40%를 곱한 금액 이상으로 정하고, 나머지 설정 비율은 DB형에 반영하는 방식입니다. [S1]\n\n이와 같은 혼합형 퇴직연금규약은 근로자대표의 동의 또는 의견을 거쳐 작성·신고해야 합니다. [S3] [S11]", "luna": {"ok": true, "quote": "아닙니다. DB형과 DC형을 함께 설정하는 경우, DC형 부담금은 연간 임금총액의 12분의 1에 DC형 설정 비율을 곱한 금액 이상으로 정할 수 있습니다."}, "opus": {"ok": false, "quote": "", "reason": "답변은 혼합 설정 시의 부담금만 설명하고, DC형 단독 설정 시 연간 임금총액의 12분의 1 이상을 납입해야 한다는 원칙은 명시하지 않았습니다."}, "codex": {"ok": false, "quote": "", "reason": "DC형 단독 설정 시 사용자가 연간 임금총액의 12분의 1 이상을 납입해야 한다는 의무는 명시하지 않았습니다."}}], "pattern": "luna_only_yes"}, {"key": "n07-kp2", "id": "n07", "level": "L3", "question": "회사에 계속 다니고 있는데 석 달째 월급이 밀렸습니다. 노동청에 진정해서 체불 임금등·사업주 확인서도 받았는데, 퇴직하지 않아도 국가가 대신 주는 대지급금을 받을 수 있나요? 받는다면 어느 기간의 임금이 대상인가요?", "kp_index": 2, "kp": "재직자 대지급금 범위는 소송·진정 등 제기일 기준 맨 나중 체불일부터 소급 3개월간의 미지급 임금 등임", "all_kps": ["제7조의 대지급금은 퇴직한 근로자 대상이지만, 사업주가 제7조제1항제4호·제5호(판결 등 또는 체불 임금등·사업주 확인서 발급)에 해당하면 재직 근로자도 대지급금을 받을 수 있음", "재직자 대지급금 범위는 소송·진정 등 제기일 기준 맨 나중 체불일부터 소급 3개월간의 미지급 임금 등임"], "reference": "대지급금은 원칙적으로 퇴직한 근로자에게 지급되지만(임금채권보장법 제7조), 사업주가 제7조제1항제4호(확정판결 등) 또는 제5호(체불 임금등·사업주 확인서로 미지급 확인)에 해당하면 근로계약이 종료되지 않은 재직 근로자도 대지급금을 청구할 수 있습니다(제7조의2제1항). 대상은 진정 등을 제기한 날을 기준으로 맨 나중의 임금 체불이 발생한 날부터 소급하여 3개월 동안의 미지급 임금·휴업수당·출산전후휴가급여이며, 한 사업에서 1회만 지급됩니다(제7조의2제2항·제4항).", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r3", "answer": "퇴직하지 않은 재직 근로자도 대지급금을 받을 수 있습니다. 다만 사업주가 법 제7조제1항제4호의 판결·명령·조정·결정 등에 해당하거나, 제5호에 따라 체불 임금등·사업주 확인서로 미지급 임금등이 확인된 경우여야 합니다. [S2]\n\n또한 재직 근로자는 소송·진정 등을 제기할 당시 근로계약이 종료되지 않았고, 사업주가 일정 기간 이상 사업을 했으며, 임금액·신청기간 등 시행령상 기준을 충족해야 합니다. [S3] [S6]\n\n질문처럼 체불 임금등·사업주 확인서를 받은 경우에는, 가장 최근의 임금 체불이 발생한 날부터 소급하여 3개월 동안 지급되어야 했으나 지급받지 못한 임금이 대상입니다. 같은 기간의 미지급 휴업수당과 출산전후휴가기간 중 급여도 대상에 포함될 수 있습니다. [S2]\n\n따라서 석 달째 월급이 밀렸다면, 법정 요건과 상한액 범위에서 그 최근 3개월분의 미지급 임금이 대상이 될 수 있습니다. 대지급금은 해당 사업에서 재직하는 동안 1회만 지급됩니다. [S2]\n\n체불 임금등·사업주 확인서에 따른 대지급금은 확인서가 최초로 발급된 날부터 6개월 이내에 청구해야 하며, 청구서는 확인서 원본 또는 사본을 첨부하여 근로복지공단에 제출해야 합니다. [S4] [S13]\n\n공단은 특별한 사유가 없으면 청구서를 제출받은 날부터 14일 이내에 지급 여부를 결정하고 지급해야 합니다. [S8]", "luna": {"ok": true, "quote": "질문처럼 체불 임금등·사업주 확인서를 받은 경우에는, 가장 최근의 임금 체불이 발생한 날부터 소급하여 3개월 동안 지급되어야 했으나 지급받지 못한 임금이 대상입니다."}, "opus": {"ok": false, "quote": "질문처럼 체불 임금등·사업주 확인서를 받은 경우에는, 가장 최근의 임금 체불이 발생한 날부터 소급하여 3개월 동안 지급되어야 했으나 지급받지 못한 임금이 대상입니다.", "reason": "맨 나중 체불일부터 소급 3개월이라는 내용은 있으나, 그 체불일을 소송·진정 등 제기일을 기준으로 정한다는 조건이 빠져 있다."}, "codex": {"ok": false, "quote": "질문처럼 체불 임금등·사업주 확인서를 받은 경우에는, 가장 최근의 임금 체불이 발생한 날부터 소급하여 3개월 동안 지급되어야 했으나 지급받지 못한 임금이 대상입니다.", "reason": "맨 나중 체불일부터 소급 3개월이라는 기간은 명시했지만, 맨 나중 체불일을 소송·진정 등 제기일 기준으로 정한다는 조건이 빠져 있습니다."}}], "pattern": "luna_only_yes"}, {"key": "n09-kp2", "id": "n09", "level": "L2", "question": "6개월 단위의 탄력적 근로시간제를 도입하려고 합니다. 근무일이 끝나고 다음 근무일 시작 전까지 최소 몇 시간을 쉬게 해야 하 전하는 방법으로 지급", "55세 이후 퇴직 등 대통령령으로 정한 사유가 있으면 예외", "계정을 지정하지 않으면 근로자 명의의 개인형퇴직연금제도 계정으로 이전"], "reference": "원칙적으로 퇴직금은 근로자가 지정한 개인형퇴직연금제도 계정 등으로 이전하는 방식으로 지급되며, 지정하지 않으면 본인 명의 IRP 계정으로 이전됩니다. 다만 55세 이후 퇴직, 고시 금액 이하 급여, 사망 등 시행령 사유가 있으면 예외입니다(근로자퇴직급여 보장법 제9조제2항·제3항, 시행령 제3조의2).", "note": "", "answers": [{"run": "v2-qwen3-4B-k10", "answer": "원칙적으로 퇴직금은 근로자가 지정한 개인형퇴직연금제도(IRP) 계정 또는 중소기업퇴직연금기금제도 계정으로 이전하는 방법으로 지급해야 합니다. [S1]\n\n근로자가 계정을 지정하지 않으면 근로자 명의의 개인형퇴직연금제도 계정으로 이전합니다. [S1]\n\n다만 다음과 같은 경우에는 본인 통장으로 직접 지급될 수 있습니다: ① 55세 이후 퇴직하여 급여를 받는 경우, ② 급여가 고용노동부장관이 정한 금액 이하인 경우, ③ 근로자가 사망한 경우, ④ 퇴직 후 국외로 출국한 경우, ⑤ 다른 법령에 따라 급여의 전부 또는 일부를 공제하는 경우입니다. [S2]\n\n퇴직금은 지급사유가 발생한 날부터 14일 이내에 지급해야 하며, 특별한 사정이 있으면 당사자 간 합의로 지급기일을 연장할 수 있습니다. [S1]\n\n대법원은 지급기일을 연장하기로 합의했더라도 연장된 지급기일까지 퇴직금을 지급하지 않으면 퇴직급여 보장법 위반죄가 성립한다고 판단했습니다(대법원 2023. 7. 13. 선고 2023도188 판결). [S14] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "원칙적으로 퇴직금은 근로자가 지정한 개인형퇴직연금제도(IRP) 계정 또는 중소기업퇴직연금기금제도 계정으로 이전하는 방법으로 지급해야 합니다."}, "opus": {"ok": true, "quote": "원칙적으로 퇴직금은 근로자가 지정한 개인형퇴직연금제도(IRP) 계정 또는 중소기업퇴직연금기금제도 계정으로 이전하는 방법으로 지급해야 합니다.", "reason": "근로자가 지정한 IRP 계정으로 이전하는 원칙을 명시했습니다. 다만 '제23조의8 계정'을 '중소기업퇴직연금기금제도 계정'이라는 명칭으로 썼고, 둘이 같은 계정인지는 주어진 정보만으로 확인할 수 없습니다."}, "codex": {"ok": false, "quote": "원칙적으로 퇴직금은 근로자가 지정한 개인형퇴직연금제도(IRP) 계정 또는 중소기업퇴직연금기금제도 계정으로 이전하는 방법으로 지급해야 합니다. [S1]", "reason": "IRP 계정으로 이전한다는 원칙은 명시했지만, 제시된 내용만으로는 중소기업퇴직연금기금제도 계정이 제23조의8 계정과 같은지 확인할 수 없습니다."}}], "pattern": "codex_only_no"}, {"key": "g024-kp1", "id": "g024", "level": "L3", "question": "무주택자인데 전세보증금 때문에 퇴직금 중간정산을 받을 수 있나요? 몇 번까지 되나요?", "kp_index": 1, "kp": "주택구입 등 대통령령 사유로 근로자가 요구하면 퇴직 전 중간정산 가능", "all_kps": ["주택구입 등 대통령령 사유로 근로자가 요구하면 퇴직 전 중간정산 가능", "무주택자가 주거 목적으로 전세금 또는 보증금을 부담하는 경우가 사유에 해당", "하나의 사업에 근로하는 동안 1회로 한정"], "reference": "가능합니다. 무주택자가 주거 목적으로 전세금이나 보증금을 부담하는 경우는 중간정산 사유이며, 하나의 사업에 근로하는 동안 1회로 한정됩니다. 정산 후 계속근로기간은 정산시점부터 새로 계산합니다(근로자퇴직급여 보장법 제8조제2항, 시행령 제3조제1항제2호).", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r3", "answer": "네. 무주택자인 근로자가 주거 목적으로 전세금 또는 보증금을 부담하는 경우에는 퇴직금 중간정산 사유에 해당할 수 있습니다. [S1]\n\n다만 근로자가 하나의 사업에 근로하는 동안 전세금 또는 보증금 부담을 사유로 중간정산을 받을 수 있는 횟수는 1회로 한정됩니다. [S1]\n\n중간정산은 근로자가 퇴직하기 전에 요구하는 경우 사용자가 미리 정산하여 지급할 수 있는 제도이며, 사용자가 반드시 지급해야 하는 것은 조문상 명시되어 있지 않습니다. [S2]", "luna": {"ok": true, "quote": "중간정산은 근로자가 퇴직하기 전에 요구하는 경우 사용자가 미리 정산하여 지급할 수 있는 제도이며, 사용자가 반드시 지급해야 하는 것은 조문상 명시되어 있지 않습니다."}, "opus": {"ok": true, "quote": "중간정산은 근로자가 퇴직하기 전에 요구하는 경우 사용자가 미리 정산하여 지급할 수 있는 제도이며", "reason": "근로자가 요구하면 퇴직 전 중간정산이 가능하다는 핵심은 단언했고, 정해진 '중간정산 사유'가 필요하다는 점도 담았으나 '대통령령'과 '주택구입' 예시는 명시하지 않았다."}, "codex": {"ok": false, "quote": "중간정산은 근로자가 퇴직하기 전에 요구하는 경우 사용자가 미리 정산하여 지급할 수 있는 제도이며, 사용자가 반드시 지급해야 하는 것은 조문상 명시되어 있지 않습니다. [S2]", "reason": "근로자의 요구에 따른 퇴직 전 중간정산 가능성은 명시했지만, 주택구입 등 대통령령으로 정한 사유라는 조건은 언급하지 않았습니다."}}], "pattern": "codex_only_no"}, {"key": "l5a01-kp2", "id": "l5a01", "level": "L5a", "question": "기간을 정하지 않고 일하던 중 회사에서 '계약종료통지서'를 받았는데 계약을 끝내는 날짜만 있고 왜 끝내는지는 아무 사유도 적혀 있지 않습니다. 회사는 제가 이유를 이미 알고 있으니 문제없다고 하는데, 이런 해고 통지도 효력이 있나요?", "kp_index": 2, "kp": "해고사유가 전혀 기재되지 않은 서면 통지는 제27조 위반으로 해고의 효력 없음", "all_kps": ["해고는 해고사유와 해고시기를 서면으로 통지해야 효력이 있음(근로기준법 제27조)", "해고사유가 전혀 기재되지 않은 서면 통지는 제27조 위반으로 해고의 효력 없음", "근로자가 해고사유를 이미 알고 있었다는 사정만으로 위반이 치유되지 않음"], "reference": "효력이 없습니다. 근로기준법 제27조는 해고사유와 해고시기를 서면으로 통지해야 해고의 효력이 있다고 정하고 있으므로, 사유가 전혀 적히지 않은 통지서로는 해고 통지 요건을 갖추지 못합니다. 서면 통지가 효력 요건이므로 근로자가 이유를 이미 알고 있었다는 사정으로 대신할 수 없습니다.", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r2", "answer": "근로자를 해고하려면 사용자는 해고사유와 해고시기를 서면으로 통지해야 하며, 이를 서면으로 통지하지 않은 해고는 효력이 없습니다. [S1]\n\n대법원은 기간을 정하지 않은 고용계약에서 회사가 교부한 계약종료통지서에 계약종료 사유나 근거규정이 전혀 기재되지 않은 사안에서, 그 통지서가 해고사유를 전혀 기재하지 않았으므로 근로기준법 제27조를 위반한 해고통지라고 판단했습니다(대법원 2021. 2. 25. 선고 2017다226605 판결). 따라서 근로자가 해고 이유를 이미 알고 있었더라도, 해고통지서에 해고사유가 전혀 없다면 원칙적으로 효력이 인정되기 어렵습니다. [S13]\n\n다만 해고통지서라는 명칭이 아니더라도 근로자의 처지에서 해고사유를 구체적으로 알 수 있는 서면이면 충분하다고 대법원은 판단했습니다(대법원 2021. 7. 29. 선고 2021두36103 판결). [S14]\n\n질문의 계약종료통지서에 종료 날짜만 있고 해고사유가 전혀 없다면, 위 판례에 비추어 근로기준법 제27조에 따른 서면통지 요건을 갖추지 못한 해고로 볼 가능성이 큽니다. [S1] [S13]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "따라서 근로자가 해고 이유를 이미 알고 있었더라도, 해고통지서에 해고사유가 전혀 없다면 원칙적으로 효력이 인정되기 어렵습니다."}, "opus": {"ok": true, "quote": "그 통지서가 해고사유를 전혀 기재하지 않았으므로 근로기준법 제27조를 위반한 해고통지라고 판단했습니다(대법원 2021. 2. 25. 선고 2017다226605 판결). 따라서 근로자가 해고 이유를 이미 알고 있었더라도, 해고통지서에 해고사유가 전혀 없다면 원칙적으로 효력이 인정되기 어렵습니다.", "reason": "해고사유를 전혀 적지 않은 통지가 제27조 위반이라고 단언했고, '원칙적으로 효력이 인정되기 어렵다'는 완화된 표현이지만 해고의 효력이 없다는 의미는 같다."}, "codex": {"ok": false, "quote": "따라서 근로자가 해고 이유를 이미 알고 있었더라도, 해고통지서에 해고사유가 전혀 없다면 원칙적으로 효력이 인정되기 어렵습니다. [S13]", "reason": "사유가 전혀 없는 통지가 제27조 위반이라고 설명했지만, 해고의 효력이 없다고 단언하지 않고 원칙적으로 인정되기 어렵다고 유보했습니다."}}, {"run": "v2-qwen3-4B-k10", "answer": "근로자를 해고하려면 사용자는 해고사유와 해고시기를 서면으로 통지해야 하며, 이를 서면으로 통지하지 않은 해고는 효력이 없습니다. [S1]\n\n따라서 기간을 정하지 않고 근무하던 중 받은 계약종료통지서가 해고통지에 해당하고, 종료일만 적혀 있을 뿐 해고사유가 전혀 기재되어 있지 않다면 근로기준법 제27조 위반에 해당할 수 있습니다. [S1]\n\n대법원은 근로자가 해고사유를 이미 알고 있고 대응할 수 있었더라도, 사용자가 서면으로 통지하면서 해고사유를 전혀 기재하지 않았다면 근로기준법 제27조를 위반한 해고통지라고 판단했습니다(대법원 2021. 2. 25. 선고 2017다226605 판결). [S13]\n\n다만 해고통지서라는 명칭이 아니더라도, 근로자의 처지에서 해고사유를 구체적으로 알 수 있는 서면이면 서면통지로 인정될 수 있다고 대법원은 판단했습니다(대법원 2021. 7. 29. 선고 2021두36103 판결). [S14]\n\n질문처럼 계약종료통지서에 종료일만 있고 해고사유가 전혀 없다면, 회사가 “이유를 이미 알고 있다”고 주장하는 것만으로는 서면통지 요건을 충족했다고 보기 어렵습니다. [S13]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "따라서 기간을 정하지 않고 근무하던 중 받은 계약종료통지서가 해고통지에 해당하고, 종료일만 적혀 있을 뿐 해고사유가 전혀 기재되어 있지 않다면 근로기준법 제27조 위반에 해당할 수 있습니다. [S1]"}, "opus": {"ok": false, "quote": "종료일만 적혀 있을 뿐 해고사유가 전혀 기재되어 있지 않다면 근로기준법 제27조 위반에 해당할 수 있습니다.", "reason": "사유가 없는 통지의 제27조 위반을 '해당할 수 있습니다'로 유보적으로만 표현했고, 그런 통지에 따른 해고의 효력이 없다는 결론은 명시하지 않아 핵심 사실이 빠짐."}, "codex": {"ok": true, "quote": "근로자를 해고하려면 사용자는 해고사유와 해고시기를 서면으로 통지해야 하며, 이를 서면으로 통지하지 않은 해고는 효력이 없습니다. [S1]\n\n대법원은 근로자가 해고사유를 이미 알고 있고 대응할 수 있었더라도, 사용자가 서면으로 통지하면서 해고사유를 전혀 기재하지 않았다면 근로기준법 제27조를 위반한 해고통지라고 판단했습니다(대법원 2021. 2. 25. 선고 2017다226605 판결). [S13]", "reason": "해고사유를 전혀 기재하지 않은 서면통지는 제27조 위반이라고 단언하고, 해고사유의 서면통지가 없는 해고는 효력이 없다고 명시하고 있습니다."}}, {"run": "v2-qwen3-4B-k10-r3", "answer": "근로자를 해고하려면 사용자는 해고사유와 해고시기를 서면으로 통지해야 하며, 이를 서면으로 통지하지 않은 해고는 효력이 없습니다. [S1]\n\n따라서 계약종료통지서에 종료일만 있고 해고사유가 전혀 기재되어 있다면, 원칙적으로 근로기준법 제27조에 따른 서면통지 요건을 갖추지 못한 것으로 볼 수 있습니다. [S1]\n\n대법원은 근로자가 해고사유를 이미 알고 있고 대응할 수 있었더라도, 사용자가 서면으로 통지하면서 해고사유를 전혀 기재하지 않았다면 근로기준법 제27조를 위반한 해고통지라고 판단했습니다(대법원 2021. 2. 25. 선고 2017다226605 판결). [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n또한 대법원은 계약종료통지서가 실질적으로 해고통지서에 해당하고 해고사유가 전혀 기재되지 않은 경우, 근로자가 그 사유를 구체적으로 알고 있었다는 사정만으로 제27조 위반이 아니라고 볼 수 없다고 판단했습니다(대법원 2021. 2. 25. 선고 2017다226605 판결). [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "따라서 계약종료통지서에 종료일만 있고 해고사유가 전혀 기재되어 있다면, 원칙적으로 근로기준법 제27조에 따른 서면통지 요건을 갖추지 못한 것으로 볼 수 있습니다."}, "opus": {"ok": false, "quote": "따라서 계약종료통지서에 종료일만 있고 해고사유가 전혀 기재되어 있다면, 원칙적으로 근로기준법 제27조에 따른 서면통지 요건을 갖추지 못한 것으로 볼 수 있습니다.", "reason": "사유를 전혀 적지 않은 통지가 제27조 위반이라는 점은 3문단에서 밝혔지만, 그래서 해고가 효력이 없다는 결론은 명시하지 않았고, 2문단은 '전혀 기재되어 있다면'으로 적어 의미가 앞뒤와 모순됩니다."}, "codex": {"ok": false, "quote": "따라서 계약종료통지서에 종료일만 있고 해고사유가 전혀 기재되어 있다면, 원칙적으로 근로기준법 제27조에 따른 서면통지 요건을 갖추지 못한 것으로 볼 수 있습니다. [S1]", "reason": "해고사유 기재 여부에 관한 조건이 뒤의 미기재 설명과 모순되고, 해고사유가 전혀 없는 서면 통지의 해고 효력이 없다는 결론도 명시하지 않았습니다."}}], "pattern": "codex_only_no"}, {"key": "l5a01-kp3", "id": "l5a01", "level": "L5a", "question": "기간을 정하지 않고 일하던 중 회사에서 '계약종료통지서'를 받았는데 계약을 끝내는 날짜만 있고 왜 끝내는지는 아무 사유도 적혀 있지 않습니다. 회사는 제가 이유를 이미 알고 있으니 문제없다고 하는데, 이런 해고 통지도 효력이 있나요?", "kp_index": 3, "kp": "근로자가 해고사유를 이미 알고 있었다는 사정만으로 위반이 치유되지 않음", "all_kps": ["해고는 해고사유와 해고시기를 서면으로 통지해야 효력이 있음(근로기준법 제27조)", "해고사유가 전혀 기재되지 않은 서면 통지는 제27조 위반으로 해고의 효력 없음", "근로자가 해고사유를 이미 알고 있었다는 사정만으로 위반이 치유되지 않음"], "reference": "효력이 없습니다. 근로기준법 제27조는 해고사유와 해고시기를 서면으로 통지해야 해고의 효력이 있다고 정하고 있으므로, 사유가 전혀 적히지 않은 통지서로는 해고 통지 요건을 갖추지 못합니다. 서면 통지가 효력 요건이므로 근로자가 이유를 이미 알고 있었다는 사정으로 대신할 수 없습니다.", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r2", "answer": "근로자를 해고하려면 사용자는 해고사유와 해고시기를 서면으로 통지해야 하며, 이를 서면으로 통지하지 않은 해고는 효력이 없습니다. [S1]\n\n대법원은 기간을 정하지 않은 고용계약에서 회사가 교부한 계약종료통지서에 계약종료 사유나 근거규정이 전혀 기재되지 않은 사안에서, 그 통지서가 해고사유를 전혀 기재하지 않았으므로 근로기준법 제27조를 위반한 해고통지라고 판단했습니다(대법원 2021. 2. 25. 선고 2017다226605 판결). 따라서 근로자가 해고 이유를 이미 알고 있었더라도, 해고통지서에 해고사유가 전혀 없다면 원칙적으로 효력이 인정되기 어렵습니다. [S13]\n\n다만 해고통지서라는 명칭이 아니더라도 근로자의 처지에서 해고사유를 구체적으로 알 수 있는 서면이면 충분하다고 대법원은 판단했습니다(대법원 2021. 7. 29. 선고 2021두36103 판결). [S14]\n\n질문의 계약종료통지서에 종료 날짜만 있고 해고사유가 전혀 없다면, 위 판례에 비추어 근로기준법 제27조에 따른 서면통지 요건을 갖추지 못한 해고로 볼 가능성이 큽니다. [S1] [S13]\n\n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "따라서 근로자가 해고 이유를 이미 알고 있었더라도, 해고통지서에 해고사유가 전혀 없다면 원칙적으로 효력이 인정되기 어렵습니다."}, "opus": {"ok": true, "quote": "따라서 근로자가 해고 이유를 이미 알고 있었더라도, 해고통지서에 해고사유가 전혀 없다면 원칙적으로 효력이 인정되기 어렵습니다.", "reason": "근로자가 해고사유를 이미 알고 있었다는 사정이 있어도 사유를 전혀 적지 않은 통지는 효력이 인정되지 않는다고 밝혀, 그 사정만으로 위반이 치유되지 않는다는 의미를 담고 있다."}, "codex": {"ok": false, "quote": "따라서 근로자가 해고 이유를 이미 알고 있었더라도, 해고통지서에 해고사유가 전혀 없다면 원칙적으로 효력이 인정되기 어렵습니다. [S13]", "reason": "근로자가 이유를 이미 알았더라도 효력 인정이 어렵다고만 표현하여, 그 사정만으로 위반이 치유되지 않는다고 명시적으로 단언하지 않았습니다."}}], "pattern": "codex_only_no"}, {"key": "l5a02-kp2", "id": "l5a02", "level": "L5a", "question": "2024년에 월급제로 입사해 5개월째 일하고 있습니다. 사장님이 오늘 갑자기 내일부터 나오지 말라고 했는데, 미리 말해준 것도 없고 따로 돈을 준다는 얘기도 없습니다. 입사 6개월이 안 된 월급제 직원은 해고예고를 안 해도 된다고 하던데, 저는 받을 수 있는 게 없나요?", "kp_index": 2, "kp": "현행 예외는 계속 근로기간 3개월 미만 등 제26조 단서 각 호뿐이며 '6개월 미만 월급근로자' 예외는 없음", "all_kps": ["해고하려면 적어도 30일 전에 예고해야 하고, 예고하지 않았으면 30일분 이상의 통상임금(해고예고수당)을 지급해야 함(근로기준법 제26조)", "현행 예외는 계속 근로기간 3개월 미만 등 제26조 단서 각 호뿐이며 '6개월 미만 월급근로자' 예외는 없음", "근속 5개월 월급근로자는 해고예고 또는 30일분 통상임금 지급 대상"], "reference": "받을 수 있습니다. 근로기준법 제26조에 따라 사용자는 해고 30일 전에 예고하거나, 예고하지 않았다면 30일분 이상의 통상임금(해고예고수당)을 지급해야 합니다. 현행 예외는 계속 근로기간 3개월 미만 등 제26조 단서 각 호뿐이고 '6개월 미만 월급근로자' 예외는 없으므로, 근속 5개월이면 해고예고수당 지급 대상입니다.", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r3", "answer": "입사 후 계속 근로한 기간이 3개월 이상이므로, 사용자는 해고일 30일 전에 예고하거나 30일분 이상의 통상임금을 지급해야 합니다. 3개월 미만인 경우에만 해고예고 의무의 예외가 됩니다. [S1]\n\n따라서 5개월째 근무한 사실이 맞다면, 모르는 사람의 계좌로 임금을 일괄 송금한 것만으로는 임금을 직접 지급했다고 보기 어렵고, 다시 청구할 수 있습니다. 임금은 원칙적으로 통화로 근로자에게 직접 전액 지급해야 합니다. [S7]\n\n대법원은 근로자가 제3자에게 임금 수령을 위임했더라도, 원칙적으로 그 위임은 무효이고, 예외적으로 근로자 본인에게 지급하는 것과 동일시되거나 임금을 본인에게 그대로 전달할 것이 확실한 사람만 사자로 볼 수 있으며 이를 엄격하게 판단해야 한다고 판단했습니다. [S12] 귀하가 전혀 모르는 사람의 계좌로 임금이 일괄 송금되었고 돈을 제대로 받지 못했다면, 해당 계좌 명의인이 귀하에게 임금을 전달할 것이 확실한 사람으로 인정되기 어려워 회사의 지급이 무효가 될 가능성이 큽니다. 따라서 회사가 이미 지급했다고 주장하더라도 임금 지급의무가 소멸하지 않았다고 주장할 수 있습니다. [S12]\n\n다만 대법원은 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "귀하가 전혀 모르는 사람의 계좌로 임금이 일괄 송금되었고 돈을 제대로 받지 못했다면, 해당 계좌 명의인이 귀하에게 임금을 전달할 것이 확실한 사람으로 인정되기 어려워 회사의 지급이 무효가 될 가능성이 큽니다."}, "opus": {"ok": true, "quote": "회사가 귀하가 전혀 모르는 사람의 계좌로 임금을 일괄 송금한 것만으로는 임금을 직접 지급했다고 보기 어렵고, 다시 청구할 수 있습니다.", "reason": "위임이 있었더라도 모르는 제3자에게 지급한 것은 직접 지급으로 보기 어려워 유효한 지급이 아니라는 취지를 단언했습니다."}, "codex": {"ok": false, "quote": "귀하가 전혀 모르는 사람의 계좌로 임금이 일괄 송금되었고 돈을 제대로 받지 못했다면, 해당 계좌 명의인이 귀하에게 임금을 전달할 것이 확실한 사람으로 인정되기 어려워 회사의 지급이 무효가 될 가능성이 큽니다.", "reason": "위임했더라도 모르는 제3자에게 지급한 것은 직접 지급 원칙 위반으로 무효라고 단언하지 않고 무효일 가능성이 크다고만 표현했습니다."}}, {"run": "v2-qwen3-4B-k10-r3", "answer": "네. 회사가 귀하가 전혀 모르는 사람의 계좌로 임금을 일괄 송금한 것만으로는 임금을 직접 지급했다고 보기 어렵고, 다시 청구할 수 있습니다. 임금은 원칙적으로 통화로 근로자에게 직접 전액 지급해야 합니다. [S7]\n\n대법원은 근로자가 제3자에게 임금 수령을 위임한 경우에도, 그 제3자가 사회통념상 근로자 본인에게 지급하는 것과 동일시되거나 임금을 근로자 본인에게 그대로 전달할 것이 확실한 사람인 경우에만 예외적으로 수령자로 볼 수 있고, 그 판단은 엄격해야 한다고 판단했습니다. [S12] 귀하의 경우처럼 임금을 받은 사람이 귀하와 전혀 모르는 사이이고, 귀하에게 돈이 제대로 전달되지 않았다면 회사의 송금은 직접 지급 원칙에 위반되어 무효라고 판단될 가능성이 있습니다. [S12]\n\n따라서 회사가 해당 송금을 이유로 임금 지급이 끝났다고 주장하더라도, 귀하는 미지급 임금을 회사에 청구할 수 있습니다. 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "귀하의 경우처럼 임금을 받은 사람이 귀하와 전혀 모르는 사이이고, 귀하에게 돈이 제대로 전달되지 않았다면 회사의 송금은 직접 지급 원칙에 위반되어 무효라고 판단될 가능성이 있습니다."}, "opus": {"ok": true, "quote": "회사가 귀하가 전혀 모르는 사람의 계좌로 임금을 일괄 송금한 것만으로는 임금을 직접 지급했다고 보기 어렵고, 다시 청구할 수 있습니다.", "reason": "수령을 위임했더라도 모르는 제3자에게 한 송금은 직접 지급 원칙 위반으로 유효한 지급이 아니라는 취지를 밝혔지만, 뒤에서 '무효라고 판단될 가능성이 있습니다'라고 다소 유보했습니다."}, "codex": {"ok": false, "quote": "귀하의 경우처럼 임금을 받은 사람이 귀하와 전혀 모르는 사이이고, 귀하에게 돈이 제대로 전달되지 않았다면 회사의 송금은 직접 지급 원칙에 위반되어 무효라고 판단될 가능성이 있습니다.", "reason": "위임했더라도 모르는 제3자에게 지급한 것은 유효한 임금 지급이 아니라고 단언하지 않고 무효로 판단될 가능성만 제시했습니다."}}], "pattern": "codex_only_no"}, {"key": "l5a05-kp2", "id": "l5a05", "level": "L5a", "question": "회사가 작년에 쓰지 못한 연차에 대한 수당을 정해진 지급일에 주지 않았습니다. 회사는 연차수당은 매달 주는 월급이 아니라서 임금체불이 아니라고 하는데, 연차수당을 지급일에 주지 않은 것도 근로기준법 위반인가요?", "kp_index": 2, "kp": "연차휴가미사용수당도 근로의 대가로 지급하는 임금(제2조제1항제5호)이므로 지급기일에 전액 지급하지 않으면 제43조 위반", "all_kps": ["임금은 직접 근로자에게 그 전액을 지급해야 함(근로기준법 제43조 제1항)", "연차휴가미사용수당도 근로의 대가로 지급하는 임금(제2조제1항제5호)이므로 지급기일에 전액 지급하지 않으면 제43조 위반"], "reference": "위반입니다. 연차휴가미사용수당도 근로의 대가로 지급하는 임금(근로기준법 제2조제1항제5호)이므로, 정해진 지급일에 전액을 지급하지 않으면 임금 전액 지급 원칙(제43조제1항) 위반입니다.", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r2", "answer": "네. 연차휴가미사용수당도 지급일에 전액 지급하지 않으면 근로기준법 위반이 될 수 있습니다. [S13]\n\n근로기준법은 임금을 통화로 직접 근로자에게 전액 지급하고, 임금 지급일을 정한 경우 그날 지급하도록 정하고 있습니다. [S5] 또한 연차휴가 기간의 임금은 휴가를 주기 전이나 준 직후의 임금지급일에 지급해야 합니다. [S3]\n\n대법원은 연차휴가미사용수당이 매월 정기적으로 지급되는 임금이 아니더라도, 사용자가 지급기일에 그 전액을 지급하지 않으면 근로기준법 제43조 제1항 및 제109조 제1항 위반죄가 성립한다고 판단했습니다(대법원 2017. 7. 11. 선고 2013도7896 판결). [S13] 따라서 회사가 “월급이 아니므로 임금체불이 아니다”라고 주장하는 것만으로는 지급 지연이 정당화되지 않습니다. [S13]\n\n지급기일을 넘긴 경우, 제36조에 따른 지급 사유가 발생한 날부터 14일이 되는 날까지 지급해야 하는 임금에는 그 다음 날부터 지급일까지 연 20%의 지연이자가 발생할 수 있습니다. [S1] [S9] 다만 법령상 자금 확보 곤란, 법원이나 노동위원회에서 임금의 존부를 다투는 것이 적절한 경우 등에는 지연이자 적용이 제외될 수 있습니다. [S7]\n\n근로기준법 제109조 위반은 3년 이하의 징역 또는 3천만원 이하의 벌금 대상입니다. [S2] 다만 제109조의 개정 내용은 2026년 10월 8일부터 시행될 예정입니다. [S2]\n\n대법원은 위 사안에서 연차휴가미사용수당의 지급기일 미지급도 근로기준법 위반이라고 판단했습니다(대법원 2017. 7. 11. 선고 2013도7896 판결). [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "대법원은 연차휴가미사용수당이 매월 정기적으로 지급되는 임금이 아니더라도, 사용자가 지급기일에 그 전액을 지급하지 않으면 근로기준법 제43조 제1항 및 제109조 제1항 위반죄가 성립한다고 판단했습니다(대법원 2017. 7. 11. 선고 2013도7896 판결)."}, "opus": {"ok": true, "quote": "대법원은 연차휴가미사용수당이 매월 정기적으로 지급되는 임금이 아니더라도, 사용자가 지급기일에 그 전액을 지급하지 않으면 근로기준법 제43조 제1항 및 제109조 제1항 위반죄가 성립한다고 판단했습니다", "reason": "연차휴가미사용수당을 지급기일에 전액 지급하지 않으면 제43조 위반이라는 결론과 이 수당이 임금이라는 전제를 담고 있으나, '근로의 대가'라는 성격 규정과 제2조제1항제5호 근거는 명시하지 않았다."}, "codex": {"ok": false, "quote": "대법원은 연차휴가미사용수당이 매월 정기적으로 지급되는 임금이 아니더라도, 사용자가 지급기일에 그 전액을 지급하지 않으면 근로기준법 제43조 제1항 및 제109조 제1항 위반죄가 성립한다고 판단했습니다(대법원 2017. 7. 11. 선고 2013도7896 판결). [S13]", "reason": "지급기일에 전액 지급하지 않으면 제43조 위반이라는 사실은 명시했지만, 연차휴가미사용수당이 근로의 대가로 지급하는 임금이라는 사실은 명시적으로 단언하지 않았습니다."}}, {"run": "v2-qwen3-4B-k10", "answer": "네. 연차휴가미사용수당도 지급기일에 전액 지급하지 않으면 근로기준법 위반이 될 수 있습니다. [S13]\n\n근로기준법은 임금을 통화로 직접 근로자에게 전액 지급하고, 임금은 매월 1회 이상 일정한 날짜를 정해 지급하도록 규정합니다. [S5] 또한 연차휴가 기간의 임금은 유급휴가를 주기 전이나 준 직후의 임금지급일에 지급해야 합니다. [S3]\n\n따라서 연차수당이 매월 지급되는 월급이 아니라는 이유만으로 지급기일 미지급이 임금체불이 아니라고 할 수는 없습니다. 대법원도 연차휴가미사용수당이 매월 정기적으로 지급되는 임금이 아니더라도, 사용자가 지급기일에 전액 지급하지 않으면 근로기준법 제43조 제1항 및 제109조 제1항 위반죄가 성립한다고 판단했습니다(대법원 2017. 7. 11. 선고 2013도7896 판결) [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n지급기일을 넘긴 경우, 사용자는 지급 사유 발생일부터 14일이 되는 날까지 지급해야 하는 임금에 대해 그 다음 날부터 지급일까지 연 20%의 지연이자를 지급해야 합니다. [S1] [S9] 다만 법령상 자금 확보 곤란이나 지급 의무의 존부를 법원 또는 노동위원회에서 다투는 것이 적절하다고 인정되는 경우 등에는 지연이자 적용이 제외될 수 있습니다. [S7]\n\n현재 근로기준법 제109조는 제43조 위반에 대해 3년 이하의 징역 또는 3천만원 이하의 벌금을 정하고 있습니다. [S2] 다만 제109조의 개정 내용은 2026년 10월 8일 시행 예정입니다. [S2]", "luna": {"ok": true, "quote": "대법원도 연차휴가미사용수당이 매월 정기적으로 지급되는 임금이 아니더라도, 사용자가 지급기일에 전액 지급하지 않으면 근로기준법 제43조 제1항 및 제109조 제1항 위반죄가 성립한다고 판단했습니다(대법원 2017. 7. 11. 선고 2013도7896 판결) [S13]"}, "opus": {"ok": true, "quote": "대법원도 연차휴가미사용수당이 매월 정기적으로 지급되는 임금이 아니더라도, 사용자가 지급기일에 전액 지급하지 않으면 근로기준법 제43조 제1항 및 제109조 제1항 위반죄가 성립한다고 판단했습니다", "reason": "연차휴가미사용수당을 임금으로 보고 지급기일 미지급 시 제43조 위반이라고 단언했으나, 제2조제1항제5호 근거와 '근로의 대가'라는 표현은 명시되지 않았습니다."}, "codex": {"ok": false, "quote": "대법원도 연차휴가미사용수당이 매월 정기적으로 지급되는 임금이 아니더라도, 사용자가 지급기일에 전액 지급하지 않으면 근로기준법 제43조 제1항 및 제109조 제1항 위반죄가 성립한다고 판단했습니다(대법원 2017. 7. 11. 선고 2013도7896 판결) [S13]", "reason": "지급기일에 전액 지급하지 않으면 제43조 위반이라는 내용은 있지만, 연차휴가미사용수당이 근로의 대가로 지급하는 임금이라는 핵심 사실은 명시적으로 단언하지 않았습니다."}}], "pattern": "codex_only_no"}, {"key": "l5b02-kp3", "id": "l5b02", "level": "L5b", "question": "병원 방사선사인데 야간에는 집에서 '콜 대기' 당직을 섭니다. 호출이 오면 병원에 나가 촬영을 하고, 호출이 없으면 집에서 쉬거나 잠을 잡니다. 이 콜 대기 시간 전체가 근로시간으로 인정돼서 수당을 받을 수 있나요?", "kp_index": 3, "kp": "판례: 콜대기 시간 전부를 근로시간으로 단정할 수 없고 근무 밀도·호출 빈도·출근 시한 등을 심리해 범위를 판단해야 함", "all_kps": ["작업을 위해 사용자의 지휘·감독 아래에 있는 대기시간 등은 근로시간으로 봄(근로기준법 제50조제3항)", "판례: 당직이 근무 밀도가 낮은 대기성 단속적 업무이면 본래 업무에 실제로 종사한 시간만 근로시간임(본래 업무의 연장이거나 통상근무와 같으면 당직시간 전체가 근로시간)", "판례: 콜대기 시간 전부를 근로시간으로 단정할 수 없고 근무 밀도·호출 빈도·출근 시한 등을 심리해 범위를 판단해야 함"], "reference": "콜 대기 시간 전체가 당연히 근로시간으로 인정되지는 않습니다. 근로기준법 제50조제3항은 작업을 위하여 근로자가 사용자의 지휘·감독 아래에 있는 대기시간 등을 근로시간으로 보므로, 호출을 받아 병원에서 실제로 촬영한 시간은 근로시간입니다. 집에서 쉬거나 잠을 자며 호출을 기다린 시간이 이 대기시간에 해당하는지는 조문에 기준이 없습니다. 대법원은 병원 방사선기사 등의 자택 당직·콜대기 근무시간이 문제 된 사안에서, 당직 중 업무가 본래 업무의 연장이거나 통상근무와 같으면 당직시간이 근로시간에 포함되지만 근무 밀도가 낮은 대기성의 단속적 업무라면 본래의 업무에 실제로 종사한 시간만을 근로시간으로 보아야 한다고 하면서, 콜대기 근무시간 전부를 근로시간으로 인정한 원심을 심리미진으로 파기했습니다(대법원 2024. 11. 14. 선고 2021다220062 등 판결). 따라서 호출 빈도, 호출 시 출근 시한, 수면 보장 여부 등에 따라 콜 대기 시간의 전부 또는 일부만 근로시간으로 인정될 수 있으며, 결론은 구체적 근무 실태에 따라 달라질 수 있습니다.", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r2", "answer": "콜 대기 시간 전체가 자동으로 근로시간으로 인정되는 것은 아닙니다. 근로자가 사용자의 지휘·감독을 받는 시간은 근로시간이고, 대기시간이라도 자유로운 이용이 보장되지 않고 실질적으로 지휘·감독을 받으면 근로시간에 포함됩니다. [S4]\n\n대법원은 방사선사의 자택 콜대기 사건에서, 자택에서의 대기시간 전부가 근로시간인지 또는 일부만 근로시간인지 판단하려면 통상근무와 콜대기 근무의 업무 내용·근무 밀도 차이, 호출 시 몇 분 안에 출근해야 하는지 등을 심리해야 한다고 판단했습니다(대법원 2024. 11. 14. 선고 2021다220062, 220079, 220086, 220093 판결). [S12] 따라서 호출이 없을 때 집에서 자유롭게 쉬거나 잘 수 있었다는 사정만으로 전체 시간이 근로시간이 아니라고 단정할 수도 없고, 반대로 콜 대기 전체가 곧바로 근로시간이라고 단정할 수도 없습니다. [S12]\n\n근로시간으로 인정되는 시간이 연장근로에 해당하면 통상임금의 50% 이상을 가산하여 지급해야 하고, 오후 10시부터 다음 날 오전 6시 사이의 근로라면 야간근로 가산도 적용됩니다. [S2] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "따라서 호출이 없을 때 집에서 자유롭게 쉬거나 잘 수 있었다는 사정만으로 전체 시간이 근로시간이 아니라고 단정할 수도 없고, 반대로 콜 대기 전체가 곧바로 근로시간이라고 단정할 수도 없습니다."}, "opus": {"ok": true, "quote": "자택에서의 대기시간 전부가 근로시간인지 또는 일부만 근로시간인지 판단하려면 통상근무와 콜대기 근무의 업무 내용·근무 밀도 차이, 호출 시 몇 분 안에 출근해야 하는지 등을 심리해야 한다고 판단했습니다", "reason": "콜대기 시간 전부를 근로시간으로 단정할 수 없고 근무 밀도·출근 시한 등을 심리해야 한다는 점을 단언하므로 true이며, 호출 빈도는 명시되지 않았지만 '등'으로 포괄되어 핵심 취지는 같습니다."}, "codex": {"ok": false, "quote": "대법원은 방사선사의 자택 콜대기 사건에서, 자택에서의 대기시간 전부가 근로시간인지 또는 일부만 근로시간인지 판단하려면 통상근무와 콜대기 근무의 업무 내용·근무 밀도 차이, 호출 시 몇 분 안에 출근해야 하는지 등을 심리해야 한다고 판단했습니다(대법원 2024. 11. 14. 선고 2021다220062, 220079, 220086, 220093 판결).", "reason": "콜대기 전체를 근로시간으로 단정할 수 없고 근무 밀도와 출근 시한을 심리해야 한다고 했으나, 호출 빈도를 판단 요소로 명시하지 않았습니다."}}], "pattern": "codex_only_no"}, {"key": "l5b05-kp1", "id": "l5b05", "level": "L5b", "question": "파견으로 2년 넘게 일한 회사가 저를 직접 고용하겠다며 근로계약서를 줬는데 '계약기간 1년'으로 되어 있습니다. 저는 기간제를 원한 적이 없습니다. 직접고용이라면 기간 없는 계약이어야 하는 것 아닌가요?", "kp_index": 1, "kp": "2년을 초과해 계속 파견근로자를 사용한 사용사업주는 해당 파견근로자를 직접 고용해야 함(파견법 제6조의2제1항제3호)", "all_kps": ["2년을 초과해 계속 파견근로자를 사용한 사용사업주는 해당 파견근로자를 직접 고용해야 함(파견법 제6조의2제1항제3호)", "판례: 직접고용 시 특별한 사정이 없는 한 기간을 정하지 않은 근로계약을 체결해야 함이 원칙이고, 특별한 사정은 사용사업주가 증명해야 함", "판례: 특별한 사정 없이 체결한 기간제 근로계약 중 기간을 정한 부분은 무효가 될 수 있음"], "reference": "원칙적으로 기간 없는 계약이어야 합니다. 파견근로자 보호 등에 관한 법률 제6조의2제1항제3호에 따라 2년을 초과해 계속 파견근로자를 사용한 사용사업주는 그 근로자를 직접 고용해야 하지만, 조문은 직접 고용의 계약 기간 유무를 정하지 않습니다. 대법원은 직접고용의무에 따라 기간제 근로계약을 체결한 사안에서, 사용사업주는 특별한 사정이 없는 한 기간을 정하지 않은 근로계약을 체결해야 하고, 근로자가 기간제를 희망한 경우 등 특별한 사정의 존재는 사용사업주가 증명해야 하며, 특별한 사정 없이 체결한 기간제 근로계약 중 기간을 정한 부분은 무효가 될 수 있다고 판단했습니다(대법원 2022. 1. 27. 선고 2018다207847 판결). 기간제를 원한 적이 없다면 계약기간 1년 부분은 무효가 될 수 있으나, 결론은 동종 업무 근로자의 계약 형태 등 구체적 사실관계에 따라 달라질 수 있습니다.", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r2", "answer": "파견사업주·사용사업주·파견근로자 간 합의 없이 파견기간이 2년을 초과한 경우, 사용사업주는 해당 파견근로자를 직접 고용해야 합니다. [S4][S6]\n\n직접고용 시 사용사업주에게 같은 종류 또는 유사한 업무를 수행하는 근로자가 있으면 그 근로자에게 적용되는 취업규칙 등의 근로조건을 적용하고, 그러한 근로자가 없으면 기존 근로조건보다 낮아서는 안 됩니다. [S6]\n\n대법원은 사용사업주가 직접고용의무에 따라 근로계약을 체결할 때 특별한 사정이 없는 한 기간을 정하지 않은 근로계약을 체결해야 한다고 판단했습니다. [S12] 근로자가 기간제 계약을 희망했거나, 같은 종류·유사 업무의 근로자 대부분이 기간제여서 기간 없는 계약을 기대하기 어려웠던 경우 등 특별한 사정이 있으면 예외적으로 기간제 계약이 가능하지만, 그 특별한 사정은 사용사업주가 증명해야 합니다. [S12]\n\n따라서 질문처럼 기간제 계약을 원하지 않았고 특별한 사정도 없다면, ‘계약기간 1년’ 부분은 직접고용의무를 완전히 이행한 것으로 보기 어렵고 무효가 될 수 있습니다. [S12] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "파견사업주·사용사업주·파견근로자 간 합의 없이 파견기간이 2년을 초과한 경우, 사용사업주는 해당 파견근로자를 직접 고용해야 합니다."}, "opus": {"ok": true, "quote": "파견사업주·사용사업주·파견근로자 간 합의 없이 파견기간이 2년을 초과한 경우, 사용사업주는 해당 파견근로자를 직접 고용해야 합니다.", "reason": "2년을 넘기면 사용사업주가 직접 고용해야 한다는 핵심 사실(주체·기간·의무)이 명시되어 있으나, 정답 포인트에 없는 '합의 없이'라는 조건이 덧붙었고 근거 조문(파견법 제6조의2제1항제3호)은 적혀 있지 않습니다."}, "codex": {"ok": false, "quote": "파견사업주·사용사업주·파견근로자 간 합의 없이 파견기간이 2년을 초과한 경우, 사용사업주는 해당 파견근로자를 직접 고용해야 합니다. [S4][S6]", "reason": "정답 포인트에 없는 ‘당사자 간 합의 없이’라는 조건을 추가하여 직접고용 의무의 발생 조건을 다르게 서술했습니다."}}], "pattern": "codex_only_no"}, {"key": "l5b09-kp1", "id": "l5b09", "level": "L5b", "question": "계약직으로 2년 넘게 같은 업무를 계속해서 무기계약 근로자로 간주됐습니다. 그런데 회사는 제 임금과 수당은 예전 계약직 기준 그대로라고 합니다. 같은 일을 하는 기간 없는 계약 직원들에게 적용되는 취업규칙의 임금 기준을 저도 적용받을 수 있나요?", "kp_index": 1, "kp": "예외 사유 없이 2년을 초과해 사용된 기간제근로자는 기간의 정함이 없는 근로계약을 체결한 근로자로 봄(기간제법 제4조제2항)", "all_kps": ["예외 사유 없이 2년을 초과해 사용된 기간제근로자는 기간의 정함이 없는 근로계약을 체결한 근로자로 봄(기간제법 제4조제2항)", "판례: 무기계약으로 간주된 근로자에게는 동종·유사 업무의 기간 없는 계약 근로자가 있으면 달리 정함이 없는 한 그 근로자에게 적용되는 취업규칙 등이 동일하게 적용됨", "취업규칙 기준에 미달하는 근로계약 부분은 무효이고 취업규칙 기준에 따름(근로기준법 제97조)"], "reference": "적용받을 수 있습니다. 기간제법 제4조제2항에 따라 예외 사유 없이 2년을 초과해 사용된 기간제근로자는 기간의 정함이 없는 근로계약을 체결한 근로자로 보지만, 이 조항은 간주된 뒤의 임금 등 근로조건을 정하지 않습니다. 대법원은 무기계약으로 간주된 근로자의 임금이 문제 된 사안에서, 해당 사업장에 동종 또는 유사한 업무에 종사하는 기간의 정함이 없는 근로계약 근로자가 있으면 달리 정함이 없는 한 그 근로자에게 적용되는 취업규칙 등이 동일하게 적용된다고 판단했습니다(대법원 2019. 12. 24. 선고 2015다254873 판결). 이때 근로기준법 제97조에 따라 취업규칙에서 정한 기준에 미달하는 근로계약 부분은 무효가 되고 취업규칙 기준에 따릅니다. 다만 동종·유사 업무인지, 달리 정한 사정이 있는지 등 구체적 사실관계에 따라 결론이 달라질 수 있습니다.", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r2", "answer": "기간제근로자를 2년을 초과하여 사용하면 기간의 정함이 없는 근로계약을 체결한 근로자로 간주됩니다. [S13]\n\n이 경우 같은 사업 또는 사업장에서 동종·유사 업무에 종사하는 기간의 정함이 없는 근로자에게 적용되는 취업규칙 등이 달리 정해져 있지 않다면 원칙적으로 동일하게 적용됩니다. 따라서 회사가 별도의 특별한 사정을 제시하지 못한다면, 같은 일을 하는 기간의 정함이 없는 근로자에게 적용되는 취업규칙의 임금·수당 기준을 적용받을 수 있습니다. [S13]\n\n또한 기간제근로자라는 이유로 동종·유사 업무의 기간의 정함이 없는 근로자보다 차별적 처우를 해서는 안 됩니다. [S3]\n\n취업규칙의 기준보다 낮은 임금·수당을 정한 근로계약 부분은 무효이고, 그 부분은 취업규칙의 기준에 따릅니다. [S1] 근로자와 사용자는 취업규칙과 근로계약을 지키고 성실히 이행할 의무가 있습니다. [S6]\n\n대법원은 기간의 정함이 없는 근로계약을 체결한 것으로 간주된 근로자에게 동종·유사 업무의 무기계약 근로자에게 적용되는 취업규칙 등을 원칙적으로 동일하게 적용해야 한다고 판단했습니다(대법원 2019. 12. 24. 선고 2015다254873 판결) [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "기간제근로자를 2년을 초과하여 사용하면 기간의 정함이 없는 근로계약을 체결한 근로자로 간주됩니다."}, "opus": {"ok": true, "quote": "기간제근로자를 2년을 초과하여 사용하면 기간의 정함이 없는 근로계약을 체결한 근로자로 간주됩니다.", "reason": "2년 초과 사용 시 무기계약 근로자로 간주된다는 핵심 사실을 단언하므로 true로 보나, '예외 사유 없이'라는 조건과 기간제법 제4조제2항 근거 조문은 빠져 있습니다."}, "codex": {"ok": false, "quote": "기간제근로자를 2년을 초과하여 사용하면 기간의 정함이 없는 근로계약을 체결한 근로자로 간주됩니다.", "reason": "2년 초과 사용 시 무기계약으로 간주된다는 내용은 있으나, 예외 사유가 없어야 한다는 조건이 빠져 있습니다."}}, {"run": "v2-qwen3-4B-k10", "answer": "기간제근로자를 2년을 초과하여 사용하면 기간의 정함이 없는 근로계약을 체결한 근로자로 간주됩니다. [S13]\n\n이 경우 같은 사업 또는 사업장에서 동종·유사 업무에 종사하는 기간의 정함이 없는 근로자에게 적용되는 취업규칙 등이 달리 정해져 있지 않다면 원칙적으로 동일하게 적용됩니다. 따라서 회사가 단순히 종전 계약직 기준이라는 이유만으로 임금·수당을 계속 불리하게 적용하기는 어렵습니다. [S13]\n\n또한 기간제근로자라는 이유로 동종·유사 업무의 무기계약 근로자보다 차별적 처우를 해서는 안 됩니다. [S3]\n\n취업규칙에서 정한 기준보다 낮은 근로조건을 근로계약으로 정했다면 그 부분은 무효이고, 취업규칙의 기준이 적용됩니다. [S1] 근로자와 사용자는 취업규칙과 근로계약을 지키고 성실히 이행할 의무가 있습니다. [S6]\n\n다만 실제 적용 여부는 동종·유사 업무인지, 비교 대상 근로자에게 적용되는 취업규칙의 범위와 내용이 무엇인지, 별도의 정함이나 특별한 사정이 있는지에 따라 판단됩니다. 대법원은 기간의 정함이 없는 근로자로 간주된 근로자에게 동종·유사 업무의 무기계약 근로자에게 적용되는 취업규칙 등이 원칙적으로 동일하게 적용된다고 판단했습니다(대법원 2019. 12. 24. 선고 2015다254873 판결) [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "luna": {"ok": true, "quote": "기간제근로자를 2년을 초과하여 사용하면 기간의 정함이 없는 근로계약을 체결한 근로자로 간주됩니다."}, "opus": {"ok": true, "quote": "기간제근로자를 2년을 초과하여 사용하면 기간의 정함이 없는 근로계약을 체결한 근로자로 간주됩니다.", "reason": "2년 초과 사용 시 무기계약 근로자로 간주된다는 핵심 사실은 단언했으나, '예외 사유 없이'라는 조건과 근거 조문(기간제법 제4조제2항)은 명시하지 않았습니다."}, "codex": {"ok": false, "quote": "기간제근로자를 2년을 초과하여 사용하면 기간의 정함이 없는 근로계약을 체결한 근로자로 간주됩니다. [S13]", "reason": "2년 초과 사용 시 무기계약 간주는 명시했지만, 예외 사유가 없어야 한다는 조건은 빠져 있습니다."}}, {"run": "v2-qwen3-4B-k10-r3", "answer": "기간제근로자를 2년 초과 사용하여 기간의 정함이 없는 근로계약을 체결한 근로자로 간주되는 경우, 같은 사업 또는 사업장에서 동종·유사 업무에 종사하는 기간의 정함이 없는 근로자에게 적용되는 취업규칙 등이 달리 정해져 있지 않다면 원칙적으로 동일하게 적용됩니다. [S13]\n\n또한 기간제근로자라는 이유로 동종·유사 업무의 기간의 정함이 없는 근로자보다 불리한 처우를 해서는 안 됩니다. [S3]\n\n따라서 질문하신 취업규칙의 임금·수당 기준이 같은 업무의 기간의 정함이 없는 근로자에게 적용되고, 별도의 달리 정한 사정이 없다면 그 기준을 적용받을 수 있습니다. [S13]\n\n취업규칙에서 정한 기준보다 낮게 정한 근로계약 부분은 무효이고, 그 부분은 취업규칙 기준에 따릅니다. [S1] 대법원은 취업규칙에 미달하는 개별 근로계약의 조건을 무효로 하고 취업규칙 기준을 적용하는 것이 취업규칙의 최저기준으로서의 강행적·보충적 효력 때문이라고 판단했습니다(대법원 2019. 12. 24. 선고 2015다254873 판결). [S13]\n\n다만 실제 적용 여부는 동종·유사 업무인지, 해당 취업규칙이 그 근로자에게 적용되는지, 별도의 달리 정한 사정이 있는지에 따라 달라질 수 있습니다. 대법원은 개별 사안의 사실관계에 따라 판단했습니다. [S13]", "luna": {"ok": true, "quote": "기간제근로자를 2년 초과 사용하여 기간의 정함이 없는 근로계약을 체결한 근로자로 간주되는 경우, 같은 사업 또는 사업장에서 동종·유사 업무에 종사하는 기간의 정함이 없는 근로자에게 적용되는 취업규칙 등이 달리 정해져 있지 않다면 원칙적으로 동일하게 적용됩니다."}, "opus": {"ok": true, "quote": "기간제근로자를 2년 초과 사용하여 기간의 정함이 없는 근로계약을 체결한 근로자로 간주되는 경우,", "reason": "2년 초과 사용 시 무기계약 근로자로 간주된다는 핵심 사실은 담겨 있으나, '예외 사유 없이'라는 조건과 기간제법 제4조제2항 근거는 빠져 있습니다."}, "codex": {"ok": false, "quote": "기간제근로자를 2년 초과 사용하여 기간의 정함이 없는 근로계약을 체결한 근로자로 간주되는 경우, 같은 사업 또는 사업장에서 동종·유사 업무에 종사하는 기간의 정함이 없는 근로자에게 적용되는 취업규칙 등이 달리 정해져 있지 않다면 원칙적으로 동일하게 적용됩니다.", "reason": "2년 초과 사용에 따른 무기계약 간주를 전제로 삼지만, 예외 사유가 없는 경우라는 조건은 명시하지 않았습니다."}}], "pattern": "codex_only_no"}, {"key": "n04-kp2", "id": "n04", "level": "L3", "question": "중증 장애로 작업 능력이 일반 직원보다 현저히 떨어지는 직원이 있습니다. 이 직원에게는 최저임금보다 적은 임금을 줘도 되나요?", "kp_index": 2, "kp": "정신장애나 신체장애로 근로능력이 현저히 낮은 사람은 고용노동부장관의 인가를 받은 경우에만 최저임금 효력 규정(제6조) 적용이 제외됨", "all_kps": ["사용자는 원칙적으로 최저임금 적용 근로자에게 최저임금액 이상을 지급해야 함", "정신장애나 신체장애로 근로능력이 현저히 낮은 사람은 고용노동부장관의 인가를 받은 경우에만 최저임금 효력 규정(제6조) 적용이 제외됨"], "reference": "사용자는 최저임금의 적용을 받는 근로자에게 최저임금액 이상의 임금을 지급해야 합니다(최저임금법 제6조제1항). 다만 정신장애나 신체장애로 근로능력이 현저히 낮은 사람으로서 사용자가 고용노동부장관의 인가를 받은 경우에는 제6조가 적용되지 않으므로(제7조), 인가 없이 임의로 최저임금보다 적게 줄 수는 없습니다.", "note": "", "answers": [{"run": "v2-qwen3-4B-k10", "answer": "원칙적으로 사용자는 최저임금 적용 근로자에게 최저임금액 이상을 지급해야 하며, 최저임금보다 낮게 정한 근로계약 부분은 무효입니다. [S4]\n\n다만 정신장애나 신체장애로 근로능력이 현저히 낮은 사람 등에 대해서는 사용자가 대통령령으로 정하는 바에 따라 고용노동부장관의 인가를 받은 경우 최저임금법이 적용되지 않습니다. [S1] 이 인가는 장애가 업무 수행에 직접적으로 현저한 지장을 주는 것이 명백하다고 인정되는 경우에 가능합니다. [S2]\n\n따라서 직원의 중증 장애와 작업능력 저하만으로 곧바로 최저임금보다 적은 임금을 지급할 수 있는 것은 아니며, 관할 지방고용노동관서의 장에게 인가를 신청하여 인가를 받아야 합니다. [S3] 인가 신청에는 직전 달 사업장 전체 근로자 임금대장 사본, 장애를 증명하는 서류 등이 필요합니다. [S3] 최저임금 적용 제외 인가 권한은 지방고용노동관서의 장에게 위임되어 있습니다. [S12]\n\n인가를 받은 경우에도 지방고용노동관서의 장은 유사 직종 근로자의 임금수준에 상응하는 임금을 지급하도록 사용자에게 권고할 수 있습니다. [S3]", "luna": {"ok": true, "quote": "다만 정신장애나 신체장애로 근로능력이 현저히 낮은 사람 등에 대해서는 사용자가 대통령령으로 정하는 바에 따라 고용노동부장관의 인가를 받은 경우 최저임금법이 적용되지 않습니다."}, "opus": {"ok": true, "quote": "다만 정신장애나 신체장애로 근로능력이 현저히 낮은 사람 등에 대해서는 사용자가 대통령령으로 정하는 바에 따라 고용노동부장관의 인가를 받은 경우 최저임금법이 적용되지 않습니다.", "reason": "대상(정신·신체장애로 근로능력이 현저히 낮은 사람), 장관 인가라는 요건, 인가 없이는 안 된다는 한정(\"곧바로 … 지급할 수 있는 것은 아니며 … 인가를 받아야 합니다\")을 모두 담고 있어 true로 판정함. 다만 제외 범위를 '제6조(효력 규정)'가 아닌 '최저임금법' 전체로 표현해 조문 특정이 빠져 있음."}, "codex": {"ok": false, "quote": "다만 정신장애나 신체장애로 근로능력이 현저히 낮은 사람 등에 대해서는 사용자가 대통령령으로 정하는 바에 따라 고용노동부장관의 인가를 받은 경우 최저임금법이 적용되지 않습니다.", "reason": "장애에 따른 근로능력 저하와 인가 조건은 명시했지만, 적용 제외 대상을 최저임금 효력 규정(제6조)이 아닌 최저임금법 전체로 서술하여 제외 범위가 다릅니다."}}], "pattern": "codex_only_no"}, {"key": "n05-kp1", "id": "n05", "level": "L3", "question": "두 달마다 주던 정기상여금을 최저임금에 포함시키려고, 총액은 그대로 두고 매달 나눠 주는 방식으로 취업규칙을 바꾸려 합니다. 취업규칙 불리한 변경처럼 직원 과반수의 동의를 받아야 하나요?", "kp_index": 1, "kp": "취업규칙을 근로자에게 불리하게 변경할 때는 원칙적으로 과반수 노동조합 또는 근로자 과반수의 동의를 받아야 함(근로기준법 제94조제1항 단서)", "all_kps": ["취업규칙을 근로자에게 불리하게 변경할 때는 원칙적으로 과반수 노동조합 또는 근로자 과반수의 동의를 받아야 함(근로기준법 제94조제1항 단서)", "최저임금 산입을 위해 1개월 초과 주기 임금을 총액 변동 없이 매월 지급하도록 취업규칙을 바꾸는 경우에는 근로기준법 제94조제1항에도 불구하고 과반수 노조 또는 근로자 과반수의 의견 청취로 족함(동의 불요)"], "reference": "취업규칙을 근로자에게 불리하게 변경할 때는 원칙적으로 과반수 노동조합(없으면 근로자 과반수)의 동의를 받아야 합니다(근로기준법 제94조제1항 단서). 그러나 최저임금법 제6조의2는 최저임금 산입 임금(제6조제4항)에 포함시키기 위해 1개월을 초과하는 주기로 지급하던 임금을 총액 변동 없이 매월 지급하는 것으로 취업규칙을 바꾸는 경우, 근로기준법 제94조제1항에도 불구하고 과반수 노동조합 또는 근로자 과반수의 의견을 듣도록 정하고 있으므로 이 경우에는 동의 없이 의견 청취로 족합니다.", "note": "", "answers": [{"run": "v2-qwen3-4B-k10-r3", "answer": "아니요. 해당 정기상여금이 최저임금 산입 대상 임금에 포함되는 경우, 총액의 변동 없이 1개월을 초과하는 주기로 지급하던 임금을 매월 지급하도록 취업규칙을 변경할 때에는 근로자 과반수의 동의가 아니라 의견을 들어야 합니다. 근로자 과반수 노동조합이 있으면 그 노동조합의 의견을, 없으면 근로자 과반수의 의견을 들어야 합니다. [S1]\n\n이는 근로기준법 제94조 제1항의 일반적인 불이익 변경 절차에도 불구하고 적용되는 최저임금법 제6조의2의 특례입니다. [S1]\n\n다만, 변경 내용이 총액 감소 등으로 실제 근로조건을 불리하게 변경하는 경우에는 근로기준법 제94조 제1항 단서에 따라 근로자 과반수의 동의를 받아야 합니다. [S2] 대법원은 취업규칙의 불이익 변경에 관하여, 근로자 상호 간 의견을 교환하고 찬반 의사를 모으는 집단적 의사결정 방법에 의한 동의가 필요하다고 판단했습니다(대법원 2026. 6. 25. 선고 2025다215010 판결) [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n변경 후 취업규칙은 변경 전후 내용을 비교한 서류와 과반수 노동조합 또는 근로자 과반수의 의견을 들었음을 증명하는 자료를 첨부하여 신고해야 합니다. [S5]", "luna": {"ok": true, "quote": "다만, 변경 내용이 총액 감소 등으로 실제 근로조건을 불리하게 변경하는 경우에는 근로기준법 제94조 제1항 단서에 따라 근로자 과반수의 동의를 받아야 합니다."}, "opus": {"ok": true, "quote": "다만, 변경 내용이 총액 감소 등으로 실제 근로조건을 불리하게 변경하는 경우에는 근로기준법 제94조 제1항 단서에 따라 근로자 과반수의 동의를 받아야 합니다.", "reason": "불리한 변경에는 제94조제1항 단서에 따라 과반수 동의가 필요하다고 단언하므로 true로 판정했으나, 동의 주체로 '과반수 노동조합'을 명시하지 않은 누락이 있습니다."}, "codex": {"ok": false, "quote": "다만, 변경 내용이 총액 감소 등으로 실제 근로조건을 불리하게 변경하는 경우에는 근로기준법 제94조 제1항 단서에 따라 근로자 과반수의 동의를 받아야 합니다. [S2]", "reason": "불리한 변경 시 근로자 과반수의 동의 의무는 명시하지만, 과반수 노동조합이 있는 경우 그 노동조합의 동의를 받아야 한다는 내용은 빠져 있습니다."}}], "pattern": "codex_only_no"}, {"key": "n07-kp1", "id": "n07", "level": "L3", "question": "회사에 계속 다니고 있는데 석 달째 월급이 밀렸습니다. 노동청에 진정해서 체불 임금등·사업주 확인서도 받았는데, 퇴직하지 않아도 국가가 대신 주는 대지급금을 받을 수 있나요? 받는다면 어느 기간의 임금이 대상인가요?", "kp_index": 1, "kp": "제7조의 대지급금은 퇴직한 근로자 대상이지만, 사업주가 제7조제1항제4호·제5호(판결 등 또는 체불 임금등·사업주 확인서 발급)에 해당하면 재직 근로자도 대지급금을 받을 수 있음", "all_kps": ["제7조의 대지급금은 퇴직한 근로자 대상이지만, 사업주가 제7조제1항제4호·제5호(판결 등 또는 체불 임금등·사업주 확인서 발급)에 해당하면 재직 근로자도 대지급금을 받을 수 있음", "재직자 대지급금 범위는 소송·진정 등 제기일 기준 맨 나중 체불일부터 소급 3개월간의 미지급 임금 등임"], "reference": "대지급금은 원칙적으로 퇴직한 근로자에게 지급되지만(임금채권보장법 제7조), 사업주가 제7조제1항제4호(확정판결 등) 또는 제5호(체불 임금등·사업주 확인서로 미지급 확인)에 해당하면 근로계약이 종료되지 않은 재직 근로자도 대지급금을 청구할 수 있습니다(제7조의2제1항). 대상은 진정 등을 제기한 날을 기준으로 맨 나중의 임금 체불이 발생한 날부터 소급하여 3개월 동안의 미지급 임금·휴업수당·출산전후휴가급여이며, 한 사업에서 1회만 지급됩니다(제7조의2제2항·제4항).", "note": "", "answers": [{"run": "       <span class="chip">포인트 ${c.kp_index} / ${c.all_kps.length}</span><span class="pill">${PAT[c.pattern]}</span></div>
    <div class="q">${esc(c.question)}</div>
    <ol class="kps">${c.all_kps.map((k, i) => `<li class="${i + 1 === c.kp_index ? "on" : ""}">${i + 1}. ${esc(k)}</li>`).join("")}</ol>
    ${c.note ? `<div class="note"><b>참고</b> ${esc(c.note)}</div>` : ""}
    <div class="runs">답변 실행 ${c.answers.map((x, i) => `<button data-run="${i}" aria-pressed="${i === Math.min(run, c.answers.length - 1)}">${esc(x.run.replace("v2-qwen3-4B-", ""))}</button>`).join("")}
      <span>(판정이 갈린 실행 ${c.answers.length}개)</span></div>
    <div class="judges">${judge("Luna", a.luna)}${judge("Opus", a.opus)}${judge("Codex", a.codex)}</div>
    <div class="answer">${highlight(a.answer, [a.luna.quote, a.opus.quote, a.codex.quote])}</div>
    <details class="ref"><summary>GT 참고 답변</summary><p>${esc(c.reference)}</p></details>
    <div class="decide" role="group" aria-label="판단">
      <button data-d="yes" aria-pressed="${d.decision === "yes"}"><span>1 · 포함됨</span><small>답변에 이 포인트가 있음</small></button>
      <button data-d="no" aria-pressed="${d.decision === "no"}"><span>2 · 빠짐</span><small>답변에 이 포인트가 없음</small></button>
      <button data-d="relax" aria-pressed="${d.decision === "relax"}"><span>3 · 포인트가 과함</span><small>핵심은 있음, 포인트 완화 필요</small></button>
    </div>
    <label for="note" class="prog">메모</label>
    <textarea id="note" placeholder="판단 근거나 포인트 수정안">${esc(d.note || "")}</textarea>
    <div class="status"><span>${d.decision ? "저장됨 · " + new Date(d.at).toLocaleString("ko-KR") : "아직 판단하지 않음"}</span><span class="mono">${c.key}</span></div>`;
  try { localStorage.setItem("kp-review-pos", JSON.stringify({f: document.getElementById("filter").value, k: c.key})); } catch {}
}
function notice(t) { const n = document.getElementById("notice"); n.hidden = !t; n.textContent = t || ""; }
async function save(patch) {
  const c = list[idx], a = c.answers[0];
  const next = {...(dec[c.key] || {}), ...patch, item: c.id, kp_index: c.kp_index, kp: c.kp, pattern: c.pattern,
    judges: {luna: a.luna.ok, opus: a.opus.ok, codex: a.codex.ok}, by: "user", at: new Date().toISOString()};
  dec[c.key] = next;
  if (db) { try { await db.collection("kp_review_v1").doc(c.key).set(next); notice(""); } catch { notice("저장하지 못했습니다. 다시 눌러 주세요."); } }
  else { try { localStorage.setItem("kp-review-v1", JSON.stringify(dec)); } catch {} }
}
function go(d) { const n = idx + d; if (n >= 0 && n < list.length) { idx = n; run = 0; render(); window.scrollTo({top: 0}); } }
async function decide(v) {
  await save({decision: v, note: document.getElementById("note").value});
  if (idx < list.length - 1) go(1); else render();
}
document.getElementById("card").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.run) { run = +b.dataset.run; render(); }
  else if (b.dataset.d) decide(b.dataset.d);
});
let nt; document.getElementById("card").addEventListener("input", e => {
  if (e.target.id !== "note") return; clearTimeout(nt); nt = setTimeout(() => save({note: e.target.value}), 800);
});
document.getElementById("prev").addEventListener("click", () => go(-1));
document.getElementById("next").addEventListener("click", () => go(1));
document.getElementById("filter").addEventListener("change", () => { applyFilter(); run = 0; render(); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "1") decide("yes"); else if (e.key === "2") decide("no"); else if (e.key === "3") decide("relax");
});
let startKey = null;
try { const s = JSON.parse(localStorage.getItem("kp-review-pos") || "{}"); startKey = s.k; if (s.f) document.getElementById("filter").value = s.f; } catch {}
applyFilter(startKey); render();
(async () => {
  db = window.claude ? await window.claude.use("db") : null;
  if (!db) { try { Object.assign(dec, JSON.parse(localStorage.getItem("kp-review-v1") || "{}")); } catch {} notice("판단이 이 브라우저에만 저장됩니다. claude.ai에서 열어 주세요."); render(); return; }
  db.collection("kp_review_v1").onSnapshot(snap => {
    let ch = false;
    for (const x of snap.docChanges()) { const v = x.doc.data() || {}; if (!dec[x.doc.id] || dec[x.doc.id].at !== v.at) { dec[x.doc.id] = v; ch = true; } }
    if (ch && document.activeElement?.id !== "note") render();
  }, () => notice("저장소 연결이 끊겼습니다. 새로 고쳐 주세요."));
})();
</script>
