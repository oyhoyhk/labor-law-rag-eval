score": 0.5402, "via": "search", "gold": false}, {"rank": 11, "id": "근로기준법 시행령#33", "score": 0.0, "via": "link", "gold": false}, {"rank": 12, "id": "근로기준법 시행령#7의2", "score": 0.0, "via": "link", "gold": false}, {"rank": 13, "id": "판례#2022다245419", "score": 0.6444, "via": "precedent", "gold": false}, {"rank": 14, "id": "판례#2021다227100", "score": 0.6146, "via": "precedent", "gold": false}], "answer": "[정보 부족]  \n근거 블록에는 근로기준법상 ‘안식휴가’에 관한 규정이 없고, 연차 유급휴가에 대해서만 3년 이상 계속 근로한 경우 최초 1년을 초과하는 계속 근로 연수 매 2년에 1일을 가산하며 총 25일을 한도로 한다고 규정되어 있습니다. [S1]", "citations": [], "cit_precision": null, "cit_recall": null, "key_points": [], "asserts_conclusion": null, "unsupported": [], "n_claims": 0}, {"id": "l5a01", "level": "L5a", "split": "test", "question": "기간을 정하지 않고 일하던 중 회사에서 '계약종료통지서'를 받았는데 계약을 끝내는 날짜만 있고 왜 끝내는지는 아무 사유도 적혀 있지 않습니다. 회사는 제가 이유를 이미 알고 있으니 문제없다고 하는데, 이런 해고 통지도 효력이 있나요?", "expected": "answered", "reference": "효력이 없습니다. 근로기준법 제27조는 해고사유와 해고시기를 서면으로 통지해야 해고의 효력이 있다고 정하고 있으므로, 사유가 전혀 적히지 않은 통지서로는 해고 통지 요건을 갖추지 못합니다. 서면 통지가 효력 요건이므로 근로자가 이유를 이미 알고 있었다는 사정으로 대신할 수 없습니다.", "notes": "판결요지에 '사유를 알고 있으면 상세 기재 불요'라는 판례 단서가 있음 — 질문이 '전혀 미기재' 사실에 한정돼야 L5a 성립. 기간 종기 없는 재계약 후 '계약종료'를 해고로 본 사실관계 전제 확인", "status": "answered", "refusal_reason": null, "refusal_mode": null, "m0": true, "stability": [true, true, true], "gold": ["근로기준법#27"], "found_search": ["근로기준법#27"], "found_link": [], "missing": [], "recall_all": true, "rr": 1.0, "retrieved": [{"rank": 1, "id": "근로기준법#27", "score": 0.7044, "via": "search", "gold": true}, {"rank": 2, "id": "근로기준법#26", "score": 0.6358, "via": "search", "gold": false}, {"rank": 3, "id": "근로기준법#24", "score": 0.581, "via": "search", "gold": false}, {"rank": 4, "id": "근로기준법#23", "score": 0.5663, "via": "search", "gold": false}, {"rank": 5, "id": "근로기준법 시행규칙#3", "score": 0.5441, "via": "search", "gold": false}, {"rank": 6, "id": "근로기준법 시행규칙#4", "score": 0.539, "via": "search", "gold": false}, {"rank": 7, "id": "근로기준법#15", "score": 0.5199, "via": "search", "go : false}, {"rank": 11, "id": "임금채권보장법 시행규칙#13", "score": 0.0, "via": "link", "gold": false}, {"rank": 12, "id": "판례#2025다209645", "score": 0.6415, "via": "precedent", "gold": false}, {"rank": 13, "id": "판례#2023도8158", "score": 0.5701, "via": "precedent", "gold": false}], "answer": "네. 회사가 귀하가 전혀 모르는 사람의 계좌로 임금을 일괄 송금한 것만으로는 임금을 직접 지급했다고 보기 어렵고, 다시 청구할 수 있습니다. 임금은 원칙적으로 통화로 근로자에게 직접 전액 지급해야 합니다. [S7]\n\n대법원은 근로자가 제3자에게 임금 수령을 위임했더라도, 원칙적으로 그 위임은 무효이고, 예외적으로 근로자 본인에게 지급하는 것과 동일시되거나 임금을 본인에게 그대로 전달할 것이 확실한 사람만 사자로 볼 수 있으며 이를 엄격하게 판단해야 한다고 판단했습니다. [S12] 귀하가 전혀 모르는 사람의 계좌로 임금이 일괄 송금되었고 돈을 제대로 받지 못했다면, 해당 계좌 명의인이 귀하에게 임금을 전달할 것이 확실한 사람으로 인정되기 어려워 회사의 지급이 무효가 될 가능성이 큽니다. 따라서 회사가 이미 지급했다고 주장하더라도 임금 지급의무가 소멸하지 않았다고 주장할 수 있습니다. [S12]\n\n다만 대법원은 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "citations": ["근로기준법#43", "판례#2025다209645"], "cit_precision": 0.5, "cit_recall": 1.0, "key_points": [{"text": "임금은 통화로 직접 근로자에게 그 전액을 지급해야 함(근로기준법 제43조 제1항)", "ok": true, "quote": "임금은 원칙적으로 통화로 근로자에게 직접 전액 지급해야 합니다."}, {"text": "법령·단체협약에 의한 예외는 임금 일부 공제와 통화 외 지급에 관한 것이며 직접 지급 원칙에는 예외가 없음", "ok": false, "quote": ""}, {"text": "근로자가 위임했더라도 모르는 제3자에게 지급한 것은 직접 지급 원칙 위반으로 유효한 임금 지급이 아님", "ok": true, "quote": "귀하가 전혀 모르는 사람의 계좌로 임금이 일괄 송금되었고 돈을 제대로 받지 못했다면, 해당 계좌 명의인이 귀하에게 임금을 전달할 것이 확실한 사람으로 인정되기 어려워 회사의 지급이 무효가 될 가능성이 큽니다."}, {"text": "근로자는 회사에 임금 지급을 청구할 수 있음", "ok": true, "quote": "네. 회사가 귀하가 전혀 모르는 사람의 계좌로 임금을 일괄 송금한 것만으로는 임금을 직접 지급했다고 보기 어렵고, 다시 청구할 수 있습니다."}], "asserts_conclusion": null, "unsupported": [], "n_claims": 9}, {"id": "l5a05", "level": "L5a", "split": "test", "question": "회사가 작년에 쓰지 못한 연차에 대한 수당을 정해진 지급일에 주지 않았습니다. 회사는 연차수당은 매달 주는 월급이 아니라서 임금체불이 아니라고 하는데, 연차수당을 지급일에 주지 않은 것도 근로기준법 위반인가요?", "expected": "answered", "reference": "위반입니다. 연차휴가미사용수당도 근로의 대가로 지급하는 임금(근로기준법 제2조제1항제5호)이므로, 정해진 지급일에 전액을 지급하지 않으면 임금 전액 지급 원칙(제43조제1항) 위반입니다.", "notes": "판결요지 [4][5]는 노조법(직장폐쇄·쟁의행위) 쟁점으로 Corpus 밖 — 질문에서 제외함. 연차수당의 임금성은 제2조 제1항 제5호 정의와 제60조 제5항으로 뒷받침되는지 확인. 2013도 사건이나 선고는 2017년 [재검토 반영] 판례의 목적론적 논리 대신 조문 도출 가능한 포인트로 교체, 제2조 근거 추가. [v2.2 사후 수정] KP3(제43조 위반 형사처벌, 제109조제1항) 삭제 — 질문은 법 위반 여부만 묻고 처벌은 묻지 않음. 언급은 무방(가점 아님)", "status": "answered", "refusal_reason": null, "refusal_mode": null, "m0": true, "stability": [true, true, true], "gold": ["근로기준법#109", "근로기준법#2", "근로기준법#43"], "found_search": ["근로기준법#109", "근로기준법#43"], "found_link": [], "missing": ["근로기준법#2"], "recall_all": false, "rr": 0.5, "retrieved": [{"rank": 1, "id": "근로기준법#37", "score": 0.6715, "via": "search", "gold": false}, {"rank": 2, "id": "근로기준법#109", "score": 0.6228, "via": "search", "gold": true}, {"rank": 3, "id": "근로기준법 시행령#33", "score": 0.6176, "via": "search", "gold": false}, {"rank": 4, "id": "근로기준법#45", "score": 0.6053, "via": "search", "gold": false}, {"rank": 5, "id": "근로기준법#43", "score": 0.6041, "via": "search", "gold": true}, {"rank": 6, "id": "근로기준법#43의8", "score": 0.5989, "via": "search", "gold": false}, {"rank": 7, "id": "근로기준법 시행령#18", "score": 0.5979, "via": "search", "gold": false}, {"rank": 8, "id": "근로기준법#110", "score": 0.5909, "via": "search", "gold": false}, {"rank": 9, "id": "근로기준법 시행령#17", "score": 0.5885, "via": "search", "gold": false}, {"rank": 10, "id": "근로기준법 시행령#60", "score": 0.5883, "via": "search", "gold": false}, {"rank": 11, "id": "근로기준법#60", "score": 0.0, "via": "link", "gold": false}, {"rank": 12, "id": "판례#2018다296472", "score": 0.6125, "via": "precedent", "gold": false}, {"rank": 13, "id": "판례#2013도7896", "score": 0.6093, "via": "precedent", "gold": false}], "answer": "네. 연차휴가미사용수당도 지급일에 전액 지급하지 않으면 근로기준법 위반이 될 수 있습니다. [S13]\n\n근로기준법은 임금을 통화로 직접 근로자에게 전액 지급하고, 임금 지급일을 정한 경우 그날 지급하도록 정하고 있습니다. [S5] 또한 연차휴가 기간의 임금은 휴가를 주기 전이나 준 직후의 임금지급일에 지급해야 합니다. [S3]\n\n대법원은 연차휴가미사용수당이 매월 정기적으로 지급되는 임금이 아니더라도, 사용자가 지급기일에 그 전액을 지급하지 않으면 근로기준법 제43조 제1항 및 제109조 제1항 위반죄가 성립한다고 판단했습니다(대법원 2017. 7. 11. 선고 2013도7896 판결). [S13] 따라서 회사가 “월급이 아니므로 임금체불이 아니다”라고 주장하는 것만으로는 지급 지연이 정당화되지 않습니다. [S13]\n\n지급기일을 넘긴 경우, 제36조에 따른 지급 사유가 발생한 날부터 14일이 되는 날까지 지급해야 하는 임금에는 그 다음 날부터 지급일까지 연 20%의 지연이자가 발생할 수  하수급인에게 직접 일을 준 직상 수급인**이 하수급인과 연대하여 임금을 지급할 책임을 집니다. [S1]\n\n따라서 질문의 경우에는 **건설업 등록이 없는 하청업체에 직접 일을 준 건설업 등록 업체**가 하청업체와 연대책임을 부담합니다. 그 회사가 원청으로부터 공사를 받은 수급인이라면, 원청이 아니라 우선 그 회사가 제44조의2상 직상 수급인입니다. [S1]\n\n직상 수급인이 건설사업자가 아닌 경우에는 그 상위 수급인 중 최하위 건설사업자를 직상 수급인으로 봅니다. [S1] 질문에서는 직상 수급인이 건설업 등록 업체이므로 이 예외 규정에 따라 원청을 직상 수급인으로 보지는 않습니다. [S1]\n\n대법원은 건설업 등록이 없는 하수급인이 임금을 지급하지 않았다면, 직상 수급인은 자신에게 귀책사유가 있는지 또는 하수급인에게 공사대금을 지급했는지와 관계없이 하수급인과 연대하여 임금을 지급할 책임이 있다고 판단했습니다(대법원 2021. 7. 8. 선고 2020다296321 판결) [S11]. 대법원은 또한 근로자가 임금 수령권한을 하수급인에게 위임했더라도, 하수급인이 근로자에게 지급하지 않았다면 직상 수급인이 제44조의2상 책임을 면하지 않는다고 판단했습니다(대법원 2024. 6. 27. 선고 2024도4055 판결) [S12]. 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "citations": ["근로기준법#44의2", "판례#2020다296321", "판례#2024도4055"], "cit_precision": 0.3333333333333333, "cit_recall": 0.5, "key_points": [{"text": "건설업에서 2차례 이상 공사도급이 이루어지고 건설사업자가 아닌 하수급인이 임금을 지급하지 못하면 직상 수급인이 하수급인과 연대하여 임금 지급 책임을 짐(근로기준법 제44조의2 제1항)", "ok": true, "quote": "건설업에서 2차례 이상 도급이 이루어지고, 건설사업자가 아닌 하수급인이 근로자에게 해당 건설공사 임금을 지급하지 못한 경우에는 그 하수급인에게 직접 일을 준 직상 수급인이 하수급인과 연대하여 임금을 지급할 책임을 집니다."}, {"text": "제44조의2의 연대책임 주체는 직상 수급인(건설사업자가 아닌 하수급인에게 하도급을 준 건설사업자)으로 한정됨", "ok": true, "quote": "따라서 질문의 경우에는 건설업 등록이 없는 하청업체에 직접 일을 준 건설업 등록 업체가 하청업체와 연대책임을 부담합니다. 그 회사가 원청으로부터 공사를 받은 수급인이라면, 원청이 아니라 우선 그 회사가 제44조의2상 직상 수급인입니다."}], "asserts_conclusion": null, "unsupported": ["판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있다."], "n_claims": 8}, {"id": "l5a08", "level": "L5a", "split": "test", "question": "6개월짜리 계약직으로 일하기로 했는데 회사가 근로계약서에 임금 계산 방법이나 휴일, 연차 같은 내용을 하나도 적어주지 않았습니다. 회사는 계약직은 기간제법만 적용돼서 과태료 문제일 뿐이라고 하는데, 계약직에게도 근로기준법상 근로조건 명시 의무가 적용되나요?", "expected": "answered", "reference": "적용됩니다. 근로기준법 제17조제1항은 사용자가 근로계약을 체결할 때 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시하도록 정하고 있고, 기간제근로자도 근로기준법상 근로자이므로 이 의무가 적용됩니다. 기간제법에 근로기준법 제17조의 적용을 배제하는 규정이 없으므로, 기간제법에 과태료 규정이 있다는 이유로 근로기준법상 의무와 벌칙(제114조제1호)이 사라지지 않습니다.", "notes": "L5a/L5b 경계: '두 법의 중첩 적용'은 명문 규정이 아니고 (나)(다)는 입법취지 논거 — 문언만으로 충분하다는 분류 근거 재확인 [v1.1] 정답 포인트 3을 논증 단계('배제 규정 없음')에서 결론('배제되지 않음' 로기준법 제17조와 그 벌칙 조항이 적용되며, 기간제법이 유사한 위반행위에 과태료를 정하고 있어도 근로기준법의 적용이 배제되지 않는다고 판단했습니다(대법원 2024. 6. 27. 선고 2020도16541 판결). [S13] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n따라서 회사가 임금 계산방법, 휴일, 연차 유급휴가 등을 계약서에 명시·교부하지 않았다면, 기간제법상 과태료 문제뿐 아니라 근로기준법상 의무 위반도 문제될 수 있습니다. [S2] [S7]", "citations": ["근로기준법#17", "근로기준법#2", "기간제 및 단시간근로자 보호 등에 관한 법률#17", "기간제 및 단시간근로자 보호 등에 관한 법률#24", "판례#2020도16541"], "cit_precision": 0.8, "cit_recall": 0.8, "key_points": [{"text": "사용자는 근로계약 체결 시 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시해야 함(근로기준법 제17조 제1항)", "ok": true, "quote": "근로기준법은 근로계약 체결 시 임금, 소정근로시간, 휴일, 연차 유급휴가 등을 명시하고, 임금의 구성항목·계산방법·지급방법과 소정근로시간·휴일·연차 유급휴가가 적힌 서면을 교부하도록 정합니다."}, {"text": "기간제근로자도 근로기준법상 근로자이므로 제17조가 적용됨", "ok": true, "quote": "기간제근로자는 근로기준법상 근로자에 해당하므로, 기간제라는 이유만으로 근로기준법 제17조의 적용이 배제되지 않습니다."}, {"text": "기간제법이 적용된다는 이유로 근로기준법 제17조 의무가 배제되지 않음", "ok": true, "quote": "대법원은 기간제 근로계약에도 근로기준법 제17조와 그 벌칙 조항이 적용되며, 기간제법이 유사한 위반행위에 과태료를 정하고 있어도 근로기준법의 적용이 배제되지 않는다고 판단했습니다(대법원 2024. 6. 27. 선고 2020도16541 판결)."}], "asserts_conclusion": null, "unsupported": ["판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있다."], "n_claims": 11}, {"id": "l5b01", "level": "L5b", "split": "test", "question": "저희 회사는 두 달마다 기본급의 100%를 정기상여금으로 주는데, '지급일에 재직 중인 사람에게만 준다'는 조건이 붙어 있습니다. 회사는 이 조건 때문에 상여금이 통상임금이 아니어서 올해 연장근로수당 계산에서 빠진다고 합니다. 맞나요?", "expected": "answered", "reference": "회사 주장은 맞지 않을 가능성이 큽니다. 근로기준법 시행령 제6조제1항은 통상임금을 '근로자에게 정기적이고 일률적으로 소정근로 또는 총 근로에 대하여 지급하기로 정한' 금액으로 정의하고, 연장근로에는 통상임금의 100분의 50 이상을 가산해야 합니다(근로기준법 제56조제1항). 다만 '지급일 재직자에게만 준다'는 조건이 붙은 상여금이 이 정의에 해당하는지는 조문에 기준이 없습니다. 대법원은 정기상여금 등의 통상임금성이 문제 된 사안에서, 특정 시점에 재직 중이어야 한다는 조건이 부가되어 있다는 사정만으로 그 임금의 통상임금성이 부정되지 않으며, 이 새로운 법리는 2024. 12. 19. 이후 제공한 연장근로 등에 대한 법정수당 산정부터 적용된다고 판단했습니다(대법원 2024. 12. 19. 선고 2020다247190 전원합의체 판결). 따라서 올해 연장근로수당 계산에는 두 달마다 지급되는 정기상여금이 통상임금으로 포함될 수 있습니다. 다만 판례의 결론은 상여금의 실제 지급 조건 등 구체적 사실관계에 따라 달라질 수 있습니다.", "notes": "필수 포함 L5b. RAG가 시행령 제6조 문언만으로 '해당/비해당'을 단정하면 오답 처리할지 판정 기준 확정 필요. 질문 기간이 2024-12-19 이후임을 명시('올해') [채점 기준] 조문을 인용하면서 결정적 판단 기준이  아니라고 단정할 수도 없고, 반대로 콜 대기 전체가 곧바로 근로시간이라고 단정할 수도 없습니다. [S12]\n\n근로시간으로 인정되는 시간이 연장근로에 해당하면 통상임금의 50% 이상을 가산하여 지급해야 하고, 오후 10시부터 다음 날 오전 6시 사이의 근로라면 야간근로 가산도 적용됩니다. [S2] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "citations": ["근로기준법#50", "판례#2021다220062", "근로기준법#56"], "cit_precision": 0.6666666666666666, "cit_recall": 0.6666666666666666, "key_points": [{"text": "작업을 위해 사용자의 지휘·감독 아래에 있는 대기시간 등은 근로시간으로 봄(근로기준법 제50조제3항)", "ok": true, "quote": "근로자가 사용자의 지휘·감독을 받는 시간은 근로시간이고, 대기시간이라도 자유로운 이용이 보장되지 않고 실질적으로 지휘·감독을 받으면 근로시간에 포함됩니다."}, {"text": "판례: 당직이 근무 밀도가 낮은 대기성 단속적 업무이면 본래 업무에 실제로 종사한 시간만 근로시간임(본래 업무의 연장이거나 통상근무와 같으면 당직시간 전체가 근로시간)", "ok": true, "quote": "대법원은 방사선사의 자택 콜대기 사건에서, 자택에서의 대기시간 전부가 근로시간인지 또는 일부만 근로시간인지 판단하려면 통상근무와 콜대기 근무의 업무 내용·근무 밀도 차이, 호출 시 몇 분 안에 출근해야 하는지 등을 심리해야 한다고 판단했습니다(대법원 2024. 11. 14. 선고 2021다220062, 220079, 220086, 220093 판결)."}, {"text": "판례: 콜대기 시간 전부를 근로시간으로 단정할 수 없고 근무 밀도·호출 빈도·출근 시한 등을 심리해 범위를 판단해야 함", "ok": true, "quote": "따라서 호출이 없을 때 집에서 자유롭게 쉬거나 잘 수 있었다는 사정만으로 전체 시간이 근로시간이 아니라고 단정할 수도 없고, 반대로 콜 대기 전체가 곧바로 근로시간이라고 단정할 수도 없습니다."}], "asserts_conclusion": false, "unsupported": [], "n_claims": 10}, {"id": "l5b03", "level": "L5b", "split": "dev", "question": "의원과 '위탁진료계약'을 맺고 2년간 봉직의로 일했습니다. 주중과 토요일 대부분을 그 의원에서 진료했고, 진료 실적과 상관없이 매달 고정된 금액을 받았으며 매달 진료 현황을 보고했습니다. 계약서가 위탁계약이라 퇴직금이 없다고 하는데, 저도 퇴직금을 받을 수 있나요?", "expected": "answered", "reference": "받을 수 있을 가능성이 큽니다. 퇴직금을 받는 '근로자'는 근로기준법 제2조제1항제1호에 따라 '직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람'이고, 근로자퇴직급여 보장법도 이 정의를 따릅니다(제2조제1호). 위탁진료계약을 맺은 의사가 이 근로자에 해당하는지는 조문에 판단 기준이 없습니다. 대법원은 의원과 위탁진료계약을 맺고 진료한 의사의 퇴직금이 문제 된 사안에서, 근로자 여부는 계약 형식보다 실질에 비추어 임금을 목적으로 종속적인 관계에서 근로를 제공했는지로 판단해야 한다고 하면서, 계약 형식이 위탁진료계약이더라도 주중과 토요일 대부분을 그 의원에서 근무하고 진료 현황을 보고했으며 실적과 관계없이 고정 보수를 받았다면 근로기준법상 근로자에 해당한다고 판단했습니다(대법원 2023. 9. 21. 선고 2021도11675 판결). 근로자라면 사용자는 퇴직일부터 14일 이내에 퇴직금을 지급해야 합니다(근로자퇴직급여 보장법 제9조제1항). 다만 근로자성은 구체적 근무 실태에 따라 달라질 수 있습니다.", "notes": "근로자성 판단 = L5b 대표 유형. 퇴직급여법 제4조(1년 이상·주 15시간 이상) 충족 사실을 질문에 이미 포함('2년', ' ", "score": 0.6475, "via": "precedent", "gold": true}], "answer": "계약서의 명칭이 ‘위탁진료계약’이라는 이유만으로 퇴직금 지급 대상에서 제외되지는 않습니다. 근로자퇴직급여 보장법상 근로자는 근로기준법상 근로자를 말하고, 사용자는 근로기준법상 사용자를 말합니다. [S7] 사용자는 계속근로기간 1년에 대하여 30일분 이상의 평균임금을 퇴직금으로 지급하는 제도를 설정해야 합니다. [S3]\n\n근로자 해당 여부는 계약 형식보다 실질에 따라 판단하며, 업무 내용·근무시간·근무장소를 사용자가 정하는지, 지휘·감독을 받는지, 보수가 근로 자체의 대가인지 등을 종합합니다. [S14] 질문하신 사정인 2년간의 계속 근무, 주중 및 토요일 대부분의 의원 근무, 진료 실적과 무관한 고정 보수, 매월 진료 현황 보고는 근로자성 판단에서 고려되는 사정에 해당합니다. [S14]\n\n대법원은 위탁진료계약의 형식에도 불구하고 정해진 시간과 장소에서 진료하고 매월 고정 보수를 받으며, 근무시간·근무장소 관리와 업무상 상당한 지휘·감독을 받은 의사를 근로기준법상 근로자로 판단했습니다(대법원 2023. 9. 21. 선고 2021도11675 판결). [S14] 따라서 질문의 사실관계가 판례의 사정과 같다면 퇴직금 지급 대상이 될 가능성이 있습니다. 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n퇴직금은 계속근로기간 1년에 대하여 30일분 이상의 평균임금을 기준으로 합니다. [S3]", "citations": ["근로자퇴직급여 보장법#2", "근로자퇴직급여 보장법#8", "판례#2021도11675"], "cit_precision": 0.6666666666666666, "cit_recall": 0.4, "key_points": [{"text": "퇴직금 대상 근로자는 직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람임(근로기준법 제2조제1항제1호, 퇴직급여법 제2조제1호)", "ok": true, "quote": "근로자퇴직급여 보장법상 근로자는 근로기준법상 근로자를 말하고, 사용자는 근로기준법상 사용자를 말합니다."}, {"text": "판례: 근로자 여부는 계약 형식보다 실질에 비추어 임금을 목적으로 종속적 관계에서 근로를 제공했는지로 판단함", "ok": true, "quote": "근로자 해당 여부는 계약 형식보다 실질에 따라 판단하며, 업무 내용·근무시간·근무장소를 사용자가 정하는지, 지휘·감독을 받는지, 보수가 근로 자체의 대가인지 등을 종합합니다."}, {"text": "판례: 위탁진료계약 형식이라도 정해진 시간·장소 근무, 실적 무관 고정 보수, 진료 현황 보고 등이 있으면 근로기준법상 근로자(퇴직금 지급 대상)에 해당함", "ok": true, "quote": "대법원은 위탁진료계약의 형식에도 불구하고 정해진 시간과 장소에서 진료하고 매월 고정 보수를 받으며, 근무시간·근무장소 관리와 업무상 상당한 지휘·감독을 받은 의사를 근로기준법상 근로자로 판단했습니다(대법원 2023. 9. 21. 선고 2021도11675 판결)."}], "asserts_conclusion": false, "unsupported": ["질문에 제시된 2년간의 계속 근무는 근로자성 판단에서 고려되는 사정에 해당한다.", "판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있다."], "n_claims": 18}, {"id": "l5b04", "level": "L5b", "split": "test", "question": "회사로부터 해고 통보를 이메일로만 받았습니다. 이메일에는 해고 사유와 해고 날짜가 구체적으로 적혀 있고 저도 메일을 열어 확인했습니다. 해고는 서면으로 통지해야 효력이 있다고 들었는데, 이메일 통보도 서면 통지로 인정되나요?", "expected": "answered", "reference": "인정될 수 있습니다. 근로기준법 제27조는 사용자가 해고사유와 해고시기를 서면으로 통지해야 하고, 서면으로 통지해야 해고의 효력이 있다고 정하지 nk": 10, "id": "근로기준법#93", "score": 0.5309, "via": "search", "gold": false}, {"rank": 11, "id": "남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률 시행령#19", "score": 0.0, "via": "link", "gold": false}, {"rank": 12, "id": "판례#2016다202947", "score": 0.6027, "via": "precedent", "gold": false}, {"rank": 13, "id": "판례#2021다219529", "score": 0.591, "via": "precedent", "gold": false}], "answer": "직장 내 괴롭힘은 사용자 또는 근로자가 직장에서의 지위 또는 관계 등의 우위를 이용하여 업무상 적정범위를 넘어 다른 근로자에게 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위입니다. [S2]\n\n신고가 들어오거나 회사가 직장 내 괴롭힘 발생 사실을 인지하면 회사는 다음과 같이 해야 합니다.\n\n1. 지체 없이 당사자 등을 대상으로 사실 확인을 위한 객관적인 조사를 실시해야 합니다. [S1]\n2. 조사 기간 중 필요한 경우 피해근로자등을 보호하기 위해 근무장소 변경, 유급휴가 명령 등 적절한 조치를 해야 하며, 피해근로자등의 의사에 반하는 조치는 할 수 없습니다. [S1]\n3. 조사 결과 괴롭힘이 확인되고 피해근로자가 요청하면 근무장소 변경, 배치전환, 유급휴가 명령 등 적절한 조치를 해야 합니다. [S1]\n4. 괴롭힘이 확인되면 지체 없이 행위자에게 징계, 근무장소 변경 등 필요한 조치를 해야 하며, 조치 전에 피해근로자의 의견을 들어야 합니다. [S1]\n5. 신고한 근로자 및 피해근로자등에게 해고나 그 밖의 불리한 처우를 해서는 안 됩니다. [S1]\n6. 조사자, 조사 내용을 보고받은 사람 및 조사 과정 참여자는 피해근로자등의 의사에 반하여 조사 과정에서 알게 된 비밀을 다른 사람에게 누설해서는 안 됩니다. 다만 사용자에게 조사 관련 내용을 보고하거나 관계 기관의 요청에 따라 필요한 정보를 제공하는 경우는 제외됩니다. [S1]\n7. 상시 10명 이상의 근로자를 사용하는 사용자는 직장 내 괴롭힘의 예방 및 발생 시 조치 등에 관한 사항을 취업규칙에 작성하여 고용노동부장관에게 신고해야 합니다. [S10]\n\n제76조의3 제2항·제4항·제5항·제7항을 위반한 경우에는 500만원 이하의 과태료가 부과될 수 있습니다. [S4] 제76조의2를 위반하여 사용자가 직장 내 괴롭힘을 한 경우에는 1천만원 이하의 과태료가 부과될 수 있습니다. [S4] 제116조 관련 개정 내용 중 일부는 2026년 10월 8일, 2026년 12월 8일 및 2027년 1월 1일 시행 예정입니다. [S4]", "citations": ["근로기준법#76의2", "근로기준법#76의3", "근로기준법#93", "근로기준법#116"], "cit_precision": 0.5, "cit_recall": 1.0, "key_points": [{"text": "직장 내 괴롭힘은 지위·관계 등의 우위를 이용해 업무상 적정범위를 넘어 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위", "ok": true, "quote": "직장 내 괴롭힘은 사용자 또는 근로자가 직장에서의 지위 또는 관계 등의 우위를 이용하여 업무상 적정범위를 넘어 다른 근로자에게 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위입니다."}, {"text": "신고 접수·인지 시 지체 없이 객관적으로 조사", "ok": true, "quote": "지체 없이 당사자 등을 대상으로 사실 확인을 위한 객관적인 조사를 실시해야 합니다."}, {"text": "조사 기간 피해근로자등 보호를 위한 근무장소 변경·유급휴가 등 조치(피해자 의사에 반하지 않게)", "ok": true, "quote": "조사 기간 중 필요한 경우 피해근로자등을 보호하기 위해 근무장소 변경, 유급휴가 명령 등 적절한 조치를 해야 하며, 피해근로자등의 의 via": "link", "gold": false}, {"rank": 13, "id": "근로기준법 시행령#43", "score": 0.0, "via": "link", "gold": false}], "answer": "임신한 근로자를 보호하기 위한 주요 제도는 다음과 같습니다.\n\n1. **출산전후휴가**  \n   사용자는 출산 전후 90일의 휴가를 부여해야 하며, 미숙아 출산 시 100일, 다태임신 시 120일로 연장됩니다. 출산 후 휴가 기간은 원칙적으로 45일 이상이어야 하고, 다태임신은 60일 이상이어야 합니다. 최초 60일은 유급이며, 다태임신은 최초 75일이 유급입니다. [S1]  \n   미숙아는 임신 37주 미만 출생 또는 출생 시 체중 2,500그램 미만이면서 출생 후 24시간 이내 신생아중환자실에 입원한 영유아를 말합니다. [S11]\n\n2. **출산전후휴가의 분할 사용**  \n   유산·사산 경험, 출산 당시 만 40세 이상, 유산·사산 위험에 대한 의료기관 진단 등 사유가 있으면 출산 전 휴가를 나누어 사용할 수 있습니다. 다만 출산 후 휴가는 연속하여 45일 이상, 다태임신은 60일 이상이어야 합니다. [S1] [S13]\n\n3. **유산·사산휴가**  \n   임신 중 유산 또는 사산한 근로자가 청구하면 유산·사산휴가를 부여해야 합니다. 임신기간에 따라 유산 또는 사산일부터 10일, 30일, 60일 또는 90일까지 부여합니다. [S1] [S13]\n\n4. **임신 중 시간외근로 및 업무 전환 제한**  \n   사용자는 임신 중인 여성 근로자에게 시간외근로를 시킬 수 없으며, 근로자가 요구하면 쉬운 종류의 근로로 전환해야 합니다. [S1]\n\n5. **임신기 근로시간 단축**  \n   임신 12주 이내 또는 32주 이후인 근로자가 신청하면 1일 2시간의 근로시간 단축을 허용해야 합니다. 유산·조산 등 위험이 있는 근로자는 임신 전 기간에 이를 신청할 수 있습니다. [S1] [S4]  \n   근로시간 단축을 이유로 임금을 삭감할 수 없습니다. 신청하려면 원칙적으로 개시 예정일 3일 전까지 관련 사항을 적은 문서와 의사의 진단서를 제출해야 합니다. [S1] [S2]\n\n6. **업무 시작·종료 시각 변경**  \n   임신 중인 근로자가 1일 소정근로시간을 유지하면서 업무의 시작 및 종료 시각 변경을 신청하면 사용자는 이를 허용해야 합니다. 다만 정상적인 사업 운영에 중대한 지장이 있거나 근로자의 안전·건강 관련 법령을 위반하게 되는 경우에는 예외가 인정됩니다. [S1] [S6]  \n   신청은 원칙적으로 변경 예정일 3일 전까지 문서와 임신 사실을 증명하는 의사의 진단서를 제출해야 합니다. [S6]\n\n7. **태아검진 시간**  \n   임산부 정기건강진단에 필요한 시간을 청구하면 사용자는 이를 허용해야 하며, 그 시간을 이유로 임금을 삭감할 수 없습니다. [S3]\n\n8. **탄력적 근로시간제 적용 제외**  \n   15세 이상 18세 미만 근로자와 임신 중인 여성 근로자에게는 2주 이내", "citations": ["근로기준법#74", "근로기준법 시행규칙#12의2", "근로기준법 시행령#43", "근로기준법 시행규칙#12의3", "근로기준법 시행령#43의2", "근로기준법 시행령#43의3", "근로기준법#74의2"], "cit_precision": 0.14285714285714285, "cit_recall": 1.0, "key_points": [{"text": "출산전후휴가 90일(미숙아 100일, 다태아 120일)이며 출산 후 45일(다태아 60일) 이상 배정", "ok": true, "quote": "사용자는 출산 전후 90일의 휴가를 부여해야 하며, 미숙아 출산 시 100일, 다태임신 시 120일로 연장됩니다. 출산 후 휴가 기간은 원칙적으로 45일 이상이어야 하고, 다태임신은 60일 이상이어야 합니다."}, {"text": "휴가 중 최초 60일(다태아 75일)은 유급", "ok": true, "quote": "최초 60일은 유급이며, 다태임신은 최초 급된 날부터 6개월 이내에 해야 하며, 확인서 원본 또는 사본을 첨부하여 공단에 제출해야 합니다. [S4] [S13]\n\n재직 근로자에 대한 대지급금은 해당 사업에서 근로하는 동안 1회만 지급됩니다. [S2]", "citations": ["임금채권보장법#7의2", "임금채권보장법 시행령#7", "임금채권보장법 시행령#8", "임금채권보장법 시행령#9", "임금채권보장법 시행규칙#5"], "cit_precision": 0.2, "cit_recall": 0.5, "key_points": [{"text": "제7조의 대지급금은 퇴직한 근로자 대상이지만, 사업주가 제7조제1항제4호·제5호(판결 등 또는 체불 임금등·사업주 확인서 발급)에 해당하면 재직 근로자도 대지급금을 받을 수 있음", "ok": true, "quote": "퇴직하지 않은 재직 근로자도 대지급금을 받을 수 있습니다. 사업주가 판결·명령·조정·결정 등을 받았거나 체불 임금등·사업주 확인서로 미지급 임금등이 확인된 경우, 재직 근로자가 지급을 청구하면 대지급금이 지급됩니다."}, {"text": "재직자 대지급금 범위는 소송·진정 등 제기일 기준 맨 나중 체불일부터 소급 3개월간의 미지급 임금 등임", "ok": true, "quote": "대상 임금은 진정 등을 제기한 날을 기준으로, 가장 최근의 임금 체불이 발생한 날부터 소급하여 3개월 동안 지급되어야 했으나 지급받지 못한 임금입니다."}], "asserts_conclusion": null, "unsupported": [], "n_claims": 13}, {"id": "n08", "level": "L3", "split": "dev", "question": "회사 사정이 어려워 직원들 임금 3억 원이 밀렸습니다. 사업주로서 정부의 체불임금 지급 융자를 받으려는데 한도가 2억 원이라고 들었습니다. 2억 원을 넘게 융자받을 방법은 없나요?", "expected": "answered", "reference": "일반 체불 임금등 융자는 사업주당 총 2억원, 근로자 1명당 2천만원 범위에서 신청할 수 있습니다(임금채권보장법 시행규칙 제8조의8제4항). 다만 제8조의8제4항 전단에도 불구하고 최근 3개월 이내 발생한 미청산 체불액이 2억원을 초과하고 신청 금액의 120% 이상 부동산을 담보로 제공하는 등 요건을 모두 갖춘 사업주는 2억원을 초과하는 특별융자를 근로자 1명당 2천만원, 사업주당 총 10억원 범위에서 신청할 수 있습니다(제8조의9제1항·제5항).", "notes": "A=시행규칙#8의8④, B=#8의9 ('제8조의8제4항 전단에도 불구하고'). #8의9 is also a split candidate; not reused in split items.", "status": "answered", "refusal_reason": null, "refusal_mode": null, "m0": true, "stability": [true, true, true], "gold": ["임금채권보장법 시행규칙#8의8", "임금채권보장법 시행규칙#8의9"], "found_search": ["임금채권보장법 시행규칙#8의8", "임금채권보장법 시행규칙#8의9"], "found_link": [], "missing": [], "recall_all": true, "rr": 0.3333333333333333, "retrieved": [{"rank": 1, "id": "임금채권보장법 시행규칙#8의10", "score": 0.7681, "via": "search", "gold": false}, {"rank": 2, "id": "임금채권보장법#7의3", "score": 0.7668, "via": "search", "gold": false}, {"rank": 3, "id": "임금채권보장법 시행규칙#8의8", "score": 0.7299, "via": "search", "gold": true}, {"rank": 4, "id": "임금채권보장법 시행규칙#8의9", "score": 0.697, "via": "search", "gold": true}, {"rank": 5, "id": "임금채권보장법 시행규칙#8의6", "score": 0.6865, "via": "search", "gold": false}, {"rank": 6, "id": "임금채권보장법 시행규칙#8의11", "score": 0.6831, "via": "search", "gold": false}, {"rank": 7, "id": "임금채권보장법 시행규칙#8의7", "score": 0.6776, "via": "search", "gold": false}, {"rank": 8, "id": "임금채권보장법 시행규칙#8의12", "score": 0.658, "via": "search", "gold": false}, {"rank": 9, "id": "임금채권보장법 시행령#6", "score": 0.6491, "via": "search", "gold": false}, {"rank": 10, "id": "근로기준법#43의3", "score": 0.6324, "via": "search", "gold": false}, {"rank": 11, "id": "임금채권보장법 시행규칙#13", "score": 0.0, "via": "link", "gold": false}, {"rank": 12, "id": "임금채권보장법 시행규칙#14", "score": 0.0, "via": "link", "gold": false}, {"rank": 13, "id": "임금채권보장법 시행령#24", "score": 0.0, "via": "link", "gold": false}], "answer": "가능합니다. 일반 융자는 사업주당 총 2억 원까지이고, 근로자 1명당 신청액은 2천만 원까지입니다. [S3]\n\n다만 다음 요건을 모두 갖추면 2억 원을 초과하는 특별융자를 신청할 수 있습니다. [S4]\n\n- 사업주가 적용 대상 사업 또는 사업장에서 6개월 이상 사업을 영위했을 것 [S5]\n- 대상 근로자가 6개월 이상 계속 근로 중이거나, 확인 신청일 전 1년 이내에 퇴직했을 것 [S7]\n- 확인 신청일 기준 최근 3개월 이내 발생하여 청산되지 않은 체불 임금등이 2억 원을 초과할 것 [S4]\n- 특별융자 신청액의 120% 이상에 상당하는 부동산을 담보로 제공할 것 [S4]\n- 융자 상환 계획과 취약근로자 우선 지원 계획이 구체적이고 타당할 것 [S4]\n\n특별융자는 근로자 1명당 2천만 원까지, 사업주당 총 10억 원 범위에서 신청할 수 있습니다. 다만 이미 일반 융자를 받은 금액이 있으면 10억 원에서 그 금액을 공제한 범위로 제한됩니다. [S4]\n\n신청하려면 특별융자대상사업주 확인신청서와 일반 융자 확인자료, 담보 부동산 자료, 상환 계획서 및 취약근로자 우선 지원 계획서를 관할 지방고용노동관서의 장에게 제출해야 합니다. [S4] 확인통지서를 받은 뒤에는 45일 이내에 근로복지공단에 특별융자를 신청해야 합니다. [S4][S13]\n\n특별융자 금액은 공단이 담보 부동산 가액 평가 결과를 고려하여 결정하며, 공단은 융자금 회수가 어렵다고 판단하면 계약 체결을 거부할 수 있습니다. [S1][S6]\n\n따라서 체불액이 3억 원이라는 사정만으로 자동으로 3억 원을 융자받는 것은 아니며, 최근 3개월 내 발생한 미청산 체불액이 2억 원을 초과하고 담보·계획 요건 등을 충족해야 합니다. [S4] 판례는 제공되지 않았으므로 판례에 관한 별도 판단은 제시하지 않습니다.", "citations": ["임금채권보장법 시행규칙#8의8", "임금채권보장법 시행규칙#8의9", "임금채권보장법 시행규칙#8의6", "임금채권보장법 시행규칙#8의7", "임금채권보장법 시행령#24", "임금채권보장법 시행규칙#8의10", "임금채권보장법 시행규칙#8의11"], "cit_precision": 0.2857142857142857, "cit_recall": 1.0, "key_points": [{"text": "일반 체불 임금등 융자는 사업주당 총 2억원(근로자 1명당 2천만원) 범위임", "ok": true, "quote": "가능합니다. 일반 d": ["근로기준법#44의3"], "found_search": ["근로기준법#44의3"], "found_link": [], "missing": [], "recall_all": true, "rr": 1.0, "retrieved": [{"rank": 1, "id": "근로기준법#44의3", "score": 0.7859, "via": "search", "gold": true}, {"rank": 2, "id": "근로기준법#44의2", "score": 0.7521, "via": "search", "gold": false}, {"rank": 3, "id": "근로기준법#44", "score": 0.7061, "via": "search", "gold": false}, {"rank": 4, "id": "근로기준법#90", "score": 0.6304, "via": "search", "gold": false}, {"rank": 5, "id": "임금채권보장법#8", "score": 0.6221, "via": "search", "gold": false}, {"rank": 6, "id": "근로기준법#44의4", "score": 0.6186, "via": "search", "gold": false}, {"rank": 7, "id": "임금채권보장법#8의2", "score": 0.593, "via": "search", "gold": false}, {"rank": 8, "id": "근로기준법#43의8", "score": 0.5845, "via": "search", "gold": false}, {"rank": 9, "id": "임금채권보장법 시행령#11", "score": 0.5757, "via": "search", "gold": false}, {"rank": 10, "id": "최저임금법#6", "score": 0.566, "via": "search", "gold": false}, {"rank": 11, "id": "근로기준법 시행령#24", "score": 0.0, "via": "link", "gold": false}, {"rank": 12, "id": "판례#2023도8158", "score": 0.6376, "via": "precedent", "gold": false}, {"rank": 13, "id": "판례#2021다217370", "score": 0.6251, "via": "precedent", "gold": false}], "answer": "네. 다만 업체의 건설업 등록 여부와 도급 구조에 따라 달라집니다.\n\n1. **바로 위 수급인에 대한 청구**  \n건설업에서 2차례 이상 도급이 이루어졌고, 임금을 지급하지 않은 하수급인이 「건설산업기본법」상 건설사업자가 아닌 경우, 그 직상 수급인은 하수급인과 연대하여 해당 근로자의 임금을 지급할 책임이 있습니다. [S2]  \n따라서 재하도급 업체가 건설사업자가 아니고 귀하가 그 업체에 고용되어 일했다면, 바로 위 하청업체에 임금을 청구할 수 있습니다. [S2]\n\n대법원은 이 책임이 직상 수급인의 귀책사유나 하수급인에게 대금을 지급했는지와 관계없이 인정되는 강행규정이라고 판단했습니다(대법원 2021. 6. 10. 선고 2021다217370 판결) [S13]  \n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n2. **원청 건설사에 대한 직접 청구**  \n하수급인에 대한 확정된 지급명령은 제44조의3 제1항 제2호의 집행권원에 해당할 수 있습니다. 이 경우 직상 수급인은 하수급인이 지급해야 할 해당 건설공사 임금에 해당하는 금액을, 자신이 하수급인에게 지급해야 할 하도급대금 채무의 범위에서 근로자에게 직접 지급해야 합니다. [S1]\n\n도급이 2차례 이상 이루어졌다면, 하수급인에게 집행권원이 있는 근로자는 원수급인에게도 직접 지급을 요구할 수 있습니다. 원수급인은 근로자가 민법상 채권자대위권을 행사할 수 있는 금액 범위에서 이에 따라야 합니다. [S1]\n\n따라서 확정된 지급명령을 근거로 **바로 위 하청업체에는 연대책임에 따른 임금을, 원청 건설사에는 제44조의3에 따른 직접 지급을 요구할 수 있습니다.** 다만 원청에 대한 직접 지급은 해당 임금이 그 건설공사에서 발생한 임금이어야 하고, 원청의 하도급대금 채무 또는 채권자대위권 행사 가능 금액 범위로 제한됩니다. [S1]\n\n대법원은 바로 위 수급인의 형사책임에 관하여, 하수급인이 바로 위 수급인이 된 이후에 발생한 임금에 대해서만 책임을 부담한다고 판단했습니다(대법원 2023. 12. 14. 선고 2023도8158 판결) [S12]  \n다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "citations": ["근로기준법#44의2", "판례#2021다217370", "근로기준법#44의3", "판례#2023도8158"], "cit_precision": 0.25, "cit_recall": 1.0, "key_points": [{"text": "확정된 지급명령 등 집행권원이 있으면 직상 수급인은 하도급 대금 채무 범위에서 근로자가 청구하면 해당 공사에서 발생한 임금 상당액을 직접 지급해야 함", "ok": true, "quote": "이 경우 직상 수급인은 하수급인이 지급해야 할 해당 건설공사 임금에 해당하는 금액을, 자신이 하수급인에게 지급해야 할 하도급대금 채무의 범위에서 근로자에게 직접 지급해야 합니다."}, {"text": "도급이 2차례 이상 이루어진 경우 집행권원이 있는 근로자는 원수급인에게도 직접 지급을 요구할 수 있음", "ok": true, "quote": "도급이 2차례 이상 이루어졌다면, 하수급인에게 집행권원이 있는 근로자는 원수급인에게도 직접 지급을 요구할 수 있습니다."}], "asserts_conclusion": null, "unsupported": ["판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있다."], "n_claims": 15}, {"id": "n12", "level": "L2", "split": "test", "question": "팀장에게 성희롱을 당해 회사에 신고했고 지금 조사가 진행 중입니다. 조사 기간 동안 팀장과 떨어져 일할 수 있게 해 달라고 요구할 수 있나요? 또 신고한 뒤 성과평가에서 불이익을 받으면 문제가 되나요?", "expected": "answered", "reference": "사업주는 조사 기간 동안 피해근로자등을 보호하기 위해 필요한 경우 근무장소의 변경, 유급휴가 명령 등 적절한 조치를 해야 하며, 피해근로자등의 의사에 반하는 조치를 해서는 안 됩니다(남녀고용평등과 일·가정 양립 지원에 관한 법률 제14조제3항). 또한 신고한 근로자와 피해근로자등에게 성과평가 또는 동료평가 등에서의 차별과 같은 불리한 처우를 해서는 안 됩니다(제14조제6항제4호).", "notes": "Split: KP1 in chunk art:남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률#14:1 (③), KP2 in chunk :2 (⑥4호). Distinct from g037 (#13 education).", "status": "answered", "refusal_reason": null, "refusal_mode": null, "m0": true, "stability": [true, true, true], "gold": ["남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률#14"], "found_search": ["남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률#14"], "found_link": [], "missing": [], "recall_all": true, "rr": 1.0, "retrieved": [{"rank": 1, "id": "남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률#14", "score": 0.7768, "via": "search", "gold": true}, {"rank": 2, "id": "근로기준법#76의3", "score": 0.6826, "via": "search", "gold": false}, {"rank": 3, "id": "남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률#14의2", "score": 불 임금의 **3배 이내 금액**을 손해배상으로 청구할 수 있습니다. [S7]", "citations": ["근로기준법#109", "근로기준법#107", "근로기준법#43의8"], "cit_precision": 0.6666666666666666, "cit_recall": 1.0, "key_points": [{"text": "2026-10-01 현재 임금 지급 의무(제43조) 위반은 3년 이하의 징역 또는 3천만원 이하의 벌금 대상임(근로기준법 제109조제1항)", "ok": true, "quote": "현재 기준(2026년 10월 1일) 근로기준법상 임금체불에 대한 처벌은 **3년 이하의 징역 또는 3천만원 이하의 벌금**입니다. 임금 지급 의무를 정한 근로기준법 제43조 위반이 제109조 제1항의 처벌 대상입니다."}, {"text": "제43조 등 위반을 5년 이하의 징역 또는 5천만원 이하의 벌금으로 상향하는 개정(2026.4.7 공포)은 2026-10-08 시행 예정으로 아직 미시행", "ok": true, "quote": "다만 **2026년 10월 8일부터** 제43조 위반에 대한 처벌이 **5년 이하의 징역 또는 5천만원 이하의 벌금**으로 강화될 예정입니다."}], "asserts_conclusion": null, "unsupported": [], "n_claims": 8}, {"id": "n25", "level": "L3", "split": "dev", "question": "하청업체 직원인데 하청 사장이 월급을 못 줬습니다. 원청이 공사대금을 제때 안 줘서 그렇다는데, 원청에도 임금 책임을 물을 수 있나요? 어떤 경우에 원청 책임이 인정되나요?", "expected": "answered", "reference": "근로기준법 제44조제1항에 따라 직상 수급인의 귀책사유로 하수급인이 임금을 지급하지 못하면 직상 수급인은 하수급인과 연대하여 임금 책임을 집니다. 그 귀책사유는 시행령 제24조가 정한 정당한 사유 없는 도급 금액 지급일 미지급, 원자재 공급 지연·미공급, 도급계약 조건 불이행의 세 가지이므로, 원청이 공사대금을 정당한 사유 없이 제때 주지 않았다면 원청에도 책임을 물을 수 있습니다.", "notes": "delegation: 근로기준법 제44조제2항 '귀책사유 범위는 대통령령으로' → 시행령 제24조 1~3호.", "status": "answered", "refusal_reason": null, "refusal_mode": null, "m0": true, "stability": [true, true, true], "gold": ["근로기준법 시행령#24", "근로기준법#44"], "found_search": ["근로기준법 시행령#24", "근로기준법#44"], "found_link": [], "missing": [], "recall_all": true, "rr": 1.0, "retrieved": [{"rank": 1, "id": "근로기준법#44", "score": 0.7444, "via": "search", "gold": true}, {"rank": 2, "id": "근로기준법#44의2", "score": 0.7329, "via": "search", "gold": false}, {"rank": 3, "id": "근로기준법#44의3", "score": 0.699, "via": "search", "gold": false}, {"rank": 4, "id": "근로기준법 시행령#24", "score": 0.6157, "via": "search", "gold": true}, {"rank": 5, "id": "근로기준법#90", "score": 0.6102, "via": "search", "gold": false}, {"rank": 6, "id": "파견근로자 보호 등에 관한 법률#34", "score": 0.5552, "via": "search", "gold": false}, {"rank": 7, "id": "임금채권보장법#8", "score": 0.5521, "via": "search", "gold": false}, {"rank": 8, "id": "근로기준법#44의4", "score": 0.5462, "via": "search", "gold": false}, {"rank": 9, "id": "근로기준법#43의8", "score": 0.5426, "via": "search", "gold": false}, {"rank": 10, "id": "임금채권보장법#8의2", "score": 0.5261, "via": "search", "gold": false}, {"rank": 11, "id": "판례#2020다296321", "score": 0.6537, "via": "precedent", "gold": false}, {"rank": 12, "id": "판례#2023도8158", "score": 0.6415, "via": "precedent", "gold": false}], "answer": "원청의 책임은 공사 형태와 원청의 귀책사유에 따라 달라집니다.\n\n1. **일반적인 도급사업**에서는 하청업체가 원청 등 직상 수급인의 귀책사유로 임금을 지급하지 못한 경우, 직상 수급인이 하청업체와 연대하여 임금 지급 책임을 집니다. [S1]  \n   원청의 귀책사유에는 정당한 사유 없이 도급계약상 공사대금을 지급일에 지급하지 않은 경우, 원자재 공급을 지연하거나 하지 않은 경우, 도급계약 조건을 이행하지 않아 하청업체가 사업을 정상적으로 수행하지 못한 경우가 포함됩니다. [S4]  \n   따라서 원청이 정당한 사유 없이 공사대금을 제때 지급하지 않아 하청업체가 임금을 지급하지 못했다면, 원청의 연대책임이 인정될 수 있습니다. [S1][S4]\n\n2. **건설업에서 공사도급이 2차례 이상 이루어진 경우**에는 별도 규정이 적용됩니다. 건설사업자가 아닌 하청업체가 근로자에게 해당 건설공사에서 발생한 임금을 지급하지 못하면, 직상 수급인은 하청업체와 연대하여 임금을 지급할 책임을 집니다. [S2]  \n   이 경우 직상 수급인이 건설사업자가 아니면, 상위 수급인 중 최하위 건설사업자를 직상 수급인으로 봅니다. [S2]\n\n대법원은 건설업에서 2차례 이상 도급이 이루어지고 건설사업자가 아닌 하청업체가 임금을 지급하지 못한 경우, 직상 수급인은 자신의 귀책사유가 있는지 또는 하청업체에 공사대금을 지급했는지와 관계없이 연대하여 임금을 지급할 책임이 있다고 판단했습니다(대법원 2021. 7. 8. 선고 2020다296321 판결). [S11]  \n다만 이 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n또한 대법원은 직상 수급인이 된 이후 하청업체가 근로자에게 부담하게 된 임금에 대해서만 해당 처벌조항상 책임을 부담하고, 직상 수급인이 되기 전에 이미 발생한 임금 미지급까지 형사책임을 지는 것은 아니라고 판단했습니다(대법원 2023. 12. 14. 선고 2023도8158 판결). [S12]  \n다만 이 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.\n\n건설업의 경우, 일정한 요건이 있으면 직상 수급인이 하청업체에 지급할 하도급대금 범위에서 근로자에게 임금을 직접 지급해야 할 수도 있습니다. 예를 들어 원청과 하청업체가 임금 직접 지급에 합의한 경우, 확정된 지급명령 등 집행권원이 있는 경우, 또는 하청업체가 임금채무를 알리고 원청이 하청업체의 파산 등으로 지급할 수 없는 명백한 사유를 인정한 경우입니다. [S3]  \n따라서 질문의 경우에는 ① 건설업인지, ② 도급이 2차례 이상인지, ③ 하청업체가 건설사업자인지, ④ 원청이 직상 수급인인지, ⑤ 임금이 해당 공사에서 발생한 것인지, ⑥ 원청의 공사", "citations": ["근로기준법#44", "근로기준법 시행령#24", "근로기준법#44의2", "판례#2020다296321", "판례#2023도8158", "근로기준법#44의3"], "cit_precision": 0.3333333333333333, "cit_recall": 1.0, "key_points": [{"text": "직상 수급인(원청)의 귀책사유로 하수급인이 임금을 a": "link", "gold": false}, {"rank": 13, "id": "근로기준법#46", "score": 0.0, "via": "link", "gold": false}, {"rank": 14, "id": "판례#2022다245419", "score": 0.7069, "via": "precedent", "gold": true}, {"rank": 15, "id": "판례#2021다227100", "score": 0.6895, "via": "precedent", "gold": false}], "answer": "근로기준법상 1개월 개근 시 1일의 유급휴가가 부여되고, 1년간 80% 이상 출근하면 15일의 유급휴가가 부여됩니다. 또한 3년 이상 계속 근로한 경우에만 가산휴가가 발생합니다. [S1]\n\n대법원은 1년을 초과하되 2년 이하의 기간 동안 근로한 경우, 최초 1년 동안의 제60조 제2항 휴가 최대 11일과 최초 1년을 마친 다음 날 발생하는 제60조 제1항 휴가 15일을 합쳐 최대 26일이라고 판단했습니다(대법원 2022. 9. 7. 선고 2022다245419 판결) [S14]\n\n따라서 질문처럼 정확히 2년 근무 후 계약이 만료되어 퇴사한 경우, 미사용 연차수당은 원칙적으로 최대 26일분입니다. 2년을 다 채운 날에 추가로 15일이 발생하여 41일이 되는 것은 아닙니다. 제60조 제1항의 15일은 최초 1년 근로를 마친 다음 날 발생하므로, 그 15일을 사용할 수 있는 다음 근로연도까지 근로관계가 유지되지 않으면 추가 15일은 발생하지 않습니다. [S14]\n\n다만, 연차휴가수당은 유급휴가를 주기 전이나 준 직후의 임금지급일에 지급해야 합니다. [S11] 또한 연차휴가를 사용하지 않아 소멸한 경우라도 사용자의 귀책사유로 사용하지 못했다면 소멸하지 않으며, 사용자가 법정 사용촉진 조치를 한 경우에는 미사용 휴가에 대한 보상 의무가 없을 수 있습니다. [S1][S2]\n\n근거 법령은 2026년 10월 1일 현재 시행 중이며, 연차휴가 분할청구·사용시기 변경·불리한 처우 금지 등을 포함한 개정 내용은 2027년 6월 10일부터 시행될 예정입니다. [S1][S2]\n\n대법원 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "citations": ["근로기준법#60", "판례#2022다245419", "근로기준법 시행령#33", "근로기준법#61"], "cit_precision": 0.5, "cit_recall": 1.0, "key_points": [{"text": "1년간 80% 이상 출근 시 15일, 계속근로 1년 미만은 1개월 개근 시 1일의 유급휴가(근로기준법 제60조제1항·제2항)", "ok": true, "quote": "근로기준법상 1개월 개근 시 1일의 유급휴가가 부여되고, 1년간 80% 이상 출근하면 15일의 유급휴가가 부여됩니다."}, {"text": "판례: 연차휴가는 전년도 1년간의 근로를 마친 다음 날 발생하므로 2년째 근로를 마치고 근로관계가 끝나면 15일이 추가로 발생하지 않음", "ok": true, "quote": "제60조 제1항의 15일은 최초 1년 근로를 마친 다음 날 발생하므로, 그 15일을 사용할 수 있는 다음 근로연도까지 근로관계가 유지되지 않으면 추가 15일은 발생하지 않습니다."}, {"text": "판례: 1년 초과 2년 이하 근로자의 최대 연차휴가일수는 11일 + 15일 = 총 26일(41일 아님)", "ok": true, "quote": "따라서 질문처럼 정확히 2년 근무 후 계약이 만료되어 퇴사한 경우, 미사용 연차수당은 원칙적으로 최대 26일분입니다. 2년을 다 채운 날에 추가로 15일이 발생하여 41일이 되는 것은 아닙니다."}], "asserts_conclusion": true, "unsupported": ["그 15일을 사용할 수 있는 다음 근로연도까지 근로관계가 유지되지 않으면 추가 15일은 발생하지 않는다.", "대법원 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있다."], "n_claims": 16}, {"id": "l5b08", "level": "L5b", "split": "test", "question": "시내버스 기사입니다. 단체협약에는 연차를 쓰려면 정해진 기한 전까지 신청하라고 되어 있는데, 개인 사정으로 그 기한을 넘겨 연차를 신청했더니 회사가 반려했습니다. 연차는 근로자가 원하는 날에 줘야 하는 것 아닌가요? 회사가 근로기준법을 위반한 건가요?", "expected": "answered", "reference": "근로기준법 위반이 아닐 가능성이 큽니다. 근로기준법 제60조제5항은 연차 유급휴가를 근로자가 청구한 시기에 주도록 하면서, 청구한 시기에 휴가를 주는 것이 사업 운영에 막대한 지장이 있는 경우에는 사용자가 그 시기를 변경할 수 있다고 정하지만, 단체협약상 청구 기한을 넘긴 신청이 이에 해당하는지는 조문에 기준이 없습니다. 대법원은 시내버스 회사가 단체협약상 기한을 넘겨 지정한 연차를 반려한 사안에서, 제60조제5항 위반죄는 사용자가 적법한 시기변경권을 행사하지 않은 채 연차휴가를 방해한 경우에 성립하는데, 노선버스처럼 운영의 정시성이 중요한 사업에서 근로자가 불가피한 사유 없이 단체협약상 휴가 청구 기한을 지키지 않았다면 사용자는 특별한 사정이 없는 한 적법하게 시기변경권을 행사할 수 있다고 판단했습니다(대법원 2025. 7. 17. 선고 2021도11886 판결). 다만 기한을 넘긴 개인 사정이 불가피한 사유였는지 등 구체적 사실관계에 따라 결론이 달라질 수 있습니다.", "notes": "l5_candidates 2021도11886. 선고 후 2026-02-19 개정은 제60조 제6항만 대상 — 제5항 무관. '반려'를 시기변경권 행사로 보는 전제는 판례 사실관계 확인 필요. [채점 기준] 제60조 제5항 본문만 인용해 '위반'으로 단정하거나, 판례 결론('적법')을 근거 없이 단정하면 오답. [v2.1 판례 인용형 전환] 요구사항 변경(조문만으로 판단할 수 없는 질문은 조문에 연결된 대법원 판례를 검색해 답변)에 따라 expected_status를 insufficient_context→answered로 변경하고 판례를 gold_evidence에 추가. 이 항목의 기존 [채점 기준](판례 결론 단정=오답, 유보형 부분 답변=통과)은 폐기. [채점 기준 v2.1] 조문 내용을 먼저 제시하고 판례를 사건번호와 함께 사례로 인용하면 통과. 판례 판시를 조문 문언인 것처럼 제시하거나, 판례를 밝히지 않고 결론만 단정하면 결함. '구체적 사실관계에 따라 결론이 달라질 수 있음' 단서는 권장(정답 포인트 아님). 조문만 인용하고 판단을 유보한 답변은 정답 포인트 미충족으로 실패 처리(의도된 설계). 판결요지 첫째·넷째 단락 사용. '반려'를 시기변경권 행사로 본 판례 사건명과 정합.", "status": "answered", "refusal_reason": null, "refusal_mode": null, "m0": true, "stability": [true, true, true], "gold": ["근로기준법#110", "근로기준법#60", "판례#2021도11886"], "found_search": ["근로기준법#60"], "found_link": ["판례#2021도11886"], "missing": ["근로기준법#110"], "recall_all": false, "rr": 1.0, "retrieved": [{"rank": 1, "id": "근로기준법#60", "score": 0.6991, "via": "search", "gold": true}, {"rank": 2, "id": "근로기준법#61", "score": 0.633, "via": "search", "gold": false}, {"rank": 3, "id": "근로기준법#10", "score": 0.6174, "via": "search", "gold": false}, {"rank": 4, "id": "근로기준법#57", "score": 0.6085, "via": "search", "gold": false}, {"rank": 5, "id": "근로기준법#62", "score": 0.6074, "via": "search", "gold": false}, {"rank": 6, "id": "근로기준법#55", "score": 0.5768, "via": "search", "gold": false}, {"rank": 7, "id": "근로기준법#73", "score": 0.5744, "via": "search", "gold": false}, {"rank": 8, "id": "근로기준법#51의2", "score": 0.5579, "via": "search", "gold": false}, {"rank": 9, "id": "근로기준법#19", "score": 0.5579, "via": "search", "gold": false}, {"rank": 10, "id": "근로기준법#17", "score": 0.5567, "via": "search", "gold": false}, {"rank": 11, "id": "근로기준법 시행령#33", "score": 0.0, "via": "link", "gold": false}, {"rank": 12, "id": "근로기준법 시행령#7의2", "score": 0.0, "via": "link", "gold": false}, {"rank": 13, "id": "판례#2021도11886", "score": 0.6661, "via": "precedent", "gold": true}, {"rank": 14, "id": "판례#2022다245419", "score": 0.5878, "via": "precedent", "gold": false}], "answer": "근로자의 연차유급휴가권은 법정 요건을 충족하면 발생하지만, 사용자는 근로자가 청구한 시기에 휴가를 주는 것이 원칙이고 사업 운영에 막대한 지장이 있는 경우에는 그 시기를 변경할 수 있습니다. [S1]\n\n대법원은 노선 여객자동차운송사업처럼 운영의 정시성이 중요한 사업에서 단체협약이 연차 신청기한을 정하고 있는데도 근로자가 불가피한 사유 없이 그 기한을 지키지 않고 신청한 경우, 지정된 시기까지 대체근로자를 확보하기 어려워 사업 운영에 막대한 지장이 발생한다고 보아 사용자가 시기변경권을 행사할 수 있다고 판단했습니다(대법원 2025. 7. 17. 선고 2021도11886 판결). [S13]\n\n따라서 개인 사정이 불가피한 사유에 해당하지 않고, 단체협약상 신청기한을 넘긴 신청으로 대체근로자 확보 등 버스 운행에 막대한 지장이 발생하는 경우라면 회사의 반려가 곧바로 근로기준법 위반이라고 단정하기 어렵습니다. [S13]\n\n반대로 불가피한 사유가 있었거나 회사가 사업 운영에 막대한 지장이 있다는 사정 없이 연차 사용을 거부한 경우라면, 회사는 적법한 시기변경권을 행사한 것으로 보기 어려울 수 있습니다. [S1][S13]\n\n현재 관련 조문은 시행 중이나, 2027년 6월 10일부터 연차휴가 분할청구, 청구 시기 부여 및 불리한 처우 금지 등에 관한 개정 내용이 시행될 예정입니다. [S1] 다만 판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있습니다.", "citations": ["근로기준법#60", "판례#2021도11886"], "cit_precision": 1.0, "cit_recall": 0.6666666666666666, "key_points": [{"text": "연차휴가는 근로자가 청구한 시기에 주어야 하나, 사업 운영에 막대한 지장이 있으면 사용자가 시기를 변경할 수 있음(근로기준법 제60조제5항)", "ok": true, "quote": "근로자의 연차유급휴가권은 법정 요건을 충족하면 발생하지만, 사용자는 근로자가 청구한 시기에 휴가를 주는 것이 원칙이고 사업 운영에 막대한 지장이 있는 경우에는 그 시기를 변경할 수 있습니다."}, {"text": "판례: 노선버스처럼 정시성이 중요한 사업에서 근로자가 불가피한 사유 없이 단체협약상 휴가 청구 기한을 지키지 않으면, 사용자는 특별한 사정이 없는 한 적법하게 시기변경권을 행사할 수 있음", "ok": true, "quote": "대법원은 노선 여객자동차운송사업처럼 운영의 정시성이 중요한 사업에서 단체협약이 연차 신청기한을 정하고 있는데도 근로자가 불가피한 사유 없이 그 기한을 지키지 않고 신청한 경우, 지정된 시기까지 대체근로자를 확보하기 어려워 사업 운영에 막대한 지장이 발생한다고 보아 사용자가 시기변경권을 행사할 수 있다고 판단했습니다(대법원 2025. 7. 17. 선고 2021도11886 판결)."}, {"text": "판례: 제60조제5항 위반죄는 사용자가 적법한 시기변경권을 행사하지 않은 채 연차휴가를 방해한 경우에 성립함(적법한 시기변경이면 위반 아님)", "ok": true, "quote": "반대로 불가피한 사유가 있었거나 회사가 사업 운영에 막대한 지장이 있다는 사정 없이 연차 사용을 거부한 경우라면, 회사는 적법한 시기변경권을 행사한 것으로 보기 어려울 수 있습니다."}], "asserts_conclusion": false, "unsupported": ["판례는 개별 사안의 사실관계에 따라 달리 판단될 수 있다."], "n_claims": 10}, {"id": "l5b09", "level": "L5b", "split": "dev", "question": "계약직으로 2년 넘게 같은 업무를 계속해서 무기계약 근로자로 간주됐습니다. 그런데 회사는 제 임금과 수당은 예전 계약직 기준 그대로라고 합니다. 같은 일을 하는 기간 없는 계약 직원들에게 적용되는 취업규칙의 임금 기준을 저도 적용받을 수 있나요?", "expected": "answered", "reference": "적용받을 수 있습니다. 기간제법 제4조제2항에 따라 예외 사유 없이 2년을 초과해 사용된 기간제근로자는 기간의 정함이 없는 근로계약을 체결한 근로자로 보지만, 이 조항은 간주된 뒤의 임금 등 근로조건을 정하지 않습니다. 대법원은 무기계약으로 간주된 근로자의 임금이 문제 된 사안에서, 해당 사업장에 동종 또는 유사한 업무에 종사하는 기간의 정함이 없는 근로계약 근로자가 있으면 달리 정함이 없는 한 그 근로자에게 적용되는 취업규칙 등이 동일하게 적용된다고 판단했습니다(대법원 2019. 12. 24. 선고 2015다254873 판결). 이때 근로기준법 제97조에 따라 취업규칙에서 정한 기준에 미달하는 근로계약 부분은 무효가 되고 취업규칙 기준에 따릅니다. 다만 동종·유사 업무인지, 달리 정한 사정이 있는지 등 구체적 사실관계에 따라 결론이 달라질 수 있습니다.", "notes": "l5_candidates 2015다254873. 선고 후 2020-05-26 개정은 제4조 제1항·제8조의 '당해'→'해당' 자구 정비로 보이며 제4조 제2항 불변(법령 연혁 확인 필요). 파견법 제6조의2 제3항(직접고용 시 동종 근로자 취업규칙 적용)은 파견근로자 한정 명문 규정이라 기간제에 유추 단정하면 오답. [채점 기준] '적용된다'를 조문만으로 단정하면 오답. [v2.1 판례 인용형 전환] 요구사항 변경(조문만으로 판단할 수 없는 질문은 조문에 연결된 대법원 판례를 검색해 답변)에 따라 expected_status를 insufficient_context→answered로 변경하고 판례를 gold_evidence에 추가. 이 항목의 기존 [채점 기준](판례 결론 단정=오답, 유보형 부분 답변=통과)은 폐기. [채점 기준 v2.1] 조문 내용을 먼저 제시하고 판례를 사건번호와 함께 사례로 인용하면 통과. 판례 판시를 조문 문언인 것처럼 제시하거나, 판례를 밝히지 않고 결론만 단정하면 결함. '구체적 사실관계에 따라 결론이 달라질 수 있음' 단서는 권장(정답 포인트 아님). 조문만 인용하고 판단을 유보한 답변은 정답 포인트 미충족으로 실패 처리(의도된 설계). 판결요지 [1]·[2] 사용. 판결요지 ②가 제8조 문언은 차별 금지만 정한다고 인정 — 제8조를 근거로 '조문이 직접 정한다'고 제시하면 결함.", "status": "answered", "refusal_reason": null, "refusal_mode": null, "m0": true, "stab         <dt>GT 근거</dt><dd>${x.gold.length ? x.gold.map(esc).join(", ") : "없음(거절해야 하는 문항)"}</dd>
        <dt>검색으로 찾음</dt><dd>${x.found_search.map(esc).join(", ") || "—"}</dd>
        <dt>연결로 찾음</dt><dd>${x.found_link.map(esc).join(", ") || "—"}</dd>
        <dt>누락</dt><dd>${x.missing.map(esc).join(", ") || "—"}</dd>
        <dt>첫 정답 순위</dt><dd class="mono">${x.rr ? Math.round(1 / x.rr) + "위" : "—"}</dd>
      </dl>
      <div class="ret"><table><thead><tr><th>#</th><th>조문·판례</th><th>유사도</th><th>경로</th><th></th></tr></thead><tbody>${goldRows}${missRows}</tbody></table></div>
    </div>
    <div class="pane">
      <h3>LLM 답변 · 채점</h3>
      <dl class="kv">
        <dt>기대</dt><dd>${x.expected === "answered" ? "답변" : "거절 또는 근거 없음 명시"}</dd>
        <dt>실제</dt><dd>${x.status === "answered" ? "답변" : "거절"}${x.refusal_reason ? ` (${esc(x.refusal_reason)})` : ""}</dd>
        <dt>판정</dt><dd>${ansPill(x)}</dd>
        ${x.asserts_conclusion != null ? `<dt>결론 단정</dt><dd>${x.asserts_conclusion ? "예" : "아니오"}</dd>` : ""}
        <dt>인용</dt><dd>${x.citations.map(esc).join(", ") || "—"}${x.cit_precision != null ? ` <span class="mono">(정밀도 ${pct(x.cit_precision)} · 재현율 ${pct(x.cit_recall)})</span>` : ""}</dd>
        <dt>근거 없는 주장</dt><dd>${x.n_claims ? `${x.unsupported.length} / ${x.n_claims}` : "—"}</dd>
      </dl>
      ${kp ? `<div class="kp">${kp}</div>` : ""}
      ${x.unsupported.length ? `<div class="ref">근거 없는 주장: ${x.unsupported.map(esc).join(" / ")}</div>` : ""}
      <div class="answer">${esc(x.answer)}</div>
      <div class="ref"><b>GT 참고 답변</b> ${esc(x.reference)}</div>
    </div>
  </div>`;
}
const state = {res: "all", lv: new Set(), q: ""};
function match(x) {
  if (state.res === "bad" && x.m0) return false;
  if (state.res === "unstable" && new Set(x.stability).size < 2) return false;
  if (state.res === "miss" && !x.missing.length) return false;
  if (state.lv.size && !state.lv.has(x.level)) return false;
  if (state.q) { const h = (x.id + " " + x.question + " " + x.gold.join(" ") + " " + x.retrieved.map(r => r.id).join(" ")).toLowerCase(); if (!h.includes(state.q)) return false; }
  return true;
}
function render() {
  const xs = items.filter(match);
  document.getElementById("count").textContent = `${xs.length}개 문항`;
  document.getElementById("list").innerHTML = xs.map(x => `<details id="${x.id}" data-id="${x.id}">
    <summary><span class="mono">${x.id}</span><span class="lv" title="${LV[x.level]}">${x.level}</span><span class="qtext">${esc(x.question)}</span>
    <span class="tags">${retPill(x)}${ansPill(x)}<span class="dots" title="3회 실행 정답 여부">${x.stability.map(s => `<span class="dot ${s ? "ok" : "bad"}"></span>`).join("")}</span></span></summary></details>`).join("");
}
document.getElementById("list").addEventListener("toggle", e => {
  const d = e.target; if (d.open && !d.dataset.filled) { d.insertAdjacentHTML("beforeend", body(items.find(x => x.id === d.dataset.id))); d.dataset.filled = 1; }
}, true);
document.querySelector(".filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  if (b.dataset.f === "res") { state.res = b.dataset.v; document.querySelectorAll('[data-f="res"]').forEach(c => c.setAttribute("aria-pressed", c === b)); }
  else { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); on ? state.lv.add(b.dataset.v) : state.lv.delete(b.dataset.v); }
  render();
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
render();
function openHash() { const d = document.getElementById(location.hash.slice(1)); if (d && d.tagName === "DETAILS") { d.open = true; d.scrollIntoView({block: "start"}); } }
window.addEventListener("hashchange", openHash); openHash();
</script>
